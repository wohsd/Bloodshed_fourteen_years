  ROD_focus_11: "重组东北军"
  ROD_focus_11_desc: "重建军队，增强国防力量。"
  
  ROD_focus_12: "赴任西北剿总"
  ROD_focus_12_desc: "前往西北地区执行剿匪任务。"
  
  ROD_focus_13: "接触共产党"
  ROD_focus_13_desc: "与中共建立联系，探讨合作可能。"
  
  ROD_focus_14: "逼蒋抗日"
  ROD_focus_14_desc: "迫使蒋介石领导全国抗日。"
  
  ROD_focus_15: "为蒋剿共"
  ROD_focus_15_desc: "继续执行剿共政策，维护国民政府权威。"
  
  ROD_focus_16: "（未命名）"
  ROD_focus_16_desc: ""
  
