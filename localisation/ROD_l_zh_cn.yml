  ROD_focus_29: "巩固统一战线"
  ROD_focus_29_desc: "巩固抗日民族统一战线。"
  
  ROD_focus_30: "抗日民族统一战线"
  ROD_focus_30_desc: "建立广泛的抗日民族统一战线，团结一切可以团结的力量。"
  
