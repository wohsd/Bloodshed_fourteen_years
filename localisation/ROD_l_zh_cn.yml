  ROD_focus_2: "与日军谈判"
  ROD_focus_2_desc: "尝试通过外交途径解决与日本的冲突。"
  
  ROD_focus_3: "通电下野"
  ROD_focus_3_desc: "暂时退出政治舞台，以平息各方争议。"
  
  ROD_focus_4: "赴任北平绥靖公署"
  ROD_focus_4_desc: "接受新的职务，继续为国家服务。"
  
  ROD_focus_5: "建立东北情报网"
  ROD_focus_5_desc: "收集关于东北局势的重要情报。"
  
  ROD_focus_6: "复校东北大学"
  ROD_focus_6_desc: "恢复教育事业，培养国家人才。"
  
  ROD_focus_7: "长城抗战"
  ROD_focus_7_desc: "组织军队抵抗日本侵略。"
  
  ROD_focus_8: "释放政治犯"
