l_simp_chinese:
 BFY_dev_event.ok:0 "知道了"
 BFY_dev_event.1.t:0 "教育现代化等级提升"
 BFY_dev_event.1.d:0 "随着学堂、书刊与新式课程的推广，国民识字率与科学素养稳步提高。\n\n我国§Y教育现代化§!已提升至 §G第 [?BFY_disp_education|0] 级§!。"
 BFY_dev_event.2.t:0 "教育现代化等级下降"
 BFY_dev_event.2.d:0 "战乱与财政困窘使教育事业遭受严重挫折。\n\n我国§Y教育现代化§!已下降至 §R第 [?BFY_disp_education|0] 级§!。"
 BFY_dev_event.3.t:0 "农业现代化等级提升"
 BFY_dev_event.3.d:0 "水利灌溉与良种推广初见成效，粮食产量稳步增长。\n\n我国§Y农业现代化§!已提升至 §G第 [?BFY_disp_farming|0] 级§!。"
 BFY_dev_event.4.t:0 "农业现代化等级下降"
 BFY_dev_event.4.d:0 "灾荒与土地失耕使农业生产大幅倒退。\n\n我国§Y农业现代化§!已下降至 §R第 [?BFY_disp_farming|0] 级§!。"
 BFY_dev_event.5.t:0 "社会现代化等级提升"
 BFY_dev_event.5.d:0 "新式社会组织与基层治理逐步建立，国家的组织与动员能力增强。\n\n我国§Y社会现代化§!已提升至 §G第 [?BFY_disp_social|0] 级§!。"
 BFY_dev_event.6.t:0 "社会现代化等级下降"
 BFY_dev_event.6.d:0 "社会动荡使组织与动员能力受到严重削弱。\n\n我国§Y社会现代化§!已下降至 §R第 [?BFY_disp_social|0] 级§!。"
 BFY_dev_event.7.t:0 "工业现代化等级提升"
 BFY_dev_event.7.d:0 "新工厂陆续建成投产，工业生产能力迈上了一个新台阶。\n\n我国§Y工业现代化§!已提升至 §G第 [?BFY_disp_industrial|0] 级§!。"
 BFY_dev_event.8.t:0 "工业现代化等级下降"
 BFY_dev_event.8.d:0 "工厂停产、设备流失，工业生产能力明显萎缩。\n\n我国§Y工业现代化§!已下降至 §R第 [?BFY_disp_industrial|0] 级§!。"
 BFY_dev_event.9.t:0 "军事现代化等级提升"
 BFY_dev_event.9.d:0 "整军经武初见成效，部队的训练、装备与作战水平显著提高。\n\n我国§Y军事现代化§!已提升至 §G第 [?BFY_disp_military|0] 级§!。"
 BFY_dev_event.10.t:0 "军事现代化等级下降"
 BFY_dev_event.10.d:0 "军队扩充过速、训练废弛，军事现代化水平不进反退。\n\n我国§Y军事现代化§!已下降至 §R第 [?BFY_disp_military|0] 级§!。"
 BFY_dev_event.11.t:0 "医疗现代化等级提升"
 BFY_dev_event.11.d:0 "新式医院与防疫体系逐步铺开，公共卫生状况明显改善。\n\n我国§Y医疗现代化§!已提升至 §G第 [?BFY_disp_medical|0] 级§!。"
 BFY_dev_event.12.t:0 "医疗现代化等级下降"
 BFY_dev_event.12.d:0 "疫病流行而医疗体系疲弱，公共卫生状况不断恶化。\n\n我国§Y医疗现代化§!已下降至 §R第 [?BFY_disp_medical|0] 级§!。"
