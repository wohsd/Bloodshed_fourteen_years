l_simp_chinese:
 revolutionary_three_principles_of_the_people_economy:0 "新民主主义经济"
 The_winner_Central:0 "中原大战的胜利者"
 The_winner_Central_desc:0 "虽然国民政府取得了最后的胜利，但“中原大战”历时7个月，双方动员兵力110万人以上，支出军费5亿元，死伤30万人，战火波及20多省。战祸所及，破坏严重。作为战场的中原人民，河南洛阳等27县严重受灾。"
 Armies_from_world:0 "五湖四海的军队"
 Armies_from_world_desc:0 "冯玉祥所组建的抗日同盟军来自不同地区的部队，其士气和作战能力都不能与正规军相提及。"
 Anti_Japanese_zeal:0 "抗日热情"
 Anti_Japanese_zeal_desc:0 "目前的热情：§H[?Anti_JP_zeal]§!\n人民的抗日之心已经沸腾。高校学生开始自发动员组织抗日游行活动，动员全国人民抵抗日本的侵略。\n\n§H效果：§!\n每当热情上升§H1§!点，各项增益将会增加§G0.02%§!的效果，但每§R丢失§!一个大型城市，§R投降派§!的势力将会增加，热情也随着§R减弱§!。"
 Encourage_enlistment_military:0 "十万青年十万军"
 The_Golden_Decade:0 "黄金十年"
 Militaristic_fervor:0 "军国主义狂热"
 Morale_collapsed:0 "士气崩溃"
 Eight_provincial_guerrillas:0 "南方八省游击队"
 Poorly_managed_areas:0 "战略重视度低的地区"
 Four_families:0 "四大家族"
 YGC_Mao_Jewish_coalition_army:0 "毛犹联军"
 Not_resisting:0 "不抵抗政策"
 Negative_Encirclement:0 "消极剿共"
 Fortress_tactics:0 "碉堡战术"
 Fortress_tactics_desc:0 "蒋介石采纳国民党将军柳维垣、戴岳等和外国军事顾问的建议，确定“战略攻势，战术守势”和“步步为营，节节推进，碉堡公路，连绵不断，经济封锁，滴水不漏”的策略。同时，对部队进行整编，师以下撒销旅一级建制，每师直辖3个团，并在师、团两级增设侦察队，扩充运输队。军事力量方面，在保定等处招募新兵，扩编10余个师，并从各省抽调部队入赣，同时购进大批新式武器装备部队。"
 Anti_hometown_group:0 "地方乡团"
 Anti_hometown_group_desc:0 "在对红军农村革命根据地的大小围剿中，不熟悉农村地理的国民党通常都会让熟悉当地的地主、乡绅作“向导”，来帮助找到根据地位置所在。作为回报，会在攻克革命根据地后，默许地主、乡绅恢复此前在当地的土地权利，甚至以加重赋税、霸占更多土地的方式，来对农民进行“反攻倒算”。"
 Regionalist_warlords:0 "地方主义军阀"
 Regionalist_warlords_desc:0 "自中原大战之后，虽然明面上蒋介石统一了中国，但是各地的军阀神貌离合，大多数人只关心自己的利益，安心当一个山大王。\n\n§R中央军队无法进入我们的防区§!"
