 lower_education:"传统私塾教育"
 lower_education_desc:"识字率极低，教育以儒家经典为主，缺乏现代科学知识。"
 low_education:"大众扫盲运动"
 low_education_desc:"推行简体字或注音符号，大规模建立夜校和识字班。"
 medium_education:"义务教育奠基"
 medium_education_desc:"立法推行初等义务教育，在全国范围建设标准化小学。"
 high_education:"中等教育扩张"
 high_education_desc:"在每个县建立初级中学，在重要城市建设高级中学和师范学校。"
 higher_education:"高等教育体系"
 higher_education_desc:"建立覆盖文、理、工、农、医的综合性大学和研究型学院。"
 highest_education:"精英人才战略"
 highest_education_desc:"建立研究生院和留学基金，培养能在国际前沿竞争的顶尖人才。"

 farming_development:"农业现代化"
 farming_development_modifier_tooltip:"------------\n£development 农业现代化阶段进度：[?farming_development_var|0]%\n£development 每月现代化进程合计：[?farming_development_monthly_total|+1]%\n£development 进度来源：国家法律（利率、女性地位等）、全国基础设施净增\n£development 进度满101%自动晋升下一等级（不可手动切换）"
 lower_farming:"传统佃农经济"
 lower_farming_desc:"生产关系落后，生产技术停滞，靠天吃饭，单位产量低下。"
 low_farming:"减租与垦荒"
 low_farming_desc:"通过土地制度改革解放生产力，鼓励开垦荒地，扩大耕种面积。"
 medium_farming:"科学种田推广"
 medium_farming_desc:"建立农业试验站，推广优良品种、化肥和基本的病虫害防治。"
 high_farming:"水利设施建设"
 high_farming_desc:"大规模兴修水库、灌溉渠，基本消灭大规模水旱灾害的影响。"
 higher_farming:"机械化农业"
 higher_farming_desc:"在平原地区推广拖拉机、联合收割机等农业机械，建立国营农场。"
 highest_farming:"商品化现代农业"
 highest_farming_desc:"农业实现区域专业化生产，农产品加工和物流发达，农民收入大幅提高。"

 social_development:"社会现代化"
 social_development_modifier_tooltip:"------------\n£development 社会现代化阶段进度：[?social_development_var|0]%\n£development 每月现代化进程合计：[?social_development_monthly_total|+1]%\n£development 进度来源：国家法律（女性地位、工人权利、利率、少数民族权利）、政治点数获得\n£development 进度满101%自动晋升下一等级（不可手动切换）"
 lower_social:"宗族自治社会"
 lower_social_desc:"国家权力仅止于县城，乡村由士绅和宗族长老依照习惯法管理。"
 low_social:"国家权力下沉"
 low_social_desc:"废除乡绅特权，推行保甲制度，将行政组织延伸到乡村。"
 medium_social:"法治体系初建"
 medium_social_desc:"颁布现代民法典和刑法，建立独立的司法体系，打破宗族法。"
 high_social:"公民意识觉醒"
 high_social_desc:"通过媒体、社团和公共活动，培育民众的国家认同感和公共参与意识。"
 higher_social:"福利保障萌芽"
 higher_social_desc:"建立劳工保护法、养老金和失业救济的初步框架。"
 highest_social:"高效组织社会"
 highest_social_desc:"社会具备高度的动员能力和自我管理能力，基层治理实现现代化。"

 industrial_development:"工业现代化"
 industrial_development_modifier_tooltip:"------------\n£development 工业现代化阶段进度：[?industrial_development_var|0]%\n£development 每月现代化进程合计：[?industrial_development_monthly_total|+1]%\n£development 进度来源：国家法律（女性地位、工人权利、利率）、工厂数量净增减\n£development 进度满101%自动晋升下一等级（不可手动切换）"
 lower_industry:"手工业与作坊"
 lower_industry_desc:"工业生产依赖人力、水力，产品以农产品加工和简单消费品为主。"
 low_industry:"初步工业化"
 low_industry_desc:"引进机器设备，建立纺织厂、火柴厂等轻工业工厂。"
 medium_industry:"重工业奠基"
 medium_industry_desc:"建设钢铁联合企业、煤矿和初步的化学工厂，开始生产生产资料。"
 high_industry:"完善工业体系"
 high_industry_desc:"建立包括机械制造、发电设备、基础化工在内的门类齐全的工业。"
 higher_industry:"电气化与自动化"
 higher_industry_desc:"全国主要工业区实现电网覆盖，工业生产开始引入自动化生产线。"
 highest_industry:"创新产业实践"
 highest_industry_desc:"能够自主生产精密机床、仪器仪表和高端合金，工业产能位居世界前列。"

 military_development:"军事现代化"
 military_development_modifier_tooltip:"------------\n£development 军事现代化阶段进度：[?military_development_var|0]%\n£development 每月现代化进程合计：[?military_development_monthly_total|+1]%\n£development 进度来源：国家法律（女性地位、工人权利、少数民族权利）、海陆空作战经验\n£development 进度满101%自动晋升下一等级（不可手动切换）"
 lower_military:"私人军阀武装"
 lower_military_desc:"军队效忠于个人，兵源靠抓丁，装备万国造，缺乏统一训练。"
 low_military:"国家化改造"
 low_military_desc:"统一编制、军服和指挥体系，建立中央军校，培养现代军官团。"
 medium_military:"初步合成化"
 medium_military_desc:"在步兵基础上，开始建设独立的炮兵、工兵和通讯兵部队。"
 high_military:"机械化突击"
 high_military_desc:"建立装甲部队和摩托化步兵，具备大纵深的快速突击能力。"
 higher_military:"诸军兵种协同"
 higher_military_desc:"海、陆、空三军体系完备，能够组织大规模的陆海空协同作战。"
 highest_military:"一体化国防军"
 highest_military_desc:"建立完善的国防动员体系和后勤保障体系，具备在本土进行全维作战并投射力量的能力。"

 medical_development:"医疗现代化"
 medical_development_modifier_tooltip:"------------\n£development 医疗现代化阶段进度：[?medical_development_var|0]%\n£development 每月现代化进程合计：[?medical_development_monthly_total|+1]%\n£development 进度来源：全国基础设施净增、民族精神加成\n£development 进度满101%自动晋升下一等级（不可手动切换）"
 lower_medical:"经验医学体系"
 lower_medical_desc:"基于传统中医和零散西医诊所，主要服务城市富裕阶层。"
 low_medical:"公共卫生启蒙"
 low_medical_desc:"建立初步的防疫体系，推广基础的卫生常识，控制大规模传染病。"
 medium_medical:"基础医疗网络"
 medium_medical_desc:"在主要城镇建立公立医院和诊所，开始普及现代医学诊疗。"
 high_medical:"疾病防控体系"
 high_medical_desc:"建立覆盖全国的疫苗接种计划和流行病监测网络。"
 higher_medical:"专业化医疗时代"
 higher_medical_desc:"细分医学专科，建立医学研究机构，抗生素等现代药物广泛应用。"
 highest_medical:"全民健康工程"
 highest_medical_desc:"医疗资源深入乡村，人均寿命和婴儿死亡率达到世界先进水平。"
