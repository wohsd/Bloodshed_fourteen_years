# ===== 国家法律（政府行：女性地位/工人权利/少数民族；治理行：言论/禁烟/利率/赋税/地方/警察） =====
 bfy_female_laws:0 "女性地位法"
 bfy_worker_laws:0 "工人权利法"
 bfy_interest_laws:0 "利率法"
 bfy_minority_laws:0 "少数民族权利法"
 bfy_female_traditional:0 "传统女教"
 bfy_female_traditional_desc:0 "奉行“女子无才便是德”，妇女缠足、深居闺阁，不参与社会公共生活，也不进学堂读书。占人口一半的人力资源被白白浪费。"
 bfy_female_limited:0 "废止缠足、兴办女学"
 bfy_female_limited_desc:0 "政府下令禁止缠足，创办女子学堂，妇女开始获得接受现代教育的机会，但活动范围仍多限于家庭。"
 bfy_female_workforce:0 "妇女进入工厂与社会"
 bfy_female_workforce_desc:0 "纺织厂、缫丝厂大量招募女工，妇女也开始担任护士、教师、职员。战时她们更是后方生产的重要支柱。"
 bfy_female_equal:0 "法律上男女平等"
 bfy_female_equal_desc:0 "法律规定妇女享有与男子平等的选举权、财产权和受教育权，提倡同工同酬。旧习未除，保守势力对此啧有烦言。"
 bfy_female_full:0 "妇女能顶半边天"
 bfy_female_full_desc:0 "妇女被全面动员起来，进工厂、下田、参军、参政，在各行各业与男子并肩战斗，社会风貌为之一新。"
 bfy_worker_banned:0 "禁止工人结社"
 bfy_worker_banned_desc:0 "工人被禁止组织工会和罢工，工头、帮会、包工层层盘剥，工时长、报酬低、伤亡无人过问。血汗劳动虽能压低工程成本，却积累着社会矛盾。"
 bfy_worker_limited:0 "有限的劳动保护"
 bfy_worker_limited_desc:0 "颁布初步的工厂法规，限制童工、改善学徒待遇，对工伤死亡给予少量抚恤，但工人仍无组织权。"
 bfy_worker_legal:0 "工会合法化"
 bfy_worker_legal_desc:0 "承认工人组织工会和集体谈判的合法权利，劳资关系开始有了正常的沟通渠道。"
 bfy_worker_eight_hours:0 "八小时工作制"
 bfy_worker_eight_hours_desc:0 "法定每日工作八小时，改善劳动条件。工人的积极性与社会安定提升，雇主的成本也随之增加。"
 bfy_worker_control:0 "工人监督生产"
 bfy_worker_control_desc:0 "工人成立组织直接参与乃至监督工厂管理，劳动者第一次感到自己是工厂的主人。旧管理人员的抵触使初期效率受到影响。"
 bfy_interest_usury:0 "高利贷盘剥"
 bfy_interest_usury_desc:0 "民间“印子钱”“驴打滚”盛行，月息可达十分以上。农民一旦举债便永世不得翻身，大量土地落入债主之手，实业更无从谈起。"
 bfy_interest_high:0 "高息民间借贷"
 bfy_interest_high_desc:0 "资金主要由钱庄、当铺和富户提供，利息高昂，月息五至十分。借贷者勉强维持，扩大生产则力不从心。"
 bfy_interest_moderate:0 "钱业公会行规"
 bfy_interest_moderate_desc:0 "钱庄票号通过同业公会规范利息，月息约二三分。金融秩序初步建立，但现代银行信用仍不发达。"
 bfy_interest_low:0 "官办银行放贷"
 bfy_interest_low_desc:0 "国家银行和省立银行以较低利息向工商业者和农民放贷，月息降至一分上下，资金开始流向生产领域。"
 bfy_interest_development:0 "政策性低息信贷"
 bfy_interest_development_desc:0 "设立实业银行、农民银行，以政策贴息扶持工矿、交通和农业改良，低息信贷成为推动建设的杠杆。"
 bfy_interest_zero:0 "无息配给信贷"
 bfy_interest_zero_desc:0 "在全面统制或计划经济体制下，国家按计划向企业和集体单位提供无息信贷，资金完全服务于建设目标。"
 bfy_minority_oppression:0 "民族压迫"
 bfy_minority_oppression_desc:0 "对蒙、回、藏、苗等民族实行压迫与防范，歧视、征掠、改土归流并举。高压之下政治控制看似稳固，边地却暗流涌动。"
 bfy_minority_assimilation:0 "强制同化"
 bfy_minority_assimilation_desc:0 "强令少数民族改用汉语、改从汉俗，甚至禁用本民族语言文字。同而未化，怨恨深藏。"
 bfy_minority_recognition:0 "五族共和"
 bfy_minority_recognition_desc:0 "形式上承认各民族一律平等，以五色旗象征汉满蒙回藏共和，少数民族的法律地位开始得到承认。"
 bfy_minority_autonomy:0 "民族区域自治"
 bfy_minority_autonomy_desc:0 "在少数民族聚居地区实行区域自治，任用本民族人士管理本民族事务，边疆趋于安定。"
 bfy_minority_equality:0 "各民族一律平等"
 bfy_minority_equality_desc:0 "各民族在政治、经济、文化上完全平等，少数民族群众被广泛动员进国家建设和军队之中。"

# ===== 国家法律：言论/禁烟/土地 / 赋税/地方/警察/宪政/司法 =====
 bfy_state_laws:0 "国家治理"
 bfy_speech_laws:0 "言论管控法"
 bfy_opium_laws:0 "禁烟禁毒法"
 bfy_tax_laws:0 "赋税制度"
 bfy_local_power_laws:0 "地方权力分配"
 bfy_police_laws:0 "警察治安法"

 bfy_speech_free:0 "言论自由"
 bfy_speech_free_desc:0 "开放报禁、书禁与集会结社，舆论可以公开批评政府，思想界百家争鸣；但流言异说也容易蛊惑人心。"
 bfy_speech_limited:0 "依法登记"
 bfy_speech_limited_desc:0 "出版物依法登记注册，言责自负，政府不作事前审查，报业在法律框架内正常运作。"
 bfy_speech_censored:0 "新闻检查"
 bfy_speech_censored_desc:0 "设立新闻检查所，凡涉军事、外交、治安的稿件一律送检，不合意者予以撤改。"
 bfy_speech_monopoly:0 "邮电检查"
 bfy_speech_monopoly_desc:0 "对邮电、印刷品实施普遍检查，异见报刊在邮路即被扣留，难以送达读者手中。"
 bfy_speech_total:0 "舆论统制"
 bfy_speech_total_desc:0 "一切传媒纳入统制，只许一个声音，舆论高度一律，思想界万马齐喑。"

 bfy_opium_strict:0 "严禁鸦片"
 bfy_opium_strict_desc:0 "限期戒断，烟民登记、烟馆取缔，违者处以重刑。忍受短痛之后，国民体魄为之一振。"
 bfy_opium_license:0 "渐禁特许"
 bfy_opium_license_desc:0 "分期渐禁，特许戒烟药料、公膏凭照售卖，以六年为期逐步禁绝，即所谓“二年禁毒、六年禁烟”。"
 bfy_opium_tax:0 "寓禁于征"
 bfy_opium_tax_desc:0 "对鸦片课以重税，借高税禁吸。名义上是禁烟，实则把烟税当成了一项重要财源。"
 bfy_opium_monopoly:0 "官膏专卖"
 bfy_opium_monopoly_desc:0 "政府设局官收官卖鸦片烟膏，烟利尽入官府，而吸食者并未见减少。"
 bfy_opium_open:0 "鸦片公卖"
 bfy_opium_open_desc:0 "鸦片公开种植、运输、贩卖，烟馆林立，以此充作军费政费，国民身心俱受其害。"


 bfy_tax_light:0 "轻徭薄赋"
 bfy_tax_light_desc:0 "废除苛捐杂税、与民休息，百姓安居、百业复苏，而府库开支难免拮据。"
 bfy_tax_normal:0 "依率计征"
 bfy_tax_normal_desc:0 "按既定税则征收田赋、关税、统税，税负平稳，财政收支大体平衡。"
 bfy_tax_reform:0 "整顿税务"
 bfy_tax_reform_desc:0 "裁撤厘金、改征统税，整顿关税与盐税，财税制度趋于近代化。"
 bfy_tax_surtax:0 "加征苛捐"
 bfy_tax_surtax_desc:0 "正税之外层层加派田赋附加与各色苛捐，名目繁多，民间怨言渐起。"
 bfy_tax_heavy:0 "横征暴敛"
 bfy_tax_heavy_desc:0 "为应军需而竭泽而渔，钱粮捐税无所不用其极，民不聊生，税源也随之枯竭。"

 bfy_local_confederation:0 "联省自治"
 bfy_local_confederation_desc:0 "各省自定省宪、自选省长，中央仅司外交军事，颇近于联邦之治。"
 bfy_local_selfgovernment:0 "地方自治"
 bfy_local_selfgovernment_desc:0 "推行县乡地方自治，由地方人士参与议事，中央对地方的约束较为宽松。"
 bfy_local_supervise:0 "督导县区"
 bfy_local_supervise_desc:0 "向地方派遣督导专员，在地方自治与中央控制之间采取折中。"
 bfy_local_centralization:0 "中央集权"
 bfy_local_centralization_desc:0 "收回地方用人、财税大权，重要官员悉由中央任免，政令渐能直达基层。"
 bfy_local_unification:0 "政令统一"
 bfy_local_unification_desc:0 "全国政令军令完全统一，中央垂直管理，地方尾大不掉之弊由此根除。"

 bfy_police_professional:0 "专业警政"
 bfy_police_professional_desc:0 "建立受过专业训练、职责分明的现代警察体系，治安维护与权利保障兼顾。"
 bfy_police_modern:0 "新式警察"
 bfy_police_modern_desc:0 "在城镇设立新式警察局、派出所维持交通与治安，逐步取代旧的衙役捕快。"
 bfy_police_baojia:0 "保甲制度"
 bfy_police_baojia_desc:0 "编组保甲、连坐互保，以户籍管束治安，政府对基层社会的控制力大为增强。"
 bfy_police_militia:0 "商团民团"
 bfy_police_militia_desc:0 "地方治安主要依靠商团、民团等武装维持，各管一段，体制参差不一。"
 bfy_police_lax:0 "治安废弛"
 bfy_police_lax_desc:0 "警察制度残缺不全，土匪、帮会横行乡里，治安败坏，百姓难得安宁。"


###BFY 军校与外国顾问###
 BFY_academy_baoding:0 "保定陆军军官学校"
 BFY_academy_baoding_desc:0 "中国近代第一所正规陆军军官学校，培养了大批优秀军官。控制保定后启用。"
 BFY_academy_whampoa:0 "黄埔军校"
 BFY_academy_whampoa_desc:0 "位于广州的著名军官学校，毕业生以实战能力和高昂士气著称。控制广州后启用。"
 BFY_academy_nanjing:0 "中央陆军军官学校"
 BFY_academy_nanjing_desc:0 "设于南京的最高军事学府，教学体系完整。控制南京后启用。"
 BFY_academy_mukden:0 "东北陆军讲武堂"
 BFY_academy_mukden_desc:0 "东北军最高军事学府，重视实战训练。控制沈阳后启用。"
 BFY_academy_kunming:0 "云南陆军讲武堂"
 BFY_academy_kunming_desc:0 "历史悠久的西南军事学府，学员吃苦耐劳、长于山地作战。控制昆明后启用。"
 BFY_academy_mawei:0 "马尾海军学校"
 BFY_academy_mawei_desc:0 "中国近代最早的海军学堂，培养海军军官与舰船人才。控制福州后启用。"
 BFY_academy_jianqiao:0 "笕桥中央航空学校"
 BFY_academy_jianqiao_desc:0 "设于杭州的中国空军摇篮，飞行员训练严格、士气高昂。控制杭州后启用。"
 BFY_academy_japan_army:0 "陆军士官学校"
 BFY_academy_japan_army_desc:0 "日本陆军军官的摇篮，士官生战术素养极高，崇尚进攻精神。"
 BFY_academy_japan_staff:0 "陆军大学校"
 BFY_academy_japan_staff_desc:0 "日本陆军最高学府，培养参谋与高级指挥官。"
 BFY_academy_japan_navy:0 "海军兵学校"
 BFY_academy_japan_navy_desc:0 "位于江田岛的日本海军军官学校，训练严苛，航海与炮术精湛，尤以夜战见长。"
 BFY_academy_japan_navy_staff:0 "海军大学校"
 BFY_academy_japan_navy_staff_desc:0 "日本海军最高学府，培养舰队参谋与航空兵运用人才。"
 BFY_academy_japan_air:0 "陆军航空士官学校"
 BFY_academy_japan_air_desc:0 "日本陆军航空兵军官学校，飞行员素质较高。"
 BFY_academy_japan_air_staff:0 "航空兵学校"
 BFY_academy_japan_air_staff_desc:0 "日本航空兵最高学府，培养航空参谋与高级飞行员。"
 BFY_foreign_advisor_germany:0 "德国军事顾问团"
 BFY_foreign_advisor_germany_desc:0 "德国顾问帮助整训部队、改进装备与战术，对陆军现代化助益良多。"
 BFY_foreign_advisor_japan:0 "日本军事顾问团"
 BFY_foreign_advisor_japan_desc:0 "日本顾问带来的日式操典与装备体系，在后勤与训练上有所助益。"
 BFY_foreign_advisor_usa:0 "美国军事顾问团"
 BFY_foreign_advisor_usa_desc:0 "美国顾问与援助物资显著提升了空军作战能力与后勤水平。"
 BFY_foreign_advisor_ussr:0 "苏联军事顾问团"
 BFY_foreign_advisor_ussr_desc:0 "苏联顾问带来航空队与装甲装备援助，提升了空军与装甲部队战力。"
 BFY_foreign_advisor_uk:0 "英国军事顾问团"
 BFY_foreign_advisor_uk_desc:0 "英国顾问在海军建设与军官训练方面提供了帮助。"
 BFY_foreign_advisor_france:0 "法国军事顾问团"
 BFY_foreign_advisor_france_desc:0 "法国顾问协助整训陆军，提供装备与战术指导。"
 BFY_foreign_advisor_italy:0 "意大利军事顾问团"
 BFY_foreign_advisor_italy_desc:0 "意大利顾问在航空与海军建设方面提供了援助。"
 BFY_foreign_advisor_whiterussia:0 "白俄军事顾问团"
 BFY_foreign_advisor_whiterussia_desc:0 "流亡的白俄军官以雇佣兵与顾问身份服役，带来一些实战经验，但缺乏稳定的后勤保障。"
 military_academy_trait:0 "军事院校"
 naval_academy_trait:0 "海军院校"
 air_academy_trait:0 "航空院校"
 foreign_advisor_trait:0 "外国军事顾问"
