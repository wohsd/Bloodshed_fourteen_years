 Soviet_district_spirit:0 "落后的根据地"
 Soviet_district_spirit_desc:0 "虽然我们深得苏区民意，但现实问题是我们的根据地缺乏基础的工业设备，以至于能批量生产枪支的工厂都寥寥无几。大部分枪支和弹药需要从外界购买以及战斗中缴获取得。"
 AB_spirit:0 "AB团"
 AB_spirit_desc:0 "AB团全称Anti-BolslovK League，反布尔什维克，是1926年11月底至12月间国民党右派在南昌秘密成立的一个组织，AB团的主要目的和任务是与共产党争夺国民党党内领导权，并从事一系列反共活动。"
 AB_spirit1:0 "AB团"
 AB_spirit1_desc:0 "AB团全称Anti-BolslovK League，反布尔什维克，是1926年11月底至12月间国民党右派在南昌秘密成立的一个组织，AB团的主要目的和任务是与共产党争夺国民党党内领导权，并从事一系列反共活动。"
 The_impact_Lisan_route:0 "立三路线的影响"
 The_impact_Lisan_route_desc:0 "尽管立三同志引咎辞职后前往苏联，但其立三路线的影响仍存在于军中。"
 Extreme_democratization:0 "极端民主化"
 Extreme_democratization_desc:0 "红军中部分同志主张实行“由下而上的民主集权制”，要求上级决议先交下级讨论、凡事皆须开会表决。这种极端民主化倾向导致军令政令难以贯彻、决策迟缓、组织纪律涣散，严重削弱了部队的集中统一指挥。古田会议虽对其作出批评纠正，但其残余影响仍未完全肃清。"
 Leftism:0 "左倾冒险主义"
 Leftism_desc:0 "莫斯科派来的王明、博古等人提出，党内的主要危险不是“左”，而是“右倾”。强调要实行“进攻路线”，主张在湘鄂赣各省“真正实现一省或几省的首先胜利，进而推进与争取全国范围内的胜利”。"
 Revolutionary_base:0 "苏区精神"
 Revolutionary_base_desc:0 "大革命失败后，进入民主革命阶段最长的土地革命战争时期。中国共产党领导的武装起义如火如荼，遍及全国12个省、约150个县的广大地区，建立了一个又一个革命根据地，即苏区。影响甚大的苏区达13个，其鼎盛时期的面积共约40余万平方公里、辖人口3000万，星星之火成燎原之势。"
 Local_outpost:0 "地方哨站"
 Local_outpost_desc:0 "得益于强大的群众基础，这使得百姓可以在敌军来临前及时向我们汇报。"
 Extensive_conscription:0 "动员群众"
 Extensive_conscription_desc:0 "动员群众"
 Death_in_March:0 "三月亡华论"
 China_Offensive:0 "对华作战计划"

 Great_Purge_Western_Hunan_Hubei:0 "湘鄂西肃反"
 Great_Purge_Western_Hunan_Hubei_desc:0 "湘鄂西肃反是夏曦发起的一项肃反运动，毫不夸张地说，红三军上下没有人愿意担任军官，因为当了军官就要随时面对夏曦的盘查，以致于给自己带来杀身之祸，所以士兵们宁愿混日子也不愿当军官。"

 Great_Purge_White_Sparrow_Garden:0 "白雀园大肃反"
 Great_Purge_White_Sparrow_Garden_desc:0 "张国焘以“审干锄奸”为由，首先将苏区保卫局从曾中生手中接了过来，并在很短的时间里，将原先仅有几十人的保卫局扩编到营级规模。并仿照苏联“全俄肃反委员会”的组织结构和纪律条令，将苏区保卫局的职能明确为：消灭和制止一切可能危及革命的个人和组织，用一切非常手段，同一切异已分子作斗争。"

 Long_March_Trauma:0 "长征的创伤"
 Long_March_Trauma_desc:0 "长征出发时中央红军约8.6万人，到达陕北时仅剩约7000人。部队减员严重，伤病员多，武器装备匮乏，战斗力亟待恢复。"
 Shortage_commanders_fighters:0 "指战员人才缺失"
 Shortage_commanders_fighters_desc:0 "几次重大战役下来，红军的不少高级指战员牺牲在了长征路途中，我们急需更多的指挥型人才"
 Closed_economy:0 "封闭经济"
 Closed_economy_desc:0 "转战陕北后，国民党军依旧不依不饶，接连开展了几次大范围的围剿活动，意图将红军困死在陕北"
 Challenged_authority:0 "受到挑战的权威"
 Challenged_authority_desc:0 "尽管长征的胜利确立的毛泽东等人的领导方向是准确无误的，但党内还有不少人仍旧质疑毛派的权威。"


 The_spirit_Nanniwan:0 "南泥湾精神"
 The_spirit_Nanniwan_desc:0 ""

 Mass_production_movement:0 "大生产运动"
 Mass_production_movement_desc:0 ""

 Rent_interest_reductions:0 "减租减息"
 Rent_interest_reductions_desc:0 ""

 Three_three_system_border_areas:0 "边区三三制"
 Three_three_system_border_areas_desc:0 ""

 PRC_Economic_crisis_effect:0 "入不敷出的经济"
 PRC_Economic_crisis_effect_desc:0 "我们边区的经济完全依赖蒋介石政府所给予的军饷，大多数情况都得依靠自给自足。"

 People_red_Army:0 "人民军队"


 PRC_yanan_arsenal_organization:0 "延安兵工厂"

 Provisional_Committee_Uprising:0 "临委会起义"
 Civil_War_Trauma:0 "内战创伤"
 Civil_War_Trauma_desc:0 "多年的内战在军队、工业与行政体系上都留下了深深的伤痕。通过「重建工作」决议逐步医治：军事创伤（组织度与恢复）、工业创伤（建造速度与工厂产出）、机构创伤（政治点数与稳定度）各为独立等级，全部抚平后本状况即告终结。"
 People_Armed_Forces:0 "人民武装"
 People_Armed_Forces_desc:0 "深入群众之后，根据地的工农青壮普遍被编入民兵与地方武装。他们装备简陋、训练有限，但人数众多、熟悉乡土，是革命政权最深厚的兵源与防线。武备库、速成轮训与难民安置能让这支武装略微像样一些——但也仅仅是略微。"
 National_Revolutionary_Army:0 "国民革命军"
 National_Revolutionary_Army_desc:0 "这支由革命军官团统带的精锐武装，承袭了国民革命军的番号与正统。人数不多，却是临委会麾下最可靠的突击力量。敢死队的决死意志与军功奖励的厚赏，能让这支小规模精兵在关键时刻发挥超出数量的作用。"
 Political_Department:0 "政治部"
 Three_Major_Policies_Nominal:0 "三大政策：名存实亡"
 Three_Major_Policies_Nominal_desc:0 "联俄、联共、扶助农工——三大政策写在纸上，却处处打折。承认苏区换取了共产党人的合作，但两党之间的猜忌远未消弭。"
 Three_Major_Policies_Initial:0 "三大政策：初步推行"
 Three_Major_Policies_Initial_desc:0 "第二次国共合作达成后，三大政策第一次得到像样的推行。两党军队并肩作战，民众动员的深度也前所未有。"
 RFC_second_united_front_refused:0 "拒绝联合政府"


 Sichuan_Army:0 "川军"
 Sichuan_Army_desc:0 "“失志报国，血沃中原” —— 川军将士于国家危亡之际，以最简陋的装备与最炽热的赤诚，走出天府之国，奔赴尸山血海的前线。他们脚穿草鞋，身背老套筒，却无惧强敌，在无数惨烈战场上战斗至最后一兵一卒。其牺牲之壮烈，足以惊天地、泣鬼神，用血肉谱写了‘无川不成军’的悲壮史诗。"

 Yunnan_Army:0 "滇军"  
 Yunnan_Army_desc:1 "“国之劲旅，纪律严明” —— 滇军依托云南相对稳定的后方和自给自足的军事工业，装备整齐，训练有素。他们头戴的法式钢盔是其标志。滇军以其坚韧与牺牲，证明了这是一支不可或缺的卫国力量。"

 Guangdong_Army:0 "粤军"  
 Guangdong_Army_desc:1 "“革命先锋，善打硬仗” —— 作为近代革命的摇篮，粤军思想开明，装备精良，官兵有着强烈的民族意识与果敢的战斗作风。粤籍子弟用鲜血诠释了何为决死精神，名将辈出，战功彪炳。"

 Guangxi_Army:0 "桂军"  
 Guangxi_Army_desc:1 "“广西狼兵，雄于天下” —— 桂军以其彪悍的民风、顽强的意志和卓越的山地作战能力闻名。在李宗仁、白崇禧的率领下，这支戴着独特“托尼帽”的军队，以其无畏的牺牲，赢得了全国的敬畏。"

