l_simp_chinese:
 # 东北军「联共抗日」国策线架空历史事件

 ROD_uf.1.t:0 "停止内战，联共抗日"
 ROD_uf.1.d:0 "街头上，东北军士兵与请愿学生相对而立，枪口之下是同样喊着「打回老家去」的同胞。少帅在督署里踱了一夜——十四万东北军背井离乡四年，再打下去，打的还是中国人。次日清晨，他签下了停止内战、联共抗日的密令。"
 ROD_uf.1.a:0 "枪口一致对外"

 ROD_uf.2.t:0 "白山黑水间的义勇军"
 ROD_uf.2.d:0 "东北军开始成批输送枪械、派遣军官，向辽吉黑各地的民众武装发放番号与粮饷。猎户、矿工、溃兵、学生纷纷来投，白山黑水间第一次有了成建制的抗日队伍——他们称自己为「义勇军」。"
 ROD_uf.2.a:0 "发枪募兵，扩充义勇军"

 ROD_uf.4.t:0 "与东北抗日联军并肩"
 ROD_uf.4.d:0 "东北军与杨靖宇、赵尚志等领导的抗日联军达成协作：义勇军提供向导与情报，抗联分担正面压力。两支曾在同一片林海雪原里各自苦战的队伍，终于把番号连在了一起。"
 ROD_uf.4.a:0 "联合抗联，共同作战"

 ROD_uf.7.t:0 "接受中共领导"
 ROD_uf.7.d:0 "中共方面提出，抗日武装应统一于党的领导下作战。少帅面临抉择：把东北军的命运交给陕北的窑洞，还是守住这支军队最后的独立性？"
 ROD_uf.7.a:0 "承认中共领导"
 ROD_uf.7.b:0 "保持东北军的独立性"

 ROD_uf.13.t:0 "血债血偿"
 ROD_uf.13.d:0 "如今的日军早已日薄西山，我们需要一次彻底的总攻，将日本人赶出东北，唯有清算血债，才能还我河山。"
 ROD_uf.13.a:0 "清算血债，还我河山"
