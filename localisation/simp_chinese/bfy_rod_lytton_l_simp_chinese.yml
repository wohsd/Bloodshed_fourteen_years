l_simp_chinese:
 # 九一八事变后的国联李顿调查团事件链

 ROD_lytton.1.t: "国联决议派遣调查团"
 ROD_lytton.1.d: "九一八事变后，南京政府向国际联盟提出申诉。1931年12月10日，国联理事会通过决议，决定派遣以英国李顿爵士为首的五人调查团赴远东，调查中日冲突。消息传到北平，张学良与幕僚连夜商讨：调查团能否挡住关东军的脚步，东北的命运又是否能交由远在日内瓦的会议桌裁决？"
 ROD_lytton.1.a: "寄望国联公理"

 ROD_lytton.2.t: "李顿调查团抵华"
 ROD_lytton.2.d: "1932年4月，李顿调查团抵达中国，先后赴上海、南京、北平，随后进入东北实地调查。东北军方面竭力提供九一八之夜的材料与证人，关东军却以「满洲国已成立」为由百般阻挠。调查团所到之处，民众夹道痛哭，东北沦陷的真相第一次呈现在世界面前。"
 ROD_lytton.2.a: "向调查团呈交证据"

 ROD_lytton.3.t: "《李顿报告书》公布"
 ROD_lytton.3.d: "1932年10月2日，《李顿报告书》在日内瓦公布。报告书认定九一八事变系日方预谋，伪满洲国并非出自民众自愿，却又主张东北实行国际共管，既不承认中国对东北的主权完整，也不肯开罪日本。张学良读罢，掷书于案：国联既不敢制裁，公理便只是一纸空文。"
 ROD_lytton.3.a: "公理难救东北"

 ROD_lytton.4.t: "国联通过报告书，日本退出国联"
 ROD_lytton.4.d: "1933年2月24日，国联大会以四十二票对一票通过《李顿报告书》，仅日本一国反对。三月，日本正式宣布退出国联，从此更加肆无忌惮。关东军随即进犯热河，长城烽火再起。张学良终于明白：东北的命运，终究只能靠中国人自己的枪杆子。"
 ROD_lytton.4.a: "丢掉幻想，准备抵抗"

 # --- 对应的全球新闻 ---
 ROD_lytton.10.t: "国联决定调查满洲事态"
 ROD_lytton.10.d: "国际联盟理事会今日在日内瓦通过决议，决定派遣由英、美、法、德、意五国代表组成的调查团，前往远东调查中日冲突。调查团由英国李顿爵士主持，将赴中国本土与东北各地实地取证。日本代表在会场冷眼旁观——东京从未打算让国联插手满洲。"
 ROD_lytton.10.a: "关注日内瓦的动向"

 ROD_lytton.11.t: "李顿调查团抵华"
 ROD_lytton.11.d: "国联李顿调查团今日抵达上海，随后将赴南京、北平，并进入东北实地调查九一八事变真相。中国政府向调查团提交了大批证词与文件，日本方面则抢先扶植「满洲国」，以既成事实阻挠调查。东北各地民众沿途痛哭请愿，要求国联主持公道。"
 ROD_lytton.11.a: "静观调查结果"

 ROD_lytton.12.t: "《李顿报告书》发表"
 ROD_lytton.12.d: "国联调查团今日公布《李顿报告书》。报告书认定九一八事变系日本预谋，伪满洲国并非当地民众自决的产物，同时却主张东北由国际共管，既未承认中国对东北的主权完整，也不肯对日本实施制裁。这份报告在南京与东京都激起不满，世界舆论为之哗然。"
 ROD_lytton.12.a: "公理不过如此"

 ROD_lytton.13.t: "日本退出国际联盟"
 ROD_lytton.13.d: "国际联盟大会以四十二票对一票通过《李顿报告书》，仅日本一国投下反对票。日本随即宣布退出国联，德国亦于不久后效仿。国联对满洲事变的调停至此彻底失败，关东军更加有恃无恐，热河与长城一线战云密布。"
 ROD_lytton.13.a: "国联已形同虚设"

