l_simp_chinese:
 Contact_the_old_warlords: "接受广州的条件"
 Contact_the_old_warlords_desc: "广州国民政府提出了一系列合作条件，接受这些条件意味着我们将与广州方面建立统一战线，共同对抗南京的反动势力。这是实现国家统一的重要一步。"
 Left_wing_stronghold: "左派联合阵线"
 Left_wing_stronghold_desc: "联合所有国民党左派力量，建立统一的左派阵线。团结一切进步力量，共同反对右派反动派，为实现真正的三民主义而奋斗。"
 new_focus_1: "解决军队开支"
 new_focus_2: "推行部队经商"
 new_focus_3: "开展反腐行动"
 new_focus_4: "开设物资管理局"
 new_focus_5: "分区配给制"
 new_focus_6: "与军阀合作"
 new_focus_7: "业务战略化"
 new_focus_8: "默许留守处"
 new_focus_9: "建设贸易网络"
 new_focus_10: "放权哨卡"
 new_focus_11: "设立督察组"
 new_focus_1_desc: "高昂的军功奖励与大量的劳工大大提高了军队的战斗力，但也增添了庞大的军队开支。目前我们尚能勉强维持住国家开支，但也无力开展经济建设和推动制度改革，解决军队开支问题迫在眉睫。"
 new_focus_2_desc: "开展部队经商可以在军费不足的情况下缓解军队开支问题，同时改善部队自身的生活和装备条件。现在的国家发展战略是以经济建设为中心，集中有限财力用于国家重建工作。"
 new_focus_3_desc: "军队是国家安全的最后一道防线，它的唯一宗旨是“能打仗、打胜仗”。腐败的军队没有战斗力，无法保卫国家；腐败的军队失去忠诚，会颠覆政权；腐败的军队脱离人民，将失去存续的土壤。\n保持军队的纯洁性，这不仅是军事问题，更是政治问题，是确保国家“柱石”永远坚固的必然选择。"
 new_focus_12: "三个公开原则"
 new_focus_13: "推行财务连坐"
 new_focus_12_desc: "“三个公开”即人事公开、财务公开、意见公开。规定财务人员不得随长官离任，防止形成私人账房。"
 new_focus_13_desc: "一旦发现主官贪污，其直属上级和同级军需官必须承担连带责任。贪污军饷、倒卖军火、克扣军粮者，无论数额大小，一律死刑。"
 new_focus_14: "后勤统一"
 new_focus_15: "打击走私路线"
 new_focus_16: "推行点验制度"
 new_focus_17: "军队国家化"
 new_focus_16_desc: "设立常设的、不打招呼的点验组，定期或不定期突击检查部队的粮秣、被服、弹药库存和人员名册，严查“吃空额”和盗卖军需"
 new_focus_14_desc: "所有战略物资由中央政府统一收购、统一出口，切断军队与市场的直接联系。"
 new_focus_5_desc: "根据防区划分物资进出口权限，由当地最高军事长官负责，所得利润按比例上缴“联合政府”财政。"
 new_focus_4_desc: "允许各部队成立“物资管理局”，将经商纳入政府特许经营范畴，以解决军费不足。"
 new_focus_8_desc: "留守处可以极大的激发军官们的经商热情，不仅能作为物资的储存仓库，更有利军官与政府的团结。眼下国家刚刚发生巨变，正式发扬“精诚团结”的重要时刻！"
 new_focus_101_desc: "“留守处”——这些实际上是军官养情妇、藏财物、做生意的大本营。不仅严重腐败了党国的军官，维护留守处更是动用了大量的军事力量，这样的设施不能有任何存留的余地。"
 new_focus_15_desc: "关闭一切与敌占区的非法贸易通道，尤其是涉及战略物资的走私活动。"
 new_focus_11_desc: "无论哨卡是否偏远，无论哨卡规模大小，随时进行突击检查。坚决杜绝哨卡收取过路费甚至掩护走私相关的一切行为"
 new_focus_17_desc: "军风纪非但为军队之命脉，实关系抗战之胜败与国家之存亡，败坏了军风纪便是军队的自杀。军人的首要目的就是要保护国民，理解国民，爱护国民，学习如何真正的与国民和谐相处。"
 new_focus_100_desc: "军队要发挥自身优势，利用政策支持与军事设施大力开展经商活动。军医院，维修连，甚至军工厂统统都可以投入到党国的经济当中。要将军队与老百姓紧密的结合到一起，体现党国的军民和谐。"
 new_focus_9_desc: "要致富就要先修路，现有的基础设施严重限制了“军商一体”的发展。建设和修缮道路不仅能提高通商的效率更是一件有利于国民日常通行的好事。"
 new_focus_10_desc: "建设道路及其维护产生了大量的开支，而哨卡的士兵也是要吃饭的嘛。我们支持士兵们发挥自己的经商才能，过路的商人和群众会支持他们的“商业活动”"
 new_focus_6_desc: "大家都是青天白日之下的好同志，何必彼此敌对？正式党国经济建设的关键时刻，何不握手言和，实现共同富裕？"
 new_focus_7_desc: "我们的生产报告一片欣欣向荣！甚至已经出现“生产过剩 ”的情况了，而我们的商业伙伴们也正好需要这些资源，为什么不和他们做交易呢？"
 new_focus_18: "军队战斗力问题"
 new_focus_18_desc: "国民党右派背叛革命后，军队腐化严重，战斗力大幅下降。我们必须重振军威，整顿军纪，淘汰不合格军官，建立一支真正能为平民利益而战的革命军队。"
 new_focus_19: "新训政"
 new_focus_20: "第三条道路"
 Leftist_United_Front: "左派联合阵线"
 Leftist_United_Front_desc: "联合所有进步力量，建立广泛的左派统一战线。团结国民党左派、民主党派和爱国人士，共同反对独裁统治，争取民主自由。"
 The_Final_Battle: "加入民主同盟"
 The_Final_Battle_desc: "在民主革命的关键时刻，加入中国民主同盟，与各民主党派携手合作，共同推动政治协商，建立联合政府，实现国家的和平与统一。"
 new_focus_21: "颁布《耕地暂行条例》"
 new_focus_22: "全面推广减租减息"
 new_focus_23: "开展土地平权运动"
 new_focus_23_desc: "土地问题是中国革命的核心问题。我们主张“耕者有其田”，彻底解决农民的土地需求，通过土地平权实现社会公平，为第三条道路的实践奠定坚实基础。"
 new_focus_24: "工会与农会"
 new_focus_24_desc: "组织工人和农民成立工会与农会，这是实现平民政治的重要基础。通过工会维护工人权益，通过农会保障农民利益，使工农成为国家的主人。"
 new_focus_25: "精兵强将"
 new_focus_25_desc: "裁撤冗员，淘汰老弱病残，选拔优秀官兵组成精锐部队。建立严格的训练体系，提高士兵素质和战斗技能，打造一支能征善战的劲旅。"
 new_focus_26: "生根发展"
 new_focus_26_desc: "军队不仅要能打仗，更要能建设。在驻地开展生产建设，帮助地方发展经济，与人民群众建立血肉联系，使军队真正扎根于人民之中。"
 new_focus_27: "改善军纪"
 new_focus_27_desc: "军纪涣散是当前军队的一大弊病。必须严肃军纪，禁止士兵骚扰百姓、强买强卖，做到“不拿群众一针一线”，恢复人民军队的优良传统。"
 new_focus_28: "遏制山头主义"
 new_focus_28_desc: "各派系各自为政，形成独立王国，严重削弱了军队的统一指挥和战斗力。必须打破派系壁垒，建立统一的指挥体系，确保军令畅通。"
 new_focus_29: "积极缴获装备"
 new_focus_29_desc: "与反动派作战不仅是为了消灭敌人，更是为了获取武器装备来武装自己。通过战场缴获，不断补充和更新我们的武器装备，增强部队战斗力。"
 new_focus_30: "学习政委制度"
 new_focus_30_desc: "借鉴苏联红军的政治工作经验，建立政委制度。政委负责部队的思想政治工作，确保军队始终坚持正确的政治方向，保持高昂的战斗意志。"
 new_focus_31: "扩大国防生产"
 new_focus_31_desc: "战争需要充足的物资保障。必须大力发展国防工业，建立兵工厂、弹药厂，扩大武器装备的生产规模，实现武器装备的自给自足。"
 new_focus_32: "坚持”三位一体“"
 new_focus_32_desc: "实行军政一体化的管理模式，将军事、政治、经济工作有机结合起来。军队不仅要保卫国家，还要参与国家建设，实现军民融合发展。"
 new_focus_103: "职业化军队"
 new_focus_33: "军官指导团"
 new_focus_33_desc: "建立军官指导团，对各级军官进行系统培训，提高指挥能力和战术水平。培养一批既有军事素养又有政治觉悟的优秀军官，为军队现代化建设奠定人才基础。"
 new_focus_34: "劳武结合"
 new_focus_34_desc: "贯彻“劳武结合”的方针，让士兵在训练之余参与生产劳动。既可以减轻国家负担，又能培养士兵的劳动观念，实现一手拿枪、一手拿镐的目标。"
 new_focus_35: "推广本地战法"
 new_focus_35_desc: "中国地域广阔，地形复杂，必须发展适合本土作战的战术。推广游击战、运动战等灵活机动的战法，扬长避短，以弱胜强，有效打击反动派势力。"
 new_focus_36: "兵役改革"
 new_focus_36_desc: "改革现行兵役制度，建立义务兵役制与志愿兵役制相结合的体制。广泛动员人民群众参军，扩大兵源，同时保障士兵权益，提高军队的吸引力和凝聚力。"
 new_focus_37: "军队职业化"
 new_focus_37_desc: "军队是人民的军队，必须全心全意为人民服务。我们的军队来自人民、依靠人民、为了人民，要始终保持与人民群众的血肉联系，成为保卫人民利益的坚强后盾。"
 new_focus_38: "民主的胜利？"
 new_focus_38_desc: "国民党右派背叛革命，抛弃了孙中山先生的三大政策。我们作为国民党左派，必须高举民主与进步的旗帜，与反动派进行坚决斗争，争取民主革命的最终胜利。"
 new_focus_20_desc: "1930年邓演达发表的《中国国民党临时行动委员会政治主张》，明确提出“解放中国民族，建立以农工为中心的平民政权”的纲领。我们走的是既非资本主义也非共产主义的第三条道路，是适合中国国情的独特发展道路。"
 new_focus_19_desc: "新政权十分缺乏合法性，好在我们与汪精卫确立了合作关系，即便道路不同，这位文人政客依然是当下党国最需要的名誉主席"
 new_focus_39: "试行平民代表会议"
 new_focus_39_desc: "邓演达主张“平民政治”，认为国家权力应归属于农工及其他平民群众。在基层试行平民代表会议制度，由工人、农民、士兵和知识分子代表组成，参与地方事务的管理和决策，体现“主权在民”的原则。"
 new_focus_41: "扶持合作社经济"
 new_focus_41_desc: "合作社是实现第三条道路经济的重要形式。通过扶持农业合作社、手工业合作社，帮助农民和手工业者组织起来，共同发展生产，提高收入，逐步实现共同富裕。"
 new_focus_40: "过渡期的经济政策"
 new_focus_40_desc: "在探索第三条道路的过渡时期，我们采取混合经济政策。允许资本主义经济在一定范围内存在和发展，同时积极发展国有经济和合作社经济，逐步实现经济结构的转变。"
 new_focus_42: "成立经济纠察队"
 new_focus_42_desc: "为维护经济秩序，打击投机倒把、囤积居奇等不法行为，成立专门的经济纠察队。加强市场监管，保障物价稳定，保护人民群众的经济利益。"
 new_focus_43: "吸纳民主人士"
 new_focus_43_desc: "团结一切可以团结的力量，吸纳民主党派人士、爱国华侨和社会贤达参与国家建设。建立广泛的统一战线，共同推动国家的民主与进步事业。"
 new_focus_21_desc: "将土地分配给无地少地农民，但保留“国家最终所有权”。既满足农民土地要求，又为未来通过“国家资本主义”实践第三条道路保留制度空间。"
 new_focus_22_desc: "全面推行减租减息，同时保障地主合法收租权，维持农村社会稳定。既发动农民又团结地主，是一种相对温和的政策。"
 new_focus_44: "与苏联和解？"
 new_focus_45: "镇压抗日情绪"
 new_focus_45_desc: "当前首要任务是消灭国内反动派势力，维护国家统一。抗日宣传可能扰乱军心民心，必须暂时压制，待内部稳定后再考虑对外问题。"
 new_focus_46: "请求日本投资"
 new_focus_46_desc: "为加快国家建设，改善经济状况，我们可以考虑与日本建立经济合作关系，吸引日本投资。在不损害国家主权的前提下，利用外资发展本国经济。"
 new_focus_44_desc: "邓演达曾两次流亡欧洲，1925年经苏联前往德国，1927年大革命失败后又与宋庆龄在莫斯科发表《对中国及世界革命民众宣言》。他在苏联期间接触了多种思潮，其经济思想的形成受到苏联革命实践的启发，但最终选择了适合中国国情的第三条道路。同时，也算是维护了孙中山“联俄”政策。"
 new_focus_47: "中苏贸易协定"
 new_focus_47_desc: "与苏联签订贸易协定，开展双边贸易。通过出口农产品和原材料换取苏联的工业设备和技术，加快我国工业化进程，同时加强与友好国家的联系。"
 new_focus_48: "国家计划经济委员会"
 new_focus_48_desc: "成立国家计划经济委员会，统筹全国经济发展规划。制定五年计划，合理配置资源，引导国民经济朝着第三条道路方向稳步发展，实现经济的计划性和协调性。"
 new_focus_49: "平民技术大学"
 new_focus_49_desc: "创办平民技术大学，为广大平民子弟提供接受高等教育的机会。开设工科、农科等实用专业，培养国家建设所需的技术人才，打破教育垄断，实现教育公平。"
 new_focus_50: "中华平民银行"
 new_focus_50_desc: "成立中华平民银行，为平民提供金融服务。发放农业贷款支持农民生产，提供小额贷款帮助手工业者发展，促进城乡经济发展，改善民生。"
 new_focus_51: "吸引华侨投资"
 new_focus_51_desc: "海外华侨心系祖国，拥有雄厚的资本和先进的技术。通过制定优惠政策吸引华侨回国投资，既能解决国内建设资金不足的问题，又能引进先进技术和管理经验。"
 new_focus_52: "整理税制"
 new_focus_52_desc: "改革现行税收制度，简化税种，公平税负。减轻农民和中小工商业者的负担，增加对富裕阶层的税收，实现税收的公平与合理，为国家建设提供稳定的财政收入。"
 new_focus_53: "吸引民间资本"
 new_focus_53_desc: "鼓励民间资本参与国家建设，放宽市场准入，保护私有财产。通过合理引导和规范，让民间资本在合法范围内发展，促进国民经济的多元化和活力。"
 new_focus_54: "推行劳动保护法"
 new_focus_54_desc: "制定和推行劳动保护法，保障工人的合法权益。规定工作时间、最低工资标准、劳动安全卫生条件，建立劳动保险制度，改善工人的劳动条件和生活待遇。"
 new_focus_55: "精兵简政"
 new_focus_55_desc: "精简政府机构，裁减冗余人员，提高行政效率。减少财政支出，把更多的资源投入到经济建设和改善民生中去，实现政府机构的高效化和服务化。"
 new_focus_100: "推行革命军公司"
 new_focus_101: "废除留守处"
 new_focus_102: "军队职业化"
 new_focus_102_desc: "推进军队职业化改革，建立现代化的军事制度。完善军官选拔和晋升机制，提高军队的专业化水平，使军队成为一支训练有素、纪律严明的现代化武装力量。"
 new_focus_103_desc: "打造职业化军队是军事现代化的必由之路。通过严格的训练、科学的管理和完善的保障体系，建设一支能够有效履行国防职责的现代化军队。"
 new_focus_104: "基层宪政制度"
 new_focus_104_desc: "推进基层宪政建设，实行地方自治。建立基层议会制度，让人民群众参与地方事务的决策和管理，实现基层民主，为国家的宪政建设奠定坚实基础。"
 Learn_guerrilla_warfare: "确定合作路线"
