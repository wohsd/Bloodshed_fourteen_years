 Militia_Armory: "民兵武备库"
 Militia_Armory_desc: "民兵武器杂乱、弹药匮乏，难以持续作战。在各根据地设立民兵武备库，集中修造土枪土炮、翻装子弹、制造手榴弹与地雷，并以土法炼制硝磺钢铁。这些简陋的武备库，就是人民战争的兵工厂。"
 Military_Industry_Award: "高昂军功奖励"
 Military_Industry_Award_desc: "重赏之下必有勇夫。颁布军功奖励条例，以现洋、军衔和战利品分红激励官兵奋勇作战，同时强征劳工随军保障补给。部队士气高涨、推进迅速，但日积月累的赏格与劳工开支，也将成为财政的沉重负担。"
