 new_focus_43: "吸纳民主人士"
 new_focus_21_desc: "将土地分配给无地少地农民，但保留“国家最终所有权”。既满足农民土地要求，又为未来通过“国家资本主义”过渡到社会主义保留制度空间。"
 new_focus_22_desc: "全面推行减租减息，同时保障地主合法收租权，维持农村社会稳定。既发动农民又团结地主，是一种相对温和的政策。"
 new_focus_44: "与苏联和解？"
 new_focus_45: "镇压抗日情绪"
 new_focus_46: "请求日本投资"
 new_focus_44_desc: "邓演达曾两次流亡欧洲，1925年经苏联前往德国，1927年大革命失败后又与宋庆龄在莫斯科发表《对中国及世界革命民众宣言》。他在苏联期间接触了马克思主义，其社会主义经济观的形成深受苏联革命实践的影响。同时，也算是维护了孙中山“联俄”政策。"
