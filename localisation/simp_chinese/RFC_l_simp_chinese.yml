l_simp_chinese:
 Contact_the_old_warlords: "接受广州的条件"
 Contact_the_old_warlords_desc: "广州国民政府提出了一系列合作条件，接受这些条件意味着我们将与广州方面建立统一战线，共同对抗南京的反动势力。这是实现国家统一的重要一步。"
 Left_wing_stronghold: "左派联合阵线"
 Left_wing_stronghold_desc: "联合所有国民党左派力量，建立统一的左派阵线。团结一切进步力量，共同反对右派反动派，为实现真正的三民主义而奋斗。"
 new_focus_1: "解决军队开支"
 new_focus_2: "推行部队经商"
 new_focus_3: "开展反腐行动"
 new_focus_4: "开设物资管理局"
 new_focus_5: "分区配给制"
 new_focus_6: "与军阀合作"
 new_focus_7: "业务战略化"
 new_focus_8: "默许留守处"
 new_focus_9: "建设贸易网络"
 new_focus_10: "放权哨卡"
 new_focus_11: "设立督察组"
 new_focus_1_desc: "高昂的军功奖励与大量的劳工大大提高了军队的战斗力，但也增添了庞大的军队开支。目前我们尚能勉强维持住国家开支，但也无力开展经济建设和推动制度改革，解决军队开支问题迫在眉睫。"
 new_focus_2_desc: "开展部队经商可以在军费不足的情况下缓解军队开支问题，同时改善部队自身的生活和装备条件。现在的国家发展战略是以经济建设为中心，集中有限财力用于国家重建工作。"
 new_focus_3_desc: "军队是国家安全的最后一道防线，它的唯一宗旨是“能打仗、打胜仗”。腐败的军队没有战斗力，无法保卫国家；腐败的军队失去忠诚，会颠覆政权；腐败的军队脱离人民，将失去存续的土壤。\n保持军队的纯洁性，这不仅是军事问题，更是政治问题，是确保国家“柱石”永远坚固的必然选择。"
 new_focus_12: "三个公开原则"
 new_focus_13: "推行财务连坐"
 new_focus_12_desc: "“三个公开”即人事公开、财务公开、意见公开。规定财务人员不得随长官离任，防止形成私人账房。"
 new_focus_13_desc: "一旦发现主官贪污，其直属上级和同级军需官必须承担连带责任。贪污军饷、倒卖军火、克扣军粮者，无论数额大小，一律死刑。"
 new_focus_14: "后勤统一"
 new_focus_15: "打击走私路线"
 new_focus_16: "推行点验制度"
 new_focus_17: "军队国家化"
 new_focus_16_desc: "设立常设的、不打招呼的点验组，定期或不定期突击检查部队的粮秣、被服、弹药库存和人员名册，严查“吃空额”和盗卖军需"
 new_focus_14_desc: "所有战略物资由中央政府统一收购、统一出口，切断军队与市场的直接联系。"
 new_focus_5_desc: "根据防区划分物资进出口权限，由当地最高军事长官负责，所得利润按比例上缴“联合政府”财政。"
 new_focus_4_desc: "允许各部队成立“物资管理局”，将经商纳入政府特许经营范畴，以解决军费不足。"
 new_focus_8_desc: "留守处可以极大的激发军官们的经商热情，不仅能作为物资的储存仓库，更有利军官与政府的团结。眼下国家刚刚发生巨变，正式发扬“精诚团结”的重要时刻！"
 new_focus_101_desc: "“留守处”——这些实际上是军官养情妇、藏财物、做生意的大本营。不仅严重腐败了党国的军官，维护留守处更是动用了大量的军事力量，这样的设施不能有任何存留的余地。"
 new_focus_15_desc: "关闭一切与敌占区的非法贸易通道，尤其是涉及战略物资的走私活动。"
 new_focus_11_desc: "无论哨卡是否偏远，无论哨卡规模大小，随时进行突击检查。坚决杜绝哨卡收取过路费甚至掩护走私相关的一切行为"
 new_focus_17_desc: "军风纪非但为军队之命脉，实关系抗战之胜败与国家之存亡，败坏了军风纪便是军队的自杀。军人的首要目的就是要保护国民，理解国民，爱护国民，学习如何真正的与国民和谐相处。"
 new_focus_100_desc: "军队要发挥自身优势，利用政策支持与军事设施大力开展经商活动。军医院，维修连，甚至军工厂统统都可以投入到党国的经济当中。要将军队与老百姓紧密的结合到一起，体现党国的军民和谐。"
 new_focus_9_desc: "要致富就要先修路，现有的基础设施严重限制了“军商一体”的发展。建设和修缮道路不仅能提高通商的效率更是一件有利于国民日常通行的好事。"
 new_focus_10_desc: "建设道路及其维护产生了大量的开支，而哨卡的士兵也是要吃饭的嘛。我们支持士兵们发挥自己的经商才能，过路的商人和群众会支持他们的“商业活动”"
 new_focus_6_desc: "大家都是青天白日之下的好同志，何必彼此敌对？正式党国经济建设的关键时刻，何不握手言和，实现共同富裕？"
 new_focus_7_desc: "我们的生产报告一片欣欣向荣！甚至已经出现“生产过剩 ”的情况了，而我们的商业伙伴们也正好需要这些资源，为什么不和他们做交易呢？"
 new_focus_18: "军队战斗力问题"
 new_focus_18_desc: "国民党右派背叛革命后，军队腐化严重，战斗力大幅下降。我们必须重振军威，整顿军纪，淘汰不合格军官，建立一支真正能为平民利益而战的革命军队。"
 new_focus_19: "新训政"
 new_focus_20: "提拔技术官僚"
 Leftist_United_Front: "左派联合阵线"
 Leftist_United_Front_desc: "联合所有进步力量，建立广泛的左派统一战线。团结国民党左派、民主党派和爱国人士，共同反对独裁统治，争取民主自由。"
 The_Final_Battle: "加入民主同盟"
 The_Final_Battle_desc: "在民主革命的关键时刻，加入中国民主同盟，与各民主党派携手合作，共同推动政治协商，建立联合政府，实现国家的和平与统一。"
 new_focus_21: "耕者有其田"
 new_focus_22: "减租减息"
 new_focus_23: "开展土地平权运动"
 new_focus_23_desc: "土地问题是中国革命的核心问题。我们主张“耕者有其田”，彻底解决农民的土地需求，通过土地平权实现社会公平，为第三条道路的实践奠定坚实基础。"
 new_focus_24: "工会与农会"
 new_focus_24_desc: "组织工人和农民成立工会与农会，这是实现平民政治的重要基础。通过工会维护工人权益，通过农会保障农民利益，使工农成为国家的主人。"
 new_focus_25: "精兵强将"
 new_focus_25_desc: "裁撤冗员，淘汰老弱病残，选拔优秀官兵组成精锐部队。建立严格的训练体系，提高士兵素质和战斗技能，打造一支能征善战的劲旅。"
 new_focus_26: "生根发展"
 new_focus_26_desc: "军队不仅要能打仗，更要能建设。在驻地开展生产建设，帮助地方发展经济，与人民群众建立血肉联系，使军队真正扎根于人民之中。"
 new_focus_27: "改善军纪"
 new_focus_27_desc: "军纪涣散是当前军队的一大弊病。必须严肃军纪，禁止士兵骚扰百姓、强买强卖，做到“不拿群众一针一线”，恢复人民军队的优良传统。"
 new_focus_28: "遏制山头主义"
 new_focus_28_desc: "各派系各自为政，形成独立王国，严重削弱了军队的统一指挥和战斗力。必须打破派系壁垒，建立统一的指挥体系，确保军令畅通。"
 new_focus_29: "积极缴获装备"
 new_focus_29_desc: "与反动派作战不仅是为了消灭敌人，更是为了获取武器装备来武装自己。通过战场缴获，不断补充和更新我们的武器装备，增强部队战斗力。"
 new_focus_30: "学习政委制度"
 new_focus_30_desc: "借鉴苏联红军的政治工作经验，建立政委制度。政委负责部队的思想政治工作，确保军队始终坚持正确的政治方向，保持高昂的战斗意志。"
 new_focus_31: "扩大国防生产"
 new_focus_31_desc: "战争需要充足的物资保障。必须大力发展国防工业，建立兵工厂、弹药厂，扩大武器装备的生产规模，实现武器装备的自给自足。"
 new_focus_32: "坚持”三位一体“"
 new_focus_32_desc: "实行军政一体化的管理模式，将军事、政治、经济工作有机结合起来。军队不仅要保卫国家，还要参与国家建设，实现军民融合发展。"
 new_focus_103: "职业化军队"
 new_focus_33: "军官指导团"
 new_focus_33_desc: "建立军官指导团，对各级军官进行系统培训，提高指挥能力和战术水平。培养一批既有军事素养又有政治觉悟的优秀军官，为军队现代化建设奠定人才基础。"
 new_focus_34: "劳武结合"
 new_focus_34_desc: "贯彻“劳武结合”的方针，让士兵在训练之余参与生产劳动。既可以减轻国家负担，又能培养士兵的劳动观念，实现一手拿枪、一手拿镐的目标。"
 new_focus_35: "推广本地战法"
 new_focus_35_desc: "中国地域广阔，地形复杂，必须发展适合本土作战的战术。推广游击战、运动战等灵活机动的战法，扬长避短，以弱胜强，有效打击反动派势力。"
 new_focus_36: "兵役改革"
 new_focus_36_desc: "改革现行兵役制度，建立义务兵役制与志愿兵役制相结合的体制。广泛动员人民群众参军，扩大兵源，同时保障士兵权益，提高军队的吸引力和凝聚力。"
 new_focus_37: "人民武装"
 new_focus_37_desc: "军队是人民的军队，必须全心全意为人民服务。我们的军队来自人民、依靠人民、为了人民，要始终保持与人民群众的血肉联系，成为保卫人民利益的坚强后盾。"
 new_focus_38: "团结民主派"
 new_focus_38_desc: "国民党右派背叛革命，抛弃了孙中山先生的三大政策。我们作为国民党左派，必须高举民主与进步的旗帜，与反动派进行坚决斗争，争取民主革命的最终胜利。"
 new_focus_20_desc: "1930年邓演达发表的《中国国民党临时行动委员会政治主张》，明确提出“解放中国民族，建立以农工为中心的平民政权”的纲领。我们走的是既非资本主义也非共产主义的第三条道路，是适合中国国情的独特发展道路。"
 new_focus_19_desc: "新政权十分缺乏合法性，好在我们与汪精卫确立了合作关系，即便道路不同，这位文人政客依然是当下党国最需要的名誉主席"
 new_focus_39: "老子英雄儿好汉"
 new_focus_39_desc: "邓演达主张“平民政治”，认为国家权力应归属于农工及其他平民群众。在基层试行平民代表会议制度，由工人、农民、士兵和知识分子代表组成，参与地方事务的管理和决策，体现“主权在民”的原则。"
 new_focus_41: "扶持合作社经济"
 new_focus_41_desc: "合作社是实现第三条道路经济的重要形式。通过扶持农业合作社、手工业合作社，帮助农民和手工业者组织起来，共同发展生产，提高收入，逐步实现共同富裕。"
 new_focus_40: "过渡期的经济政策"
 new_focus_40_desc: "在探索第三条道路的过渡时期，我们采取混合经济政策。允许资本主义经济在一定范围内存在和发展，同时积极发展国有经济和合作社经济，逐步实现经济结构的转变。"
 new_focus_42: "党指挥枪"
 new_focus_42_desc: "为维护经济秩序，打击投机倒把、囤积居奇等不法行为，成立专门的经济纠察队。加强市场监管，保障物价稳定，保护人民群众的经济利益。"
 new_focus_43: "吸纳民主人士"
 new_focus_43_desc: "团结一切可以团结的力量，吸纳民主党派人士、爱国华侨和社会贤达参与国家建设。建立广泛的统一战线，共同推动国家的民主与进步事业。"
 new_focus_21_desc: "将土地分配给无地少地农民，但保留“国家最终所有权”。既满足农民土地要求，又为未来通过“国家资本主义”实践第三条道路保留制度空间。"
 new_focus_22_desc: "由政府出面调停业佃关系：地主普遍减租减息，农民则须保证交租交息，双方各让一步，地主的土地所有权与合法收租权受到明确保障。这不是「耕者有其田」的土地革命，而是一场调和阶级矛盾、兼顾地主与农民利益、维系农村安定的改良——临委会要做的是中间人，而不是农民的党。"
 new_focus_44: "枪指挥党"
 new_focus_45: "亚洲新自由灯塔"
 new_focus_45_desc: "一切管制都是枷锁，一切干预都是倒退。国企尽数出售，市场全面放开，军队、官僚与资本结成治理同盟，连投票权也按财产称量。我们将以彻底的自由市场、最小的政府和最低的社会成本，向整个亚洲证明：新自由主义才是后发国家的唯一出路。中国，将成为亚洲的新自由灯塔。\n（这本质是新自由主义，但本国民族工业短期内无法与英美垄断资本竞争，最终只会沦为欧美的附庸国）"
 new_focus_46: "伟大复兴之路"
 new_focus_46_desc: "我们拒绝自由放任的冷酷，也拒绝阶级专政的激进。以国家计划引导市场，以社会市场经济统筹公私，以技术官僚体系和民族工业为骨架，把工人、农民、资本家与国家都编入同一架复兴的机器。各安其位，各尽其责，在法团主义的秩序中完成民族的伟大复兴。\n（这本质是法团主义，但东亚地区的威权主义影响巨大，威权法团主义极易滑向法西斯主义！）"
 new_focus_44_desc: "邓演达曾两次流亡欧洲，1925年经苏联前往德国，1927年大革命失败后又与宋庆龄在莫斯科发表《对中国及世界革命民众宣言》。他在苏联期间接触了多种思潮，其经济思想的形成受到苏联革命实践的启发，但最终选择了适合中国国情的第三条道路。同时，也算是维护了孙中山“联俄”政策。"
 new_focus_47: "平民阶级专政"
 new_focus_47_desc: "土地收归集体，资本受国家节制，基层由平民委员会直接管理，武装掌握在工人和农民自己手中。不与豪绅妥协，不向资本让步，由占人口绝大多数的工农平民，对一切剥削阶级实行专政。这不是议会里的清谈，而是劳苦大众第一次真正当家作主的国家。\n（这本质是国家资本主义，但随着社会建设他可能会逐步走向社会主义或官僚资本主义）"
 new_focus_48: "请求右派援助"
 new_focus_48_desc: "革命的力量尚且弱小，而右派军人和政客气数未尽。放下意识形态的分歧，向他们请求军火、资金和政治上的援助，必要时以职位和政策让步作为交换。这并不光彩，但为了第三条道路的存续，暂时的妥协是值得的。"
 new_focus_49: "平民技术学校"
 new_focus_49_desc: "创办平民技术大学，为广大平民子弟提供接受高等教育的机会。开设工科、农科等实用专业，培养国家建设所需的技术人才，打破教育垄断，实现教育公平。"
 new_focus_50: "中华平民银行"
 new_focus_50_desc: "成立中华平民银行，为平民提供金融服务。发放农业贷款支持农民生产，提供小额贷款帮助手工业者发展，促进城乡经济发展，改善民生。"
 new_focus_51: "吸引华侨投资"
 new_focus_51_desc: "海外华侨心系祖国，拥有雄厚的资本和先进的技术。通过制定优惠政策吸引华侨回国投资，既能解决国内建设资金不足的问题，又能引进先进技术和管理经验。"
 new_focus_52: "引进外国技术"
 new_focus_52_desc: "自己摸索太慢，直接购买欧美成套设备、引进技术专家和专利工艺，能在数年内走完别人几十年的工业化道路。代价同样惊人：昂贵的设备款和专家薪金压得财政喘不过气，最终都要以削减福利、加重民间负担来偿还。"
 new_focus_53: "鼓励资本流通"
 new_focus_53_desc: "鼓励民间资本参与国家建设，放宽市场准入，保护私有财产。通过合理引导和规范，让民间资本在合法范围内发展，促进国民经济的多元化和活力。"
 new_focus_54: "推行劳动保护法"
 new_focus_54_desc: "制定和推行劳动保护法，保障工人的合法权益。规定工作时间、最低工资标准、劳动安全卫生条件，建立劳动保险制度，改善工人的劳动条件和生活待遇。"
 new_focus_55: "中国民主同盟"
 new_focus_55_desc: "军队开始倒戈，旧军阀加入阵线，反动政权的瓦解已成定局。现在，是时候将分散的民主力量凝聚起来了：与各民主党派、无党派人士和社会贤达正式结成中国民主同盟，召开政治协商会议，以和平、民主的方式建立联合政府，共同擘划国家的未来。"
 new_focus_100: "推行革命军公司"
 new_focus_101: "废除留守处"
 new_focus_102: "军队职业化"
 new_focus_102_desc: "推进军队职业化改革，建立现代化的军事制度。完善军官选拔和晋升机制，提高军队的专业化水平，使军队成为一支训练有素、纪律严明的现代化武装力量。"
 new_focus_103_desc: "打造职业化军队是军事现代化的必由之路。通过严格的训练、科学的管理和完善的保障体系，建设一支能够有效履行国防职责的现代化军队。"
 new_focus_104: "完善中央机构"
 new_focus_104_desc: "新政权不能只靠热情和临时机构运转。在吸纳民主人士入阁的同时，系统建立、完善中央各职能部委，明确权责、统一政令、规范铨叙与财政制度，把松散的革命同盟改造为有执行力的现代中央政府。"
 Learn_guerrilla_warfare: "学习游击战术"
 The_Third_Road: "第三路线"
 The_Third_Road_desc: "我们理想是建立以农工为中心的“平民政权”，而并非共产党无产阶级专政的政治目标。中国社会主要矛盾是帝国主义与封建势力压迫，若是想要实现民族复兴，我们就必须联合小资产阶级、民族资产阶级共同完成民主革命。"
 new_focus_56: "拨乱反正"
 new_focus_56_desc: "我们将会联合被反动派逮捕的军官以获得军队支持"
 Learn_guerrilla_warfare_desc: "游击战是弱旅对抗强敌的有效战术。我们将向中央苏区学习游击战经验，提升部队的防御能力、突破能力和地形适应力。"
 The_Second_United_Front: "第二次国共合作"
 The_Second_United_Front_desc: "面对日本帝国主义的亡国灭种之威胁，国共两党必须捐弃前嫌、共赴国难。我们将向中央苏区提出联合政府方案，以平等地位组建抗日阵营，切实推行联俄、联共、扶助农工的三大政策。"
 new_focus_57: "废除保甲制度"
 new_focus_57_desc: "保甲制度是旧政权套在平民身上的枷锁：连坐联保、抽丁派款，把农民牢牢束缚在乡土之上。废除保甲、焚毁旧籍，农民才能从封建束缚中解放出来，自由地进入工厂和合作社务工，工会与农会也才能顺利在基层扎根。"
 new_focus_58: "劝降军队"
 new_focus_58_desc: "继续向南京的军队展开政治攻势：对愿意起义、投诚的官兵保证其人身安全与原有职级，对被反动派逮捕、迫害的军官积极营救、引为己用。枪炮未动而敌军瓦解，胜过十万雄师。"
 new_focus_59: "联合旧军阀"
 new_focus_59_desc: "旧军阀们手握兵权、各据一方，却同样受到南京削藩的威胁。以职位、防地和番号为筹码，与他们结成暂时的同盟。这些盟友并不可靠，但在民主联合政府建成之前，多一份力量就多一分胜算。"
 Reconstruct_the_Political_Department: "重设政治部"
 Reconstruct_the_Political_Department_desc: "在大革命时期，模仿苏联政委制度的政治部起到了关键作用，以政治宣传为职的政治部因为资源的匮乏同时还承担了工兵以及战地医院的工作。可惜的是在中央政府的军事改革下政治部的影响力大不如前，重设政治部将会对我军的影响意义非凡。"
 Recognize_the_status_of_the_Soviet_area: "承认苏区的地位"
 Recognize_the_status_of_the_Soviet_area_desc: "中央苏区作为共产党控制的革命根据地，已经在事实上形成了独立的政权实体。承认其地位，不仅有助于停止内战、集中力量抗日，更是推行三大政策的重要一步。"
 new_focus_60: "平民自治委员会"
 new_focus_60_desc: "在各县、乡建立由工人、农民、士兵和普通市民代表组成的平民自治委员会，接管旧政权遗留的基层权力。委员会既管诉讼调解，也管生产分配，让千百年来匍匐在权力脚下的平民，第一次挺直腰杆管理自己的生活。"
 new_focus_61: "扫盲运动"
 new_focus_61_desc: "工人农民不识字，便看不懂告示、学不会技术，更无法行使自己的政治权利。在工会、农会中广设夜校和识字班，推行千字课教学，让每一个平民都能读书看报、明晓事理。知识不应再是少数人的特权。"
 new_focus_62: "鼓励民族资本"
 new_focus_62_desc: "民族资产阶级同样遭受帝国主义和官僚资本的挤压。颁布实业奖励条例，在贷款、税收和政府订货上优待民间工厂，倡导「实业救国」「国货光荣」。让民族资本发展壮大，才能用自己的工业品夺回被洋货占据的市场。"
 new_focus_63: "改造地方干部"
 new_focus_63_desc: "临委会毕竟不是共产党，不搞阶级清洗那一套。对旧有的保甲人员和乡绅子弟，采取「团结、争取、改造」的方针：集中受训、晓以革命大义，仅淘汰民愤极大者，其余尽量留用。乡村的账目、文书与治安还离不开这些识文断字的人，关键是让他们改换门庭，为新政权做事。"
 new_focus_64: "枪械管制政策"
 new_focus_64_desc: "乡间的枪械一半在地主团防手里，一半散落在农民的自发组织中，业佃稍有龃龉便可能酿成械斗。对双方武器一律限期登记、统一管控：取缔地主私人武装，同样不允许农民持械「自己解决问题」。枪支入库，业佃矛盾才有可能坐上桌来谈，而不是见血收场。"
 new_focus_65: "加强平民武装"
 new_focus_65_desc: "政权的根基在于武装起来的人民。在工会、农会中普遍建立工人纠察队和农民自卫队，配发武器、定期操练，使每一个觉悟的平民都成为新政权的捍卫者。军民一体，反动派便无从下手。"
 new_focus_66: "确保地方稳定"
 new_focus_66_desc: "改良最怕两头过火。基层政权的首要职责是充当劳资、业佃之间的仲裁者：既督促地主减租、资方守法，也约束工农提出超出秩序的「过分」要求，把矛盾限制在调停范围之内，防止乡村滑向阶级对抗。地方安定、各业照常，第三条道路的建设才有立足之地。"
 new_focus_67: "中国制造"
 new_focus_67_desc: "引进技术只是手段，自主制造才是目的。消化吸收外来设备与工艺，建立自己的机床、动力和军工体系，从仿制走向独立设计。当中国的工厂能造出中国所需的一切，这个国家才真正挺起了工业的脊梁。"
 new_focus_68: "为人民服务"
 new_focus_68_desc: "基建的工地上有农民的汗水，重工业的炉火里有工人的辛劳。国家建设的一切成果，最终都要回到人民手中：平抑物价、兴修水利、普及教育、保障就业。政府存在的唯一理由，就是为人民服务。"
 new_focus_69: "四六工精神"
 new_focus_69_desc: "要求城镇用工单位与农民工及其所属的农业生产合作社签订劳务合同。合同在约定雇佣期限、工资等基本劳动条件条款之外，还约定了用工单位支付的工资在农民工和其所属合作社之间的分成；一般约定的分成比例是：农民工只拿到自己工资的四成，合作社分六成，所以农民工又被称为“四六工”。\n（如果完成了废除保甲制度，此国策会有额外加成）"
 new_focus_71: "节制资本"
 new_focus_71_desc: "凡有关国计民生的大银行、大工业、大交通，必须由国家经营节制，绝不容许私人资本操纵国脉。这是孙中山先生「节制资本」遗教的真义——资本可以为国家所用，却不允许反过来奴役国家与人民。"
 new_focus_72: "农村集体经济"
 new_focus_72_desc: "土地分给农民只是第一步，单干的小农依旧无力抵御天灾与市场。在自愿的基础上组织耕牛队、互助组和农业生产合作社，统一兴修水利、采购农具、推广良种，让分散的土地汇聚成改变乡村面貌的力量。"
 new_focus_73: "私有化运动"
 new_focus_73_desc: "国库空虚而百废待兴，最快的办法就是将国有企业、矿山和交通设施低价出售给民族资本家。国家甩掉了补贴的包袱，换来急需的建设资金和有产者的政治支持——至于日后这些产业的归属，已无暇计较。"
 new_focus_74: "自由放任"
 new_focus_74_desc: "管得最少的政府就是最好的政府。解除价格管制、撤销贸易壁垒、裁撤税务关卡，让每一个商人、每一支军队企业都在市场中自由逐利。至于公平与秩序——市场自己会做出公正的裁决。"
 new_focus_75: "社会市场经济"
 new_focus_75_desc: "既不搞自由放任的丛林法则，也不搞指令计划的刻板僵化。国家掌握命脉行业与发展规划，同时给市场留出充足的竞争空间，以计划校正方向，用市场激活效率。这就是我们要走的第三条道路。"
 new_focus_76: "重视基础建设"
 new_focus_76_desc: "公路、铁路、港口、电站，是一切工业发展的前提。国家集中力量投资那些回收慢、风险大、民间无力承担的基础工程，把铁路修到矿山，把电线拉进乡村，为后续建设铺就通途。"
 new_focus_77: "重工业建设计划"
 new_focus_77_desc: "没有钢铁就没有机床，没有机床就没有国防。制定系统的重工业建设计划，集中资源建设钢铁、煤炭、机械和化工基地，哪怕一代人勒紧裤腰带，也要为这个农业国打下工业的骨架。"
 new_focus_78: "弘扬民族自信"
 new_focus_78_desc: "洋货泛滥的背后是人心的溃败——「中国造的就是不行」。我们要理直气壮地提倡国货、奖励国货、使用国货，宣扬中华民族自力更生的精神。一个民族只有先相信自己能造好东西，才真的能造好东西。"
 new_focus_79: "官商兵政府"
 new_focus_79_desc: "军队保障秩序，官员提供庇护，商人贡献资金，三者结成牢不可破的同盟。工人安分做工，农民安静种田，政治由有产、有枪、有见识的上等人代为打理。这个政府或许不够民主，但足够高效——至少对支持它的人而言。"
 new_focus_80: "财产投票制"
 new_focus_80_desc: "既然国家的命脉系于资本，选票自然也应与财产相称。按照纳税与资产多寡分配政治权利，让承担国家责任的有产者主导选举与议会。没有恒产者何来恒心？政治，终究是上等人的事业。"
 new_focus_81: "收买工人领袖"
 new_focus_81_desc: "罢工与闹事，多半是几个工头在背后煽动。与其动用军警镇压，不如把工人领袖请进办公室：给职位、给股份、给体面的薪水。釜底抽薪，工潮自然平息，还能留下「劳资和谐」的美名。"
 new_focus_82: "国家粮食统购统销"
 new_focus_82_desc: "粮食是立国之本，绝不能任由私商囤积居奇、操纵粮价。颁布法令，由国家对粮食实行统一收购、统一供应，按计划向城市和军队配给口粮，农民余粮须按牌价售予国家，私营粮行一律取缔。从此粮价安定，而农业的剩余也将化为工业化的第一笔资金。"
 new_focus_83: "限制富农经济"
 new_focus_83_desc: "农村中新生的富农依仗劳力、耕畜和资金优势兼并土地、放债盘剥，是集体经济最危险的敌人。限制富农雇工与放债的自由，课以累进负担，禁止其入社掌权。我们暂不消灭富农，但绝不容许富农经济重新骑在贫雇农头上。"
 new_focus_84: "思想改造运动"
 new_focus_84_desc: "枪杆子夺取的政权，还要靠思想来巩固。在军队、学校、机关和知识分子中开展思想改造运动，批判旧观念、旧习气，学习革命理论，开展批评与自我批评。把每一个人的头脑从旧秩序中解放出来，新社会才算真正建成。"
 new_focus_85: "镇压反革命条例"
 new_focus_85_desc: "敌人不甘心失败，特务、会道门和返乡团在暗处蠢蠢欲动。颁布《惩治反革命条例》，以平民法庭与群众检举相结合，坚决镇压一切颠覆新政权的活动。对敌人的仁慈，就是对人民的犯罪。"
 RFC_focus_auto_only_tt: "§R此国策无法手动完成§!——它将在革命进程中由特殊事件自动完成。"
 RFC_reconstruction: "重建工作"
 RFC_reconstruction_desc: "战争结束了，但战争留下的创伤远未愈合。整编军队、复工工厂、改组机构，唯有脚踏实地完成重建，新秩序才算真正站稳脚跟。"
 RFC_military_adjustment: "军事调整"
 RFC_military_adjustment_desc: "内战留下的军队派系林立、编制混乱、士气低落。着手整编遣散、统一军令、重塑军纪，逐步抚平军事创伤。\n\n当前军事创伤等级：§Y[?RFC_cw_level_army]§! 级\n每完成一次降低一级，降为0级后本决议消失。"
 RFC_rebuild_factories: "重建工厂"
 RFC_rebuild_factories_desc: "战火使工矿企业停产损毁，铁路公路断绝。组织人力物力修复厂房、复工复产，让经济机器重新运转起来。\n\n当前工业创伤等级：§Y[?RFC_cw_level_industry]§! 级\n每完成一次降低一级，降为0级后本决议消失。"
 RFC_restructure_institutions: "改组机构"
 RFC_restructure_institutions_desc: "旧的基层政权已经瓦解，新的行政体系尚未建立。裁汰冗员、整顿吏治、重建各级治理机构，恢复政府的组织与动员能力。\n\n当前机构创伤等级：§Y[?RFC_cw_level_govt]§! 级\n每完成一次降低一级，降为0级后本决议消失。"
 RFC_military_reform: "军事改革"
 RFC_military_reform_desc: "仗可以越打越精，军可以越练越强。投入陆军经验，对武装力量进行持续的整顿与改革。改革成果将直接体现到我军的建军精神之中。"
 RFC_mr_local_cadets: "地方干部军事化"
 RFC_mr_local_cadets_desc: "把熟悉乡土的地方干部纳入军事体系，使其平时能治民、战时能带兵，让军队在本土如鱼得水。\n\n§G效果：§!核心领土攻击 §G+5%§!，核心领土防御 §G+5%§!\n§Y花费：50 点陆军经验§!"
 RFC_mr_political_cadets: "政工干部军事化"
 RFC_mr_political_cadets_desc: "政工干部不能只会动嘴，必须懂军事、能上阵。对政工干部进行系统的军事轮训，使政治工作与作战指挥真正融为一体。\n\n§G效果：§!组织度恢复 §G+4%§!\n§Y花费：50 点陆军经验§!"
 RFC_mr_repair_roads: "修整农村小路"
 RFC_mr_repair_roads_desc: "把乡间小路拓宽夯实、打通断头路，使民兵在根据地内能够快速机动、互相支援。\n\n§G效果：§!核心领土攻击 §G+5%§!，核心领土防御 §G+5%§!\n§Y花费：50 点陆军经验§!"
 RFC_mr_militia_training_1: "加强民兵训练"
 RFC_mr_militia_training_2: "加强民兵训练"
 RFC_mr_militia_training_3: "加强民兵训练"
 RFC_mr_militia_training_4: "加强民兵训练"
 RFC_mr_militia_training_5: "加强民兵训练"
 RFC_mr_militia_training_6: "加强民兵训练"
 RFC_mr_militia_training_7: "加强民兵训练"
 RFC_mr_militia_training_8: "加强民兵训练"
 RFC_mr_militia_training_9: "加强民兵训练"
 RFC_mr_militia_training_10: "加强民兵训练"
 RFC_mr_militia_training_1_desc: "对民兵队伍进行一轮强化轮训，从队列、射击到班组战术逐一打磨。训练越深入，所需的教官与时间越多。\n\n§G效果：§!民兵攻击 §G+5%§!，民兵防御 §G+5%§!（永久增强「人民武装」）\n§Y花费：40 点陆军经验§!\n§Y耗时：§!60 天（完成后效果生效，并出现下一级决议）"
 RFC_mr_militia_training_2_desc: "对民兵队伍进行一轮强化轮训，从队列、射击到班组战术逐一打磨。训练越深入，所需的教官与时间越多。\n\n§G效果：§!民兵攻击 §G+5%§!，民兵防御 §G+5%§!（永久增强「人民武装」）\n§Y花费：60 点陆军经验§!\n§Y耗时：§!60 天（完成后效果生效，并出现下一级决议）"
