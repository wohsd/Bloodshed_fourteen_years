 RFC_mr_methamphetamine: "引进甲基苯丙胺"
 RFC_mr_methamphetamine_desc: "敢死队的突击需要士兵在关键时刻忘却疲劳与恐惧。引进并配发甲基苯丙胺（冰毒），这是各国军队心照不宣的秘密武器——代价则是士兵的身体。\n\n§G效果：§!突破 §G+10%§!（永久增强「国民革命军」）\n§Y花费：50 点陆军经验§!"
