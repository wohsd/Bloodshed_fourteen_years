 new_focus_37: "国民的军队"
 new_focus_38: "民主的胜利？"
 new_focus_20_desc: "1930年邓演达发表的《中国国民党临时行动委员会政治主张》，明确提出“解放中国民族，建立以农工为中心的平民政权，实现社会主义”的纲领。"
 new_focus_19_desc: "新政权十分缺乏合法性，好在我们与汪精卫确立了合作关系，即便道路不同，这位文人政客依然是当下党国最需要的名誉主席"
