ROJ1931.811.t: "徐永昌继任山西省主席"
ROJ1931.811.d: "1931年8月11日，商震因与阎锡山关系紧张而离晋，徐永昌继任山西省政府主席。徐永昌为人稳重，在晋系中威望较高，与各方关系融洽。他主持山西政务，维持了山西的相对稳定，为阎锡山日后重返山西创造了条件。"
ROJ1931.811.a: "徐永昌主政，山西暂安"
ROJ1932.220.t: "阎锡山重回山西"
ROJ1932.220.d: "1932年2月20日，经南京国民政府任命，阎锡山以太原绥靖主任的身份重回山西，正式恢复对晋绥的统治。阎锡山在大连蛰伏期间，密切关注山西局势，通过旧部维持其在晋绥的影响力。此次重回山西，标志着阎锡山重新执掌晋绥军政大权，晋系军阀得以重新整合。"
ROJ1932.220.a: "阎锡山归来，晋系重振"
ROJ1932.1.t: "阎锡山重回山西"
ROJ1932.1.d: "阎锡山以太原绥靖主任的身份重回山西，正式恢复对晋绥的统治。"
ROJ1932.1.a: "阎锡山归来"
