l_simp_chinese:
 # 东北抗日义勇军 / 抗日联军 历史事件

 ROD_yiyongjun.1.t:0 "辽东民众自卫军誓师"
 ROD_yiyongjun.1.d:0 "1932年4月，唐聚五在桓仁督师，辽东十四县举旗自卫。数月之间，这支由警察、猎户、矿工与学生拼凑起来的队伍扩至数万，成为义勇军中最成规模的一支。张学良面临抉择：是以枪械粮饷接济这批抗日弟兄，还是任其自生自灭？"
 ROD_yiyongjun.1.a:0 "发枪助饷，收编自卫军"

 ROD_yiyongjun.2.t:0 "《义勇军进行曲》传遍全国"
 ROD_yiyongjun.2.d:0 "1935年5月，《风云儿女》在上海上映，主题曲《义勇军进行曲》一日之间传遍街巷。「起来！不愿做奴隶的人们！」——歌词喊出的正是东北义勇军的血战。上海的影院、北平的学堂、武汉的军营，处处有人传唱。关外的抗战，第一次成为全国的声音。"
 ROD_yiyongjun.2.a:0 "推波助澜，任其传唱"

 ROD_yiyongjun.3.t:0 "东北抗日联军统一建制"
 ROD_yiyongjun.3.d:0 "1936年2月，东北各抗日武装发表《东北抗日联军统一军队建制宣言》，杨靖宇、赵尚志、周保中各部整编为第一、二、三路军。散处白山黑水的义勇军、游击队与残存的东北军，第一次有了统一的番号与指挥。"
 ROD_yiyongjun.3.a:0 "统一番号，划区作战"
 ROD_yiyongjun.3.b:0 "保持松散联合，各自为战"

 ROD_yiyongjun.4.t:0 "杨靖宇殉国"
 ROD_yiyongjun.4.d:0 "1940年2月23日，杨靖宇在濛江县三道崴子被围，弹尽粮绝后战死。日军剖开他的腹部，胃里只有草根、树皮与棉絮。消息传出，东北军民无不落泪——血债血偿四字，自此不再只是一句口号。"
 ROD_yiyongjun.4.a:0 "以血还血，血债血偿"
 ROD_yiyongjun.4.b:0 "保存实力，转入隐蔽"
