 # 1931.12.15 第二次下野
 CHIJiang.1.t:0 "宁粤对峙与蒋中正下野"
 CHIJiang.1.d:0 "九一八事变后，不抵抗方针使蒋介石成为举国声讨的靶子。宁粤双方虽在上海议和，粤方却坚持以蒋下野为合作的先决条件。1931年12月15日，国民党四届一中全会在南京开幕，蒋介石被迫辞去国民政府主席、行政院长及陆海空军总司令本兼各职，通电下野。林森继任国民政府主席，孙科出任行政院长——一个没有蒋介石的南京政府，究竟能撑多久？"
 CHIJiang.1.a:0 "通电下野，暂避锋芒"
 CHIJiang.1.b:0 "拒绝交权，强行留任"

 # 1932.1 复出
 CHIJiang.2.t:0 "蒋中正复出"
 CHIJiang.2.d:0 "一二八事变骤起，十九路军在上海孤军血战，南京政府指挥失灵、财政濒于崩溃，孙科内阁不满一月即告垮台。党内元老纷纷通电请蒋回京。1932年3月，蒋介石出任军事委员会委员长，重掌中央军权。下野不过四十余日，这位“在野”的委员长又回到了权力中枢。"
 CHIJiang.2.a:0 "复任军事委员会委员长"
 CHIJiang.2.b:0 "维持林森主政，拒绝蒋复出"

 # 1935.12.7 汪精卫遇刺后兼行政院长
 CHIJiang.3.t:0 "汪精卫遇刺，蒋兼行政院长"
 CHIJiang.3.d:0 "1935年11月1日，国民党四届六中全会在南京开幕合影之际，汪精卫连中三枪，重伤退出政坛，行政院一时群龙无首。12月，蒋介石接任行政院长，党、政、军大权再度集于一身。对外妥协与对内整军的双重路线，至此少了一道掣肘。"
 CHIJiang.3.a:0 "蒋介石兼任行政院长"
 CHIJiang.3.b:0 "另推他人组阁"

 # 1943.8 林森逝世后任国民政府主席
 CHIJiang.4.t:0 "林森逝世，蒋出任国民政府主席"
 CHIJiang.4.d:0 "1943年8月1日，国民政府主席林森在重庆病逝。这位以“恬淡守法”著称的元老一去，名义元首的虚位便再无缓冲。9月，国民党五届十一中全会推举蒋介石为国民政府主席——自1928年以来，党、政、军最高职位第一次全部归于一人。"
 CHIJiang.4.a:0 "蒋介石出任国民政府主席"
 CHIJiang.4.b:0 "另推元老继任主席"
