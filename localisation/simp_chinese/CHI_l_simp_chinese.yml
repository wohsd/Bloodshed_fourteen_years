 Implement_the_Five_Power_Constitution: "实施五权宪法"
 Implement_the_Five_Power_Constitution_desc: "五权宪法是孙中山先生提出的政治制度，包括行政、立法、司法、考试、监察五权分立。实施五权宪法意味着建立分权制衡的政治体制，限制个人权力，促进民主政治的发展。"
