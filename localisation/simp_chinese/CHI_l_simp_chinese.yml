 Split_and_Revive_Society_desc: "三青团成立后，“复兴社”被完全并入其中充当骨干力量，而陈诚作为书记长，实际上成为复兴社残余势力的整合者。蒋介石此举的目的之一，就是“消解旧有组织，不使其借三青团名义死灰复燃”，同时也让陈诚取代贺衷寒、康泽等人，成为黄埔系在党务领域的代表。"
