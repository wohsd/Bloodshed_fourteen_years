 Party_and_league_merger_desc: "为了集中力量应对危机，蒋介石决心整合自己一手创建的三青团，以消除内耗，增强凝聚力。国民党六届四中全会决定三青团并入国民党。规定各级团部干部转为同级党部副职，强制党员登记，逾期未登记者视同退党。\nCC系借此机会在三青团势力强大的地区迅速扩张"
