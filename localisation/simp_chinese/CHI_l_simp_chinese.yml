 Split_and_Revive_Society_desc: "三青团成立后，“复兴社”被完全并入其中充当骨干力量，而陈诚作为书记长，实际上成为复兴社残余势力的整合者。蒋介石此举的目的之一，就是“消解旧有组织，不使其借三青团名义死灰复燃”，同时也让陈诚取代贺衷寒、康泽等人，成为黄埔系在党务领域的代表。"
 Establish_the_Central_Bureau: "开设中统"
 Factional_Revival_Society: "制衡派系"
 Factional_Revival_Society_desc: "像复兴社这样一个独立、庞大且有意识形态的团体，本身就是对蒋介石权力的威胁。 复兴社只是他通往独裁路上的一块垫脚石，用过之后，就要拆解掉，把权力重新收归自己手中。"
 Establish_the_Military_Statistics_Bureau: "开设军统"
 Central_Reconstruction_Committee: "中央改造委员会"
 Anti_corruption_campaign: "打虎运动"
 Order_Warlords_to_Attack: "推行行政督察专员制度"
 Order_Warlords_to_Attack_desc: "在“剿共”省份推行 “行政督察专员制” 。将地方的党政军大权集中于专员一人之手，而这位专员直接对中央政府（也就是蒋介石）负责。这一下子就绕过了CC系长期把持的省、县党部，使得CC系在地方的权力根基几乎被连根拔起，从“党权领导一切”变为“行政权力主导一切”。"
 Control_the_warlords: "控制军阀"
 Basically_implemented_desc: "1935年底之前，国民政府实行的是蒋介石与汪精卫“军政分立”的权力格局——蒋管军事，汪管行政。1935年11月1日，汪精卫在国民党四届六中全会开幕式后遭刺客枪击受重伤，被迫辞去行政院长职务。蒋介石接任行政院长，完成了对党政军权力的全面统合。"
