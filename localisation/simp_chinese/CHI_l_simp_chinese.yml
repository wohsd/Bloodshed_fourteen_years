 Decentralization_of_the_Five_Yuan: "实现五院分权"
 Basically_implemented: "掌控五院"
 Basically_implemented_desc: "蒋介石的训政只完成了孙中山“权能分治”的制度外壳，而最核心的权力制衡逻辑和人民主权思想，则被彻底抽空，替换为“以党治国”和个人独裁。"
 Support_Chen_Chengs_reforms: "支持陈诚改革"
 Fascist_propaganda: "法西斯主义中国化"
 Fascist_propaganda_desc: "邓文仪任蒋介石侍从秘书，负责军长、师长人选的荐任审核，是国民党最有权势的人物之一。他主持创办“拔提书店”，专门发行蒋介石言行录、传记以及希特勒的《我的奋斗》《墨索里尼自传》等书籍，为蒋介石树碑立传。\n他主编的《领袖言行》一书中写道：“或曰领袖与墨索里尼、希特勒相埒，同为世界之伟大人物……而我领袖丰功伟绩，实非希墨二氏所可比者。”这段谄媚之词深得蒋介石欢心。"
 Lushan_Military_Officer_Training_Class_desc: "为配合第五次“围剿”，蒋介石在江西庐山举办“庐山军官训练团”，贺衷寒负责政治军官的训练工作。贺衷寒负责3400名政治军官的训练，讲授法西斯理论和反共政治工作方法。德国军事顾问团一百余人进驻庐山传授战术，意大利高级顾问史丹法尼公开宣扬中国应在蒋介石领导下实行独裁。"
 Establish_a_desc: "康泽组建的别动队是一支武装特务部队，全盘效仿德国党卫队，从组织形式、服装、制度建设到思想控制全面法西斯化。以“三分军事，七分政治”为号召，担负“组织民众，训练民众”工作，包括推行保甲与清查户口、编成“‘剿匪’义勇队”、收容逃亡的地主恶霸、监视各部队、促进“新生活运动”等。他们有权调动武装部队，可过问县政府工作行使县长职权。\n“站着进来，躺着出去”"
 Support_the_Revival_Society_desc: "介石下令成立“联络组”，任命戴笠为联络参谋，领导十个官员，这是国民党军事情报组织的萌芽。戴笠以此为基础，利用黄埔同学关系，拉拢了一批愿意“义务”为他搜集情报的人，即后来所说的“十人团。“十人团”没有正式编制，经费紧张，戴笠甚至要自掏腰包维持运转，就连工作场所也是胡宗南赠与的。\n在蒋介石设立复兴社后不久便下设了特务处，在得到了蒋介石的支持之后，这支十人的团队很快便扩编至100人，并在之后逐步发展为上千人的组织。"
 Infiltrate_the_army: "渗透军队"
 Faction_Revival_Society: "分裂复兴社"
 Faction_Revival_Society_desc: "像复兴社这样一个独立、庞大且有意识形态的团体，本身就是对蒋介石权力的威胁。 复兴社只是他通往独裁路上的一块垫脚石，用过之后，就要拆解掉，把权力重新收归自己手中。"
