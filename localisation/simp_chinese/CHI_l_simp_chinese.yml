 Media_depoliticization_reform: "媒体去党化改革"
 Streamlin_party_organization: "精简党部机构"
 Set_things_right: "恢复左派名誉"
 Set_things_right_desc: "恢复左派名誉意味着重新评价国民党左派的历史地位，承认其在国民革命中的贡献。这将促进党内民主，减少个人独裁的影响，推动政治体制的多元化。"
 Stick_to_a_right_wing_stance: "坚持右派立场"
 Stick_to_a_right_wing_stance_desc: "坚持右派立场意味着强化国民党的保守主义倾向，反对民主改革，维护传统的社会秩序和政治制度。这将加强蒋介石的个人权威，巩固其对党的控制。"
 Establish_an_intra_party_proposal_system: "建立党内提案制度"
 Restore_the_three_major_policies: "恢复三大政策"
 Uphold_an_anti_Communist_stance: "坚持反共立场"
 Realize_democratization_within_the_party: "实现党国民主化"
 Taking_advantage_of_internal_party_conflicts: "利用党军矛盾"
 Nationalization_of_the_military: "军队去党化"
 Nationalization_of_the_military_desc: "军队去党化意味着将军队从党的控制中分离出来，使其成为国家的军队而非党的军队。这将削弱蒋介石通过党对军队的控制，减少个人权威在军队中的影响。"
