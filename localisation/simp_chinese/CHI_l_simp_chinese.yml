 CHIFocus_7: "设立新闻局"
 CHIFocus_7_desc: "为了走向“宪政”，并加强对外宣传，决定将原先隶属于国民党中央宣传部的“国际宣传处”，升格为直属于行政院的“新闻局”。\n新闻局是政府的“公关部”与“发言人”，主要负责对内对外宣达政令、阐明国家政策、发布重要新闻等。不过，其主要精力集中在国际宣传上。其负责人大多是外交官出身的专业人才，如董显光、沈昌焕、钱复、胡志强等，很多人后来都转任“外交部长”或“驻美大使”等职。\n（新闻局在力求“还原史实”的某抗战模组中，从外交部门摇身一变化身为捍卫民国国内“言论自由”的部门。真是实属可笑，这里就不点名新东亚了）"
