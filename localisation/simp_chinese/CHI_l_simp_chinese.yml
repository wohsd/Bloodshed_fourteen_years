 Establish_the_Presidential_Office_desc: "1948年，国民政府实行宪政，蒋介石当选为总统，设立总统府作为总统的办公机构。总统府的设立进一步强化了蒋介石的个人权力，使其成为国家的最高领导人。"
 Lift_the_ban_on_political_parties: "开放党禁"
 Rebuilding_the_Republic_of_China: "再造民国"
 Party_government_relations: "党政关系"
 Restrict_the_partys_conservatives: "党政职权划分"
