l_simp_chinese:
 leader_authority_positive: "§Y这将提高领袖权威§!"
 leader_authority_negative: "§Y这将降低领袖权威§!"
 CHI_focus_2: "首要威胁"
CHI_focus_2_desc: "为了明确国家面临的主要威胁，国民党确定首要威胁。通过分析国际和国内形势，确定国家面临的主要威胁，制定相应的应对策略，保障国家的安全和稳定。确定首要威胁不仅有助于明确国家的战略方向，也有助于集中力量应对主要挑战。"
 CHI_focus_13: "设立剿匪总司令部"
CHI_focus_13_desc: "为了加强对剿匪工作的领导，国民党设立剿匪总司令部。通过统一指挥剿匪行动，协调各方面的力量，提高剿匪的效率和效果，维护国家的稳定和安全。设立剿匪总司令部不仅有助于加强对剿匪工作的领导，也有助于维护国家的稳定和安全。"
 CHI_focus_12: "新生活运动"
CHI_focus_12_desc: "为了提高国民的道德素质和生活习惯，国民党开展新生活运动。通过提倡清洁、整齐、简单、朴素的生活方式，培养国民的良好品德和爱国精神，促进社会的和谐发展。新生活运动不仅有助于提高国民的道德素质，也有助于加强社会的凝聚力。"
 CHI_focus_4: "组建复兴社"
 CHI_focus_4_desc: "复兴社是成立于南京的秘密政治组织，由蒋介石亲自担任社长，以黄埔系少壮军人为主体。它不仅是国民党内部的特务组织，更是蒋介石用以平衡CC系、政学系等其他派系、巩固个人独裁统治的核心工具。"
 Support_Chen_Chengs_reforms: "推动军事改革"
Support_Chen_Chengs_reforms_desc: "为了提高军队的战斗力和现代化水平，国民党推动军事改革。通过改革军事制度、加强军事训练、更新武器装备等措施，提高军队的战斗力和现代化水平。推动军事改革不仅有助于提高军队的战斗力，也有助于加强国家的国防能力。"
 CHI_focus_14: "停止清党运动"
CHI_focus_14_desc: "为了缓和党内矛盾，维护党的团结和稳定，国民党停止清党运动。通过停止清党运动，缓和党内的紧张气氛，维护党的团结和稳定，为国家的发展创造良好的政治环境。停止清党运动不仅有助于维护党的团结和稳定，也有助于促进国家的发展。"
 Fascist_propaganda: "法西斯主义中国化"
 Fascist_propaganda_desc: "邓文仪任蒋介石侍从秘书，负责军长、师长人选的荐任审核，是国民党最有权势的人物之一。他主持创办“拔提书店”，专门发行蒋介石言行录、传记以及希特勒的《我的奋斗》《墨索里尼自传》等书籍，为蒋介石树碑立传。\n他主编的《领袖言行》一书中写道：“或曰领袖与墨索里尼、希特勒相埒，同为世界之伟大人物……而我领袖丰功伟绩，实非希墨二氏所可比者。”这段谄媚之词深得蒋介石欢心。"
 Establish_a: "成立别动队"
 Support_the_Revival_Society: "成立特务处"
 Infiltrate_the_army: "凝聚意志，保卫领袖"
Infiltrate_the_army_desc: "为了加强对军队的控制和管理，国民党在军队中凝聚意志，保卫领袖。通过加强对军队的思想教育和政治工作，确保军队对领袖的绝对忠诚，维护军队的稳定和统一。凝聚意志，保卫领袖不仅有助于加强对军队的控制和管理，也有助于维护国家的稳定和安全。"
 Continue_political_training: "继续训政"
 Continue_political_training_desc: "训政是国民党在实现宪政前的过渡阶段，由国民党代行国民大会职权。继续训政意味着延长国民党的一党专政，强化蒋介石的个人权威，推迟民主政治的实现。"
 Decentralization_of_the_Five_Yuan: "召开制宪国民大会"
Decentralization_of_the_Five_Yuan_desc: "为了实现国家的民主化，国民党召开制宪国民大会。通过召开制宪国民大会，制定宪法，确立国家的政治制度，为国家的民主化和法治化奠定基础。召开制宪国民大会不仅是国家民主化进程中的重要步骤，也有助于维护国家的统一和稳定。"
 Abolish_the_silver_standard: "制度性改革"
Abolish_the_silver_standard_desc: "银本位制度已经不适应现代经济的发展需要，废除银本位制度是实现货币现代化的重要步骤。通过废除银本位，建立更加灵活的货币制度，促进经济的稳定发展。"
Foreign_exchange_and_silver_regulation: "外汇与白银管制"
Foreign_exchange_and_silver_regulation_desc: "外汇和白银是国家经济的重要资源，加强外汇与白银管制是维护国家经济安全的重要措施。通过合理管制外汇和白银的流通，稳定汇率，保障国家的经济稳定。"
Commercial_Control_Council: "商业统制总会"
Commercial_Control_Council_desc: "商业统制总会是管理商业活动的重要机构，设立商业统制总会是规范商业行为的重要措施。通过统一管理商业活动，促进商业的健康发展，保障国家的经济利益。"
Issuing_China_Storage_Bonds: "发行“中储券”"
Issuing_China_Storage_Bonds_desc: "中储券是重要的金融工具，发行中储券是筹集资金的重要方式。通过发行中储券，为国家的建设和发展筹集资金，促进经济的发展。"
Request_Japan_for_economic_cooperation: "请求日“经济提携”"
Request_Japan_for_economic_cooperation_desc: "日本是东亚强国，与日本开展经济合作对于我国的经济发展具有重要意义。通过请求日本的经济提携，引进日本的资金和技术，促进我国的工业化进程。"
China_US_Loan_Plan: "争取英美贷款支持"
China_US_Loan_Plan_desc: "英美是世界经济强国，争取英美贷款支持对于我国的经济发展具有重要意义。通过获得英美的贷款，为国家的建设和发展提供资金支持，促进经济的发展。"
common_prosperity: "共荣共存"
common_prosperity_desc: "共荣共存是重要的外交理念，通过与其他国家建立共荣共存的关系，促进区域经济的共同发展，实现互利共赢。"
Coping_with_inflation: "应对通货膨胀"
Coping_with_inflation_desc: "通货膨胀是经济发展中的常见问题，应对通货膨胀是维护经济稳定的重要措施。通过采取有效的货币政策和财政政策，控制通货膨胀，保障人民的生活水平。"
Fiat_currency_reform: "发行法币"
Fiat_currency_reform_desc: "法币改革是货币制度的重要变革，发行法币是实现货币现代化的关键步骤。通过发行法币，建立统一的货币体系，促进经济的稳定发展。"
Bank_restructuring: "银行改组"
Bank_restructuring_desc: "银行是金融体系的核心，银行改组是加强金融体系建设的重要措施。通过改组银行，提高银行的运营效率和服务质量，促进金融体系的健康发展。"
Open_policy: "开放政策"
Open_policy_desc: "开放政策是促进经济发展的重要策略，通过实行开放政策，吸引外国投资和技术，促进国内经济的发展，提高国家的国际竞争力。"
Establish_a_Trade_Committee: "设立贸易委员会"
Establish_a_Trade_Committee_desc: "贸易委员会是管理贸易活动的重要机构，设立贸易委员会是规范贸易行为的重要措施。通过统一管理贸易活动，促进贸易的健康发展，保障国家的贸易利益。"
Increase_agricultural_taxes: "提高农业税"
Increase_agricultural_taxes_desc: "农业税是国家财政的重要来源，适当提高农业税是增加财政收入的重要措施。通过提高农业税，为国家的建设和发展提供资金支持，促进经济的发展。"
Issue_the_Gold_Yuan_Note: "发布金圆券"
Issue_the_Gold_Yuan_Note_desc: "金圆券是重要的货币工具，发布金圆券是货币改革的重要步骤。通过发布金圆券，稳定货币体系，促进经济的稳定发展。"
New_National_Movement: "新国民运动"
New_National_Movement_desc: "新国民运动是一场重要的社会运动，旨在提高国民的道德素质和爱国精神。通过开展新国民运动，培养国民的良好品德和爱国意识，促进社会的和谐发展。"
Crack_down_on_localism: "打击地方势力"
Crack_down_on_localism_desc: "地方势力的存在严重影响了国家的统一和稳定，打击地方势力是维护国家统一的重要措施。通过打击地方势力，加强中央对地方的控制，确保国家的统一和稳定。"
Solve_the_economic_crisis: "解决经济危机"
Solve_the_economic_crisis_desc: "经济危机是国家发展中的重大挑战，解决经济危机是维护经济稳定的重要措施。通过采取有效的经济政策，应对经济危机，促进经济的恢复和发展。"
Maintain_the_silver_standard: "行政管制"
Maintain_the_silver_standard_desc: "银本位制度是国家货币制度的重要组成部分，维护银本位制度是稳定货币体系的重要措施。通过行政管制，维护银本位制度的稳定，保障国家的经济安全。"
CHI_focus_6: "保证绝对忠诚"
CHI_focus_6_desc: "我们的特务机构就发现了陈诚与邓演达的私自联系，陈诚试图支持临委会起义？此时绝对不能这样不了了之！必须加强对军队和党内的控制，确保所有高级官员对领袖的绝对忠诚。"
Split_and_Revive_Society_desc: "三青团成立后，“复兴社”被完全并入其中充当骨干力量，而陈诚作为书记长，实际上成为复兴社残余势力的整合者。蒋介石此举的目的之一，就是“消解旧有组织，不使其借三青团名义死灰复燃”，同时也让陈诚取代贺衷寒、康泽等人，成为黄埔系在党务领域的代表。"
Establish_the_Central_Bureau: "开设中统"
Establish_the_Central_Bureau_desc: "中统是重要的特务机构，开设中统是加强情报工作的重要措施。通过设立中统，加强对国内的情报收集和监控，维护国家的安全和稳定。"
Establish_the_Military_Statistics_Bureau: "开设军统"
Establish_the_Military_Statistics_Bureau_desc: "军统是重要的军事特务机构，开设军统是加强军事情报工作的重要措施。通过设立军统，加强对军事领域的情报收集和监控，维护国家的军事安全。"
Central_Reconstruction_Committee: "中央改造委员会"
Central_Reconstruction_Committee_desc: "中央改造委员会是负责党的改造和重建的重要机构，通过设立中央改造委员会，加强党的建设和改造，提高党的凝聚力和战斗力。"
Anti_corruption_campaign: "打虎运动"
Anti_corruption_campaign_desc: "打虎运动是一场重要的反腐败运动，旨在打击政府和党内的腐败现象。通过开展打虎运动，清除腐败分子，提高政府的廉洁度和公信力。"
Order_Warlords_to_Attack: "推行行政督察专员制度"
Order_Warlords_to_Attack_desc: "在“剿共”省份推行 “行政督察专员制” 。将地方的党政军大权集中于专员一人之手，而这位专员直接对中央政府（也就是蒋介石）负责。这一下子就绕过了CC系长期把持的省、县党部，使得CC系在地方的权力根基几乎被连根拔起，从“党权领导一切”变为“行政权力主导一切”。"
Control_the_warlords: "控制军阀"
Control_the_warlords_desc: "军阀割据是国家统一的重要障碍，控制军阀是实现国家统一的重要措施。通过采取政治和军事手段，控制和削弱军阀势力，加强中央对地方的控制，实现国家的统一和稳定。"
Supreme_Defense_Council: "国防最高委员会"
Supreme_Defense_Council_desc: "抗日战争全面爆发后，为了集中统一指挥全国抗战，国民党设立国防最高委员会，由蒋介石亲任委员长。该委员会集党政军大权于一身，成为战时中国的最高决策机构。蒋介石通过这一机构，不仅加强了对全国抗战的统一领导，更重要的是进一步集中了个人权力，使自己成为实际上的独裁者。国防最高委员会的设立，标志着国民党一党专政和蒋介石个人独裁的进一步强化。"
Establish_the_Presidential_System: "确立“总裁制”"
Establish_the_Presidential_System_desc: "抗日战争进入相持阶段后，国民党内部派系斗争激烈。为了加强党的集中统一领导，适应战时需要，国民党临时全国代表大会通过决议，修改党章，将原有的“总理”制改为“总裁”制，并选举蒋介石为国民党总裁。总裁制的设立，使蒋介石成为国民党的最高领袖，拥有绝对的权力，不仅在军事上，而且在党务和政治上也确立了个人独裁地位。这一制度的实施，标志着国民党一党专政的进一步强化，也为蒋介石继续维持独裁统治奠定了基础。"
Promulgate_the_Program_for_War_of_Resistance_an_Nation_Building: "颁布《抗战建国纲领》"
Promulgate_the_Program_for_War_of_Resistance_an_Nation_Building_desc: "抗日战争爆发后，为了团结全国人民共同抗日，国民党临时全国代表大会通过并颁布《抗战建国纲领》。这是抗日战争时期国民党的基本政治纲领，也是国共第二次合作的政治基础之一。纲领明确提出了抗战的总目标是“驱逐日本帝国主义，建设新中国”，并规定了军事、政治、经济、文化等各方面的具体政策。该纲领的颁布，对于团结全国人民共同抗日，动员全国力量投入抗战，起到了积极的作用。同时，它也体现了国民党在抗战初期的进步性，为全民族抗战的开展提供了政治指导。"
Central_Training_Group: "中央训练团"
Central_Training_Group_desc: "为了培养和训练忠诚于国民党和蒋介石的干部队伍，国民党设立中央训练团。该机构以“三民主义”为指导思想，对各级干部进行政治、军事和业务培训，强调绝对忠诚于蒋介石。中央训练团的设立，不仅提高了干部的素质和能力，更重要的是加强了蒋介石对干部队伍的控制，为巩固其独裁统治提供了人才保障。"
Antechamber: "侍从室"
Antechamber_desc: "为了加强对国家事务的直接控制，蒋介石设立侍从室作为自己的私人办事机构。侍从室成员多为蒋介石的亲信，负责处理蒋介石的日常事务、起草重要文件、传递机密指令等。侍从室的设立，使蒋介石能够绕过正常的行政程序，直接干预国家的重要决策，成为其个人独裁的重要工具。通过侍从室，蒋介石进一步集中了权力，巩固了自己的独裁地位。"
Agent_Controlled_Military: "利用军特矛盾"
Agent_Controlled_Military_desc: "国民党内部存在着军队系统和特务系统之间的矛盾。为了巩固自己的权力，蒋介石采取了利用军特矛盾的策略。通过有意制造和利用两者之间的矛盾，使双方相互牵制、相互削弱，从而加强中央对军队和特务系统的控制。这种策略不仅有助于维护蒋介石的独裁统治，也避免了任何一方势力过大威胁到他的地位。"
Military_independence: "保证军特团结"
Military_independence_desc: "为了避免军特矛盾影响国家的稳定和战斗力，国民党采取措施保证军特团结。通过明确分工，让特务系统专注于情报搜集、反间谍等专业领域，同时通过制度保障军事指挥官拥有不受干扰的战场指挥权。这种措施不仅有助于提高军队的战斗力，也有助于维护国家的稳定和统一。"
Intelligence_sharing: "情报共享"
Intelligence_sharing_desc: "为了提高情报工作的效率和准确性，国民党建立情报共享机制。通过加强各情报机构之间的合作和信息交流，实现情报的及时共享和分析，提高情报的准确性和时效性。这种机制不仅有助于加强国家的安全防御能力，也有助于提高决策的科学性和及时性。"
Ensure_the_loyalty_of_the_army: "保证军队忠诚"
Ensure_the_loyalty_of_the_army_desc: "军队的忠诚是国家稳定和安全的重要保障。为了确保军队对国民党和蒋介石的绝对忠诚，国民党加强对军队的思想教育和纪律建设。通过开展政治教育、加强军事训练、严格纪律约束等措施，使军队成为维护国民党统治和蒋介石独裁地位的坚强支柱。"
Central_Design_Bureau: "中央设计局"
Central_Design_Bureau_desc: "为了加强对国家建设的规划和指导，国民党设立中央设计局。该机构负责制定国家建设的长期规划和具体方案，包括经济、交通、工业等各个领域。中央设计局的设立，不仅有助于提高国家建设的科学性和系统性，也有助于加强中央对国家建设的统一领导，为国家的现代化建设提供了重要的规划支持。"
Party_and_Government_Work_Assessment_Committee: "党政工作考核委员会"
Party_and_Government_Work_Assessment_Committee_desc: "为了提高党政工作的效率和质量，国民党设立党政工作考核委员会。该委员会负责对各级党政机关和干部的工作进行监督和考核，通过制定科学的考核标准和评价体系，激励干部积极工作，提高党政工作的效率和质量。这种考核机制不仅有助于提高政府的行政能力，也有助于加强对干部的管理和监督。"
National_Spirit_Mobilization_Meeting: "总动员委员会"
National_Spirit_Mobilization_Meeting_desc: "为了应对战争和国家建设的需要，国民党设立总动员委员会。该委员会负责组织和协调全国的人力、物力和财力，确保国家资源的合理分配和有效利用。总动员委员会的设立，不仅有助于提高国家的动员能力，也有助于加强中央对全国资源的控制，为国家的战争和建设提供了重要的组织保障。"
National_Monthly_Meeting: "国民月会"
National_Monthly_Meeting_desc: "为了增强国民的国家意识和参与意识，国民党推行国民月会制度。通过定期召开国民月会，向国民宣传国家政策、收集国民意见、增强国民的凝聚力和向心力。国民月会的设立，不仅有助于提高国民的政治参与度，也有助于加强国民党对基层社会的控制，巩固其统治基础。"
CHI_Five_Year_Plan: "五年计划"
CHI_Five_Year_Plan_desc: "为了实现国家的工业化和现代化，国民党制定并实施五年计划。该计划明确了国家经济和社会发展的目标和任务，包括工业、农业、交通等各个领域的发展规划。五年计划的实施，不仅有助于促进国家的经济发展，也有助于加强中央对经济的控制和管理，为国家的现代化建设提供了重要的规划指导。"
Resources_Committee: "资源委员会"
Resources_Committee_desc: "为了合理开发和利用国家的资源，国民党设立资源委员会。该委员会负责管理国家的矿产、能源等重要资源，制定资源开发规划，协调资源的分配和利用。资源委员会的设立，不仅有助于提高资源的利用效率，也有助于加强中央对资源的控制，为国家的经济发展提供了重要的资源保障。"
Build_a_national_defense_transportation_network: "构建国防交通网络"
Build_a_national_defense_transportation_network_desc: "为了加强国家的防御能力，国民党致力于构建国防交通网络。通过修建铁路、公路、机场等交通基础设施，形成纵横交错的交通网络，提高军队的机动性和后勤保障能力。国防交通网络的构建，不仅有助于加强国家的防御能力，也有助于促进区域经济的发展，为国家的现代化建设提供了重要的交通保障。"
Factory_relocation: "工厂迁移监督委员会"
Factory_relocation_desc: "为了应对战争威胁和促进工业布局的优化，国民党设立工厂迁移监督委员会。该委员会负责组织和协调工厂的迁移工作，确保工厂能够安全、有序地迁移到后方或其他战略地区。工厂迁移监督委员会的设立，不仅有助于保护国家的工业设施，也有助于促进工业的合理布局，为国家的经济发展和战争准备提供了重要的保障。"
Party_and_league_merger: "党团合并"
Party_and_league_merger_desc: "为了集中力量应对危机，消除党内派系内耗，增强党的凝聚力，蒋介石决定整合自己一手创建的三青团。国民党六届四中全会通过决议，将三青团并入国民党，规定各级团部干部转为同级党部副职，并强制党员登记，逾期未登记者视同退党。这一措施不仅有助于加强党的集中统一领导，也为蒋介石进一步巩固个人权力创造了条件。同时，CC系也借此机会在三青团势力强大的地区迅速扩张自己的势力范围。"
Establish_a_Youth_Service_Club: "青年服务社"
Establish_a_Youth_Service_Club_desc: "为了更好地服务青年、引导青年，国民党设立青年服务社。该机构通过为青年提供各种服务和支持，如教育、就业、文化活动等，培养青年的社会责任感和爱国精神，引导青年积极参与国家建设。青年服务社的设立，不仅有助于提高青年的综合素质，也有助于加强国民党对青年的影响力和控制力，为其统治培养后备力量。"
Central_Cadre_School: "中央干部学校"
Central_Cadre_School_desc: "为了培养和训练忠诚于国民党和蒋介石的高级干部，国民党设立中央干部学校。该学校以“三民主义”为指导思想，对干部进行系统的政治、军事和业务培训，强调绝对忠诚于蒋介石。中央干部学校的设立，不仅提高了干部的素质和能力，更重要的是为国民党培养了一批忠实的骨干力量，为巩固其统治提供了人才保障。"
One_hundred_thousand_youths_one_hundred_thousand_soldiers: "十万青年十万军"
One_hundred_thousand_youths_one_hundred_thousand_soldiers_desc: "为了应对战争的需要，国民党发起“十万青年十万军”运动，号召广大青年参军报国。通过宣传和动员，大量青年响应号召，加入军队，为国家的国防建设和抗战事业提供了有力的人力支持。这一运动不仅增强了军队的战斗力，也激发了全国人民的爱国热情，为抗战的胜利做出了重要贡献。"
Control_propaganda_positions: "成立“励进社”"
Control_propaganda_positions_desc: "为了加强对宣传阵地的控制，国民党成立励进社。该组织作为国民党的重要宣传机构，负责宣传党的政策、引导社会舆论、打击反对势力。通过控制宣传阵地，国民党能够更有效地传播自己的意识形态，加强对社会的控制，维护自己的统治地位。励进社的成立，标志着国民党对宣传工作的高度重视。"
Party_and_government_reform: "党政革新"
Party_and_government_reform_desc: "为了提高党政工作的效率和质量，增强党的凝聚力和战斗力，国民党推行党政革新。通过改革党政机构、优化工作流程、提高干部素质等措施，使党政工作更加适应国家发展的需要。党政革新不仅有助于提高政府的行政能力，也有助于加强党的建设，为国民党的统治提供更加坚实的基础。"
The_Movement_for_the_Construction_of_China_Centric_Culture: "中国本位文化建设运动"
The_Movement_for_the_Construction_of_China_Centric_Culture_desc: "为了弘扬中国传统文化，构建具有中国特色的文化体系，国民党发起中国本位文化建设运动。这场运动强调以中国传统文化为基础，吸收西方文化的精华，反对全盘西化和文化复古主义。通过开展这一运动，不仅增强了民族自信心和文化认同感，也为国民党的统治提供了文化支撑。"
Focus_on_anti_Communist_tasks: "专注反共任务"
Focus_on_anti_Communist_tasks_desc: "共产党的存在被国民党视为对其统治的严重威胁。为了维护国民党的统治地位，国民党将反共作为重要任务，集中力量打击共产党。通过军事围剿、政治压制、经济封锁等手段，国民党试图消除共产党的影响，巩固自己的统治。这一政策不仅反映了国民党对共产党的敌视，也体现了其维护一党专政的决心。"
Unite_the_will_concentrate_the_strength: "统一意志，凝聚力量"
Unite_the_will_concentrate_the_strength_desc: "为了加强国家团结，凝聚全国力量，国民党提出“统一意志，凝聚力量”的口号。通过宣传、教育等手段，统一全国人民的思想和意志，将全国人民的力量凝聚起来，共同为国家的建设和发展而努力。这一措施不仅有助于提高国家的凝聚力和向心力，也有助于加强国民党的统治地位。"
Military_authoritarianism_with_Chinese_characteristics: "以军治国"
Military_authoritarianism_with_Chinese_characteristics_desc: "为了维护国家的稳定和秩序，国民党采取以军治国的策略。通过加强军队的建设和控制，依靠军队来维持国家的稳定，巩固自己的统治地位。以军治国不仅有助于迅速恢复和维持社会秩序，也有助于加强中央对地方的控制，为国民党的独裁统治提供了有力的保障。"
Build_international_channels: "铁路建设"
Build_international_channels_desc: "为了改善交通运输条件，促进区域经济的协调发展，国民党大力推进铁路建设。通过修建铁路，不仅可以加强各地区之间的联系，促进物资和人员的流通，还可以加强中央对地方的控制，维护国家的统一和稳定。铁路建设是国家现代化建设的重要组成部分，对于促进经济发展和社会进步具有重要意义。"
Develop_state_owned_industries: "实业部"
Develop_state_owned_industries_desc: "为了加强对工业的管理和指导，促进工业的发展，国民党设立实业部。该机构负责制定工业发展规划，管理和监督工业企业，促进工业技术的进步和创新。实业部的设立，不仅有助于提高国家的工业实力，也有助于加强中央对工业的控制，为国家的现代化建设提供了重要的机构保障。"
Expand_resource_extraction: "玉门油矿"
Expand_resource_extraction_desc: "为了保障国家的能源供应，国民党大力开发玉门油矿。玉门油矿是中国重要的石油资源，通过开发玉门油矿，增加石油产量，不仅可以满足国家的能源需求，还可以促进相关产业的发展，推动国家的工业化进程。石油是现代工业的血液，玉门油矿的开发对于国家的经济发展和国防建设具有重要意义。"
Develop_state_owned_industries0: "发展长江三角洲工业"
Develop_state_owned_industries0_desc: "长江三角洲是中国经济最发达的地区之一，具有优越的地理位置和丰富的资源。为了促进经济的快速发展，国民党重点发展长江三角洲工业。通过加大对该地区的投资，引进先进技术和设备，提高工业生产效率，促进区域经济的快速发展。长江三角洲工业的发展，不仅可以带动全国经济的增长，也可以为国家的现代化建设提供重要的经济支撑。"
Develop_state_owned_industries1: "发展西北工业"
Develop_state_owned_industries1_desc: "西北地区是中国的重要战略区域，拥有丰富的自然资源。为了促进区域经济的平衡发展，国民党重点发展西北工业。通过加大对西北地区的投资，开发当地的资源，建立工业基地，提高西北地区的经济发展水平。发展西北工业不仅可以促进全国经济的协调发展，还可以加强对西北地区的控制，维护国家的统一和稳定。"
Expand_resource_extraction0: "建立大型钢厂"
Expand_resource_extraction0_desc: "钢铁是现代工业的基础，是国家工业化的重要标志。为了满足国家工业发展的需求，国民党建立大型钢厂。通过引进先进的技术和设备，提高钢铁的产量和质量，为国家的工业发展提供重要的原材料支持。大型钢厂的建立，不仅可以促进工业的发展，还可以提高国家的经济实力和国防能力。"
Expand_resource_extraction1: "特矿统制政策"
Expand_resource_extraction1_desc: "特矿是国家的重要战略资源，对于工业发展和国防建设具有重要意义。为了合理开发和利用特矿资源，保障国家的战略需求，国民党实施特矿统制政策。通过对特矿资源的统一管理和控制，确保特矿资源的合理分配和有效利用，为国家的工业发展和国防建设提供重要的资源保障。特矿统制政策的实施，不仅有助于提高资源的利用效率，也有助于加强中央对资源的控制。"
Develop_state_owned_industries2: "发展西南工业"
Develop_state_owned_industries2_desc: "西南地区是中国的重要战略区域，拥有丰富的自然资源和战略地位。为了促进区域经济的平衡发展，国民党重点发展西南工业。通过加大对西南地区的投资，开发当地的资源，建立工业基地，提高西南地区的经济发展水平。发展西南工业不仅可以促进全国经济的协调发展，还可以加强对西南地区的控制，维护国家的统一和稳定。同时，西南地区作为战略后方，其工业发展对于国家的安全也具有重要意义。"
Military_industrial_construction: "军工建设"
Military_industrial_construction_desc: "为了加强国家的国防能力，国民党大力推进军工建设。通过建立和扩建军事工业基地，提高武器装备的生产能力和质量，为军队提供充足的武器装备。军工建设是国防建设的重要组成部分，对于保障国家的安全和稳定具有重要意义。同时，军工建设也可以促进相关产业的发展，推动国家的工业化进程。"
Integrate_existing_military_factories: "扩建金陵兵工厂"
Integrate_existing_military_factories_desc: "金陵兵工厂是中国重要的军事工业基地，为了提高武器装备的生产能力，国民党扩建金陵兵工厂。通过引进先进的技术和设备，扩大生产规模，提高生产效率，为军队提供更多、更先进的武器装备。金陵兵工厂的扩建，不仅可以增强国家的国防能力，也可以促进当地经济的发展。"
Zhuzhou_Ordnance_Factory: "株洲兵工厂"
Zhuzhou_Ordnance_Factory_desc: "为了加强军工建设，提高武器装备的生产能力，国民党设立株洲兵工厂。株洲兵工厂作为重要的军事工业基地，负责生产各种武器装备，为军队提供物资支持。通过引进先进的技术和设备，提高生产效率和产品质量，株洲兵工厂成为国家国防工业的重要组成部分。株洲兵工厂的设立，不仅可以增强国家的国防能力，也可以促进当地经济的发展。"
German_economic_aid: "德国经济援助"
German_economic_aid_desc: "德国是工业强国，拥有先进的技术和丰富的资金。为了促进中国的经济发展和工业化进程，国民党寻求德国的经济援助。通过接受德国的经济援助，引进德国的技术和资金，中国可以加快工业化步伐，提高工业生产能力。德国经济援助对于中国的现代化建设具有重要意义，也有助于加强中德两国之间的友好关系。"
German_Positional_Tactics: "与德国交好"
German_Positional_Tactics_desc: "德国是世界军事强国，拥有先进的军事技术和战术。为了提高中国军队的战斗力，国民党积极与德国建立友好关系。通过与德国的军事交流和合作，引进德国的军事技术和战术，学习德国的军事经验，提升中国军队的现代化水平。与德国交好不仅有助于加强中国的国防能力，也有助于促进中德两国之间的经济和文化交流。"
Formed_German_style_adjuster: "德式调整师"
Formed_German_style_adjuster_desc: "为了提高中国军队的战斗力和现代化水平，国民党按照德国军队的标准组建德式调整师。通过引进德国的武器装备，采用德国的训练方法和战术，德式调整师成为中国军队中的精锐力量。德式调整师的组建，不仅提高了中国军队的战斗力，也为中国军队的现代化建设提供了重要的参考。"
 Three_Year_Plan_for_Heavy_Industry: "重工业三年计划"
 Three_Year_Plan_for_Heavy_Industry_desc: "为了实现国家的工业化和现代化，国民党制定并实施重工业三年计划。该计划重点发展钢铁、机械、能源等重工业，通过集中力量发展重工业，提高国家的工业实力和国防能力。重工业三年计划的实施，不仅有助于促进国家的经济发展，也有助于加强中央对经济的控制和管理，为国家的现代化建设提供了重要的规划指导。"
 Dehua_Credit_Loan_Contract: "德华信用借款合同"
 Dehua_Credit_Loan_Contract_desc: "为了获取发展经济和国防所需的资金，国民党与德国签订德华信用借款合同。通过向德国借款，中国可以引进德国的技术和设备，加快工业化步伐，提高工业生产能力。德华信用借款合同的签订，不仅有助于中国的现代化建设，也有助于加强中德两国之间的友好关系。"
 Be_on_good_terms_with_Italy: "与意大利交好"
 Be_on_good_terms_with_Italy_desc: "意大利是欧洲强国，拥有先进的技术和丰富的资源。为了促进中国的经济发展和现代化建设，国民党积极与意大利建立友好关系。通过与意大利的经济和文化交流，引进意大利的技术和资金，中国可以加快工业化步伐，提高国家的综合实力。与意大利交好不仅有助于加强中国的国际地位，也有助于促进中意两国之间的友好合作。"
 Agreement_on_the_Settlement_of_the_China_Italy_Debt: "《解决中意庚款协定》"
 Agreement_on_the_Settlement_of_the_China_Italy_Debt_desc: "为了解决历史遗留的庚款问题，改善中意两国关系，国民党与意大利签订《解决中意庚款协定》。该协定规定了庚款的偿还方式和用途，将部分庚款用于中国的教育和文化事业。《解决中意庚款协定》的签订，不仅有助于改善中意两国关系，也有助于促进中国的教育和文化事业的发展。"
 Central_Nanchang_Aircraft_Manufacturing_Factory: "中央南昌飞机制造厂"
 Central_Nanchang_Aircraft_Manufacturing_Factory_desc: "为了发展航空工业，提高国家的空中防御能力，国民党设立中央南昌飞机制造厂。该工厂主要负责飞机的制造和维修，虽然主要依靠拼装外国零件，技术水平有限，但其设立标志着中国航空工业的起步。中央南昌飞机制造厂的设立，不仅有助于提高国家的空中防御能力，也为中国航空工业的发展积累了经验。"
 Yangtze_River_Defense_Plan: "长江防卫计划"
 Yangtze_River_Defense_Plan_desc: "为了加强长江流域的防御能力，国民党制定长江防卫计划。通过在长江沿岸修建防御工事，部署兵力和武器装备，建立有效的防御体系，确保长江流域的安全。长江防卫计划的实施，不仅有助于保护长江流域的经济和人口，也有助于维护国家的安全和稳定。"
 Purchase_Italian_equipment: "采购意式装备"
 Purchase_Italian_equipment_desc: "为了提高中国军队的战斗力，国民党从意大利采购意式装备。通过引进意大利的武器装备，中国军队的装备水平得到了一定程度的提升。采购意式装备不仅有助于提高中国军队的战斗力，也有助于加强中意两国之间的军事合作。"
 Be_good_with_France: "与法国交好"
 Be_good_with_France_desc: "法国是欧洲强国，拥有先进的技术和丰富的文化。为了促进中国的现代化建设和文化发展，国民党积极与法国建立友好关系。通过与法国的经济和文化合作，引进法国的技术和资金，促进中国的工业化和文化发展。与法国交好不仅有助于加强中国的国际地位，也有助于促进中法两国之间的友好合作。"
Sino_French_Education_Foundation_Committee: "中法教育基金委员会"
Sino_French_Education_Foundation_Committee_desc: "为了促进中法两国之间的教育交流和合作，国民党与法国共同设立中法教育基金委员会。该委员会通过设立教育基金，支持两国之间的学生交流、学术合作和文化交流，培养国际化人才。中法教育基金委员会的设立，不仅有助于促进中法两国之间的教育交流，也有助于加强两国之间的友好关系。"
 Railway_construction_loan: "铁路建设贷款"
 Railway_construction_loan_desc: "为了加快铁路建设，改善交通运输条件，国民党寻求铁路建设贷款。通过获取贷款，国民党可以引进先进的铁路建设技术和设备，加快铁路网络的建设，促进区域经济的协调发展。铁路建设贷款对于国家的现代化建设具有重要意义，也有助于加强中国与贷款国之间的经济合作。"
 Purchase_French_equipment: "采购法式装备"
 Purchase_French_equipment_desc: "为了提高中国军队的战斗力，国民党从法国采购法式装备。通过引进法国的武器装备，中国军队的装备水平得到了一定程度的提升。采购法式装备不仅有助于提高中国军队的战斗力，也有助于加强中法两国之间的军事合作。"
 Management_of_Zhongying_Geng_Fund_Board_of_Directors: "管理中英庚款董事会"
 Management_of_Zhongying_Geng_Fund_Board_of_Directors_desc: "为了合理管理和利用中英庚款，国民党设立管理中英庚款董事会。该董事会负责管理庚款的使用，将庚款用于教育、文化、科技等事业的发展。管理中英庚款董事会的设立，不仅有助于合理利用庚款资源，也有助于促进中国的教育和文化事业的发展。"
 Be_good_with_UK: "与英国交好"
 Be_good_with_UK_desc: "英国是世界强国，拥有先进的技术和丰富的经验。为了促进中国的现代化建设和经济发展，国民党积极与英国建立友好关系。通过与英国的经济和贸易合作，引进英国的技术和资金，促进中国的工业化和经济发展。与英国交好不仅有助于加强中国的国际地位，也有助于促进中英两国之间的友好合作。"
 Naval_Assistance_Agreement: "海军援助协定"
 Naval_Assistance_Agreement_desc: "为了加强中国的海军建设，提高海军的战斗力，国民党与外国签订海军援助协定。通过接受外国的海军援助，中国可以引进先进的海军技术和装备，提高海军的现代化水平。海军援助协定的签订，不仅有助于加强中国的海防能力，也有助于加强中国与援助国之间的军事合作。"
 China_first_tank_unit: "中国第一支装甲部队"
 China_first_tank_unit_desc: "为了提高中国军队的机械化水平和战斗力，国民党组建中国第一支装甲部队。通过引进外国的坦克和装甲车辆，采用先进的训练方法和战术，中国第一支装甲部队成为中国军队中的精锐力量。中国第一支装甲部队的组建，不仅提高了中国军队的战斗力，也为中国军队的现代化建设提供了重要的参考。"
 Purchase_British_style_equipment: "采购英式装备"
 Purchase_British_style_equipment_desc: "为了提高中国军队的战斗力，国民党从英国采购英式装备。通过引进英国的武器装备，中国军队的装备水平得到了一定程度的提升。采购英式装备不仅有助于提高中国军队的战斗力，也有助于加强中英两国之间的军事合作。"
 Construct_the_China_Burma_Road: "修建滇缅公路"
 Construct_the_China_Burma_Road_desc: "为了加强中国与外部世界的联系，保障物资的运输，国民党修建滇缅公路。滇缅公路连接中国云南和缅甸，是中国对外交通的重要通道。通过修建滇缅公路，中国可以更有效地获取外部的物资和援助，对于抗日战争的胜利具有重要意义。滇缅公路的修建，不仅有助于加强中国的国际联系，也有助于促进沿线地区的经济发展。"
 Construction_of_the_Yunnan_Vietnam_Railway: "修建滇越铁路"
 Construction_of_the_Yunnan_Vietnam_Railway_desc: "为了加强中国与越南的联系，促进物资的运输，国民党修建滇越铁路。滇越铁路连接中国云南和越南，是中国对外交通的重要通道。通过修建滇越铁路，中国可以更有效地与东南亚地区进行经济和文化交流，促进沿线地区的经济发展。滇越铁路的修建，不仅有助于加强中国的国际联系，也有助于促进区域经济的发展。"
 CHIFocus_3: "与美国交好"
 CHIFocus_3_desc: "美国是世界强国，拥有先进的技术和丰富的资源。为了促进中国的现代化建设和经济发展，国民党积极与美国建立友好关系。通过与美国的经济和贸易合作，引进美国的技术和资金，促进中国的工业化和经济发展。与美国交好不仅有助于加强中国的国际地位，也有助于促进中美两国之间的友好合作。"
 Purchase_American_equipment: "采购美式武器"
 Purchase_American_equipment_desc: "为了提高中国军队的战斗力，国民党从美国采购美式武器。通过引进美国的先进武器装备，中国军队的装备水平得到了显著提升。采购美式武器不仅有助于提高中国军队的战斗力，也有助于加强中美两国之间的军事合作。"
 Soviet_loans_to_China: "苏联援华贷款"
 Soviet_loans_to_China_desc: "为了获取发展经济和国防所需的资金，国民党接受苏联的援华贷款。通过获得苏联的贷款和技术支持，中国可以加快工业化步伐，提高工业生产能力。苏联援华贷款对于中国的现代化建设具有重要意义，也有助于加强中苏两国之间的友好关系。"
 Purchase_Su_style_weapons: "采购苏式武器"
 Purchase_Su_style_weapons_desc: "为了提高中国军队的战斗力，国民党从苏联采购苏式武器。通过引进苏联的武器装备，中国军队的装备水平得到了一定程度的提升。采购苏式武器不仅有助于提高中国军队的战斗力，也有助于加强中苏两国之间的军事合作。"
 Flying_Tigers: "飞虎队"
 Flying_Tigers_desc: "为了加强中国的空中防御能力，国民党与美国合作组建飞虎队。飞虎队由美国飞行员组成，他们在中国上空与日军作战，为中国的抗日战争做出了重要贡献。飞虎队的组建，不仅有助于加强中国的空中防御能力，也有助于加强中美两国之间的军事合作。"
 Lend_Lease_Act: "租借法案"
 Lend_Lease_Act_desc: "为了获取战争所需的物资和装备，国民党接受美国的租借法案援助。通过租借法案，中国可以获得美国的武器装备、物资和技术支持，对于抗日战争的胜利具有重要意义。租借法案的实施，不仅有助于加强中国的抗战能力，也有助于加强中美两国之间的友好关系。"
 Tchaikovsky_Advisory_Group: "崔可夫顾问团"
 Tchaikovsky_Advisory_Group_desc: "为了提高中国军队的战斗力和现代化水平，国民党邀请苏联崔可夫顾问团来华。崔可夫顾问团由苏联的军事专家组成，他们帮助中国军队进行整编和训练，引进苏联的军事技术和战术，提高中国军队的战斗力。崔可夫顾问团的到来，对于中国军队的现代化建设具有重要意义。"
 CHIFocus_9: "西北国际通道"
 CHIFocus_9_desc: "为了加强中国与外部世界的联系，保障物资的运输，国民党开辟西北国际通道。西北国际通道连接中国西北地区与苏联等国家，是中国对外交通的重要通道。通过开辟西北国际通道，中国可以更有效地获取外部的物资和援助，对于抗日战争的胜利具有重要意义。西北国际通道的开辟，不仅有助于加强中国的国际联系，也有助于促进西北地区的经济发展。"
 Nationalist_Army_US_Equipment_Modernization: "修建中印公路"
 Nationalist_Army_US_Equipment_Modernization_desc: "为了加强中国与印度的联系，保障物资的运输，国民党修建中印公路。中印公路连接中国云南和印度，是中国对外交通的重要通道。通过修建中印公路，中国可以更有效地获取外部的物资和援助，对于抗日战争的胜利具有重要意义。中印公路的修建，不仅有助于加强中国的国际联系，也有助于促进沿线地区的经济发展。"
 China_India_Oil_Pipeline: "中印输油管道"
 China_India_Oil_Pipeline_desc: "为了保障中国的石油供应，国民党修建中印输油管道。中印输油管道连接印度和中国，是中国获取石油的重要通道。通过修建中印输油管道，中国可以更有效地获取外部的石油资源，对于国家的经济发展和国防建设具有重要意义。中印输油管道的修建，不仅有助于保障中国的能源供应，也有助于加强中印两国之间的经济合作。"
 CHIFocus_4: "与苏联交好"
 CHIFocus_4_desc: "苏联是世界强国，拥有先进的技术和丰富的资源。为了促进中国的现代化建设和经济发展，国民党积极与苏联建立友好关系。通过与苏联的经济和贸易合作，引进苏联的技术和资金，促进中国的工业化和经济发展。与苏联交好不仅有助于加强中国的国际地位，也有助于促进中苏两国之间的友好合作。"
 CHIFocus_6: "美国军事顾问团"
 CHIFocus_6_desc: "为了提高中国军队的战斗力和现代化水平，国民党邀请美国军事顾问团来华。美国军事顾问团由美国的军事专家组成，他们帮助中国军队进行整编和训练，引进美国的军事技术和战术，提高中国军队的战斗力。美国军事顾问团的到来，对于中国军队的现代化建设具有重要意义。"
 Military_industrial_construction1: "扩建巩县兵工厂"
 Military_industrial_construction1_desc: "为了提高武器装备的生产能力，国民党扩建巩县兵工厂。巩县兵工厂是中国重要的军事工业基地，通过扩建巩县兵工厂，提高武器装备的生产能力和质量，为军队提供更多、更先进的武器装备。巩县兵工厂的扩建，不仅可以增强国家的国防能力，也可以促进当地经济的发展。"
 Highway_construction: "公路建设"
 Highway_construction_desc: "为了改善交通运输条件，促进区域经济的协调发展，国民党大力推进公路建设。通过修建公路，不仅可以加强各地区之间的联系，促进物资和人员的流通，还可以加强中央对地方的控制，维护国家的统一和稳定。公路建设是国家现代化建设的重要组成部分，对于促进经济发展和社会进步具有重要意义。"
 Airport_construction: "机场建设"
 Airport_construction_desc: "为了加强国家的空中交通和防御能力，国民党大力推进机场建设。通过修建机场，不仅可以提高国家的空中交通能力，还可以加强国家的空中防御能力，保障国家的安全和稳定。机场建设是国家现代化建设的重要组成部分，对于促进经济发展和国防建设具有重要意义。"
 National_Radio_Communication_Network_Plan: "全国无线电通信网计划"
 National_Radio_Communication_Network_Plan_desc: "为了加强国家的通信能力，国民党制定全国无线电通信网计划。通过建立全国性的无线电通信网络，提高国家的通信效率和可靠性，加强各地区之间的联系和协调。全国无线电通信网计划的实施，不仅有助于提高国家的通信能力，也有助于加强中央对地方的控制，维护国家的统一和稳定。"
 The_Shaping_of_National_Will: "国民意志之塑造"
 The_Shaping_of_National_Will_desc: "为了统一全国人民的思想和意志，凝聚全国力量，国民党提出国民意志之塑造。通过宣传、教育等手段，培养国民的国家意识和爱国精神，使全国人民团结一心，共同为国家的建设和发展而努力。国民意志之塑造不仅有助于提高国家的凝聚力和向心力，也有助于加强国民党的统治地位。"
 Convene_National_Congress: "结束训政"
 Convene_National_Congress_desc: "为了实现国家的民主化，国民党决定结束训政，召开国民大会。通过召开国民大会，制定宪法，实现还政于民，使国家进入宪政时期。结束训政是国家民主化进程中的重要步骤，对于实现国家的长治久安具有重要意义。"
 Constitution_of_the_Republic_of_China: "制定《中华民国宪法》"
 Constitution_of_the_Republic_of_China_desc: "为了实现国家的民主化和法治化，国民党制定《中华民国宪法》。该宪法规定了国家的政治制度、公民的权利和义务等重要内容，是国家的根本大法。制定《中华民国宪法》不仅有助于实现国家的民主化和法治化，也有助于维护国家的统一和稳定。"
 Implement_the_Five_Power_Constitution: "实施五权宪法"
 Implement_the_Five_Power_Constitution_desc: "为了实现孙中山先生的五权宪法思想，国民党实施五权宪法。五权宪法包括行政、立法、司法、考试、监察五权分立，是一种具有中国特色的政治制度。实施五权宪法不仅有助于实现国家的民主化和法治化，也有助于提高政府的行政效率和治理能力。"

 Improve_the_examination_and_personnel_evaluation_system: "完善考试院铨叙制度"
 Improve_the_examination_and_personnel_evaluation_system_desc: "为了提高公务员的素质和能力，国民党完善考试院铨叙制度。通过改革考试制度，加强对公务员的考核和评价，选拔优秀的人才进入公务员队伍。完善考试院铨叙制度不仅有助于提高政府的行政效率，也有助于建立公正、透明的人事制度。"
 Improve_the_audit_functions_of_the_supervisory_institute: "健全监察院审计职能"
 Improve_the_audit_functions_of_the_supervisory_institute_desc: "为了加强对政府财政的监督和管理，国民党健全监察院审计职能。通过加强对政府财政的审计和监督，防止腐败和浪费，提高财政资金的使用效率。健全监察院审计职能不仅有助于提高政府的廉洁度，也有助于增强政府的公信力。"
 Strengthen_the_judiciarys_independent_trial: "强化司法院独立审判"
 Strengthen_the_judiciarys_independent_trial_desc: "为了保障司法公正和独立，国民党强化司法院独立审判。通过改革司法制度，确保司法机关独立行使审判权，不受行政机关和其他势力的干涉。强化司法院独立审判不仅有助于保障公民的合法权益，也有助于维护社会的公平正义。"
 Elect_representatives_to_the_National_Assembly: "选举国民大会代表"
 Elect_representatives_to_the_National_Assembly_desc: "为了实现国家的民主化，国民党举行国民大会代表选举。通过选举产生国民大会代表，代表人民行使国家权力，参与国家的重大决策。选举国民大会代表是国家民主化进程中的重要步骤，对于实现人民当家作主具有重要意义。"
 Expand_suffrage: "扩大选举权"
 Expand_suffrage_desc: "为了实现国家的民主化，国民党扩大选举权。通过降低选举资格限制，使更多的公民能够参与选举，行使自己的民主权利。扩大选举权不仅有助于提高公民的政治参与度，也有助于促进国家的民主化进程。"
 Improve_the_Electoral_Law: "完善选举法"
 Improve_the_Electoral_Law_desc: "为了确保选举的公平、公正和透明，国民党完善选举法。通过改革选举制度，规范选举程序，加强对选举的监督和管理，确保选举的合法性和公正性。完善选举法不仅有助于提高选举的质量，也有助于增强公民对选举的信任。"
 Implement_local_self_government: "实施地方自治"
 Implement_local_self_government_desc: "为了实现地方的民主管理，国民党实施地方自治。通过赋予地方一定的自治权，让地方居民参与地方事务的管理和决策，提高地方管理的效率和质量。实施地方自治不仅有助于提高地方的发展活力，也有助于促进国家的民主化进程。"
 Establish_local_councils: "建立地方议会"
 Establish_local_councils_desc: "为了实现地方的民主管理，国民党建立地方议会。通过选举产生地方议会代表，代表地方居民行使地方权力，参与地方事务的决策和管理。建立地方议会不仅有助于提高地方管理的民主性和科学性，也有助于促进地方的发展和稳定。"
 Strengthen_public_opinio_supervision: "强化民意监督"
 Strengthen_public_opinio_supervision_desc: "为了加强对政府的监督和约束，国民党强化民意监督。通过建立健全民意表达机制，鼓励公民参与国家事务的监督和管理，提高政府的透明度和 accountability。强化民意监督不仅有助于提高政府的治理能力，也有助于促进国家的民主化进程。"
 Restructure_the_Executive_Yuan: "重组行政院"
 Restructure_the_Executive_Yuan_desc: "为了提高政府的行政效率和治理能力，国民党重组行政院。通过改革行政机构，优化部门设置，提高公务员的素质和能力，使行政院更好地适应国家发展的需要。重组行政院不仅有助于提高政府的行政效率，也有助于加强中央对地方的控制和管理。"
 Establish_the_Presidential_Office: "设立总统府"
 Establish_the_Presidential_Office_desc: "为了适应宪政体制的需要，国民党设立总统府作为总统的办公机构。总统府的设立进一步强化了总统的权力，使其成为国家的最高领导人。总统府的设立不仅有助于提高政府的行政效率，也有助于加强国家的统一和稳定。"
 Lift_the_ban_on_political_parties: "路线问题"
 Lift_the_ban_on_political_parties_desc: "为了适应国家发展的需要，国民党重新审视党的路线问题。通过讨论和调整党的路线，使党更好地适应国家的政治、经济和社会发展。路线问题的讨论不仅有助于统一党内的思想和行动，也有助于促进国家的稳定和发展。"
 Rebuilding_the_Republic_of_China: "再造民国"
 Rebuilding_the_Republic_of_China_desc: "为了实现国家的现代化和民主化，国民党提出再造民国的口号。通过改革政治、经济和社会制度，使国家焕发新的活力，实现国家的繁荣和富强。再造民国不仅是一个政治口号，更是国民党为实现国家现代化而做出的努力。"
 Party_government_relations: "党政关系"
 Party_government_relations_desc: "为了明确党和政府的关系，国民党重新审视党政关系。通过明确党和政府的职责和权限，使党更好地领导政府，政府更好地执行党的政策。党政关系的调整不仅有助于提高政府的行政效率，也有助于加强党的领导。"
 Restrict_the_partys_conservatives: "党政职权划分"
 Restrict_the_partys_conservatives_desc: "为了明确党和政府的职权划分，国民党进行党政职权划分。通过明确党和政府的职责和权限，使党更好地发挥领导作用，政府更好地执行具体事务。党政职权划分不仅有助于提高政府的行政效率，也有助于加强党的领导。"
 Establish_an_Anti_Corruptio_Commission: "建立廉政公署"
 Establish_an_Anti_Corruptio_Commission_desc: "为了打击腐败，提高政府的廉洁度，国民党建立廉政公署。通过加强对政府官员的监督和管理，查处腐败行为，提高政府的公信力。建立廉政公署不仅有助于提高政府的廉洁度，也有助于增强公民对政府的信任。"
 Democratization_reform_within_the_party: "党内民主化改革"
 Democratization_reform_within_the_party_desc: "为了提高党的活力和凝聚力，国民党进行党内民主化改革。通过扩大党内民主，让更多的党员参与党的决策和管理，提高党的决策的科学性和民主性。党内民主化改革不仅有助于提高党的活力和凝聚力，也有助于促进国家的民主化进程。"
 Clean_up_the_CC_system: "清理CC系"
 Clean_up_the_CC_system_desc: "为了加强党的团结和统一，国民党清理CC系。通过整顿党内派系，消除派系斗争，加强党的集中统一领导。清理CC系不仅有助于加强党的团结和统一，也有助于提高党的战斗力。"
 Ensure_freedom_of_speech: "确保言论自由"
 Ensure_freedom_of_speech_desc: "为了保障公民的基本权利，国民党确保言论自由。通过制定和实施相关法律，保障公民的言论自由权利，促进社会的民主和进步。确保言论自由不仅有助于保障公民的基本权利，也有助于促进社会的民主和进步。"
 Media_depoliticization_reform: "媒体去党化改革"
 Media_depoliticization_reform_desc: "为了保障媒体的独立性和客观性，国民党进行媒体去党化改革。通过减少党对媒体的控制，让媒体更加独立地发挥监督和舆论引导作用，促进社会的民主和进步。媒体去党化改革不仅有助于保障媒体的独立性和客观性，也有助于促进社会的民主和进步。"
 Streamlin_party_organization: "精简党部机构"
 Streamlin_party_organization_desc: "为了提高党的工作效率和战斗力，国民党精简党部机构。通过减少冗余的机构和人员，优化党的组织架构，提高党的工作效率和战斗力。精简党部机构不仅有助于提高党的工作效率，也有助于加强党的集中统一领导。"
 Set_things_right: "恢复左派名誉"
 Set_things_right_desc: "恢复左派名誉意味着重新评价国民党左派的历史地位，承认其在国民革命中的贡献。这将促进党内民主，减少个人独裁的影响，推动政治体制的多元化。"
 Stick_to_a_right_wing_stance: "坚持右派立场"
 Stick_to_a_right_wing_stance_desc: "坚持右派立场意味着强化国民党的保守主义倾向，反对民主改革，维护传统的社会秩序和政治制度。这将加强蒋介石的个人权威，巩固其对党的控制。"
 Establish_an_intra_party_proposal_system: "建立党内提案制度"
 Establish_an_intra_party_proposal_system_desc: "为了提高党的决策的科学性和民主性，国民党建立党内提案制度。通过鼓励党员提出提案，参与党的决策和管理，提高党的决策的科学性和民主性。建立党内提案制度不仅有助于提高党的决策的科学性和民主性，也有助于增强党员的参与意识和责任感。"
 Restore_the_three_major_policies: "恢复三大政策"
 Restore_the_three_major_policies_desc: "为了适应国家发展的需要，国民党恢复三大政策。三大政策包括联俄、联共、扶助农工，是孙中山先生提出的重要政策。恢复三大政策不仅有助于团结各方面的力量，也有助于促进国家的统一和发展。"
 Uphold_an_anti_Communist_stance: "坚持反共立场"
 Uphold_an_anti_Communist_stance_desc: "共产党的存在被国民党视为对其统治的严重威胁。为了维护国民党的统治地位，国民党坚持反共立场。通过军事围剿、政治压制、经济封锁等手段，国民党试图消除共产党的影响，巩固自己的统治。这一政策不仅反映了国民党对共产党的敌视，也体现了其维护一党专政的决心。"
 Realize_democratization_within_the_party: "实现党国民主化"
 Realize_democratization_within_the_party_desc: "为了实现国家的民主化，国民党提出实现党国民主化的目标。通过改革政治制度，扩大民主参与，实现国家的民主化。实现党国民主化不仅是国民党的政治目标，也是国家发展的必然趋势。"
 Taking_advantage_of_internal_party_conflicts: "利用党军矛盾"
 Taking_advantage_of_internal_party_conflicts_desc: "国民党内部存在着党和军队之间的矛盾。为了巩固自己的权力，蒋介石采取了利用党军矛盾的策略。通过有意制造和利用两者之间的矛盾，使双方相互牵制、相互削弱，从而加强中央对军队和党的控制。这种策略不仅有助于维护蒋介石的独裁统治，也避免了任何一方势力过大威胁到他的地位。"
 Nationalization_of_the_military: "军队去党化"
 Nationalization_of_the_military_desc: "为了实现军队的国家化，国民党进行军队去党化改革。通过将军队从党的控制中分离出来，使其成为国家的军队而非党的军队，提高军队的专业化和现代化水平。军队去党化不仅有助于提高军队的战斗力，也有助于维护国家的统一和稳定。"
 Disband_the_military_party_committee: "裁撤军队党部"
 Disband_the_military_party_committee_desc: "为了实现军队的国家化，国民党裁撤军队党部。通过减少党对军队的控制，使军队更加专注于军事训练和作战，提高军队的战斗力。裁撤军队党部不仅有助于提高军队的战斗力，也有助于维护国家的统一和稳定。"
 Establish_the_Political_Work_Committee_of_the_National_Revolutionary_Army: "设立国民革命军政治工作委员会"
 Establish_the_Political_Work_Committee_of_the_National_Revolutionary_Army_desc: "为了加强对军队的政治领导，国民党设立国民革命军政治工作委员会。通过在军队中开展政治工作，提高军队的政治素质和战斗力，确保军队对党的忠诚。设立国民革命军政治工作委员会不仅有助于提高军队的战斗力，也有助于加强党对军队的控制。"
 Land_reform: "扶植自耕农"
 Land_reform_desc: "为了改善农民的生活条件，促进农业的发展，国民党实施扶植自耕农政策。通过分配土地给无地或少地的农民，使他们成为自耕农，提高农民的生产积极性和生活水平。扶植自耕农不仅有助于改善农民的生活条件，也有助于促进农业的发展。"
 Cadastral_survey: "全国土地调查"
 Cadastral_survey_desc: "为了了解全国的土地状况，为土地改革提供依据，国民党进行全国土地调查。通过调查全国的土地面积、分布和使用情况，为土地改革和农业发展提供科学的依据。全国土地调查不仅有助于了解全国的土地状况，也有助于制定科学的土地政策。"
 Tenant_Farmer_Protection_Law: "佃农保护法"
 Tenant_Farmer_Protection_Law_desc: "为了保护佃农的合法权益，国民党制定佃农保护法。通过规定地租的最高限额、保障佃农的租佃权等措施，保护佃农的合法权益，提高佃农的生产积极性。佃农保护法不仅有助于保护佃农的合法权益，也有助于促进农业的发展。"
 Twenty_Five_Percent_Rent_Reduction: "二五减租"
 Twenty_Five_Percent_Rent_Reduction_desc: "为了减轻佃农的负担，提高佃农的生产积极性，国民党实施二五减租政策。通过将地租减少25%，减轻佃农的负担，提高佃农的生产积极性。二五减租不仅有助于减轻佃农的负担，也有助于促进农业的发展。"
 Rebuild_the_farmers_associations: "重建农会组织"
 Rebuild_the_farmers_associations_desc: "为了组织和团结农民，促进农业的发展，国民党重建农会组织。通过建立农会组织，团结农民，维护农民的合法权益，促进农业的发展。重建农会组织不仅有助于组织和团结农民，也有助于促进农业的发展。"
 Limiting_land_rent_and_protecting_tenant_rights: "限制地租与保障佃权"
 Limiting_land_rent_and_protecting_tenant_rights_desc: "为了保护佃农的合法权益，国民党实施限制地租与保障佃权政策。通过规定地租的最高限额、保障佃农的租佃权等措施，保护佃农的合法权益，提高佃农的生产积极性。限制地租与保障佃权不仅有助于保护佃农的合法权益，也有助于促进农业的发展。"
 Establish_the_Land_Finance_Department_of_the_China_Farmers_Bank: "设立中国农民银行土地金融部"
 Establish_the_Land_Finance_Department_of_the_China_Farmers_Bank_desc: "为了支持农业的发展，国民党设立中国农民银行土地金融部。通过提供农业贷款、土地抵押贷款等金融服务，支持农民购买土地、改善农业生产条件，促进农业的发展。设立中国农民银行土地金融部不仅有助于支持农业的发展，也有助于改善农民的生活条件。"
 Land_reform0: "平均地权"
 Land_reform0_desc: "为了实现孙中山先生的平均地权思想，国民党实施平均地权政策。通过核定地价、照价征税、照价收买、涨价归公等措施，实现土地的公平分配，改善农民的生活条件。平均地权不仅是孙中山先生的重要思想，也是国民党为实现社会公平而做出的努力。"
Victory_of_the_National_Revolution: "国民革命的胜利"
Victory_of_the_National_Revolution_desc: "经过长期的努力和奋斗，国民党终于取得了国民革命的胜利。中国在经历了无数的战火与屈辱后终于迎来了统一，按照孙中山先生的计划，国家应当结束军政阶段转向训政阶段。国民革命的胜利不仅实现了国家的统一，也为国家的现代化建设奠定了基础。"
Reorganize_National_Revolutionary_Army: "整编国民革命军"
Reorganize_National_Revolutionary_Army_desc: "党国军队愈发的混乱不堪，不少部队原先都来自投诚的军阀部队。他们的编制混乱，训练不足，装备参差不齐。但最重要的就是一些军官不忠诚，整编军队的计划一刻也不能拖延。通过整编军队，提高军队的战斗力和忠诚度，为国家的统一和稳定提供有力的保障。"
Reorganize_National_Revolutionary_Army_tooltip: "§H$CHI_army$§!追加效果：\n$MODIFIER_ARMY_ORG_FACTOR$§:§G+5.00%§!\n$MODIFIER_ORG_LOSS_WHEN_MOVING$§:§G-5.00%§!\n"
Chinese_Hindenburg_Line: "中国兴登堡防线"
Chinese_Hindenburg_Line_desc: "世界局势愈发紧张，国防建设迫在眉睫，国民党继续加强与德国的军事合作，在双方工程师的努力下设计出了一种“体积小、造价低、实用性强”的工事结构。通过修建中国兴登堡防线，提高国家的防御能力，保障国家的安全和稳定。建造这样一个现代长城般的工程虽然困难重重，但对于国家的安全具有重要意义。"
Establish_Munitions_Department: "设立兵工总署"
Establish_Munitions_Department_desc: "为了加强军事工业的建设，提高武器装备的生产能力，国民党设立兵工总署。通过统一管理军事工业，协调各兵工厂的生产，提高武器装备的质量和产量，为军队提供充足的武器装备。设立兵工总署不仅有助于提高国家的军事工业实力，也有助于加强国家的国防能力。"
Open_Military_Research_Institute: "开设军事研究所"
Open_Military_Research_Institute_desc: "当年欧洲列强用坚船利炮轰开了中国国门，不久后的甲午中日战争更是将中国的尊严摔个粉碎。若是不改变军事科技上的落后，就是至党国于水火之中。为了提高军事科技水平，国民党开设军事研究所。通过开展军事科学研究，开发先进的武器装备，提高军队的战斗力。开设军事研究所不仅有助于提高国家的军事科技水平，也有助于加强国家的国防能力。"
Establish_Central_Military_Academy: "开设中央军校"
Establish_Central_Military_Academy_desc: "中央军校的设立是党国军事现代化的关键一步，各地军阀陈旧的训练方式依然影响了许多优秀的青年军官，建立中央军校统一军事教材有利于党国军队的协调统一。通过培养高素质的军事人才，提高军队的战斗力和现代化水平，为国家的安全和稳定提供有力的保障。中央军校的设立不仅有助于提高军队的素质，也有助于加强党对军队的控制。"
Establish_Central_Military_Academy_tooltip: "§H$CHI_army$§!追加效果：\n$MODIFIER_XP_GAIN_ARMY$§:§G+5.00%§!\n$MODIFIER_ARMY_ORG_FACTOR$§:§G+5.00%§!\n"
Democracy_Over_Autocracy: "民主战胜独裁"
Democracy_Over_Autocracy_desc: "剿匪行动的不断失利以及对党内元老的软禁严重打击了国民对国府的信任，而现在党国的领袖又死于非命。无论百姓还是官兵都无不担心新生的民国再次分裂，如今共匪潜藏在国内各地，而南方又有气势汹汹的广州政府，分兵作战的局面将非常不利于我们。但党内各派与共匪基本决裂，或许向南方政府妥协会是一个正确的选择。民主战胜独裁不仅是国家发展的必然趋势，也是人民的共同愿望。"
Liao_Zhongkai_Issue: "廖仲恺问题"
Liao_Zhongkai_Issue_desc: "廖仲恺是国民党的重要领导人，他的遇刺引发了党内的震动。为了查明真相，国民党成立专门的调查委员会，调查廖仲恺遇刺的原因和幕后主使。廖仲恺问题的处理不仅关系到党内的团结和稳定，也关系到国家的发展和前途。"

Hu_Hanmin_Leadership: "胡汉民主导"
Hu_Hanmin_Leadership_desc: "国民党左派不过是一个打着三民主义旗号的共产主义社团，我们绝不能让这些想要改写孙先生理想的可耻小偷主导民主同盟。汪精卫那摇摆不停的投机主义已经使他失去了信用，我们应当联合粤桂的伙伴共同阻止汪精卫的卑鄙阴谋。"
Wang_Jingwei_Leadership: "汪精卫主导"
Wang_Jingwei_Leadership_desc: "种种证据都表明胡汉民和他所领导的国民党右派就是杀死廖仲恺的真正凶手，党国不会允许这样毫无下限的杀人凶手去主导民主同盟。我们应当立刻发动舆论打压这位残忍的杀手，并且联合我们在广州政府安排的人脉阻挠胡汉民的计划。汪精卫作为国民党的重要领导人，他的主导地位不仅有助于维护党内的团结和稳定，也有助于推动国家的现代化建设。"
Redraft_Party_Program: "重新制定纲领"
Redraft_Party_Program_desc: "为了适应国家发展的需要，国民党重新制定纲领。通过重新制定纲领，明确党的目标和任务，使党更好地适应国家的政治、经济和社会发展。重新制定纲领不仅有助于统一党内的思想和行动，也有助于促进国家的稳定和发展。"
Reorganize_Kuomintang: "改组国民党"
Reorganize_Kuomintang_desc: "为了提高党的战斗力和凝聚力，国民党改组国民党。通过改革党的组织架构，优化党的领导机构，提高党的工作效率和战斗力。改组国民党不仅有助于提高党的战斗力和凝聚力，也有助于加强党对国家的领导。"
Crackdown_on_Corruption: "打击“腐化”势力"
Crackdown_on_Corruption_desc: "为了维护党的纯洁性和战斗力，国民党打击“腐化”势力。通过清理党内的腐化分子，纯洁党的队伍，提高党的战斗力和凝聚力。打击“腐化”势力不仅有助于维护党的纯洁性和战斗力，也有助于提高党在人民群众中的威信。"
Strengthen_Party_Authority: "提高党的权威"
Strengthen_Party_Authority_desc: "为了加强党对国家的领导，国民党提高党的权威。通过加强党的建设，提高党的战斗力和凝聚力，增强党在国家政治生活中的影响力。提高党的权威不仅有助于加强党对国家的领导，也有助于维护国家的统一和稳定。"
Chiang_Kai_shek_Consolidates_Power: "蒋介石稳居高位"
Chiang_Kai_shek_Consolidates_Power_desc: "蒋胡之争已经落下帷幕，胡汉民不得不承认自己的失败，并退居幕后，蒋介石将进一步提升自己的权威。"
Chiang_Kai_shek_Consolidates_Power_tooltip: "§H蒋介石§!将继续领导§H国民党§!"
Announce_Political_Tutelage: "宣布训政"
Announce_Political_Tutelage_desc: "为了实现国家的民主化，国民党宣布训政。根据孙中山先生的建国方略，国家需要经过军政、训政、宪政三个阶段。宣布训政意味着国家进入了由党领导人民训练民主能力的阶段，为将来的宪政做准备。宣布训政不仅是国家民主化进程中的重要步骤，也有助于维护国家的统一和稳定。"
National_Education_tooltip: "设定初始数值：\n当前§H政府效率§!=10%\n当前§H国民素养§!=5%\n当前§H国民经济§!=8%"
National_Education: "国民之教育"
 National_Education_desc: "教育是国家发展的基石，国民教育的普及是实现国家现代化的关键。通过推广基础教育，提高国民的文化素养，培养更多的人才，为国家的建设和发展提供智力支持。"
 Improve_Education_System: "完善教育体系"
 Improve_Education_System_desc: "现有的教育体系存在诸多问题，需要进行全面改革和完善。通过修订教育法规，规范教育管理，提高教育质量，建立更加科学、合理的教育体系，为国家培养更多优秀人才。"
 Promote_Teacher_Colleges: "推广师范学堂"
 Promote_Teacher_Colleges_desc: "教师是教育的核心，培养高素质的教师队伍是提高教育质量的关键。通过推广师范学堂，加强教师培训，提高教师的专业素养和教学能力，为教育事业的发展提供有力的人才保障。"
 Build_Central_Research_Academy: "建设中央研究院"
 Build_Central_Research_Academy_desc: "科学研究是国家发展的动力，中央研究院的建设是推动科技进步的重要举措。通过整合科研资源，吸引优秀科学家，开展前沿科学研究，为国家的科技发展和创新能力提升提供重要支撑。"
 Improve_Border_Teacher_Welfare: "提高教师待遇"
 Improve_Border_Teacher_Welfare_desc: "边境地区的教育条件相对落后，教师待遇较低，影响了教育质量的提升。通过提高边境地区教师的待遇，改善他们的工作和生活条件，吸引更多优秀教师到边境地区任教，促进教育均衡发展。"
 Implement_Compulsory_Education: "施行义务教育"
 Implement_Compulsory_Education_desc: "义务教育是国家的基本教育政策，是保障公民受教育权利的重要措施。通过施行义务教育，确保所有适龄儿童和青少年都能接受基本的教育，提高国民的整体文化素质。"
 Reform_Higher_Education_System: "改善高等教育体制"
 Reform_Higher_Education_System_desc: "高等教育是培养高层次人才的重要途径，需要不断改革和完善。通过调整高等教育结构，优化专业设置，提高教学质量，培养更多适应国家发展需要的高素质人才。"
 Progress_of_National_Quality: "国民素质之进步"
Progress_of_National_Quality_desc: "国民素质之进步意味着提高国民的教育水平和文化素养，培养公民意识和民主观念。这将促进社会的现代化和民主化，削弱个人独裁的基础。\n\n\#ffff00这将降低领袖权威#"
Government_Organization: "政府之组织"
Government_Organization_desc: "为了建立高效、有序的政府体系，国民党重视政府的组织建设。通过制定和完善政府组织法规，明确政府各部门的职责和权限，建立科学、合理的政府组织结构，提高政府的行政效率和治理能力。政府之组织不仅有助于提高政府的行政效率，也有助于维护国家的稳定和发展。"
Announce_Political_Tutelage_Program: "颁布训政纲领"
Announce_Political_Tutelage_Program_desc: "训政是孙中山先生提出的政治制度，是从军政到宪政的过渡阶段。通过颁布训政纲领，明确训政时期的政治目标和政策，为实现宪政奠定基础。"
National_Government_Organization_Law: "国民政府组织法"
National_Government_Organization_Law_desc: "国民政府组织法是规范政府组织的重要法律，是政府运作的基本依据。通过制定和实施国民政府组织法，明确政府各部门的组织架构和职责权限，提高政府的运作效率。"
Implement_Five_Power_System: "推行五院制"
Implement_Five_Power_System_desc: "五院制是孙中山先生提出的政治制度，包括行政、立法、司法、考试、监察五权分立。通过推行五院制，建立分权制衡的政治体制，提高政府的决策科学性和公正性。"
Define_Chairman_Authority: "订正主席权利"
Define_Chairman_Authority_desc: "订正主席权利意味着扩大和明确主席的权力范围，强化主席对党政军各部门的控制。这将进一步巩固蒋介石的个人权威，使其拥有更大的决策权。\n\n\#ffff00这将提高领袖权威#"
Local_Equal_Authority_System: "地方均权制度"
Local_Equal_Authority_System_desc: "地方均权制度是实现地方自治的重要措施，是平衡中央与地方权力的关键。通过建立地方均权制度，赋予地方一定的自治权，调动地方的积极性和创造性，促进地方经济和社会的发展。"
Draft_Local_Laws: "草拟地方法律"
Draft_Local_Laws_desc: "地方法律是规范地方事务的重要依据，草拟地方法律是地方立法的重要环节。通过草拟符合地方实际情况的地方法律，规范地方的经济和社会活动，保障地方的稳定和发展。"
Consolidate_Republics_Governance: "总揽中华民国之治权"
Consolidate_Republics_Governance_desc: "总揽中华民国之治权是加强中央集权的重要措施，是实现国家统一的关键。通过整合各方面的权力，加强中央对地方的控制，确保国家的统一和稳定。"
National_Livelihood: "国民生计"
 National_Livelihood_desc: "国民生计是国家稳定的基础，改善民生是政府的重要职责。通过发展经济，提高人民的生活水平，解决就业问题，实现社会的和谐稳定。"
 Large_scale_Transport_Construction: "大规模交通建设"
 Large_scale_Transport_Construction_desc: "交通是经济发展的命脉，大规模交通建设是推动经济增长的重要举措。通过修建铁路、公路等交通基础设施，改善交通运输条件，促进区域经济的协调发展。"
 Unified_Tax_Reform: "统税改革"
 Unified_Tax_Reform_desc: "税收是国家财政的重要来源，统税改革是规范税收制度的重要措施。通过统一税收政策，简化税收手续，提高税收效率，为国家的建设和发展提供稳定的财政支持。"
 Agricultural_Development_Plan: "农业发展计划"
 Agricultural_Development_Plan_desc: "农业是国民经济的基础，农业发展计划是保障粮食安全的重要举措。通过推广先进的农业技术，改善农业生产条件，提高农业生产效率，确保国家的粮食供应和农民的收入增长。"
 Five_Year_Heavy_Industry_Plan: "重工五年计划"
 Five_Year_Heavy_Industry_Plan_desc: "重工业是国家工业化的核心，五年重工业计划是推动国家工业化的重要战略。通过集中力量发展钢铁、机械、能源等重工业，提高国家的工业实力和国防能力。"
 Restore_Tariff_Autonomy: "恢复关税自主权"
 Restore_Tariff_Autonomy_desc: "关税自主权是国家主权的重要组成部分，恢复关税自主权是维护国家利益的重要措施。通过制定合理的关税政策，保护国内产业，促进民族经济的发展。"
 Promote_New_Technologies: "新技术推广"
 Promote_New_Technologies_desc: "技术创新是经济发展的动力，新技术推广是提高生产效率的重要途径。通过引进和推广先进的科学技术，提高企业的技术水平和竞争力，促进经济的可持续发展。"
 Development_of_National_Economy: "国民经济之发展"
 Development_of_National_Economy_desc: "国民经济的发展是国家繁荣的基础，通过制定和实施科学的经济发展战略，优化经济结构，提高经济增长质量，实现国家经济的持续、健康发展。"
Internal_Pacification_Before_Resistance: "攘外必先安内"
Internal_Pacification_Before_Resistance_desc: "这些共匪在我们的多次围剿之下已经变得脆弱不堪，我们必须抓住这个机会快速解决这群心腹之患。至于东北方面我们只能继续命令张学良拖延时间，并向国际联盟申诉日本的无耻行为。"
Order_Warlords_to_Attack_effect: "军阀将会更积极的打击共匪。"
Resistance_First_to_Save_Nation: "救国必先抗日"
Resistance_First_to_Save_Nation_desc: "甲午中日战争的惨败将本已孱弱不堪的中国，进一步推向四分五裂的境地。党国不会忘记英勇捐躯的中国海军，不会忘记旅顺两万余名百姓，不会忘记日本的种种暴行。既然日本三番五次的想要进入东北，那么我们就用他们的鲜血滋养这片美丽的黑土地。"
Reconcile_with_Communists: "与共产党和解"
Reconcile_with_Communists_desc: "为了团结一切可以团结的力量共同抗日，国民党与共产党和解。通过与共产党建立合作关系，共同抗击日本侵略者，维护国家的主权和领土完整。与共产党和解不仅有助于团结抗日力量，也有助于维护国家的统一和稳定。"
Expand_Anti_Japanese_Propaganda: "扩大抗日宣传"
Expand_Anti_Japanese_Propaganda_desc: "为了唤起全国人民的抗日意识，国民党扩大抗日宣传。通过各种媒体和宣传渠道，宣传日本侵略者的罪行，激发全国人民的抗日热情，动员全国人民共同抗击日本侵略者。扩大抗日宣传不仅有助于唤起全国人民的抗日意识，也有助于凝聚全国人民的抗日力量。"
Establish_United_Front: "建立统一阵线"
Establish_United_Front_desc: "为了团结一切可以团结的力量共同抗日，国民党建立统一阵线。通过与各党派、各阶层建立抗日统一战线，共同抗击日本侵略者，维护国家的主权和领土完整。建立统一阵线不仅有助于团结抗日力量，也有助于维护国家的统一和稳定。"
Promote_Hu_Hanmin_Ideology: "发扬胡汉民思想"
Promote_Hu_Hanmin_Ideology_desc: "为了统一党内的思想和行动，国民党发扬胡汉民思想。胡汉民是国民党的重要领导人，他的思想对于党的发展和国家的建设具有重要意义。发扬胡汉民思想不仅有助于统一党内的思想和行动，也有助于推动国家的现代化建设。"
Party_Representative_System_in_Army: "军队党代表制度"
Party_Representative_System_in_Army_desc: "为了加强党对军队的领导，国民党实行军队党代表制度。通过在军队中设立党代表，加强党对军队的政治领导，确保军队对党的忠诚。军队党代表制度不仅有助于加强党对军队的领导，也有助于提高军队的战斗力。"
Promote_Party_based_Education: "推广党化教育"
Promote_Party_based_Education_desc: "为了加强党的思想建设，国民党推广党化教育。通过在教育体系中融入党的思想和理念，培养学生的爱国主义精神和对党的忠诚。推广党化教育不仅有助于加强党的思想建设，也有助于培养国家的建设人才。"
Strengthen_Party_Leadership: "加强党的领导"
Strengthen_Party_Leadership_desc: "为了加强党对国家的领导，国民党加强党的领导。通过加强党的建设，提高党的战斗力和凝聚力，增强党在国家政治生活中的影响力。加强党的领导不仅有助于维护国家的统一和稳定，也有助于推动国家的现代化建设。"
Expand_Local_Party_Committees: "扩建地方党委"
Expand_Local_Party_Committees_desc: "为了加强党对地方的领导，国民党扩建地方党委。通过在地方建立和完善党的组织，加强党对地方事务的领导和管理，提高党的影响力和凝聚力。扩建地方党委不仅有助于加强党对地方的领导，也有助于促进地方的发展和稳定。"
Revolutionary_Elder_Chu_Lu: "革命元老雏鲁"
Revolutionary_Elder_Chu_Lu_desc: "为了尊重和发挥革命元老的作用，国民党重视革命元老雏鲁。革命元老是党的宝贵财富，他们的经验和智慧对于党的发展和国家的建设具有重要意义。重视革命元老雏鲁不仅有助于传承党的优良传统，也有助于推动国家的现代化建设。"
Promote_Canton_Governance: "推广穗政"
Promote_Canton_Governance_desc: "为了提高地方治理水平，国民党推广穗政。穗政是广州地区的治理经验，通过推广穗政，提高其他地区的治理水平，促进地方的发展和稳定。推广穗政不仅有助于提高地方治理水平，也有助于促进国家的现代化建设。"
Government_Asset_Management: "官产投变"
Government_Asset_Management_desc: "为了提高政府资产的利用效率，国民党实行官产投变。通过对政府资产的市场化运作，提高资产的利用效率，为国家的建设和发展提供资金支持。官产投变不仅有助于提高政府资产的利用效率，也有助于促进国家的经济发展。"
Innovate_Municipal_System: "市政体系创新"
Innovate_Municipal_System_desc: "为了提高城市治理水平，国民党创新市政体系。通过改革和创新市政管理体制，提高城市的治理效率和服务质量，促进城市的发展和繁荣。市政体系创新不仅有助于提高城市治理水平，也有助于促进国家的现代化建设。"
National_Legitimacy_Sun_Ke: "国民正统孙科"
National_Legitimacy_Sun_Ke_desc: "为了维护国家的正统性和合法性，国民党重视国民正统孙科。孙科是孙中山先生的儿子，他的地位和影响力对于维护国家的正统性和合法性具有重要意义。重视国民正统孙科不仅有助于维护国家的正统性和合法性，也有助于促进国家的统一和稳定。"
Focus_on_Urban_Development: "注重城市建设"
Focus_on_Urban_Development_desc: "为了促进城市的发展和繁荣，国民党注重城市建设。通过加大对城市基础设施的投资，改善城市的居住环境和生活质量，促进城市的发展和繁荣。注重城市建设不仅有助于促进城市的发展和繁荣，也有助于提高人民的生活水平。"
Reconcile_with_Chiang_Faction: "与蒋氏集团和解"
Reconcile_with_Chiang_Faction_desc: "为了维护党内的团结和稳定，国民党与蒋氏集团和解。通过与蒋氏集团的和解，消除党内的分歧和矛盾，加强党内的团结和统一。与蒋氏集团和解不仅有助于维护党内的团结和稳定，也有助于促进国家的统一和发展。"
Transition_to_Constitutional_Government: "走向宪政"
Transition_to_Constitutional_Government_desc: "走向宪政意味着结束训政，实行民主政治，建立法治国家。这将限制个人权力，保障公民权利，促进政治体制的民主化。\n\n\#ffff00这将降低领袖权威#"
Pan_Asianist_propaganda: "宣传泛亚主义"
Pan_Asianist_propaganda_desc: "先总理早已为我们指明了党国的外交道路，先总理的大亚洲主义主张以中日合作为基础，联合亚洲其他民族，建立平等自由、互助互利的关系，共同谋求亚洲的发展。因此维护党国与日本的“友谊”是非常有必要的。"
Suppress_Anti_Japanese_Sentiment: "镇压抗日情绪"
Suppress_Anti_Japanese_Sentiment_desc: "在第四次中央全会上，汪主席确定了打击共匪渗透的基本方针。东北沦陷已成事实而共匪却依然流窜于国内各地，我们不能再纠结于过去而逃避现实了。必须坚定信念完成剿匪大业。镇压抗日情绪是为了集中力量打击共匪，维护国家的稳定和统一。"
Expand_Local_Influence: "扩大地方影响力"
Expand_Local_Influence_desc: "为了加强对地方的控制和管理，国民党扩大地方影响力。通过在地方开展各种活动，提高党的影响力和凝聚力，加强对地方事务的领导和管理。扩大地方影响力不仅有助于加强对地方的控制和管理，也有助于促进地方的发展和稳定。"
Contact_Zhang_Xueliang: "通电张学良"
Contact_Zhang_Xueliang_desc: "面对愈发猖狂的日本人，东北不能再保持以往的不抵抗政策了。我们需要立刻派出一直顾问团与东北政府一同重新制定新的对日政策政策。通电张学良不仅有助于协调东北的抗日行动，也有助于维护国家的统一和稳定。"
Transport_Anti_Japanese_Supplies: "运输抗日物资"
Transport_Anti_Japanese_Supplies_desc: "东北的抗日政策激起了国内的抗日热情，社会各界人士自发开展了大量的物资捐赠活动。虽然国民的抗战热情十分可贵，但大量的民用物资不仅难以直接支援东北抗战还会占用数量不多的运输线路。我们必须立刻重新组织运输工作确保真正有用的物资进入东北。运输抗日物资不仅有助于支援东北的抗日斗争，也有助于激发全国人民的抗日热情。"
CHIFocus_1: "庐山演讲"
CHIFocus_1_desc: "为了唤起全国人民的抗日意识，国民党举行庐山演讲。通过演讲，向全国人民阐述抗日的重要性和必要性，激发全国人民的抗日热情，动员全国人民共同抗击日本侵略者。庐山演讲不仅有助于唤起全国人民的抗日意识，也有助于凝聚全国人民的抗日力量。"
CHIFocus_3: "与美国交好"
CHIFocus_3_desc: "美国是世界强国，拥有先进的技术和丰富的资源。为了促进中国的现代化建设和经济发展，国民党积极与美国建立友好关系。通过与美国的经济和贸易合作，引进美国的技术和资金，促进中国的工业化和经济发展。与美国交好不仅有助于加强中国的国际地位，也有助于促进中美两国之间的友好合作。"
CHIFocus_4: "与苏联交好"
CHIFocus_4_desc: "苏联是世界强国，拥有先进的技术和丰富的资源。为了促进中国的现代化建设和经济发展，国民党积极与苏联建立友好关系。通过与苏联的经济和贸易合作，引进苏联的技术和资金，促进中国的工业化和经济发展。与苏联交好不仅有助于加强中国的国际地位，也有助于促进中苏两国之间的友好合作。"
CHIFocus_6: "美国军事顾问团"
CHIFocus_6_desc: "为了提高中国军队的战斗力和现代化水平，国民党邀请美国军事顾问团来华。美国军事顾问团由美国的军事专家组成，他们帮助中国军队进行整编和训练，引进美国的军事技术和战术，提高中国军队的战斗力。美国军事顾问团的到来，对于中国军队的现代化建设具有重要意义。"
CHIFocus_8: "苏军援华飞行队"
CHIFocus_8_desc: "为了加强中国的空中防御能力，国民党与苏联合作组建苏军援华飞行队。苏军援华飞行队由苏联的飞行员组成，他们在中国上空与日军作战，为中国的抗日战争做出了重要贡献。苏军援华飞行队的组建，不仅有助于加强中国的空中防御能力，也有助于加强中苏两国之间的军事合作。"
CHIFocus_9: "西北国际通道"
CHIFocus_9_desc: "为了加强中国与外部世界的联系，保障物资的运输，国民党开辟西北国际通道。西北国际通道连接中国西北地区与苏联等国家，是中国对外交通的重要通道。通过开辟西北国际通道，中国可以更有效地获取外部的物资和援助，对于抗日战争的胜利具有重要意义。西北国际通道的开辟，不仅有助于加强中国的国际联系，也有助于促进西北地区的经济发展。"
CHIFocus_11: "建立驼峰航线"
CHIFocus_11_desc: "为了加强中国与外部世界的联系，保障物资的运输，国民党建立驼峰航线。驼峰航线是连接中国和印度的空中运输线，是中国获取外部物资和援助的重要通道。通过建立驼峰航线，中国可以更有效地获取外部的物资和援助，对于抗日战争的胜利具有重要意义。驼峰航线的建立，不仅有助于加强中国的国际联系，也有助于促进抗日战争的胜利。"
CHIFocus_17: "战时总动员"
CHIFocus_17_desc: "为了应对战争的需要，国民党实行战时总动员。通过动员全国的人力、物力和财力，确保战争的需要，提高国家的战争能力。战时总动员不仅有助于提高国家的战争能力，也有助于促进全国人民的团结和合作。"
CHIFocus_18: "战时工业企业内迁"
CHIFocus_18_desc: "为了保护工业企业，保障战争的需要，国民党实行战时工业企业内迁。通过将沿海地区的工业企业迁移到内地，避免被日军破坏，保障战争的物资供应。战时工业企业内迁不仅有助于保护工业企业，也有助于促进内地的经济发展。"
CHIFocus_19: "开发大西南"
CHIFocus_19_desc: "为了促进西南地区的经济发展，国民党开发大西南。西南地区拥有丰富的自然资源和战略地位，通过开发大西南，不仅可以促进西南地区的经济发展，也可以为国家的战略安全提供保障。开发大西南不仅有助于促进西南地区的经济发展，也有助于加强国家的战略安全。"
CHIFocus_20: "以空间换取时间"
CHIFocus_20_desc: "为了应对日本的侵略，国民党采取以空间换取时间的战略。通过主动放弃一些地区，换取时间来组织和准备抗战，最终战胜日本侵略者。以空间换取时间的战略不仅有助于保存实力，也有助于最终战胜日本侵略者。"
CHIFocus_21: "为会战做准备"
CHIFocus_21_desc: "为了应对日本的侵略，国民党积极为会战做准备。通过加强军队的训练和装备，制定作战计划，准备物资和后勤保障，确保会战的胜利。为会战做准备不仅有助于提高军队的战斗力，也有助于最终战胜日本侵略者。"
CHIFocus_22: "首都内迁计划"
CHIFocus_22_desc: "为了保护国家的政治中心，国民党实施首都内迁计划。通过将首都从沿海地区迁移到内地，避免被日军占领，保障国家的政治稳定和连续性。首都内迁计划不仅有助于保护国家的政治中心，也有助于维护国家的统一和稳定。"
CHIFocus_23: "国立西南联大"
CHIFocus_23_desc: "为了保护教育资源，促进学术的发展，国民党建立国立西南联大。通过将北京大学、清华大学、南开大学等高校迁移到西南地区，组建国立西南联大，继续开展教育和学术研究。国立西南联大的建立不仅有助于保护教育资源，也有助于促进学术的发展和人才的培养。"
CHIFocus_24: "建立豫中防线"
CHIFocus_24_desc: "为了加强中原地区的防御能力，国民党建立豫中防线。通过在豫中地区修建防御工事，部署兵力和武器装备，建立有效的防御体系，确保中原地区的安全。建立豫中防线不仅有助于保护中原地区的安全，也有助于维护国家的统一和稳定。"
CHIFocus_25: "建立长沙防线"
CHIFocus_25_desc: "为了加强长沙地区的防御能力，国民党建立长沙防线。通过在长沙地区修建防御工事，部署兵力和武器装备，建立有效的防御体系，确保长沙地区的安全。建立长沙防线不仅有助于保护长沙地区的安全，也有助于维护国家的统一和稳定。"
CHIFocus_26: "建立福建防线"
CHIFocus_26_desc: "为了加强福建地区的防御能力，国民党建立福建防线。通过在福建地区修建防御工事，部署兵力和武器装备，建立有效的防御体系，确保福建地区的安全。建立福建防线不仅有助于保护福建地区的安全，也有助于维护国家的统一和稳定。"
CHIFocus_27: "建立浙江防线"
CHIFocus_27_desc: "为了加强浙江地区的防御能力，国民党建立浙江防线。通过在浙江地区修建防御工事，部署兵力和武器装备，建立有效的防御体系，确保浙江地区的安全。建立浙江防线不仅有助于保护浙江地区的安全，也有助于维护国家的统一和稳定。"
CHIFocus_28: "战略反攻阶段"
CHIFocus_28_desc: "为了最终战胜日本侵略者，国民党进入战略反攻阶段。通过组织和发动战略反攻，收复被日军占领的地区，最终取得抗日战争的胜利。战略反攻阶段不仅是抗日战争的重要阶段，也是最终战胜日本侵略者的关键。"
CHIFocus_29: "焦土政策"
CHIFocus_29_desc: "为了阻止日本侵略者的进攻，国民党实施焦土政策。通过破坏可能被日军利用的物资和设施，使日军无法获得补给和资源，从而延缓日军的进攻。焦土政策虽然会造成一定的损失，但对于阻止日军的进攻具有重要意义。"
CHIFocus_30: "准备反共行动"
CHIFocus_30_desc: "为了维护国民党的统治地位，国民党准备反共行动。通过加强对共产党的监视和打击，消除共产党的影响，巩固国民党的统治。准备反共行动不仅反映了国民党对共产党的敌视，也体现了其维护一党专政的决心。"
CHIFocus_31: "封锁陕甘宁"
CHIFocus_31_desc: "为了限制共产党的发展和活动，国民党封锁陕甘宁。通过在陕甘宁边区周围部署兵力，封锁物资和人员的进出，限制共产党的发展和活动。封锁陕甘宁不仅反映了国民党对共产党的敌视，也体现了其维护一党专政的决心。"
CHIFocus_31_tt: "当我们与[PRC.getflag][PRC.getname]邻近时，立即修建防御工事"
CHIFocus_32: "十万青年十万军"
CHIFocus_32_desc: "为了应对战争的需要，国民党发起“十万青年十万军”运动，号召广大青年参军报国。通过宣传和动员，大量青年响应号召，加入军队，为国家的国防建设和抗战事业提供了有力的人力支持。这一运动不仅增强了军队的战斗力，也激发了全国人民的爱国热情，为抗战的胜利做出了重要贡献。"
CHIFocus_33: "赣南新政"
CHIFocus_33_desc: "为了改善赣南地区的经济和社会状况，国民党实施赣南新政。通过改革土地制度、发展农业生产、改善民生等措施，促进赣南地区的经济和社会发展。赣南新政不仅有助于改善赣南地区的经济和社会状况，也有助于加强国民党在赣南地区的统治。"
CHI_focus_15: "展开合作会议"
CHI_focus_15_desc: "为了促进国际合作，国民党展开合作会议。通过与其他国家和国际组织的合作，共同应对国际挑战，维护国家的利益和安全。展开合作会议不仅有助于促进国际合作，也有助于提升国家的国际地位。"
Campaign_to_Purge_the_Party: "清党运动"
Campaign_to_Purge_the_Party_desc: "为了纯洁党的队伍，国民党开展清党运动。通过清理党内的异己分子和腐败分子，纯洁党的队伍，提高党的战斗力和凝聚力。清党运动不仅有助于纯洁党的队伍，也有助于加强党的集中统一领导。"
German_military_tactics: "德国军事战术"
German_military_tactics_desc: "为了提高军队的战斗力，国民党学习德国军事战术。通过引进德国的军事战术和训练方法，提高军队的战斗力和现代化水平。学习德国军事战术不仅有助于提高军队的战斗力，也有助于促进军队的现代化建设。"
He_Bu_Lou_Agreement: "《合步楼协议》"
He_Bu_Lou_Agreement_desc: "为了获取德国的军事和经济援助，国民党与德国签订《合步楼协议》。通过与德国的合作，获取德国的军事技术和装备，促进中国的军事现代化建设。《合步楼协议》的签订不仅有助于获取德国的援助，也有助于加强中德两国之间的友好关系。"
Split_and_Revive_Society: "成立三民主义青年团"
Split_and_Revive_Society_desc: "为了团结和教育青年，国民党成立三民主义青年团。通过组织青年参加各种活动，培养青年的爱国主义精神和对党的忠诚，为国家的建设和发展培养后备力量。成立三民主义青年团不仅有助于团结和教育青年，也有助于加强国民党对青年的影响力和控制力。"
Lushan_Military_Officer_Training_Class: "庐山军官训练班"
Lushan_Military_Officer_Training_Class_desc: "为了提高军官的素质和能力，国民党举办庐山军官训练班。通过对军官进行系统的军事训练和政治教育，提高军官的军事素质和政治觉悟，为军队的现代化建设培养合格的军官。庐山军官训练班的举办不仅有助于提高军官的素质和能力，也有助于加强党对军队的控制。"
Establish_a_secret_service_office: "第一军主导"
Establish_a_secret_service_office_desc: "陈诚的通敌被捕对黄埔系的派系平衡造成了巨大影响，黄埔系内部的信任正在土崩瓦解。黄埔系是中央嫡系的核心力量，是保卫国民革命的重要力量，当务之急是优先提拔忠诚派系稳定局面"
Expand_Local_Influence_desc: "在苏区周边及占领区强制推行保甲制度，将民众编入严密的监视网络，实行“连坐”，一人“通共”，十家连坐，一定要彻底肃清红军的地方组织！"
Solve_the_economic_crisis_desc: "这次金融危机表面上是一场因白银外流引发的“钱荒”，但根源要复杂得多——它是国际白银政策的“蝴蝶效应”、国内金融体系的结构性缺陷，以及上海地产泡沫破裂三者叠加的结果。"
Bank_restructuring_desc: "通过向中国、交通两大银行注资改组（增加官股），将国家信用注入金融系统。这本质上是政府出面为银行“兜底”，防止因挤兑导致金融系统全面停摆，不仅能暂时稳住了局势，也有利于之后的经济改革。"
China_US_Loan_Plan_desc: "英国向国民政府表示，可以提供贷款支持中国币制改革，但条件是中国必须脱离银本位，并与英镑挂钩。这背后是英国的战略意图——将中国纳入英镑集团，扩大英镑在远东的影响力。在寻求英国支持的同时，孔祥熙也向美国寻求帮助。他希望通过白银借款换取美元外汇，为中国货币提供更稳定的锚定。虽然美国对中国的币制改革持保留态度，但也肯定不愿看到中国被纳入英镑集团。"
Lushan_Military_Officer_Training_Class_desc: "为配合第五次“围剿”，蒋介石在江西庐山举办“庐山军官训练团”，贺衷寒负责政治军官的训练工作。贺衷寒负责3400名政治军官的训练，讲授法西斯理论和反共政治工作方法。德国军事顾问团一百余人进驻庐山传授战术，意大利高级顾问史丹法尼公开宣扬中国应在蒋介石领导下实行独裁。"
Establish_a_desc: "康泽组建的别动队是一支武装特务部队，全盘效仿德国党卫队，从组织形式、服装、制度建设到思想控制全面法西斯化。以“三分军事，七分政治”为号召，担负“组织民众，训练民众”工作，包括推行保甲与清查户口、编成“‘剿匪’义勇队”、收容逃亡的地主恶霸、监视各部队、促进“新生活运动”等。他们有权调动武装部队，可过问县政府工作行使县长职权。\n“站着进来，躺着出去”"
Support_the_Revival_Society_desc: "介石下令成立“联络组”，任命戴笠为联络参谋，领导十个官员，这是国民党军事情报组织的萌芽。戴笠以此为基础，利用黄埔同学关系，拉拢了一批愿意“义务”为他搜集情报的人，即后来所说的“十人团。“十人团”没有正式编制，经费紧张，戴笠甚至要自掏腰包维持运转，就连工作场所也是胡宗南赠与的。\n在蒋介石设立复兴社后不久便下设了特务处，在得到了蒋介石的支持之后，这支十人的团队很快便扩编至100人，并在之后逐步发展为上千人的组织。"

