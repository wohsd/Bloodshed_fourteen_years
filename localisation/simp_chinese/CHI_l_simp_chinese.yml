 Split_and_Revive_Society_desc: "像复兴社这样一个独立、庞大且有意识形态的团体，本身就是对蒋介石权力的威胁。 复兴社只是他通往独裁路上的一块垫脚石，用过之后，就要拆解掉，把权力重新收归自己手中。"
 Lushan_Military_Officer_Training_Class: "庐山军官训练班"
 Establish_a_secret_service_office: "成立特务处"
 Establish_a_secret_service_office_desc: "1930年，戴笠正式成立了“调查通讯小组”，即后来所说的“十人团”。“十人团”没有正式编制，经费紧张，戴笠甚至要自掏腰包维持运转，甚至场地也是胡宗南提供的。成员们大多是“义务”为蒋介石服务，没有军饷，靠的是“黄埔情谊”和“效忠领袖”的信念。这样一个忠心耿耿，一心为了党国统一大业的组织。我们是一定要支持的！"
 Expand_Local_Influence: "推行保甲制度"
 Expand_Local_Influence_desc: "在苏区周边及占领区强制推行保甲制度，将民众编入严密的监视网络，实行“连坐”，一人“通共”，十家连坐，一定要彻底肃清红军的地方组织！"
 Establish_a _Do_Not_Move_Squad_: "成立别动队"
 Unify_will_gather_strength: "统一意志，凝聚力量"
