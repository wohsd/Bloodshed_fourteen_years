 Solve_the_economic_crisis_desc: "这次金融危机表面上是一场因白银外流引发的“钱荒”，但根源要复杂得多——它是国际白银政策的“蝴蝶效应”、国内金融体系的结构性缺陷，以及上海地产泡沫破裂三者叠加的结果。"
 Bank_restructuring_desc: "通过向中国、交通两大银行注资改组（增加官股），将国家信用注入金融系统。这本质上是政府出面为银行“兜底”，防止因挤兑导致金融系统全面停摆，不仅能暂时稳住了局势，也有利于之后的经济改革。"
 China_US_Loan_Plan_desc: "英国向国民政府表示，可以提供贷款支持中国币制改革，但条件是中国必须脱离银本位，并与英镑挂钩。这背后是英国的战略意图——将中国纳入英镑集团，扩大英镑在远东的影响力。在寻求英国支持的同时，孔祥熙也向美国寻求帮助。他希望通过白银借款换取美元外汇，为中国货币提供更稳定的锚定。虽然美国对中国的币制改革持保留态度，但也肯定不愿看到中国被纳入英镑集团。"
