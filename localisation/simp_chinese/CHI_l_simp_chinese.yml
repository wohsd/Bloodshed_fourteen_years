 Establish_a_secret_service_office_desc: "陈诚的通敌被捕对黄埔系的派系平衡造成了巨大影响，黄埔系内部的信任正在土崩瓦解。黄埔系是中央嫡系的核心力量，是保卫国民革命的重要力量，当务之急是优先提拔忠诚派系稳定局面"
 Expand_Local_Influence: "推行保甲制度"
 Expand_Local_Influence_desc: "在苏区周边及占领区强制推行保甲制度，将民众编入严密的监视网络，实行“连坐”，一人“通共”，十家连坐，一定要彻底肃清红军的地方组织！"
