 # 东北军「敌后根据地」机制

 ROD_partisan_category:0 "敌后根据地"

 ROD_establish_base_area:0 "建立敌后根据地"
 ROD_establish_base_area_desc:0 "在辽吉黑的深山密林中建立稳固的抗日根据地：收容溃兵、训练武装、囤积粮弹、庇护百姓。义勇军从此有了可依托的根基，敌后抵抗将长期持续下去。"

 ROD_aid_volunteers:0 "向义勇军输送援助"
 ROD_aid_volunteers_desc:0 "派出精干的交通员穿越封锁线，把枪械、药品与经费送往各支义勇军。输送越多，根据地越巩固，敌后的抵抗也越顽强。"

 ROD_sabotage_transport:0 "破袭敌后交通线"
 ROD_sabotage_transport_desc:0 "组织精悍小队潜入敌后，扒铁轨、炸桥梁、袭车站，迟滞日伪军的兵力调动与物资转运。行动有被敌人报复的风险。"

 ROD_pw.1.t:0 "日军讨伐敌后根据地"
 ROD_pw.1.d:0 "关东军纠集伪满军警，对辽吉黑的抗日根据地发动大规模「讨伐」：推行「集团部落」，烧毁村庄，切断义勇军与百姓的联系。根据地蒙受损失，但火种并未被扑灭。"
 ROD_pw.1.a:0 "保存火种，等待时机"
