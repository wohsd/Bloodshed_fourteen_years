ROD_MaZhanShan_leader_desc: "§Y$ROD_MaZhanShan_birth_info$\n§Y背景：§!§L$ROD_MaZhanShan_bio$\n\n“逢强必反，遇压则起；虽出身草莽，亦不失为血性男儿。”"
ROD_MaZhanShan_birth_info: "生于：§!§L1885年11月30日；奉天府怀德县（今吉林省公主岭市）§!\n§Y派系：§!§Y东北军§!"
ROD_MaZhanShan_bio: "马占山，字秀芳。出生于贫苦农家，少年时因给地主放马，丢失一匹后遭诬陷、毒打与关押，马被找回后地主亦不肯退赔，遂被逼逃亡，落草为寇。因其精于骑射、为人仗义，被推为头领。\n1908年，马占山率部众接受清廷招安，投身行伍。后投效清军奉天后路巡防营统领吴俊升麾下，以作战勇猛、骑射精湛渐获赏识。1913年，吴部改编为中央骑兵第二旅，他任连长。此后凭借军功，于1916年升任营长，1918年升任团长。\n1925年，马占山升任东北陆军第十七师骑兵第五旅旅长。同年，在平定郭松龄反奉之役中，其部表现出色，战后擢升为骑兵第十七师师长，后又任骑兵第二军军长。1928年，张作霖与吴俊升在皇姑屯被炸身亡，马占山对此誓言报复。1929年，他被张学良任命为黑龙江省骑兵总指挥。至1930年，其职务为黑河警备司令兼黑龙江省陆军步兵第三旅旅长。此时，他已成为奉系东北军中一位以悍勇闻名的将领，镇守着黑龙江的北大门。"
