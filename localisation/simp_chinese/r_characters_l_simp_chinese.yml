NRC_John_Rabe: "约翰·拉贝"
NRC_John_Rabe_leader_desc: "§Y$NRC_John_Rabe_birth_info$\n§Y背景：§!§L$NRC_John_Rabe_bio$\n\n“您是几十万人的活菩萨”"
NRC_John_Rabe_birth_info: "生于：§!§L1882年11月23日；德国汉堡§!\n§Y派系：§!§中立§!"
NRC_John_Rabe_bio: "约翰·拉贝，德国商人。早年经历坎坷，父亲早逝，他早早开始学徒生涯，并辗转非洲工作数年。1908年，他受雇于西门子公司，并被派往中国北平（北京）。中国的生活成为了拉贝人生的重要转折点，他很快适应并深深喜爱上这个国家及其文化。\n在北平期间，他负责西门子的销售与市场开拓，业务范围涉及电力、电报设备与机械。他工作勤勉，为人正直友善，逐渐在华北大地的外国侨民与中国商业伙伴中建立起良好声誉。第一次世界大战期间，作为同盟国公民，拉贝与其他德国侨民一度被滞留中国。战后，他于1919年短暂返回德国，但次年即因业务需要重返中国，并被西门子调往天津分公司。\n整个1920年代，拉贝长期在中国北方工作与生活，他亲眼目睹了这个古老国家在军阀混战与政局动荡中的挣扎与变迁。他不仅是一位成功的商务人士，也成为了联系在华德国社群与中国社会的一个温和而积极的纽带。他在中国生活了超过二十年，对这个第二故乡怀有深厚的感情，并继续为西门子在华北的业务拓展而工作。"
PRD_ChenKouYa: "陈魁亚"
PRD_ChenKouYa_leader_desc: "§Y$PRD_ChenKouYa_birth_info$\n§Y背景：§!§L$PRD_ChenKouYa_bio$\n\n“从海丰的课堂到普宁的战场，革命的火种需用行动与教育来播撒。”"
PRD_ChenKouYa_birth_info: "生于：§!§L1897年；广东海丰§!\n§Y派系：§!§R中国共产党§!"
PRD_ChenKouYa_bio: "陈魁亚，1897年出生于广东海丰县海城镇。青年时就读于海丰中学，与后来被誉为“农民运动大王”的彭湃是同窗好友，两人志同道合。1919年五四运动期间，他参与组织海丰县学生联合会，积极开展爱国宣传。\n1921年，彭湃在海丰成立“社会主义研究社”传播马克思主义，陈魁亚是其主要成员之一。同年，他协助担任教育局长的彭湃推行教育改革，致力于让教育为劳动者和贫民服务。1922年，他追随被革职的彭湃深入农村，投身农民运动。\n1925年，广东革命政府第一次东征胜利后，陈魁亚被任命为海丰县教育局员，后接任局长。在此期间，他加入了中国共产党。不久后，受彭湃派遣，他前往邻近的普宁县开展农民运动，组织农民协会，并创建了中共普宁县支部，担任支部书记。1925年冬，他成功领导普宁县农民围攻县城，取得了减租减息的胜利。\n1927年，国民党发动“四一二”反革命政变后，陈魁亚在普宁与杨石魂等人迅速领导了武装暴动作为回应，于4月23日率领武装农民围攻普宁县城。此后，他参与了彭湃领导的海陆丰第三次武装起义，为建立中国第一个苏维埃政权贡献力量。起义后，他被任命为中共普宁县委书记。\n至1929年，陈魁亚在东江地区的领导地位进一步上升，先后担任东江特委常委、潮（阳）普（宁）惠（来）三县苏维埃主席等要职。到1930年，他已成为东江地区革命力量的核心领导人之一。"
HLJ_SuBingWeng: "苏炳文"
HLJ_SuBingWeng_leader_desc: "§Y$HLJ_SuBingWeng_birth_info$\n§Y背景：§!§L$HLJ_SuBingWeng_bio$\n\n“军人之天职，为守土卫国。国难当头，大丈夫威武不能屈。”"
HLJ_SuBingWeng_birth_info: "生于：§!§L1892年9月2日；辽宁新民§!\n§Y派系：§!§Y东北军§!"
HLJ_SuBingWeng_bio: "苏炳文，字翰章。1905年，14岁的苏炳文为求从军报国，步行至沈阳，考入奉天陆军小学，开始接受正规军事教育。1912年升入保定陆军军官学校第一期步兵科。1914年毕业后，被选入袁世凯创办的北京“模范团”，从见习军官逐步升至连长、营副。1918年，他以营长身份随中国参战军支队赴俄国海参崴一带执行护路任务，于1921年春回国。\n1922年第一次直奉战争后，因其东北籍身份受直系军阀猜忌而被免去实职，遂南下福建，任闽军第三旅上校参谋长、第一团团长等职。1924年第二次直奉战争后，苏炳文返回东北故乡，投入奉军郭松龄部，任第十二旅上校参谋长。1925年郭松龄反奉时，他升任东北国民军第一军少将参谋长，兵败后转任第六旅参谋长，后因作战得力，深得张学良赏识。\n1926年，苏炳文升任第六旅旅长。1927年，所部改编为东北军第十七师，任师长。1928年，调任黑龙江军务督办公署中将参谋长，兼任国防筹备处处长及省政府委员。1930年，他接任东北陆军第十五旅旅长，并兼任海拉尔镇守使、中东铁路哈（尔滨）满（洲里）护路司令、呼伦贝尔警备司令等要职，成为镇守黑龙江省西部国境地区的军事主官。"
PRY_WeiBaQun: "韦拔群"
PRY_WeiBaQun_leader_desc: "§Y$PRY_WeiBaQun_birth_info$\n§Y背景：§!§L$PRY_WeiBaQun_bio$\n\n“革命要革心，我们工农要翻身，就要先把自己的头脑武装起来。”"
PRY_WeiBaQun_birth_info: "生于：§!§L1894年2月6日；广西东兰§!\n§Y派系：§!§R中国共产党§!"
PRY_WeiBaQun_bio: "韦拔群，壮族，原名韦秉吉，字拔群。其家庭为东兰县富裕乡绅，自幼接受传统教育，后于广西法政学堂肄业。受辛亥革命与五四运动影响，早年即具有强烈爱国思想与反抗精神。1916年，他变卖家产招募乡勇，组织“讨袁护国军”赴贵州参加护国战争。后入贵州讲武堂学习军事。\n1921年，韦拔群返回家乡东兰，联络进步青年成立“改造东兰同志会”（后改为“农民自治会”），组织农民开展反对土豪劣绅、取消苛捐杂税的斗争，是广西早期农民运动的先驱。1925年，为寻求革命理论指导，他进入第三届广州农民运动讲习所学习，并在此期间结识共产党人，思想发生根本转变。结业后，他回到东兰，仿照广州农讲所模式，在当地创办了广西最早的农民运动讲习所，培养了大批农运骨干。同年冬，他秘密加入中国共产党。\n1926年，他领导成立东兰县农民协会，使东兰成为当时广西农民运动最活跃的地区之一。1927年“四一二”政变后，广西当局大肆“清党”，韦拔群率领右江地区农民自卫军坚持武装斗争，在东兰、凤山一带建立游击区。\n1929年，邓小平、张云逸等共产党人抵达广西开展兵运工作。韦拔群领导的农民武装成为党在右江地区的重要基础力量。同年12月，他率领农军主力参加百色起义。起义后，成立中国工农红军第七军和右江苏维埃政府，韦拔群任红七军第三纵队司令员、右江苏维埃政府委员，是右江革命根据地的主要创建者和领导人之一。至1930年，他继续在右江根据地领导土地革命和武装斗争，其威望极高，被当地群众亲切称为“拔哥”。"
RFC_DengYangDa: "邓演达"
RFC_DengYangDa_leader_desc: "§Y$RFC_DengYanDa_birth_info$\n§Y背景：§!§L$RFC_DengYanDa_bio$\n\n“唤起广大农工平民大众，自己起来解除自己的痛苦"
RFC_DengYanDa_birth_info: "生于：§!§L1895年3月1日；广东惠州§!\n§Y派系：§!§R国民党——临委会§!"
RFC_DengYanDa_bio: "邓演达，字择生，出身耕读之家，父亲系光绪年间秀才。受时风影响，少年邓演达较早接触新学，于1909年考入广东陆军小学堂，并在此秘密加入孙中山领导的中国同盟会。为推翻清廷，他于1911年投身革命。1916年至1919年间，他先后在武昌陆军第二预备学校及保定陆军军官学校深造，与同窗黄琪翔、叶挺等共同研习军事。\n他始终是孙中山革命事业的坚定追随者。黄埔军校创立后，邓演达历任训练部副主任、教育长等职，并坚定拥护孙中山联俄、联共、扶助农工三大政策。1927年大革命失败后，他公开进行反蒋活动。1930年，邓演达秘密回国，于8月9日在上海主持成立中国国民党临时行动委员会（简称“临委会”），被推选为总干事，并起草了以“平民革命”为核心的政治主张。该主张明确要求推翻蒋介石为首的南京统治，建立以农工为中心的平民政权，并实行“耕者有其田”的土地政策。为此，他积极筹划武装斗争，利用在黄埔军校师生中的崇高威望，组织“黄埔革命同学会”联络反蒋军事力量，秘密策动起义。\n邓演达的革命活动使其成为南京政府的重点缉捕对象。"
RFC_huangqixiang: "黄琪翔"
RFC_huangqixiang_leader_desc: "§Y$RFC_huangqixiang_birth_info$\n§Y背景：§!§L$RFC_huangqixiang_bio$\n\n“我个人出处，前天如是，今天亦如是，在国家人民的需要上，个人是从不考虑其他，只求有利于国家人民，随时准备工作。"
RFC_huangqixiang_birth_info: "生于：§!§L1898年9月2日；广东梅县§!\n§Y派系：§!§R国民党——临委会§!"
RFC_huangqixiang_bio: "黄琪翔，字御行，他早年立志从军报国，于1912年起先后就读于广东陆军小学、湖北第三陆军中学，并于1919年从保定陆军军官学校炮兵科毕业，接受了系统的军事教育。1922年，受孙中山革命思想影响，黄琪翔辞去保定军校职务，回到广东投身革命。他先后参加了讨伐陈炯明的两次东征及平定杨希闵、刘震寰叛乱的战役，累建军功。1926年北伐开始后，他任国民革命军第四军第十二师第三十六团团长，与叶挺的独立团并肩作战，在汀泗桥、贺胜桥等重要战役中表现出色，成为著名的北伐将领。1927年，他升任被誉为“铁军”的第四军军长。在1927年风云变幻的政局中，黄琪翔身处矛盾中心。他当时是张发奎第二方面军的重要将领。同年8月，尽管本人并未实际参与，但由于其显赫的军功和地位，仍被推举为八一南昌起义领导机构——“中国国民党革命委员会”的主席团成员之一。大革命失败后，黄琪翔的政治立场进一步转向。1930年5月，邓演达回国发起组织“中国国民党临时行动委员会”，旨在建立一个既反对蒋介石独裁，又不同于共产党的第三种政治力量。黄琪翔积极响应并参与创建，并担任军事委员会主任委员，成为该组织在军事方面的核心负责人"
CHI_ChenShaoKuang: "陈绍宽"
CHI_ChenShaoKuang_leader_desc: "§Y$CHI_ChenShaoKuang_birth_info$\n§Y背景：§!§L$CHI_ChenShaoKuang_bio$\n\n“欲固国防，必建海军；欲建海军，首重人才与器备。”"
CHI_ChenShaoKuang_birth_info: "生于：§!§L1889年10月27日；福建闽侯§!\n§Y派系：§!中立"
CHI_ChenShaoKuang_bio: "陈绍宽，字厚甫。1905年考入江南水师学堂第六期航海科，以勤奋著称，毕业时成绩名列第一。1908年毕业后在“通济”练习舰见习，后历任多艘舰艇的驾驶大副、副长等职，以精湛的航海技术闻名。1916年底，被选派随同考察团赴欧洲观战，先后考察英、法、意等国海军，并亲身参与英国海军对德作战。此次考察使其深刻认识到航空母舰与潜艇在未来海战中的关键作用，立志推动中国海军现代化。1919年，他以中国代表团海军代表身份参加巴黎和会。\n1926年，陈绍宽升任北洋政府海军第二舰队司令，驻守南京。北伐战争初期，他奉命协助军阀孙传芳作战。随着战局变化及海军总司令杨树庄的策动，为保存海军实力，他于1927年3月转而归附国民革命军。同年8月的龙潭战役中，他率舰队在长江上截击并重创孙传芳部，为战役胜利起到关键作用，因此获得国民政府一等勋章及“中流砥柱”勋旗。\n1928年，南京国民政府设立海军署，陈绍宽任署长。同年，他提交了著名的《条陈扩充海军呈文》，首次明确提出建造一艘航空母舰的构想，并规划了包括驱逐舰、潜艇、巡洋舰在内的完整舰队建设方案。1929年海军部成立后，他任政务次长，次年代理部长。在经费极其短缺的情况下，他致力于海军人才培养与舰艇建造，选派军官出国深造，并在福州马尾设立海军大学。至1930年，他作为中国海军现代化建设的核心推动者，其振兴海军、尤其是建设航母的梦想，已在军内外产生深远影响，但同时也面临着国力贫弱与政局动荡的重重阻力。"
CHI_ChenCe: "陈策"
CHI_ChenCe_leader_desc: "§Y$CHI_ChenCe_birth_info$\n§Y背景：§!§L$CHI_ChenCe_bio$\n\n“舰坚炮利，不若将士忠勇；风高浪急，方显水师本色。”"
CHI_ChenCe_birth_info: "生于：§!§L1893年（另有1894年、1895年等说）；广东琼山（今属海南省）\n§Y派系：§!§Y中立§!"
CHI_ChenCe_bio: "陈策，原名陈明唐，字筹硕，广东琼山（今属海南省）人。早年赴广州求学，1909年考入广东黄埔水师工业学堂（后更名为广东海军学校）学习驾驶。1911年，他在广州加入中国同盟会，投身革命。武昌起义爆发后，他奉命返回海南，组织学生军进攻琼州府城，在战斗中负伤。此后，他参与了讨伐袁世凯、龙济光等一系列革命斗争，并于1915年参与策动夺取龙济光座舰“宝璧”号的起义。\n1917年，孙中山南下护法，陈策投身其中，并于9月出任大元帅府参议。1918年初，他护卫孙中山登舰炮击广东督军莫荣新署衙。此后数年，他积极联络海军力量，支持粤军回师广东，驱逐桂系军阀。\n1922年6月，陈炯明发动叛乱，炮击总统府。危急时刻，陈策亲率永丰舰驶近接应，迎护孙中山登舰，并指挥舰艇与叛军激战。因护卫有功，深得孙中山信赖。此后，他历任广东海防司令、江防司令等要职。1927年，他在“广州张黄事变”中支持南京国民政府，次年出任海军第四舰队司令。至1930年，陈策已成长为国民党广东海军系统中的核心将领之一，长期致力于巩固南方革命根据地的海防力量。"
CHI_ChenJiLiang: "陈季良"
CHI_ChenJiLiang_leader_desc: "§Y$CHI_ChenJiLiang_birth_info$\n§Y背景：§!§L$CHI_ChenJiLiang_bio$\n\n“司令旗在，舰队就在；宁葬江鱼之腹，亦不示弱于人。”"
CHI_ChenJiLiang_birth_info: "生于：§!§L1883年9月13日；福建福州§!\n§Y派系：§!§Y中立§!"
CHI_ChenJiLiang_bio: "陈季良，原名陈世英，字季良。1897年考入南京江南水师学堂第四届驾驶班，毕业后在“海容”舰任职。1911年武昌起义时，他积极主张海军反正支持革命。\n1919年，陈世英任“江亨”舰长兼黑龙江江防舰队分舰队领队长，在庙街（今尼古拉耶夫斯克）护航。因同情苏联十月革命，他将舰上两门舰炮及弹药资助红军对抗日军干涉部队，引发震惊中外的“庙街事件”。事后，北洋政府迫于日本压力，将其革职并“永不叙用”。幸得海军同仁掩护，他改名为陈季良，继续在海军服役。\n1925年2月，陈季良升任海军第一舰队司令，兼任厦门警备司令。1926年冬，为配合北伐，他率舰队迫使福州城防司令李生春投降，正式加入国民革命军。1927年，他率部参加龙潭战役，同年10月出任国民政府军事委员会委员。\n1928年，他担任国军编遣委员会海军编遣办事处委员。1929年，陈季良出任海军部常务次长，同时仍兼任第一舰队司令。至1930年4月，他又兼任了海军陆战队总指挥。此时，他已成为国民党海军系统中一位兼具实战经验、统率舰队与行政部门职务的重要将领。"
CHI_JiangJieShi: "蒋介石"
CHI_JiangJieShi_leader_desc: "§Y$CHI_JiangJieShi_birth_info$\n§Y背景：§!§L$CHI_JiangJieShi_bio$\n\n“一个主义，一个党，一个领袖。”"
CHI_JiangJieShi_birth_info: "生于：§!§L1887年10月31日；浙江奉化§!\n§Y派系：§!§K国民党——新右派§!"
CHI_JiangJieShi_bio: "蒋介石，原名瑞元，学名志清，后改名中正，字介石。早年留学日本，就读于东京振武学校，期间加入中国同盟会，投身反清革命。辛亥革命爆发后，他回国参与光复浙江和上海的战役。此后，他追随孙中山，在粤军中担任职务，并多次参与讨伐陈炯明等战役。1924年，孙中山创办黄埔军校，蒋介石被任命为校长，借此培养嫡系军事力量，奠定其政治基础。1926年，他出任国民革命军总司令，誓师北伐，旨在推翻北洋军阀，统一中国。北伐途中，1927年4月，他在上海发动“四一二”政变，清剿共产党人，与武汉国民政府决裂，在南京另立国民政府。1928年，北伐军占领北京，张学良东北易帜，南京政府名义上统一全国。此后，蒋介石通过编遣会议和军事手段，巩固个人权威，但党内反对声音不断。1930年，他与阎锡山、冯玉祥、李宗仁等爆发中原大战，最终取胜，进一步强化了其统治地位。"
