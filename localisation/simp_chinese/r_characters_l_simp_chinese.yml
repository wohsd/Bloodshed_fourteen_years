CHI_ChenCheng_leader_desc: "§Y$CHI_ChenCheng_birth_info$\n§Y背景：§!§L$CHI_ChenCheng_bio$\n\n“服从是军人的天职，而责任高于一切。”"
CHI_ChenCheng_birth_info: "生于：§!§L1898年1月4日；浙江青田§!\n§Y派系：§!§G黄埔系——土木系§!"
CHI_ChenCheng_bio: "陈诚，字辞修。1919年考入保定陆军军官学校第八期炮兵科，1922年毕业后，南下广东，先后在粤军及建国粤军中担任军职。1924年黄埔军校建立，他受邓演达等人推荐入校，出任炮兵科教官兼炮兵队区队长。在1925年的第一次东征棉湖战役中，他指挥的炮兵发挥关键作用，战后得到蒋介石的赏识与提拔，从此被视为蒋的嫡系亲信。\n北伐期间，他先后担任国民革命军总司令部中校参谋、第二十一师第六十三团上校团长等职。1927年，他率部在浙江龙游、江苏徐州等地作战，以纪律严明和战斗力强著称。1928年北伐完成后，他出任南京警备司令、第十一师副师长等职，致力于部队的整训与建设。\n1929年至1930年，在蒋介石与地方军阀的一系列内战中，陈诚的军事才能得到进一步施展。他先后率部参与蒋桂战争、蒋唐战争。1930年中原大战期间，他任第十一师师长，在关键战役中表现突出，尤其是在击溃阎锡山部的战斗中建有功勋，其部队以善战且损耗小而闻名，战后因功晋升第十八军军长，由此开始组建其核心军事集团，成为蒋介石麾下迅速崛起的年轻将领代表。"
CHI_YangYongTai: "杨永泰"
CHI_ChenGuoFu: "陈果夫"
CHI_ChenGuoFu_leader_desc: "§Y$CHI_ChenGuoFu_birth_info$\n§Y背景：§!§L$CHI_ChenGuoFu_bio$\n\n“政治之要，在于组织与人才；主义之推行，赖于宣传与教育。”"
CHI_ChenGuoFu_birth_info: "生于：§!§L1892年10月27日；浙江吴兴§!\n§Y派系：§!§RCC系§!"
CHI_ChenGuoFu_bio: "陈果夫，名祖焘，字果夫。其叔父陈其美是辛亥革命元勋，与蒋介石为结拜兄弟。受家族影响，陈果夫早年便接触革命思想，1911年加入中国同盟会。辛亥革命爆发后，他曾赴武汉参加革命军。后因身体原因，转向学习金融与经济。1918年后在上海从事证券交易与金融活动，为孙中山的革命事业筹措经费，并在此过程中展现了其组织与理财才能。\n1924年黄埔军校成立后，他应蒋介石之邀赴广州，负责为军校采购物资与经费管理，成为蒋在党务与后勤方面的得力助手。1926年，他当选为国民党第二届中央监察委员，开始深入参与国民党中央党务。在1927年“四一二”政变前后，陈果夫与其弟陈立夫积极协助蒋介石策划“清党”，并利用其控制的“中央组织部党务调查科”及各地党部，进行人员审查与情报搜集，为清除党内异己与共产党人提供组织支持。\n南京国民政府成立后，陈果夫历任国民党中央组织部副部长、代理部长等要职，主导国民党各级党部的重建与人事安排，大力培植亲蒋势力。他与陈立夫共同建立了一套以“青天白日团”和“中国国民党忠实同志会”为核心的组织体系，形成了党内重要的派系“CC系”。至1930年，陈果夫已掌控国民党党务组织系统，并通过主持中央政治学校培养干部，影响力扩展至文化宣传、教育及特务领域，成为蒋介石在政治与党务上最为倚重的人物之一。"
CHI_HeYingQing: "何应钦"
CHI_HeYingQing_leader_desc: "§Y$CHI_HeYingQing_birth_info$\n§Y背景：§!§L$CHI_HeYingQing_bio$\n\n“为求国家之统一，革命军必须绝对服从中央，完成北伐使命。”"
CHI_HeYingQing_birth_info: "生于：§!§L1890年4月2日；贵州兴义§!\n§Y派系：§!§G黄埔系——元老派§!"
CHI_HeYingQing_bio: "何应钦，字敬之。早年就读于武昌陆军第三中学，1909年被选送日本留学，先入振武学校，后升入日本陆军士官学校第二十二期步兵科，在此期间加入中国同盟会。1911年辛亥革命爆发后，他中断学业回国，参加上海光复之役。二次革命失败后，他返回日本完成学业，并于1916年回国，赴贵州投身军界，逐渐崭露头角。\n1924年，蒋介石筹建黄埔军校，何应钦因日本士官学校背景及在黔军中的练兵经验，被任命为少将总教官，不久后接任军校教导团团长，成为蒋介石在军事上的重要助手。在两次东征中，他指挥教导第一团作战，特别是在棉湖战役中以寡敌众，战果显著，奠定其黄埔系核心将领地位。1926年北伐开始，何应钦任国民革命军第一军军长，率东路军由广东进军福建、浙江，克复福州、杭州，最终于1927年3月进驻上海。\n1927年，他积极参与蒋介石“清党”，并历任浙江省政府主席、国民革命军参谋长等要职。1928年北伐完成后，他先后担任国民政府委员、训练总监部总监。1929年至1930年间，在蒋桂战争、蒋冯战争及中原大战中，他作为蒋介石的主要军事副手，坐镇武汉或南京，统筹后方军政，为蒋介石最终确立军事优势贡献颇多，被视为国民党内地位仅次于蒋介石的军事领袖之一。"
CHI_TangShenZhi: "唐生智"
CHI_TangShenZhi_leader_desc: "§Y$CHI_TangShenZhi_birth_info$\n§Y背景：§!§L$CHI_TangShenZhi_bio$\n\n“军队应为国家之屏障，而非私人之权柄。”"
CHI_TangShenZhi_birth_info: "生于：§!§L1889年10月12日；湖南东安§!\n§Y派系：§!§G保定系§!"
CHI_TangShenZhi_bio: "唐生智，字孟潇。早年就读于湖南陆军小学，后升入武昌陆军第三中学。1909年考入保定陆军军官学校第一期步兵科，毕业后分发至湖南陆军混成旅任职。受革命思想影响，加入中国同盟会，曾参与辛亥革命及后续的护国战争，在湘军中渐露头角，由连长、营长累升至湘军第四师师长，成为湖南地方实力派的重要人物。\n1926年，广东国民政府誓师北伐，唐生智审时度势，宣布加入国民革命军，所部改编为第八军，他任军长兼前敌总指挥，指挥西路军进军湖南、湖北。在汀泗桥、贺胜桥及攻克武昌等关键战役中，其部队发挥了重要作用，势力因此迅速膨胀，控制了湖南、湖北大部地区。\n1927年，武汉国民政府与南京蒋介石政权之间发生“宁汉分裂”。唐生智站在武汉一方，被任命为第四方面军总指挥，继续北伐进入河南，与奉军作战。同年下半年，宁汉合流，但因权力争夺，唐生智与南京方面关系恶化，被指为“叛变”，遭李宗仁、程潜等部西征讨伐。其部战败后，唐生智于11月通电下野，流亡日本。\n1929年，经疏通后回国，被蒋介石重新起用，任命为国民政府军事参议院院长、第五路军总指挥，参与蒋桂战争。但其与蒋介石的合作基础脆弱。1930年中原大战爆发，唐生智最初持观望态度，后接受汪精卫改组派任命，于12月在郑州通电反蒋，就任“护党救国军”第四路总司令，但其举兵未获广泛响应。
CHI_XueYue: "薛岳"
CHI_YangHuChen: "杨虎城"
CHI_YangHuChen_leader_desc: "§Y$CHI_YangHuChen_birth_info$\n§Y背景：§!§L$CHI_YangHuChen_bio$\n\n“以乡土为根基，于变局中求生；持革命之初心，在夹缝中图存。”"
CHI_YangHuChen_birth_info: "生于：§!§L1893年11月26日；陕西蒲城§!\n§Y派系：§!§Y西北军§!"
CHI_YangHuChen_bio: "杨虎城，名虎，字虎城。早年因家贫投身江湖，辛亥革命爆发时，率当地青年组成民团，参加陕西反清起义，隶属秦陇复汉军。后回乡组织农民抗暴，逐渐发展成为地方武装首领。1915年，袁世凯称帝，杨虎城率部参加陕西护国军，投身讨袁战争。1917年，响应孙中山护法号召，其所部被编为陕西靖国军第三路第一支队，转战渭北，成为靖国军的重要力量。\n1922年，靖国军大部瓦解或接受直系改编，杨虎城拒绝收编，率部退入陕北榆林地区休整，依托并州镇守使井岳秀庇护以保存实力。在此期间，他结识进步人士杜斌丞及共产党人魏野畴，思想受到一定影响。1924年，国民党一大召开，国共合作形成，杨虎城加入中国国民党。\n1926年，北洋军阀刘镇华率镇嵩军围攻西安，杨虎城应陕西军务督办李云龙之邀，率部驰援，共同坚守西安长达八个月，直至冯玉祥国民军联军解围，此战使其声名大振。战后，所部改编为国民军联军第十军，杨虎城任军长，正式加入冯玉祥西北军系统，并于1927年东出潼关，参加北伐，在豫东、鲁南地区与直鲁联军作战。\n1929年，蒋冯关系破裂，杨虎城所部随冯玉祥反蒋。但不久后，因西北军内部矛盾及补给困难，杨虎城权衡利弊，于1929年底在河南南阳地区脱离冯玉祥，接受南京国民政府改编，任新编第十四师师长。1930年中原大战爆发，杨虎城部被蒋介石任命为讨逆军第十七路军总指挥，于豫西对冯玉祥、阎锡山联军作战。他抓住战机，率部奇袭洛阳，并乘胜西进，于10月抢先占领潼关，进入陕西。战后，蒋介石论功行赏，任命杨虎城为陕西省政府主席兼西安绥靖公署主任，使其最终确立了在陕西的统治地位。"
