CHI_ChenLiFu: "陈立夫"
CHI_ChenLiFu_leader_desc: "§Y$CHI_ChenLiFu_birth_info$\n§Y背景：§!§L$CHI_ChenLiFu_bio$\n\n"
CHI_ChenLiFu_birth_info: "生于：§!§L1900年8月21日；浙江吴兴（今湖州）§!"
CHI_ChenLiFu_bio: "陈立夫，名祖燕，字立夫。浙江吴兴人。其叔父陈其美为辛亥革命元勋，与蒋介石为结拜兄弟，故陈立夫与蒋家关系深厚。早年受传统私塾教育，奠定了国学基础。1917年考入天津北洋大学攻读矿冶，1923年毕业后赴美留学，于1924年在旧金山加入国民党，1925年获匹兹堡大学采矿学硕士学位。\n同年回国后，他弃工从政，经其兄陈果夫推荐，于1926年初出任黄埔军校校长办公厅机要秘书，自此追随蒋介石左右，负责机要通讯工作，深得蒋的信赖。北伐期间，他随军负责通讯与译电。\n1928年，陈立夫在南京出任国民党中央组织部调查科主任。1929年，在国民党第三次全国代表大会上当选中央执行委员，并出任国民党中央党部秘书长，时年仅29岁，成为国民党历史上最年轻的秘书长。在此期间，他与兄长陈果夫共同组织“中央俱乐部”（即CC系），致力于控制国民党党务实权，维护蒋介石的统治。至1930年，他已迅速崛起为蒋介石在党务与特务系统中的核心亲信，CC系的影响力亦初步形成。其在1930年后历任中央组织部长、教育部长等要职。"


PRJ_TangYuBao: "谭余保"
PRJ_TangYuBao_leader_desc: "§Y$PRJ_TangYuBao_birth_info$\n§Y背景：§!§L$PRJ_TangYuBao_bio$\n\n"
PRJ_TangYuBao_birth_info: "生于：§!§L1899年12月；湖南茶陵§!"
PRJ_TangYuBao_bio: "谭余保，湖南茶陵人。出身贫农家庭，曾为裁缝学徒。1926年参加农民运动。1927年2月加入中国共产党。大革命失败后，于1927年底返回茶陵组织农民武装斗争。1929年，任中共茶陵县第六区、第七区区委书记。1930年，他参与领导茶陵地方武装，配合红军作战，并当选为茶陵县苏维埃政府常委，开始在湘赣边区崭露头角。"

PRC_WangRuChi: "王如痴"
PRC_WangRuChi_leader_desc: "§Y$PRC_WangRuChi_birth_info$\n§Y背景：§!§L$PRC_WangRuChi_bio$\n\n"
PRC_WangRuChi_birth_info: "生于：§!§L1903年；湖南祁东§!"
PRC_WangRuChi_bio: "王如痴，湖南祁东人。1923年考入湖南省立工业专门学校。1926年加入中国共产党，同年冬考入黄埔军校武汉分校（后称中央军事政治学校）。1927年参加北伐战争。大革命失败后，参加南昌起义，随军南下。1928年被派往湘赣边区，参与井冈山革命根据地的军事工作。1930年，他在红一方面军中任职，参与中央苏区的第一次反‘围剿’斗争。"

JDW_Zhao_Dengyu: "赵登禹"
JDW_Zhao_Dengyu_leader_desc: "§Y$JDW_Zhao_Dengyu_birth_info$\n§Y背景：§!§L$JDW_Zhao_Dengyu_bio$\n\n"
JDW_Zhao_Dengyu_birth_info: "生于：§!§L1898年；山东菏泽§!"
JDW_Zhao_Dengyu_bio: "赵登禹，字舜诚，山东菏泽人。1914年投奔冯玉祥部第十六混成旅当兵，因身材魁梧、勇武过人，被选入冯玉祥卫队。1921年升任排长。1922年第一次直奉战争后升任连长。1924年参加冯玉祥发动的北京政变，升任营长。1926年随部参加北伐，任团长。1927年任第二集团军第二十五师旅长。1930年中原大战后，西北军解体，其部被张学良改编，他任第二十九军第三十七师第一〇九旅第二一七团团长，驻防山西。"

JDW_DongLingGe: "佟麟阁"
JDW_DongLingGe_leader_desc: "§Y$JDW_DongLingGe_birth_info$\n§Y背景：§!§L$JDW_DongLingGe_bio$\n\n"
JDW_DongLingGe_birth_info: "生于：§!§L1892年10月29日；河北高阳§!"
JDW_DongLingGe_bio: "佟麟阁，原名凌阁，字捷三，河北高阳人。1908年投效清军。1911年参加滦州起义。1912年转入冯玉祥部，历任排长、连长、营长。1922年任团长。1924年参加北京政变，升任旅长。1925年升任师长。1926年参加五原誓师，任国民联军第十一师师长。1927年任第二集团军第三十五军军长。1928年北伐完成后，任暂编第十一师师长。1930年中原大战期间，任西北军第二方面军第四路军总指挥。西北军失败后，他一度解甲归田，后应宋哲元之邀出山，任第二十九军副军长，协助整训部队。"

CGZ_Chen_guizhang: "陈珪璋"
CGZ_Chen_guizhang_leader_desc: "§Y$CGZ_Chen_guizhang_birth_info$\n§Y背景：§!§L$CGZ_Chen_guizhang_bio$\n\n"
CGZ_Chen_guizhang_birth_info: "生于：§!§L1897年；甘肃庆阳§!"
CGZ_Chen_guizhang_bio: "陈珪璋，字汉卿，甘肃庆阳人。早年投身军旅，在陇东地方武装中任职。1926年，他趁西北军与直系军阀在甘肃混战之机，收拢溃兵、民团，自立山头，逐渐发展成为一支盘踞陇东庆阳、平凉一带的地方武装。1928年至1930年间，他周旋于冯玉祥西北军与蒋介石南京政府之间，时而接受改编，时而独立行动，控制区域一度达十余县，自委官吏，征收税赋，成为甘肃东部主要的割据势力之一，人称‘陇东王’。"

MTX_Ma_tingxian: "马廷贤"
MTX_Ma_tingxian_leader_desc: "§Y$MTX_Ma_tingxian_birth_info$\n§Y背景：§!§L$MTX_Ma_tingxian_bio$\n\n"
MTX_Ma_tingxian_birth_info: "生于：§!§L1895年；甘肃河州（今临夏）§!"
MTX_Ma_tingxian_bio: "马廷贤，甘肃河州人，回族。其家族与马安良、马麒等河州回军世家有联姻关系。早年在其兄马廷勷部任职。1928年‘河湟事变’中，马仲英起兵反冯，马廷贤随之响应，成为马仲英部的重要将领，转战甘、宁、青等地。1930年中原大战期间，他随马仲英部进入甘肃河西走廊，并与新疆的反对力量联络，活动于甘新边界地区。此时，他已是一支拥有相当实力的回军骑兵首领。"

YWQ_Yang_wanqing: "杨万青"
YWQ_Yang_wanqing_leader_desc: "§Y$YWQ_Yang_wanqing_birth_info$\n§Y背景：§!§L$YWQ_Yang_wanqing_bio$\n\n"
YWQ_Yang_wanqing_birth_info: "生于：§!§L？？？；§!"
YWQ_Yang_wanqing_bio: "杨万青，民国时期活跃于西北地区（一说在甘肃或绥远）的地方武装首领。关于其1930年以前的具体生平，现存可靠史料记载甚少。"

YPQ_yu_pinqing: "于品卿"
YPQ_yu_pinqing_leader_desc: "§Y$YPQ_yu_pinqing_birth_info$\n§Y背景：§!§L$YPQ_yu_pinqing_bio$\n\n"
YPQ_yu_pinqing_birth_info: "生于：§!§L1886年；河北冀县§!"
YPQ_yu_pinqing_bio: "于品卿，河北冀县人。早年赴张家口经商，主要经营皮毛业，多年后成为张家口商界有一定影响力的人物。关于其1930年以前的详细活动记载不多。"

PRC_LiuChouXi: "刘畴西"
PRC_LiuChouXi_leader_desc: "§Y$PRC_LiuChouXi_birth_info$\n§Y背景：§!§L$PRC_LiuChouXi_bio$"
PRC_LiuChouXi_birth_info: "生于：§!§L1897年；湖南长沙§!"
PRC_LiuChouXi_bio: "刘畴西，字西屏，湖南长沙人。1920年考入湖南第一师范学校，1922年加入中国共产党。1924年考入黄埔军校第一期，毕业后参加东征、北伐战争。1927年参加南昌起义，任营长。1929年赴苏联伏龙芝军事学院学习。1930年回国，任红三军第八师师长，参与中央苏区的反'围剿'斗争。他作战勇敢，指挥有方，因在战斗中失去左臂，被称为'独臂将军'。"