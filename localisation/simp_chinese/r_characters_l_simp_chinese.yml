NRC_John_Rabe: "约翰·拉贝"
NRC_John_Rabe_leader_desc: "§Y$NRC_John_Rabe_birth_info$\n§Y背景：§!§L$NRC_John_Rabe_bio$\n\n“您是几十万人的活菩萨”"
NRC_John_Rabe_birth_info: "生于：§!§L1882年11月23日；德国汉堡§!"
NRC_John_Rabe_bio: "约翰·拉贝，德国商人。早年经历坎坷，父亲早逝，他早早开始学徒生涯，并辗转非洲工作数年。1908年，他受雇于西门子公司，并被派往中国北平（北京）。中国的生活成为了拉贝人生的重要转折点，他很快适应并深深喜爱上这个国家及其文化。\n在北平期间，他负责西门子的销售与市场开拓，业务范围涉及电力、电报设备与机械。他工作勤勉，为人正直友善，逐渐在华北大地的外国侨民与中国商业伙伴中建立起良好声誉。第一次世界大战期间，作为同盟国公民，拉贝与其他德国侨民一度被滞留中国。战后，他于1919年短暂返回德国，但次年即因业务需要重返中国，并被西门子调往天津分公司。\n整个1920年代，拉贝长期在中国北方工作与生活，他亲眼目睹了这个古老国家在军阀混战与政局动荡中的挣扎与变迁。他不仅是一位成功的商务人士，也成为了联系在华德国社群与中国社会的一个温和而积极的纽带。他在中国生活了超过二十年，对这个第二故乡怀有深厚的感情，并继续为西门子在华北的业务拓展而工作。"
CHI_ChenLiFu: "陈立夫"
CHI_ChenLiFu_leader_desc: "§Y$CHI_ChenLiFu_birth_info$\n§Y背景：§!§L$CHI_ChenLiFu_bio$\n\n"
CHI_ChenLiFu_birth_info: "生于：§!§L1900年8月21日；浙江吴兴（今湖州）§!"
CHI_ChenLiFu_bio: "陈立夫，名祖燕，字立夫。浙江吴兴人。其叔父陈其美为辛亥革命元勋，与蒋介石为结拜兄弟，故陈立夫与蒋家关系深厚。早年受传统私塾教育，奠定了国学基础。1917年考入天津北洋大学攻读矿冶，1923年毕业后赴美留学，于1924年在旧金山加入国民党，1925年获匹兹堡大学采矿学硕士学位。\n同年回国后，他弃工从政，经其兄陈果夫推荐，于1926年初出任黄埔军校校长办公厅机要秘书，自此追随蒋介石左右，负责机要通讯工作，深得蒋的信赖。北伐期间，他随军负责通讯与译电。\n1928年，陈立夫在南京出任国民党中央组织部调查科主任。1929年，在国民党第三次全国代表大会上当选中央执行委员，并出任国民党中央党部秘书长，时年仅29岁，成为国民党历史上最年轻的秘书长。在此期间，他与兄长陈果夫共同组织“中央俱乐部”（即CC系），致力于控制国民党党务实权，维护蒋介石的统治。至1930年，他已迅速崛起为蒋介石在党务与特务系统中的核心亲信，CC系的影响力亦初步形成。其在1930年后历任中央组织部长、教育部长等要职。"
PRD_ChenKouYa: "陈魁亚"
PRD_ChenKouYa_leader_desc: "§Y$PRD_ChenKouYa_birth_info$\n§Y背景：§!§L$PRD_ChenKouYa_bio$\n\n"
PRD_ChenKouYa_birth_info: "生于：§!§L1897年；广东海丰§!"
PRD_ChenKouYa_bio: "陈魁亚，1897年出生于广东海丰县海城镇。青年时就读于海丰中学，与后来被誉为“农民运动大王”的彭湃是同窗好友，两人志同道合。1919年五四运动期间，他参与组织海丰县学生联合会，积极开展爱国宣传。\n1921年，彭湃在海丰成立“社会主义研究社”传播马克思主义，陈魁亚是其主要成员之一。同年，他协助担任教育局长的彭湃推行教育改革，致力于让教育为劳动者和贫民服务。1922年，他追随被革职的彭湃深入农村，投身农民运动。\n1925年，广东革命政府第一次东征胜利后，陈魁亚被任命为海丰县教育局员，后接任局长。在此期间，他加入了中国共产党。不久后，受彭湃派遣，他前往邻近的普宁县开展农民运动，组织农民协会，并创建了中共普宁县支部，担任支部书记。1925年冬，他成功领导普宁县农民围攻县城，取得了减租减息的胜利。\n1927年，国民党发动“四一二”反革命政变后，陈魁亚在普宁与杨石魂等人迅速领导了武装暴动作为回应，于4月23日率领武装农民围攻普宁县城。此后，他参与了彭湃领导的海陆丰第三次武装起义，为建立中国第一个苏维埃政权贡献力量。起义后，他被任命为中共普宁县委书记。\n至1929年，陈魁亚在东江地区的领导地位进一步上升，先后担任东江特委常委、潮（阳）普（宁）惠（来）三县苏维埃主席等要职。到1930年，他已成为东江地区革命力量的核心领导人之一。"
HLJ_SuBingWeng: "苏炳文"
HLJ_SuBingWeng_leader_desc: "§Y$HLJ_SuBingWeng_birth_info$\n§Y背景：§!§L$HLJ_SuBingWeng_bio$\n\n"
HLJ_SuBingWeng_birth_info: "生于：§!§L1892年9月2日；辽宁新民§!"
HLJ_SuBingWeng_bio: "苏炳文，字翰章。1905年，14岁的苏炳文为求从军报国，步行至沈阳，考入奉天陆军小学，开始接受正规军事教育。1912年升入保定陆军军官学校第一期步兵科。1914年毕业后，被选入袁世凯创办的北京“模范团”，从见习军官逐步升至连长、营副。1918年，他以营长身份随中国参战军支队赴俄国海参崴一带执行护路任务，于1921年春回国。\n1922年第一次直奉战争后，因其东北籍身份受直系军阀猜忌而被免去实职，遂南下福建，任闽军第三旅上校参谋长、第一团团长等职。1924年第二次直奉战争后，苏炳文返回东北故乡，投入奉军郭松龄部，任第十二旅上校参谋长。1925年郭松龄反奉时，他升任东北国民军第一军少将参谋长，兵败后转任第六旅参谋长，后因作战得力，深得张学良赏识。\n1926年，苏炳文升任第六旅旅长。1927年，所部改编为东北军第十七师，任师长。1928年，调任黑龙江军务督办公署中将参谋长，兼任国防筹备处处长及省政府委员。1930年，他接任东北陆军第十五旅旅长，并兼任海拉尔镇守使、中东铁路哈（尔滨）满（洲里）护路司令、呼伦贝尔警备司令等要职，成为镇守黑龙江省西部国境地区的军事主官。"
PRY_WeiBaQun: "韦拔群"
PRY_WeiBaQun_leader_desc: "§Y$PRY_WeiBaQun_birth_info$\n§Y背景：§!§L$PRY_WeiBaQun_bio$\n\n"
PRY_WeiBaQun_birth_info: "生于：§!§L1894年2月6日；广西东兰§!"
PRY_WeiBaQun_bio: "韦拔群，壮族，原名韦秉吉，字拔群。其家庭为东兰县富裕乡绅，自幼接受传统教育，后于广西法政学堂肄业。受辛亥革命与五四运动影响，早年即具有强烈爱国思想与反抗精神。1916年，他变卖家产招募乡勇，组织“讨袁护国军”赴贵州参加护国战争。后入贵州讲武堂学习军事。\n1921年，韦拔群返回家乡东兰，联络进步青年成立“改造东兰同志会”（后改为“农民自治会”），组织农民开展反对土豪劣绅、取消苛捐杂税的斗争，是广西早期农民运动的先驱。1925年，为寻求革命理论指导，他进入第三届广州农民运动讲习所学习，并在此期间结识共产党人，思想发生根本转变。结业后，他回到东兰，仿照广州农讲所模式，在当地创办了广西最早的农民运动讲习所，培养了大批农运骨干。同年冬，他秘密加入中国共产党。\n1926年，他领导成立东兰县农民协会，使东兰成为当时广西农民运动最活跃的地区之一。1927年“四一二”政变后，广西当局大肆“清党”，韦拔群率领右江地区农民自卫军坚持武装斗争，在东兰、凤山一带建立游击区。\n1929年，邓小平、张云逸等共产党人抵达广西开展兵运工作。韦拔群领导的农民武装成为党在右江地区的重要基础力量。同年12月，他率领农军主力参加百色起义。起义后，成立中国工农红军第七军和右江苏维埃政府，韦拔群任红七军第三纵队司令员、右江苏维埃政府委员，是右江革命根据地的主要创建者和领导人之一。至1930年，他继续在右江根据地领导土地革命和武装斗争，其威望极高，被当地群众亲切称为“拔哥”。"
RFC_DengYanDa: "邓演达"
RFC_DengYanDa_leader_desc: "§Y$RFC_DengYanDa_birth_info$\n§Y背景：§!§L$RFC_DengYanDa_bio$\n\n“养成乐死之志气 革去贪生之性根”——孙中山"
RFC_DengYanDa_birth_info: "生于：§!§L1895年3月1日；广东惠州§!"
RFC_DengYanDa_bio: "邓演达，字择生，出身耕读之家，父亲系光绪年间秀才。受时风影响，少年邓演达较早接触新学，于1909年考入广东陆军小学堂，并在此秘密加入孙中山领导的中国同盟会。为推翻清廷，他于1911年投身革命。1916年至1919年间，他先后在武昌陆军第二预备学校及保定陆军军官学校深造，与同窗黄琪翔、叶挺等共同研习军事。\n他始终是孙中山革命事业的坚定追随者。黄埔军校创立后，邓演达历任训练部副主任、教育长等职，并坚定拥护孙中山联俄、联共、扶助农工三大政策。1927年大革命失败后，他公开进行反蒋活动。1930年，邓演达秘密回国，于8月9日在上海主持成立中国国民党临时行动委员会（简称“临委会”），被推选为总干事，并起草了以“平民革命”为核心的政治主张。该主张明确要求推翻蒋介石为首的南京统治，建立以农工为中心的平民政权，并实行“耕者有其田”的土地政策。为此，他积极筹划武装斗争，利用在黄埔军校师生中的崇高威望，组织“黄埔革命同学会”联络反蒋军事力量，秘密策动起义。\n邓演达的革命活动使其成为南京政府的重点缉捕对象。"
RFC_HuangQiXiang: "黄琪翔"
RFC_HuangQiXiang_leader_desc: "§Y$RFC_HuangQiXiang_birth_info$\n§Y背景：§!§L$RFC_HuangQiXiang_bio$\n\n"
RFC_HuangQiXiang_birth_info: "生于：§!§L1898年9月2日；广东梅县§!"
RFC_HuangQiXiang_bio: "黄琪翔，字御行，他早年立志从军报国，于1912年起先后就读于广东陆军小学、湖北第三陆军中学，并于1919年从保定陆军军官学校炮兵科毕业，接受了系统的军事教育。1922年，受孙中山革命思想影响，黄琪翔辞去保定军校职务，回到广东投身革命。他先后参加了讨伐陈炯明的两次东征及平定杨希闵、刘震寰叛乱的战役，累建军功。1926年北伐开始后，他任国民革命军第四军第十二师第三十六团团长，与叶挺的独立团并肩作战，在汀泗桥、贺胜桥等重要战役中表现出色，成为著名的北伐将领。1927年，他升任被誉为“铁军”的第四军军长。在1927年风云变幻的政局中，黄琪翔身处矛盾中心。他当时是张发奎第二方面军的重要将领。同年8月，尽管本人并未实际参与，但由于其显赫的军功和地位，仍被推举为八一南昌起义领导机构——“中国国民党革命委员会”的主席团成员之一。大革命失败后，黄琪翔的政治立场进一步转向。1930年5月，邓演达回国发起组织“中国国民党临时行动委员会”，旨在建立一个既反对蒋介石独裁，又不同于共产党的第三种政治力量。黄琪翔积极响应并参与创建，并担任军事委员会主任委员，成为该组织在军事方面的核心负责人"
CHI_ChenShaoKuang: "陈绍宽"
CHI_ChenShaoKuang_leader_desc: "§Y$CHI_ChenShaoKuang_birth_info$\n§Y背景：§!§L$CHI_ChenShaoKuang_bio$\n\n"
CHI_ChenShaoKuang_birth_info: "生于：§!§L1889年10月27日；福建闽侯§!"
CHI_ChenShaoKuang_bio: "陈绍宽，字厚甫。1905年考入江南水师学堂第六期航海科，以勤奋著称，毕业时成绩名列第一。1908年毕业后在“通济”练习舰见习，后历任多艘舰艇的驾驶大副、副长等职，以精湛的航海技术闻名。1916年底，被选派随同考察团赴欧洲观战，先后考察英、法、意等国海军，并亲身参与英国海军对德作战。此次考察使其深刻认识到航空母舰与潜艇在未来海战中的关键作用，立志推动中国海军现代化。1919年，他以中国代表团海军代表身份参加巴黎和会。\n1926年，陈绍宽升任北洋政府海军第二舰队司令，驻守南京。北伐战争初期，他奉命协助军阀孙传芳作战。随着战局变化及海军总司令杨树庄的策动，为保存海军实力，他于1927年3月转而归附国民革命军。同年8月的龙潭战役中，他率舰队在长江上截击并重创孙传芳部，为战役胜利起到关键作用，因此获得国民政府一等勋章及“中流砥柱”勋旗。\n1928年，南京国民政府设立海军署，陈绍宽任署长。同年，他提交了著名的《条陈扩充海军呈文》，首次明确提出建造一艘航空母舰的构想，并规划了包括驱逐舰、潜艇、巡洋舰在内的完整舰队建设方案。1929年海军部成立后，他任政务次长，次年代理部长。在经费极其短缺的情况下，他致力于海军人才培养与舰艇建造，选派军官出国深造，并在福州马尾设立海军大学。至1930年，他作为中国海军现代化建设的核心推动者，其振兴海军、尤其是建设航母的梦想，已在军内外产生深远影响，但同时也面临着国力贫弱与政局动荡的重重阻力。"
CHI_ChenCe: "陈策"
CHI_ChenCe_leader_desc: "§Y$CHI_ChenCe_birth_info$\n§Y背景：§!§L$CHI_ChenCe_bio$\n\n"
CHI_ChenCe_birth_info: "生于：§!§L1893年（另有1894年、1895年等说）；广东琼山（今属海南省）"
CHI_ChenCe_bio: "陈策，原名陈明唐，字筹硕，广东琼山（今属海南省）人。早年赴广州求学，1909年考入广东黄埔水师工业学堂（后更名为广东海军学校）学习驾驶。1911年，他在广州加入中国同盟会，投身革命。武昌起义爆发后，他奉命返回海南，组织学生军进攻琼州府城，在战斗中负伤。此后，他参与了讨伐袁世凯、龙济光等一系列革命斗争，并于1915年参与策动夺取龙济光座舰“宝璧”号的起义。\n1917年，孙中山南下护法，陈策投身其中，并于9月出任大元帅府参议。1918年初，他护卫孙中山登舰炮击广东督军莫荣新署衙。此后数年，他积极联络海军力量，支持粤军回师广东，驱逐桂系军阀。\n1922年6月，陈炯明发动叛乱，炮击总统府。危急时刻，陈策亲率永丰舰驶近接应，迎护孙中山登舰，并指挥舰艇与叛军激战。因护卫有功，深得孙中山信赖。此后，他历任广东海防司令、江防司令等要职。1927年，他在“广州张黄事变”中支持南京国民政府，次年出任海军第四舰队司令。至1930年，陈策已成长为国民党广东海军系统中的核心将领之一，长期致力于巩固南方革命根据地的海防力量。"
CHI_ChenJiLiang: "陈季良"
CHI_ChenJiLiang_leader_desc: "§Y$CHI_ChenJiLiang_birth_info$\n§Y背景：§!§L$CHI_ChenJiLiang_bio$\n\n"
CHI_ChenJiLiang_birth_info: "生于：§!§L1883年9月13日；福建福州§!"
CHI_ChenJiLiang_bio: "陈季良，原名陈世英，字季良。1897年考入南京江南水师学堂第四届驾驶班，毕业后在“海容”舰任职。1911年武昌起义时，他积极主张海军反正支持革命。\n1919年，陈世英任“江亨”舰长兼黑龙江江防舰队分舰队领队长，在庙街（今尼古拉耶夫斯克）护航。因同情苏联十月革命，他将舰上两门舰炮及弹药资助红军对抗日军干涉部队，引发震惊中外的“庙街事件”。事后，北洋政府迫于日本压力，将其革职并“永不叙用”。幸得海军同仁掩护，他改名为陈季良，继续在海军服役。\n1925年2月，陈季良升任海军第一舰队司令，兼任厦门警备司令。1926年冬，为配合北伐，他率舰队迫使福州城防司令李生春投降，正式加入国民革命军。1927年，他率部参加龙潭战役，同年10月出任国民政府军事委员会委员。\n1928年，他担任国军编遣委员会海军编遣办事处委员。1929年，陈季良出任海军部常务次长，同时仍兼任第一舰队司令。至1930年4月，他又兼任了海军陆战队总指挥。此时，他已成为国民党海军系统中一位兼具实战经验、统率舰队与行政部门职务的重要将领。"



CHI_JiangJieShi: "蒋介石"
CHI_JiangJieShi_leader_desc: "§Y$CHI_JiangJieShi_birth_info$\n§Y背景：§!§L$CHI_JiangJieShi_bio$\n\n“一个主义，一个党，一个领袖。”"
CHI_JiangJieShi_birth_info: "生于：§!§L1887年10月31日；浙江奉化§!"
CHI_JiangJieShi_bio: "蒋介石，原名瑞元，学名志清，后改名中正，字介石。早年留学日本，就读于东京振武学校，期间加入中国同盟会，投身反清革命。辛亥革命爆发后，他回国参与光复浙江和上海的战役。此后，他追随孙中山，在粤军中担任职务，并多次参与讨伐陈炯明等战役。1924年，孙中山创办黄埔军校，蒋介石被任命为校长，借此培养嫡系军事力量，奠定其政治基础。1926年，他出任国民革命军总司令，誓师北伐，旨在推翻北洋军阀，统一中国。北伐途中，1927年4月，他在上海发动“四一二”政变，清剿共产党人，与武汉国民政府决裂，在南京另立国民政府。1928年，北伐军占领北京，张学良东北易帜，南京政府名义上统一全国。此后，蒋介石通过编遣会议和军事手段，巩固个人权威，但党内反对声音不断。1930年，他与阎锡山、冯玉祥、李宗仁等爆发中原大战，最终取胜，进一步强化了其统治地位。"




CHI_BaiChongXi: "白崇禧"
CHI_BaiChongXi_leader_desc: "§Y$CHI_BaiChongXi_birth_info$\n§Y背景：§!§L$CHI_BaiChongXi_bio$\n\n"
CHI_BaiChongXi_birth_info: "生于：§!§L1893年3月18日；广西桂林§!"
CHI_BaiChongXi_bio: "白崇禧，字健生，回族。早年就读于广西陆军小学、武昌陆军预备学校。1914年考入保定陆军军官学校第三期步兵科，与黄绍竑、夏威等人同学，为日后桂系集团的结成奠定人脉基础。1916年毕业后，回广西陆军第一师任见习官，后逐步晋升。\n1921年，孙中山号召讨伐旧桂系陆荣廷，白崇禧任田南警备司令部第一营营长。在作战中足部负重伤，赴广州治疗。1923年，他被孙中山任命为“广西讨贼军”总指挥部参谋长，与李宗仁、黄绍竑通力合作，于1924年击败陆荣廷、沈鸿英等部，并于1925年击退入侵的滇军唐继尧部，统一广西，三人由此成为新桂系的核心领袖，白崇禧以多谋善断被誉为“小诸葛”。\n1926年两广统一，桂军改编为国民革命军第七军，李宗仁任军长，白崇禧任参谋长兼第二旅旅长。北伐开始后，他被蒋介石调任国民革命军总司令部长，不久转任北伐军前敌总指挥兼东路军前敌总指挥，亲临一线指挥。在汀泗桥、贺胜桥等关键战役中，他协助指挥中央军（主要由第七军与第四军组成）击溃吴佩孚主力，并率部率先攻入江西。1927年，他任东路军前敌总指挥，率部由赣入浙，克复杭州、上海，成为北伐战争的先锋将领之一。\n1927年“四一二”政变中，白崇禧是上海地区具体执行“清党”的军事负责人。同年8月，他联合何应钦等逼迫蒋介石首次下野。宁汉合流后，他任军事委员会常务委员、第四集团军副总司令兼前敌总指挥，率部继续北伐，于1928年6月率先进入北京。北伐结束后，因编遣军队问题，以李宗仁、白崇禧为首的桂系与蒋介石矛盾激化。1929年蒋桂战争爆发，桂系战败，白崇禧一度流亡越南。1930年中原大战期间，他返回广西，与李宗仁重整旗鼓，出兵湖南策应冯玉祥、阎锡山反蒋，但未能改变战局。至1930年底，他作为新桂系的军事灵魂人物，仍在广西积蓄力量。"
CHI_HuHanMing: "胡汉民"
CHI_HuHanMing_leader_desc: "§Y$CHI_HuHanMing_birth_info$\n§Y背景：§!§L$CHI_HuHanMing_bio$\n\n“革命本素志，民族主义、民权主义丝毫无疑义矣。”"
CHI_HuHanMing_birth_info: "生于：§!§L1879年12月9日；广东番禺（今广州）§!"
CHI_HuHanMing_bio: "胡汉民，原名衍鸿，字展堂。1901年考中举人，1902年起两度赴日本留学。1905年在东京初次拜见孙中山，被其学说折服，随即携家人加入中国同盟会，从此成为孙中山的主要助手之一。他长于笔政，曾任《民报》编辑，与保皇派论战，宣传三民主义。\n1911年辛亥革命后，胡汉民被推举为广东都督。1912年元旦，孙中山在南京就任中华民国临时大总统，任命胡汉民为秘书长。他权力甚大，与孙中山同室办公，宵旰忧勤，时人曾讥讽其为“第二总统”。在任广东都督期间，他尝试按照三民主义理念建设地方，其政府骨干多为同盟会成员。\n1914年，他随孙中山在日本组织中华革命党。1924年，在国民党第一次全国代表大会上，他被指定为主席团成员，并当选为中央执行委员。同年，孙中山北上时，他曾代行大元帅职权，留守广州。\n1925年孙中山逝世后，国民党内矛盾激化。同年8月廖仲恺遇刺，胡汉民因有嫌疑而被派赴苏联考察。在莫斯科期间，他以国民党代表身份活动，试图维护国民党的独立性与三民主义的正统地位，甚至提出国民党加入共产国际的要求，意在争夺革命领导权，但未获成功。\n1927年“四一二”政变后，胡汉民赶往南京与蒋介石合作，参与反共清党。1928年，他出任立法院院长，协助制订《中国国民党训政大纲》等一系列确立国民党一党专政的法律文件。至1930年，他作为国民党元老和理论家，身居高位，但此时其与蒋介石之间的权力裂痕也已悄然滋生。"
CEN_DuYuMing: "杜聿明"
CEN_DuYuMing_leader_desc: "§Y$CEN_DuYuMing_birth_info$\n§Y背景：§!§L$CEN_DuYuMing_bio$\n\n"
CEN_DuYuMing_birth_info: "生于：§!§L1904年11月28日；陕西米脂§!"
CEN_DuYuMing_bio: "杜聿明，字光亭。1923年自榆林中学毕业后，因受《新青年》等进步书刊影响，立志投考军校。1924年，黄埔军校创立，他经于右任推荐，与同乡关麟征等人赴广州，考入黄埔军校第一期，被编入第三队。在校期间接受严格军事训练，奠定其日后职业军官生涯的基础。\n1925年，杜聿明自黄埔一期毕业，随即参加北伐战争，任教导第一团第一营第三连见习官兼军需上士。后在作战中历任排长、连长等职，于东征、北伐诸役中经受实战历练。1927年，他入张治中任团长的中央陆军军官学校武汉分校学兵团，任第一营第三连连长，后升任少校营长。\n1929年，他任南京中央陆军军官学校第七期第四队中校队长。同年，任新编第一师第二旅参谋主任。1930年，他随部参加中原大战，任教导第二师第一旅第二团第一营中校营长。在河南杞县作战中，他率部与阎锡山部激战，因表现突出，战后升任该师第二旅第五团中校团长。至1930年底，作为黄埔一期毕业生，杜聿明已具备一定的实战指挥经验，开始在国民党中央军中崭露头角。"
PRC_YeTing: "叶挺"
PRC_YeTing_leader_desc: "§Y$PRC_YeTing_birth_info$\n§Y背景：§!§L$PRC_YeTing_bio$\n\n"
PRC_YeTing_birth_info: "生于：§!§L1896年；广东惠州§!"
PRC_YeTing_bio: "叶挺，原名叶为询，字希夷。启蒙老师为其改名“挺”，寓有“人要上行、叶要上挺”，挺身而出、拯救中华之意。他先后就读于广东陆军小学、湖北陆军第二预备学校和河北保定陆军军官学校，接受了系统的军事教育。\n1919年，叶挺投身孙中山领导的民主革命，在粤军中任职。1922年，粤军总司令陈炯明叛变，围攻总统府时，时任警卫团第二营营长的叶挺奉命守卫总统府前院，掩护孙夫人宋庆龄脱险。1924年，叶挺赴苏联学习，先后入莫斯科东方劳动者共产主义大学和红军学校中国班，并于同年加入中国共产主义青年团，12月转入中国共产党。\n1925年回国后，叶挺前往广州，任国民革命军第四军参谋处长，后改任独立团团长。1926年北伐战争开始，他率独立团作为先遣队，讨伐军阀吴佩孚。在汀泗桥、贺胜桥等战役中，叶挺独立团英勇善战，所向披靡，为第四军赢得了“铁军”的威名，叶挺本人也被誉为“北伐名将”。北伐军占领武汉后，他升任第十一军第二十四师师长。\n1927年，在革命危急关头，叶挺先后参与领导了南昌起义与广州起义。在南昌起义中，他担任前敌总指挥。同年12月的广州起义中，他被任命为工农红军总司令。两次起义失败后，叶挺离开中国，漂泊海外。"
NAC_Headquarters: "华北军事委员会"
CHI_WangJingWei: "汪精卫"
ROG_WangJingWei: "汪精卫"
JDF_WangJingWei: "汪精卫"
CHI_WangJingWei_leader_desc: "§Y$CHI_WangJingWei_birth_info$\n§Y背景：§!§L$CHI_WangJingWei_bio$\n\n“革命的向左来，不革命的走开去。”"
CHI_WangJingWei_birth_info: "生于：§!§L1883年5月4日；广东三水§!"
CHI_WangJingWei_bio: "汪精卫，名兆铭，字季新，笔名精卫。早年留学日本法政大学，1905年参与创立中国同盟会，成为孙中山重要助手，以文采与辩才著称。1910年因谋刺清摄政王载沣被捕，狱中诗作“引刀成一快，不负少年头”传诵一时。辛亥革命后，他一度主张与袁世凯妥协，后随孙中山南下护法。1924年国民党改组，汪精卫坚决拥护联俄容共政策，在国民党一大上当选中央执行委员，成为党内左派领袖。1925年孙中山逝世后，汪精卫被推举为广州国民政府主席兼军事委员会主席，成为最高领导人。1926年中山舰事件后，其地位受到蒋介石挑战。1927年初，他领导武汉国民政府，坚持国共合作，与南京的蒋介石分庭抗礼，史称“宁汉分裂”。同年7月，武汉方面亦决定分共，宁汉合流。此后他在与蒋介石的党内斗争中几经起伏。1930年，汪精卫联合阎锡山、冯玉祥等地方实力派，在北平召开“扩大会议”，另立国民政府，与蒋介石的南京政府抗衡，直至中原大战失败。"
CHI_LingSeng: "林森"
CHI_LingSeng_leader_desc: "§Y$CHI_LingSeng_birth_info$\n§Y背景：§!§L$CHI_LingSeng_bio$\n\n“开国之功不可没，守成之德尤足珍。”"
CHI_LingSeng_birth_info: "生于：§!§L1867年；福建闽侯§!"
CHI_LingSeng_bio: "林森，字子超，号长仁。早年考入台湾中西学堂电科，后赴上海江海关任职。1898年，因参与割台抗议活动被革职，遂投身革命。1905年，他在上海加入中国同盟会，成为早期会员。\n1911年辛亥革命爆发后，林森在九江策动新军起义，被推举为九江军政府民政长。他主持九江军政，并策动海军反正，为革命军控制长江中游做出贡献。同年，他作为江西省代表，参与制订《中华民国临时政府组织大纲》。1912年，当选为南京临时参议院议长。\n1913年，袁世凯解散国会后，林森东渡日本，加入中华革命党，继续追随孙中山从事反袁斗争。此后，他长期在海外华侨中为革命筹款。1921年，他担任广州非常国会参议院议长。1922年，陈炯明叛变时，他拥护孙中山，负责联络海军讨逆。\n1924年，在国民党第一次全国代表大会上，林森当选为中央执行委员。但他对孙中山的“联俄、容共”政策持保留态度，思想趋于保守。1925年孙中山逝世后，林森与邹鲁、谢持等人在北京西山碧云寺孙中山灵前召开“国民党一届四中全会”（即西山会议），公开反对国共合作，成为“西山会议派”的主要代表人物之一。\n1927年宁汉合流后，西山会议派与蒋介石集团达成妥协。1928年，林森出任国民政府委员、立法院副院长。至1930年，他已是一位资历深厚、德望颇高的国民党元老，在调和党内各派系方面发挥着独特作用，为其日后出任国民政府主席奠定了基础。"
CHI_CaiTingKai: "蔡廷锴"
CHI_CaiTingKai_leader_desc: "§Y$CHI_CaiTingKai_birth_info$\n§Y背景：§!§L$CHI_CaiTingKai_bio$\n\n"
CHI_CaiTingKai_birth_info: "生于：§!§L1892年4月15日；广东罗定§!"
CHI_CaiTingKai_bio: "蔡廷锴，字贤初，广东罗定人。出身贫苦农家，早年曾学习裁缝。1910年投身新军，开始了军旅生涯。他曾多次投军，1918年在李耀汉的肇军陈铭枢营中任排长。1919年肇军解体后，他随部转入护国军，并获选进入护国第二军陆军讲武堂学习。后毕业于保定陆军军官学校。\n1922年，已升任粤军第一师连长的蔡廷锴，由陈铭枢介绍加入中国国民党。同年，他参加孙中山领导的第一次北伐，在江西信丰作战勇猛，被记功一次。1924年，他效力于孙中山大本营补充团。在1925年的第一次东征及平定广州刘震寰、杨希闵叛乱的战斗中，均有他的参与。\n1926年北伐开始后，蔡廷锴升任国民革命军第四军第十师第二十八团上校团长。在攻克武昌的战斗中，他率领的团率先攻入宾阳门。随后因功升任第十一军第二十四师副师长。1927年宁汉分裂期间，他任第十师师长。同年，他一度率部参加南昌起义，但不久后脱离起义队伍。1928年，他曾奉调海南岛。\n1930年，中原大战爆发，蔡廷锴率部助蒋介石作战。因战功卓著，蒋介石将蔡廷锴与蒋光鼐的部队扩编为第十九路军，任命蒋光鼐为总指挥，蔡廷锴为第十九路军军长。至此，蔡廷锴成为这支以广东子弟兵为主、日后以淞沪抗战闻名全国的军队的最高指挥官之一。"
CHI_JiangGuangDing: "蒋光鼐"
CHI_JiangGuangDing_leader_desc: "§Y$CHI_JiangGuangDing_birth_info$\n§Y背景：§!§L$CHI_JiangGuangDing_bio$\n\n"
CHI_JiangGuangDing_birth_info: "生于：§!§L1888年12月17日；广东东莞§!"
CHI_JiangGuangDing_bio: "蒋光鼐，字憬然，广东东莞人，出身书香世家。1906年考入黄埔广东陆军小学，在校期间经陈铭枢介绍加入中国同盟会。1911年武昌起义爆发后，他作为学生军敢死队员奔赴武昌，投身辛亥革命。1912年因军功被选送保定陆军军官学校深造。1913年“二次革命”时，他离校赴江西参加李烈钧领导的湖口起义，讨伐袁世凯，失败后流亡日本。\n1916年回国后，蒋光鼐投身护国运动，后追随孙中山先生。他曾任大元帅府警卫营连长、参谋等职。1922年陈炯明叛变炮击总统府时，他率部参加了保卫总统府的战斗。\n1926年北伐开始后，蒋光鼐任国民革命军第四军第十师副师长、师长等职，参与北伐，其所在第四军被誉为“铁军”。1930年中原大战期间，他率部作战，立下战功。战后，蒋介石为嘉奖其功绩，将蒋光鼐与蔡廷锴的部队合编为国民革命军第十九路军，任命蒋光鼐为总指挥。至1930年，他已成为这支以骁勇善战著称的广东子弟兵部队的最高指挥官。"
CHI_Alexander_von_Falkenhausen: "亚历山大·冯·法肯豪森"
CHI_Alexander_von_Falkenhausen_leader_desc: "§Y$CHI_Alexander_von_Falkenhausen_birth_info$\n§Y背景：§!§L$CHI_Alexander_von_Falkenhausen_bio$\n\n"
CHI_Alexander_von_Falkenhausen_birth_info: "生于：§!§L1878年10月29日；德国西里西亚省布鲁门塔尔（亦载奥尔登堡）§!"
CHI_Alexander_von_Falkenhausen_bio: "亚历山大·冯·法肯豪森，全名亚历山大·恩斯特·阿尔弗雷德·赫尔曼·冯·法肯豪森男爵，出生于普鲁士贵族家庭。1897年自军官学校毕业后，进入陆军服役。1900年，他曾以德军中尉身份参加八国联军，随联军入侵中国。1909年后，他进入参谋本部工作，并于1912年被派往日本担任德国驻日使馆武官。这段经历使他对日本军队进行了细致的观察和研究。第一次世界大战期间，他在奥斯曼土耳其军队中服役。战后，他于1927年成为德累斯顿步兵学校的校长。1930年，法肯豪森从德国陆军退役。至1930年底，其作为一位拥有东方经验、特别是通晓日本情况的普鲁士职业军人，其未来与中国的交集已隐约可见。"
LZN_LiuZhenNian: "刘珍年"
LZN_LiuZhenNian_leader_desc: "§Y$LZN_LiuZhenNian_birth_info$\n§Y背景：§!§L$LZN_LiuZhenNian_bio$\n\n"
LZN_LiuZhenNian_birth_info: "生于：§!§L1898年（另有1897年说）；河北南宫§!"
LZN_LiuZhenNian_bio: "刘珍年，字儒席。1918年考入保定陆军军官学校第八期步兵科，1922年毕业。初入奉军李景林部，1924年第二次直奉战争中因迫击炮战术运用出色而崭露头角，升任营长。1925年李景林部被冯玉祥击败后，他转投直鲁联军，先后依附褚玉璞、张宗昌，历任旅长、参谋长等职。\n1928年春，国民革命军二次北伐，张宗昌兵败北撤。刘珍年奉命率残部退至胶东掖县，随后逼走上司方永昌，收编各部，自立门户。他审时度势，改旗易帜，投向蒋介石，被任命为国民革命军暂编第一军军长，于同年8月进驻烟台，由此开始割据胶东十余县。\n1929年，南京政府将其部缩编为新编第三师（后改称陆军第二十一师），刘珍年任师长。他对此不满，常自封“第十七军”军长。为巩固统治，他自办“芝罘陆军军官学校”培养军官，强化军队控制，并在辖区内自行委任官吏、征收税赋。至1930年中原大战时，他周旋于蒋、阎之间，接受双方任命以图自保，已成为名副其实、军政自专的“胶东王”。"
JDF_YingRuGeng: "殷汝耕"
JDF_YingRuGeng_leader_desc: "§Y$JDF_YingRuGeng_birth_info$\n§Y背景：§!§L$JDF_YingRuGeng_bio$\n\n"
JDF_YingRuGeng_birth_info: "生于：§!§L1889年；浙江平阳§!"
JDF_YingRuGeng_bio: "殷汝耕，字亦农。1905年赴日本留学，先后就读于东京高等师范学校、第一高等学校及第七高等学校。1913年考入东京帝国大学法科政治系，毕业后继续在早稻田大学深造。在日本期间，他不仅掌握了流利的日语，更深受日本政治文化影响，娶日籍女子为妻，与日本军政界建立了广泛联系。\n1916年回国后，殷汝耕在北京政府中任职，并长期参与对日外交事务。他曾任北京政府宪法起草委员会委员、众议院秘书等职。1925年，郭松龄起兵反奉时，他作为郭的日文秘书随行，负责与日本方面的联络。郭兵败被杀后，他逃入日本驻新民县领事馆，得日人庇护而幸免。\n1927年南京国民政府成立后，殷汝耕转而投靠蒋介石。因其精通日语且熟悉日本情势，被任命为国民政府驻日本代表，负责对日交涉。此后，他历任上海特别市政府参事、外交部特派员等职，常以‘日本通’身份参与处理对日事务。至1930年，他已积累相当的对日外交经验与人脉，但其政治立场中的亲日倾向与投机性格亦日益显露。"
JDW_SongZheYuan: "宋哲元"
JDW_SongZheYuan_leader_desc: "§Y$JDW_SongZheYuan_birth_info$\n§Y背景：§!§L$JDW_SongZheYuan_bio$\n\n"
JDW_SongZheYuan_birth_info: "生于：§!§L1885年10月30日；山东乐陵§!"
JDW_SongZheYuan_bio: "宋哲元，字明轩，山东乐陵人。1907年考入北京武卫右军随营武备学堂，毕业后入北洋陆军第六镇见习。1913年，他被编入冯玉祥的部队，历任连长、营长、团长等职，因练兵有方、作战勇猛而深得冯玉祥赏识，成为西北军“五虎将”之一。1924年第二次直奉战争期间，冯玉祥发动北京政变，宋哲元因功升任国民军第一军第十一师师长。1926年，他率部与直奉联军激战于南口，阻击敌军达四个月之久。\n1927年，冯玉祥部改编为国民革命军第二集团军，宋哲元任第四方面军总指挥兼陕西省主席，主持陕政。他肃清匪患，整顿吏治，并一度推行反共政策。1929年至1930年中原大战期间，他任冯玉祥部第四路军总指挥，率部在河南一带与蒋介石的中央军作战。1930年9月，随着张学良东北军入关支持蒋介石，反蒋联军战败，西北军瓦解。宋哲元收容西北军残部，被蒋介石改编为国民革命军第二十九军，他出任军长，驻防山西。至此，他成为一支以西北军旧部为核心、具有相对独立性的地方军事力量的首领。"
RON_HeJian: "何健"
RON_HeJian_leader_desc: "§Y$RON_HeJian_birth_info$\n§Y背景：§!§L$RON_HeJian_bio$\n\n"
RON_HeJian_birth_info: "生于：§!§L1887年3月11日；湖南醴陵§!"
RON_HeJian_bio: "何健，字芸樵，湖南醴陵人。早年毕业于湖南法政学堂，后弃文从武，于1916年考入保定陆军军官学校第三期步兵科，毕业后回湖南湘军服役。在湘军中，他凭借战功与手腕，由连长、营长逐步升至旅长。\n1926年，湖南唐生智部改编为国民革命军第八军参加北伐，何健任该军第二师师长。北伐期间，他率部在湖北、河南等地作战。1927年春，任第三十五军军长。1927年5月，在其部驻防武汉时，他部下团长许克祥受其影响，发动“马日事变”，大肆捕杀共产党人与工农群众，此举成为何健公开反共的起点。\n1928年，何健依附桂系，任湖南省政府委员兼清乡督办，厉行“清乡剿共”。1929年蒋桂战争后，他转而投靠蒋介石，被任命为湖南省政府主席兼第四路军总指挥，正式主政湖南。主政后，他一方面继续全力清剿省内红军，另一方面推行“尊孔读经”，提倡旧道德，以配合其政治统治。至1930年，他已完全掌控湖南军政大权，成为国民党内重要的地方实力派人物。"
CHI_ChenCheng: "陈诚"
CHI_ChenCheng_leader_desc: "§Y$CHI_ChenCheng_birth_info$\n§Y背景：§!§L$CHI_ChenCheng_bio$\n\n"
CHI_ChenCheng_birth_info: "生于：§!§L1898年1月4日；浙江青田§!"
CHI_ChenCheng_bio: "陈诚，字辞修。1919年考入保定陆军军官学校第八期炮兵科，1922年毕业后，南下广东，先后在粤军及建国粤军中担任军职。1924年黄埔军校建立，他受邓演达等人推荐入校，出任炮兵科教官兼炮兵队区队长。在1925年的第一次东征棉湖战役中，他指挥的炮兵发挥关键作用，战后得到蒋介石的赏识与提拔，从此被视为蒋的嫡系亲信。\n北伐期间，他先后担任国民革命军总司令部中校参谋、第二十一师第六十三团上校团长等职。1927年，他率部在浙江龙游、江苏徐州等地作战，以纪律严明和战斗力强著称。1928年北伐完成后，他出任南京警备司令、第十一师副师长等职，致力于部队的整训与建设。\n1929年至1930年，在蒋介石与地方军阀的一系列内战中，陈诚的军事才能得到进一步施展。他先后率部参与蒋桂战争、蒋唐战争。1930年中原大战期间，他任第十一师师长，在关键战役中表现突出，尤其是在击溃阎锡山部的战斗中建有功勋，其部队以善战且损耗小而闻名，战后因功晋升第十八军军长，由此开始组建其核心军事集团，成为蒋介石麾下迅速崛起的年轻将领代表。"
CHI_YangYongTai: "杨永泰"
CHI_YangYongTai_leader_desc: "§Y$CHI_YangYongTai_birth_info$\n§Y背景：§!§L$CHI_YangYongTai_bio$\n\n"
CHI_YangYongTai_birth_info: "生于：§!§L1880年；广东茂名§!"
CHI_YangYongTai_bio: "杨永泰，字畅卿。清末秀才出身，后就读于北京法政专门学校。早年加入中国同盟会，参与革命。1912年中华民国成立后，当选为第一届国会参议员，成为国民党内的重要成员。他长期研究中外政治制度与权谋策略，为国民党内公认的“才子”与谋士。\n1917年，孙中山在广州成立护法军政府，杨永泰南下参与，先后担任军政府财政厅长、广东省财政厅长等要职。1922年陈炯明叛变后，他随孙中山退居上海，成为孙的重要幕僚之一。\n1928年北伐完成后，杨永泰凭借其政治谋略，逐渐得到蒋介石的赏识。1930年中原大战期间，他向蒋提出“军事化整为零，政治化零为整”的策略，建议以政治分化瓦解对手，获得采纳。战后，他成为蒋介石身边的核心幕僚，正式进入蒋的决策圈。至1930年底，他已被视为蒋介石的“首席智囊”，其提出的“三分军事，七分政治”主张，即将成为日后蒋应对国内问题（特别是对中共苏区围剿）的重要指导方针。"
CHI_ChenGuoFu: "陈果夫"
CHI_ChenGuoFu_leader_desc: "§Y$CHI_ChenGuoFu_birth_info$\n§Y背景：§!§L$CHI_ChenGuoFu_bio$\n\n"
CHI_ChenGuoFu_birth_info: "生于：§!§L1892年10月27日；浙江吴兴§!"
CHI_ChenGuoFu_bio: "陈果夫，名祖焘，字果夫。其叔父陈其美是辛亥革命元勋，与蒋介石为结拜兄弟。受家族影响，陈果夫早年便接触革命思想，1911年加入中国同盟会。辛亥革命爆发后，他曾赴武汉参加革命军。后因身体原因，转向学习金融与经济。1918年后在上海从事证券交易与金融活动，为孙中山的革命事业筹措经费，并在此过程中展现了其组织与理财才能。\n1924年黄埔军校成立后，他应蒋介石之邀赴广州，负责为军校采购物资与经费管理，成为蒋在党务与后勤方面的得力助手。1926年，他当选为国民党第二届中央监察委员，开始深入参与国民党中央党务。在1927年“四一二”政变前后，陈果夫与其弟陈立夫积极协助蒋介石策划“清党”，并利用其控制的“中央组织部党务调查科”及各地党部，进行人员审查与情报搜集，为清除党内异己与共产党人提供组织支持。\n南京国民政府成立后，陈果夫历任国民党中央组织部副部长、代理部长等要职，主导国民党各级党部的重建与人事安排，大力培植亲蒋势力。他与陈立夫共同建立了一套以“青天白日团”和“中国国民党忠实同志会”为核心的组织体系，形成了党内重要的派系“CC系”。至1930年，陈果夫已掌控国民党党务组织系统，并通过主持中央政治学校培养干部，影响力扩展至文化宣传、教育及特务领域，成为蒋介石在政治与党务上最为倚重的人物之一。"
CHI_HeYingQing: "何应钦"
CHI_HeYingQing_leader_desc: "§Y$CHI_HeYingQing_birth_info$\n§Y背景：§!§L$CHI_HeYingQing_bio$\n\n"
CHI_HeYingQing_birth_info: "生于：§!§L1890年4月2日；贵州兴义§!"
CHI_HeYingQing_bio: "何应钦，字敬之。早年就读于武昌陆军第三中学，1909年被选送日本留学，先入振武学校，后升入日本陆军士官学校第二十二期步兵科，在此期间加入中国同盟会。1911年辛亥革命爆发后，他中断学业回国，参加上海光复之役。二次革命失败后，他返回日本完成学业，并于1916年回国，赴贵州投身军界，逐渐崭露头角。\n1924年，蒋介石筹建黄埔军校，何应钦因日本士官学校背景及在黔军中的练兵经验，被任命为少将总教官，不久后接任军校教导团团长，成为蒋介石在军事上的重要助手。在两次东征中，他指挥教导第一团作战，特别是在棉湖战役中以寡敌众，战果显著，奠定其黄埔系核心将领地位。1926年北伐开始，何应钦任国民革命军第一军军长，率东路军由广东进军福建、浙江，克复福州、杭州，最终于1927年3月进驻上海。\n1927年，他积极参与蒋介石“清党”，并历任浙江省政府主席、国民革命军参谋长等要职。1928年北伐完成后，他先后担任国民政府委员、训练总监部总监。1929年至1930年间，在蒋桂战争、蒋冯战争及中原大战中，他作为蒋介石的主要军事副手，坐镇武汉或南京，统筹后方军政，为蒋介石最终确立军事优势贡献颇多，被视为国民党内地位仅次于蒋介石的军事领袖之一。"
CHI_TangShengZhi: "唐生智"
CHI_TangShengZhi_leader_desc: "§Y$CHI_TangShengZhi_birth_info$\n§Y背景：§!§L$CHI_TangShengZhi_bio$\n\n"
CHI_TangShengZhi_birth_info: "生于：§!§L1889年10月12日；湖南东安§!"
CHI_TangShengZhi_bio: "唐生智，字孟潇。早年就读于湖南陆军小学，后升入武昌陆军第三中学。1909年考入保定陆军军官学校第一期步兵科，毕业后分发至湖南陆军混成旅任职。受革命思想影响，加入中国同盟会，曾参与辛亥革命及后续的护国战争，在湘军中渐露头角，由连长、营长累升至湘军第四师师长，成为湖南地方实力派的重要人物。\n1926年，广东国民政府誓师北伐，唐生智审时度势，宣布加入国民革命军，所部改编为第八军，他任军长兼前敌总指挥，指挥西路军进军湖南、湖北。在汀泗桥、贺胜桥及攻克武昌等关键战役中，其部队发挥了重要作用，势力因此迅速膨胀，控制了湖南、湖北大部地区。\n1927年，武汉国民政府与南京蒋介石政权之间发生“宁汉分裂”。唐生智站在武汉一方，被任命为第四方面军总指挥，继续北伐进入河南，与奉军作战。同年下半年，宁汉合流，但因权力争夺，唐生智与南京方面关系恶化，被指为“叛变”，遭李宗仁、程潜等部西征讨伐。其部战败后，唐生智于11月通电下野，流亡日本。\n1929年，经疏通后回国，被蒋介石重新起用，任命为国民政府军事参议院院长、第五路军总指挥，参与蒋桂战争。但其与蒋介石的合作基础脆弱。1930年中原大战爆发，唐生智最初持观望态度，后接受汪精卫改组派任命，于12月在郑州通电反蒋，就任“护党救国军”第四路总司令，但其举兵未获广泛响应。"
CHI_XueYue: "薛岳"
CHI_XueYue_leader_desc: "§Y$CHI_XueYue_birth_info$\n§Y背景：§!§L$CHI_XueYue_bio$\n\n"
CHI_XueYue_birth_info: "生于：§!§L1896年12月27日；广东韶关§!"
CHI_XueYue_bio: "薛岳，字伯陵，广东韶关人。1914年考入武昌陆军第二预备学校，1916年转入保定陆军军官学校第六期步兵科。1918年毕业后南下广东，参加孙中山领导的革命军，任粤军第一师机关枪营营附。1921年任孙中山大元帅府警卫团第一营营长，曾参与击退陈炯明叛军进攻总统府的战斗，护卫宋庆龄脱险。\n1924年，薛岳任粤军第一师少校参谋，次年升任第一军第十四师副师长兼团长，参加第一次东征讨伐陈炯明。1926年北伐开始，他任第一军第一师副师长兼第三团团长，率部参加南昌、杭州等战役。1927年，他支持蒋介石“清党”，任新编第二师师长，在潮汕地区阻击南昌起义部队。1928年任第四军副军长，参加二期北伐。\n1930年中原大战爆发，薛岳任第一军第一师师长，在陇海线战场与冯玉祥部激战。他指挥果断，作战勇猛，在杞县、兰封等地屡挫敌军，战后升任第五军军长，成为蒋介石中央军嫡系将领中的重要成员。"
YHC_YangHuCheng: "杨虎城"
YHC_YangHuCheng_leader_desc: "§Y$CHI_YangHuCheng_birth_info$\n§Y背景：§!§L$CHI_YangHuCheng_bio$\n\n"
YHC_YangHuCheng_birth_info: "生于：§!§L1893年11月26日；陕西蒲城§!"
YHC_YangHuCheng_bio: "杨虎城，名虎，字虎城。早年因家贫投身江湖，辛亥革命爆发时，率当地青年组成民团，参加陕西反清起义，隶属秦陇复汉军。后回乡组织农民抗暴，逐渐发展成为地方武装首领。1915年，袁世凯称帝，杨虎城率部参加陕西护国军，投身讨袁战争。1917年，响应孙中山护法号召，其所部被编为陕西靖国军第三路第一支队，转战渭北，成为靖国军的重要力量。\n1922年，靖国军大部瓦解或接受直系改编，杨虎城拒绝收编，率部退入陕北榆林地区休整，依托并州镇守使井岳秀庇护以保存实力。在此期间，他结识进步人士杜斌丞及共产党人魏野畴，思想受到一定影响。1924年，国民党一大召开，国共合作形成，杨虎城加入中国国民党。\n1926年，北洋军阀刘镇华率镇嵩军围攻西安，杨虎城应陕西军务督办李云龙之邀，率部驰援，共同坚守西安长达八个月，直至冯玉祥国民军联军解围，此战使其声名大振。战后，所部改编为国民军联军第十军，杨虎城任军长，正式加入冯玉祥西北军系统，并于1927年东出潼关，参加北伐，在豫东、鲁南地区与直鲁联军作战。\n1929年，蒋冯关系破裂，杨虎城所部随冯玉祥反蒋。但不久后，因西北军内部矛盾及补给困难，杨虎城权衡利弊，于1929年底在河南南阳地区脱离冯玉祥，接受南京国民政府改编，任新编第十四师师长。1930年中原大战爆发，杨虎城部被蒋介石任命为讨逆军第十七路军总指挥，于豫西对冯玉祥、阎锡山联军作战。他抓住战机，率部奇袭洛阳，并乘胜西进，于10月抢先占领潼关，进入陕西。战后，蒋介石论功行赏，任命杨虎城为陕西省政府主席兼西安绥靖公署主任，使其最终确立了在陕西的统治地位。"
YUL_JingYueXiu: "井岳秀"
YUL_JingYueXiu_leader_desc: "§Y$YUL_JingYueXiu_birth_info$\n§Y背景：§!§L$YUL_JingYueXiu_bio$\n\n"
YUL_JingYueXiu_birth_info: "生于：§!§L1879年9月6日；陕西蒲城§!"
YUL_JingYueXiu_bio: "井岳秀，字崧生，排行第十，人称“井十”。其胞弟井勿幕为同盟会陕西支部长。1906年，受井勿幕影响加入中国同盟会，投身反清革命。1911年辛亥革命爆发后，他在西安参加起义，并赴渭北督办民团，由此掌握兵权。\n1913年，外蒙在沙俄策动下独立并煽动内蒙时，井岳秀正率部在榆林。他应伊克昭盟王公之邀，力陈外附之“七不可”，成功说服各旗王公维护国家统一，使沙俄阴谋未能得逞。1916年他升任步兵团长，次年（1917年）被任命为陕北镇守使，开始了其对陕北长达二十年的统治。\n1922年，陕西靖国军杨虎城部兵败退入陕北，井岳秀不顾北洋政府通缉令，予以收容和保护，二人结下深厚情谊。1923年，他被直系军阀吴佩孚改编为陕西陆军第一师，任西北路联军总司令，并受赐“岳威将军”名号。他周旋于各方势力之间，以“保境安民”为旗号，致力于巩固其在陕北的割据地位。\n1927年，随着国共合作破裂，井岳秀公开投向南京国民政府，并开始积极反共，镇压了清涧起义等多起革命活动。1930年中原大战期间，他再次施展其“事大政策”，保持中立以保存实力。待胜负渐明时，他赴南昌谒见蒋介石表示效忠，被蒋授予陆军第八十六师师长之职。至1930年底，他已成为陕北地区说一不二的“榆林王”或“土皇帝”，其统治根基深植于地方，且与中央政权保持着一种基于现实利益的松散隶属关系。"
YUL_GaoShuangCheng: "高双成"
YUL_GaoShuangCheng_leader_desc: "§Y$YUL_GaoShuangChengg_birth_info$\n§Y背景：§!§L$YUL_GaoShuangChengg_bio$\n\n"
YUL_GaoShuangChengg_birth_info: "生于：§!§L1882年（一说1881年）；陕西渭南§!"
YUL_GaoShuangChengg_bio: "高双成，字立卿，陕西渭南人。早年投身行伍，与井岳秀结交，成为其心腹部将。1911年辛亥革命爆发时，他在井岳秀麾下参与陕西起义。1917年井岳秀出任陕北镇守使后，高双成随之赴榆林，成为井部核心军官之一，长期在陕北镇守使公署任职，历任营长、团长等职。\n1927年，井岳秀转向反共后，高双成作为其得力干将，积极参与镇压清涧起义等针对中共地下组织的军事行动。1930年中原大战期间，当井岳秀为向蒋介石表示“效忠”姿态而决定出兵山西时，高双成被委以重任，率部东渡黄河，攻击阎锡山晋军。此战虽规模有限，但使其在实战中得到进一步锻炼。至1930年底，作为井岳秀军事体系中的重要支柱，高双成已是陕北地方武装中一位资深且可靠的将领，其个人命运与井岳秀集团紧密相连。"
CHI_WeiLiHuang: "卫立煌"
CHI_WeiLiHuang_leader_desc: "§Y$CHI_WeiLiHuang_birth_info$\n§Y背景：§!§L$CHI_WeiLiHuang_bio$\n\n"
CHI_WeiLiHuang_birth_info: "生于：§!§L1897年2月16日；安徽合肥§!"
CHI_WeiLiHuang_bio: "卫立煌，字俊如。1912年在安徽和县革命军当兵，1914年入湖南都督汤芗铭部学兵营，毕业后在上海参加“肇和”舰起义反对袁世凯。1915年到广州投粤军，1917年在广州中华民国军政府警卫团任排长，后转粤军任连、营长。因其机灵能干，在孙中山的广州大本营担任警卫，由一名普通士兵逐步提升为中级军官。\n1925年，任国民革命军第1军第3师第9团团长，曾参加孙中山领导的北伐、镇压广州商团叛乱和东征陈炯明的作战。1926年参加北伐战争，入闽作战，升任国民革命军第一军第14师师长。1927年10月任国民党军第9军副军长。\n1928年任南京卫戍副司令，后入陆军大学校将官特别班进修。1930年，奉蒋介石之命在蚌埠组建第四十五师，并任第十四军军长。此时，他已成长为蒋介石中央军嫡系部队中一位以善打硬仗闻名的将领。"
SJN_FuZuoYi: "傅作义"
SJN_FuZuoYi_leader_desc: "§Y$SJN_FuZuoYi_birth_info$\n§Y背景：§!§L$SJN_FuZuoYi_bio$\n\n"
SJN_FuZuoYi_birth_info: "生于：§!§L1895年6月27日；山西荣河（今临猗）§!"
SJN_FuZuoYi_bio: "傅作义，字宜生。1910年考入太原陆军小学，1915年升入保定陆军军官学校第五期步兵科，1918年毕业。他投身于阎锡山的晋军系统，因才干出众而逐步擢升，历任排长、连长、营长、团长等职，在晋军内部以善于练兵和防守著称。\n1927年，北伐军与奉系军阀交战期间，傅作义率其晋军第四师固守河北涿州。面对张学良率领的优势奉军，他凭借坚固城防与灵活战术，坚守涿州达三个月之久，由此一战成名，获得了“守城名将”的声誉。\n1928年北伐结束后，傅作义出任天津警备司令。1930年中原大战爆发，他担任阎锡山反蒋联军第四路军指挥官，率部参加津浦线方面的作战。中原大战以反蒋联军失败告终后，其部队被张学良收编改编。"
CHI_QianDaJun: "钱大钧"
CHI_QianDaJun_leader_desc: "§Y$CHI_QianDaJun_birth_info$\n§Y背景：§!§L$CHI_QianDaJun_bio$\n\n"
CHI_QianDaJun_birth_info: "生于：§!§L1893年7月26日；江苏吴县（今属苏州）§!"
CHI_QianDaJun_bio: "钱大钧，字慕尹。早年毕业于江苏陆军小学，后升入保定陆军军官学校。1914年，被选送日本陆军士官学校中国学生队第十二期炮兵科深造。1919年回国后，于1921年南下广东，投身孙中山领导的革命政府。\n1924年黄埔军校成立，钱大钧受蒋介石邀请出任军校中校兵器教官，后代理上校总教官。他精通炮兵理论与操典，为黄埔早期军事教育的重要参与者。北伐期间，他担任过国民革命军第一军参谋长、第一师师长等职，参与了攻克南昌等战役。\n1928年北伐完成后，钱大钧出任上海警备司令。1929年，他当选为国民党中央执行委员，并调任总司令部总参议。至1930年，他已成为蒋介石身边掌管机要、协调军事的重要幕僚长之一，因其忠诚与谨慎细致而深受蒋的信任。"
CHI_SunLiRen: "孙立人"
CHI_SunLiRen_leader_desc: "§Y$CHI_SunLiRen_birth_info$\n§Y背景：§!§L$CHI_SunLiRen_bio$\n\n"
CHI_SunLiRen_birth_info: "生于：§!§L1900年12月8日；安徽庐江§!"
CHI_SunLiRen_bio: "孙立人，字抚民，号仲能。1914年考入清华学校，在校期间成绩优异，并擅长篮球等体育运动。1923年从清华毕业后，考取官费留美资格。他先入普渡大学攻读土木工程学，于1925年获学士学位。有感于国家积弱，他决意弃工从戎，考入有“南方西点”之称的弗吉尼亚军事学院，接受严格的军事教育。\n1927年，孙立人从弗吉尼亚军事学院毕业，游历欧洲考察军事后于次年回国。1928年，他进入南京国民党中央党务学校（后改称中央政治学校）任学生大队军事训练队长。1930年，经财政部长宋子文推荐，他被任命为陆海军总司令部侍卫总队副总队长，开始其军事生涯。至1930年底，这位兼具中西教育背景的年轻军官，正以其独特的专业素养，在军中崭露头角。"
CHI_ZhuSaoLiang: "朱绍良"
CHI_ZhuSaoLiang_leader_desc: "§Y$CHI_ZhuSaoLiang_birth_info$\n§Y背景：§!§L$CHI_ZhuSaoLiang_bio$\n\n"
CHI_ZhuSaoLiang_birth_info: "生于：§!§L1891年；江苏武进§!"
CHI_ZhuSaoLiang_bio: "朱绍良，字一民，江苏武进人。早年入南京陆军第四中学，后考入保定陆军军官学校第三期炮兵科。1916年毕业后，在浙江陆军第一师任排长、连长。1924年南下广东，任粤军第一师参谋长。1925年任国民革命军第四军第十师参谋长，参加第二次东征。1926年北伐开始，他任第一军参谋长，随军转战福建、浙江。\n1927年，朱绍良任国民革命军总司令部办公厅主任，成为蒋介石的重要幕僚。1928年北伐完成后，任第八师师长，驻防江苏。1929年蒋桂战争中，他率部在武汉地区作战。1930年中原大战期间，朱绍良任第二军团总指挥，在陇海线战场与冯玉祥部作战。他指挥稳健，部队纪律严明，战后因功升任第六路军总指挥。\n朱绍良为人谨慎，善于协调人际关系，在国民党军界人脉广泛。他重视军事教育，曾兼任中央陆军军官学校武汉分校教育长。至1930年底，他已成为蒋介石中央军系统中资历较深、能独当一面的高级将领。"
CHI_DaiAnLan: "戴安澜"
CHI_DaiAnLan_leader_desc: "§Y$CHI_DaiAnLan_birth_info$\n§Y背景：§!§L$CHI_DaiAnLan_bio$\n\n"
CHI_DaiAnLan_birth_info: "生于：§!§L1904年11月25日；安徽无为§!"
CHI_DaiAnLan_bio: "戴安澜，字衍功，号海鸥，安徽无为人。1922年考入安徽公学高中部。1924年考入黄埔军校第三期步兵科，在校期间学习刻苦，成绩优异。1926年毕业后，任国民革命军总司令部排长，参加北伐，在汀泗桥、贺胜桥等战斗中作战勇敢，升任连长。\n1927年，戴安澜任第一军第二师第九团连长，在龙潭战役中负伤。1928年伤愈后，入中央陆军军官学校军官团深造。1929年蒋桂战争中，他任第二师营长，在湖北作战。1930年中原大战时，戴安澜任第二师第九团团长，在陇海线战场与冯玉祥部激战。在兰封战役中，他率团坚守阵地，击退敌军多次进攻，因功获嘉奖。\n戴安澜治军严格，注重官兵教育，常亲自授课。他生活俭朴，与士兵同甘共苦，在部队中威望较高。至1930年底，这位年仅26岁的团长已成为黄埔系青年军官中的佼佼者，显示出出色的军事指挥才能。"
CHI_ChengQian: "程潜"
CHI_ChengQian_leader_desc: "§Y$CHI_ChengQian_birth_info$\n§Y背景：§!§L$CHI_ChengQian_bio$\n\n"
CHI_ChengQian_birth_info: "生于：§!§L1882年3月31日；湖南醴陵§!"
CHI_ChengQian_bio: "程潜，字颂云，湖南醴陵人。1904年考取秀才，同年赴日本留学，先后入东京振武学校、日本陆军士官学校第六期炮兵科。在日本期间加入中国同盟会，追随孙中山从事反清革命。1908年回国，在四川训练新军。辛亥革命爆发后，任湖南都督府参谋长，参与援鄂作战。1913年“二次革命”时，在湖南宣布独立讨袁，失败后逃亡日本。\n1915年回国参加护国运动，任湖南护国军总司令。1917年护法战争期间，任湘军总司令，与北洋军在湖南激战。1920年任广东军政府陆军次长。1923年任广州大本营军政部部长。1924年国民党改组后，当选为中央执行委员。1925年任国民革命军第六军军长，该军以湘军为基础，政治工作人员多由共产党员担任。\n1926年北伐开始，程潜率第六军进入江西，攻克南昌。1927年“四一二”政变后，他曾一度支持武汉国民政府，后被蒋介石排挤，第六军被解散重组。1928年北伐完成后，任湘鄂临时政务委员会主席，但不久被桂系排挤下野。1930年中原大战期间，程潜支持蒋介石，被任命为国民政府委员、军事参议院院长。战后，他虽居高位但无实权，主要活动于政治舞台。"
CHI_ZhangZhiZhong: "张治中"
CHI_ZhangZhiZhong_leader_desc: "§Y$CHI_ZhangZhiZhong_birth_info$\n§Y背景：§!§L$CHI_ZhangZhiZhong_bio$\n\n"
CHI_ZhangZhiZhong_birth_info: "生于：§!§L1890年10月27日；安徽巢县§!"
CHI_ZhangZhiZhong_bio: "张治中，字文白，安徽巢县人。1911年辛亥革命爆发时，在扬州参加反清起义。1912年进入武昌陆军军官第二预备学校，1914年考入保定陆军军官学校第三期步兵科。1916年毕业后，到安徽“安武军”见习，后南下广东参加护法运动。1924年黄埔军校成立，张治中任入伍生总队副队长，后代理总队长，参与军校早期建设。他工作认真，关爱学生，深得蒋介石信任。\n1926年北伐开始，张治中任国民革命军总司令部副官处处长，随军出征。1927年蒋介石发动“四一二”政变后，他被任命为南京中央陆军军官学校训练部部长，后任武汉分校教育长。1928年北伐完成后，任军事委员会军政厅厅长。1929年蒋桂战争中，他任武汉行营主任，主持湖北军政。\n1930年中原大战期间，张治中任第二路军第二纵队指挥官，率部在平汉线与冯玉祥部作战。他善于练兵，注重军纪，所部战斗力较强。战后，他被任命为中央陆军军官学校教育长，致力于军事人才培养。张治中虽为蒋介石嫡系，但思想较为开明，主张国共合作，在国民党内有“和平将军”之称。"
CHI_LuoZuoYing: "罗卓英"
CHI_LuoZuoYing_leader_desc: "§Y$CHI_LuoZuoYing_birth_info$\n§Y背景：§!§L$CHI_LuoZuoYing_bio$\n\n"
CHI_LuoZuoYing_birth_info: "生于：§!§L1896年3月19日；广东大埔§!"
CHI_LuoZuoYing_bio: "罗卓英，字尤青，号慈威，广东大埔人。早年就读于大埔中学，1918年考入保定陆军军官学校第八期炮兵科，与陈诚同窗，两人结下深厚友谊。1922年毕业后，回广东任第一师炮兵营连长。1924年黄埔军校成立，罗卓英任军校炮兵科教官。1925年参加两次东征，任炮兵连连长。\n1926年北伐开始，罗卓英任第一军第二师炮兵营营长，参加南昌、杭州等战役。1927年升任第二十一师第六十三团团长，在龙潭战役中表现突出。1928年任第十一师参谋长，协助师长陈诚整训部队。1929年蒋桂战争中，他参与指挥作战。1930年中原大战期间，罗卓英任第十一师第三十二旅旅长，在陇海线战场屡建战功，特别是在归德（今商丘）战役中，他率部夜袭阎锡山部指挥部，打乱敌军部署。\n罗卓英善于筹划，精于参谋业务，与陈诚合作默契，成为陈诚军事集团（后称“土木系”）的核心成员。他重视部队训练和军官培养，为第十一师战斗力的提升做出重要贡献。至1930年底，他已是陈诚麾下最得力的将领之一。"
JDW_ZhangZiZhong: "张自忠"
JDW_ZhangZiZhong_leader_desc: "§Y$JDW_ZhangZiZhong_birth_info$\n§Y背景：§!§L$JDW_ZhangZiZhong_bio$\n\n"
JDW_ZhangZiZhong_birth_info: "生于：§!§L1891年8月11日；山东临清§!"
JDW_ZhangZiZhong_bio: "张自忠，字荩臣，后改荩忱，山东临清人。1908年考入临清高等小学堂，1911年入天津北洋法政学堂。1914年投笔从戎，赴奉天（今沈阳）投奔陆军第二十师第三十九旅旅长车震。1916年随车震转投冯玉祥部，任排长。他刻苦训练，作战勇敢，深受冯玉祥赏识，由连长、营长逐步晋升。1924年第二次直奉战争后，冯玉祥部改编为国民军，张自忠升任团长。\n1926年，冯玉祥五原誓师，所部改编为国民联军（后称国民革命军第二集团军），张自忠任第二十八师师长，参加北伐，在河南等地与奉军作战。1927年，他任第二集团军军官学校校长，为西北军培养骨干。1929年蒋冯战争爆发，张自忠任第六师师长。1930年中原大战时，他任第六路军总指挥，在陇海线战场与蒋军激战。\n西北军战败后，张自忠率残部退入山西，被张学良收编。1930年底，所部改编为第二十九军第三十八师，他任师长，驻防山西阳泉。张自忠治军严明，与士兵同甘共苦，常亲自检查士兵伙食、关心士兵疾苦，在西北军旧部中威信极高。他注重军事训练，尤其强调劈刀、刺枪等近战技能，使部队保持了较强的战斗力。"
CHI_LiuZhi: "刘峙"
CHI_LiuZhi_leader_desc: "§Y$CHI_LiuZhi_birth_info$\n§Y背景：§!§L$CHI_LiuZhi_bio$\n\n"
CHI_LiuZhi_birth_info: "生于：§!§L1892年6月30日；江西吉安§!"
CHI_LiuZhi_bio: "刘峙，字经扶，江西吉安人。1911年考入湖南陆军小学，1914年升入武昌陆军第三中学，同年考入保定陆军军官学校第二期步兵科。1916年毕业后，在粤军任连长、营长。1924年黄埔军校成立，刘峙任战术教官，后任校本部参谋处科长。他教学认真，深得蒋介石赏识。\n1925年两次东征中，刘峙任教导第一团营长、团长，在棉湖战役中立功。1926年北伐开始，任第一军第二师师长，率部参加南昌、杭州等战役。1927年龙潭战役中，他率第二师坚守阵地，为战役胜利作出贡献。1928年二期北伐，任第一军团总指挥，攻克济南。\n1929年蒋桂战争中，刘峙任讨逆军第二路军总指挥，击败桂系。同年蒋冯战争中，任讨逆军第二军团总指挥。1930年中原大战期间，他任第二军团总指挥，在陇海线主战场与冯玉祥部主力激战。刘峙指挥谨慎，部队战斗力强，在归德、兰封等关键战役中发挥重要作用。战后，他因功升任河南省政府主席，成为坐镇中原的封疆大吏。刘峙对蒋介石忠诚，作战稳健，但缺乏创新，被同僚称为“福将”。"
CHI_YuJiShi: "俞济时"
CHI_YuJiShi_leader_desc: "§Y$CHI_YuJiShi_birth_info$\n§Y背景：§!§L$CHI_YuJiShi_bio$\n\n"
CHI_YuJiShi_birth_info: "生于：§!§L1904年；浙江奉化§!"
CHI_YuJiShi_bio: "俞济时，字良桢，浙江奉化人，与蒋介石同乡。1924年考入黄埔军校第一期，在校期间表现活跃，毕业后任黄埔军校教导团排长。1925年参加第一次东征，在淡水、棉湖等战斗中作战勇敢，负伤不退。伤愈后任国民革命军第一军第二师连长。\n1926年北伐开始，俞济时随第一军转战江西、浙江，升任营长。1927年龙潭战役中，他率营坚守阵地，击退孙传芳部多次进攻，战后升任团长。1928年二期北伐，参加济南战役。1929年蒋桂战争中，任第二师团长，在湖北作战。\n1930年中原大战期间，俞济时任第一师第二旅旅长，在陇海线战场作战。他指挥灵活，善于捕捉战机，在杞县战役中率旅迂回敌后，配合正面部队击溃冯玉祥部一个师。因战功卓著，战后升任警卫第一师副师长。俞济时是蒋介石的浙江同乡，又为黄埔一期生，深得信任，常被委以护卫之责。他治军严格，对蒋介石绝对忠诚，是蒋介石嫡系中的核心成员。"
CHI_XuTingYao: "徐庭瑶"
CHI_XuTingYao_leader_desc: "§Y$CHI_XuTingYao_birth_info$\n§Y背景：§!§L$CHI_XuTingYao_bio$\n\n"
CHI_XuTingYao_birth_info: "生于：§!§L1892年10月20日；安徽无为§!"
CHI_XuTingYao_bio: "徐庭瑶，字月祥，安徽无为人。1911年辛亥革命爆发，参加学生军。1912年入武昌陆军第二预备学校。1914年考入保定陆军军官学校第三期步兵科。1916年毕业后，在安徽陆军任排长、连长。1924年南下广州，任黄埔军校教官。\n1925年，徐庭瑶任国民革命军第一军第二师营长，参加两次东征。1926年北伐开始，任第一军第二师团长，参加南昌战役。1927年升任第九军副师长，参加龙潭战役。1928年任第一师副师长，参加二期北伐。\n1929年，徐庭瑶入陆军大学特别班第一期深造。1930年中原大战期间，他任第一师参谋长，协助师长胡宗南指挥作战。他参谋业务熟练，善于协调各部，为战役胜利作出贡献。战后，他调任第四师师长。徐庭瑶重视军事教育，主张军官应不断学习新知识。他关注世界军事发展趋势，特别重视装甲兵建设，是中国早期装甲兵理论的倡导者之一。"
CHI_XiongShiHui: "熊式辉"
CHI_XiongShiHui_leader_desc: "§Y$CHI_XiongShiHui_birth_info$\n§Y背景：§!§L$CHI_XiongShiHui_bio$\n\n"
CHI_XiongShiHui_birth_info: "生于：§!§L1893年；江西安义§!"
CHI_XiongShiHui_bio: "熊式辉，字天翼，江西安义人。1911年入江西陆军小学。1913年入武昌陆军第二预备学校。1915年考入保定陆军军官学校第二期步兵科。1916年毕业后，在赣军任排长、连长。1921年南下广东，任粤军参谋。1924年黄埔军校成立，任教官。\n1925年，熊式辉任国民革命军第一军第二师参谋长，参加两次东征。1926年北伐开始，任第一军参谋长，协助军长何应钦指挥作战。1927年任浙江省防军司令。1928年任淞沪警备司令。\n1929年，熊式辉任第五师师长。1930年中原大战期间，他任总司令部参谋次长，参与全局作战筹划。他善于处理复杂军务，协调各部队关系。战后，他调任江浙皖三省“剿匪”总指挥部参谋长。熊式辉精明干练，擅长行政管理和人际关系，深得蒋介石信任。他注重地方建设，在担任淞沪警备司令期间，整顿上海治安，发展市政建设，政绩显著。"
CHI_WangYaoWu: "王耀武"
CHI_WangYaoWu_leader_desc: "§Y$CHI_WangYaoWu_birth_info$\n§Y背景：§!§L$CHI_WangYaoWu_bio$\n\n"
CHI_WangYaoWu_birth_info: "生于：§!§L1904年；山东泰安§!"
CHI_WangYaoWu_bio: "王耀武，字佐民，山东泰安人。1924年考入黄埔军校第三期。在校期间学习刻苦，成绩优异。1926年毕业后，任国民革命军第一军第一师排长，参加北伐。在南昌战役中作战勇敢，升任连长。1927年参加龙潭战役，战后升任营长。\n1928年二期北伐，王耀武率营参加济南战役。1929年部队缩编，任第二师营长。1930年中原大战期间，他任第一师营长，在陇海线战场作战。在兰封战役中，他率营坚守阵地，击退冯玉祥部多次进攻，身负重伤不下火线。\n王耀武作战勇猛，指挥果断，善于把握战机。他治军严格，关心士兵，在部队中威信较高。战后，他升任第一师团长。王耀武非浙江籍，也非黄埔前两期，但凭借战功和才能，在中央军系统中逐渐崭露头角。他注重军事训练，强调实战演练，所部战斗力较强。"
CHI_TangEnBo: "汤恩伯"
CHI_TangEnBo_leader_desc: "§Y$CHI_TangEnBo_birth_info$\n§Y背景：§!§L$CHI_TangEnBo_bio$\n\n"
CHI_TangEnBo_birth_info: "生于：§!§L1900年9月20日；浙江武义§!"
CHI_TangEnBo_bio: "汤恩伯，原名克勤，浙江武义人。1916年入金华省立第七中学，后转入杭州体育专门学校。1920年毕业后赴日本留学，先后入明治大学法科、陆军士官学校第十八期炮兵科。1926年回国，任国民革命军总司令部参谋处中校参谋，参加北伐。1927年任中央陆军军官学校第六期学生大队长。\n1928年，汤恩伯任新编第五师副师长，后部队改编为第四师，他任副师长兼第十旅旅长。1929年蒋桂战争中，他率部在湖北作战。1930年中原大战期间，汤恩伯任第四师第十旅旅长，在陇海线战场与冯玉祥部激战。在兰封战役中，他指挥炮兵支援步兵进攻，突破敌军防线，因功受嘉奖。\n汤恩伯治军严酷，强调绝对服从，对部下要求苛刻。他重视军事训练，尤其注重部队的机动性和火力协同。战后，他被任命为第二师师长，成为蒋介石中央军嫡系将领。汤恩伯善于揣摩蒋介石意图，对蒋极为忠诚，逐渐成为蒋的心腹将领之一。"
CHI_SunLianZhong: "孙连仲"
CHI_SunLianZhong_leader_desc: "§Y$CHI_SunLianZhong_birth_info$\n§Y背景：§!§L$CHI_SunLianZhong_bio$\n\n"
CHI_SunLianZhong_birth_info: "生于：§!§L1893年2月2日；河北雄县§!"
CHI_SunLianZhong_bio: "孙连仲，字仿鲁，河北雄县人。1912年投效冯玉祥部，由士兵逐步升至营长。1924年第二次直奉战争后，冯玉祥部改编为国民军，孙连仲升任团长。1926年南口大战期间，他率部与直奉联军激战，战后升任旅长。同年9月，冯玉祥五原誓师，孙连仲随部参加北伐。\n1927年，孙连仲任第二集团军第十四军军长，转战河南、山东。1928年北伐完成后，任青海省政府主席。1929年蒋冯战争爆发，他任冯部第八路军总指挥。1930年中原大战期间，孙连仲任冯玉祥部第五路军总指挥，在平汉线战场与蒋军作战。他指挥稳健，善于防守，在许昌、漯河等地构筑坚固阵地，给蒋军造成重大伤亡。\n西北军战败后，孙连仲率残部退往山西，被张学良收编。1930年底，所部改编为第二十六路军，他任总指挥，驻防山东济宁。孙连仲性格沉稳，治军严谨，在西北军中以善打硬仗著称。他注重部队纪律，禁止扰民，在驻地颇得民心。"
CHI_SunKe: "孙科"
CHI_SunKe_leader_desc: "§Y$CHI_SunKe_birth_info$\n§Y背景：§!§L$CHI_SunKe_bio$\n\n"
CHI_SunKe_birth_info: "生于：§!§L1891年10月21日；广东香山（今中山）§!"
CHI_SunKe_bio: "孙科，字哲生，孙中山之子。1895年随母赴檀香山，1907年加入同盟会。1910年毕业于美国加利福尼亚大学，获文学士学位。1911年入哥伦比亚大学研究院，主修政治、经济。1917年回国，任广东大元帅府秘书。1921年任广州市首任市长，推行市政改革，开中国现代城市管理先河。\n1923年，孙科任国民党临时中央执行委员。1924年国民党一大后，任广州国民政府委员。1925年孙中山逝世后，他属于国民党内支持国共合作的左派。1926年北伐开始，他留守广州，代理广东省政府主席。1927年宁汉分裂期间，他支持武汉国民政府，任青年部部长。\n1928年，孙科赴欧美考察，研究各国政治制度。1929年回国后，任考试院副院长。1930年中原大战期间，他反对内战，主张和平统一。战后，他任国民政府委员、铁道部部长。孙科受西方教育影响，主张在中国推行宪政民主，在国民党内属于革新派。他文笔流畅，擅长演说，常发表文章阐述政治主张。"
CHI_KongXiangXi: "孔祥熙"
CHI_KongXiangXi_leader_desc: "§Y$CHI_KongXiangXi_birth_info$\n§Y背景：§!§L$CHI_KongXiangXi_bio$\n\n"
CHI_KongXiangXi_birth_info: "生于：§!§L1880年9月11日；山西太谷§!"
CHI_KongXiangXi_bio: "孔祥熙，字庸之，山西太谷人。孔子第七十五代孙。1901年赴美国留学，先后入欧柏林学院、耶鲁大学，获经济学硕士学位。1907年回国，创办铭贤学校。1911年辛亥革命时，组织山西学生军。1913年“二次革命”失败后，东渡日本，任东京中国基督教青年会总干事。\n1914年，孔祥熙在东京与宋霭龄结婚，成为蒋介石连襟。1915年回国，历任山西督军公署参议、鲁案善后督办公署实业处长等职。1924年赴广州，任广东革命政府财政厅厅长。1926年北伐开始，他负责军需供应。1927年蒋介石建立南京政府后，孔祥熙任实业部部长。\n1928年，孔祥熙任工商部部长，致力于整顿工商法规。1929年任中央银行总裁，开始掌握国家金融大权。1930年中原大战期间，他负责为蒋介石筹募军费，利用其财经专长和国际人脉，向国内外银行借款，保障了蒋军的财政需求。战后，他继续主持财经工作，成为蒋介石政权最重要的理财专家。孔祥熙善于交际，与江浙财团及外国银行界关系密切，为国民党政权巩固经济基础发挥了关键作用。"
CHI_DaiLi: "戴笠"
CHI_DaiLi_leader_desc: "§Y$CHI_DaiLi_birth_info$\n§Y背景：§!§L$CHI_DaiLi_bio$\n\n"
CHI_DaiLi_birth_info: "生于：§!§L1897年5月28日；浙江江山§!"
CHI_DaiLi_bio: "戴笠，字雨农，浙江江山人。1914年入浙江省立第一中学，次年退学。1918年投浙军第一师当兵。1926年考入黄埔军校第六期，在校期间加入国民党。1927年“四一二”政变后，他开始为蒋介石收集情报，监视校内进步师生活动。1928年，戴笠任国民革命军总司令部联络参谋，负责情报工作。\n1929年，戴笠在南京组织“军事委员会密查组”，自任组长，开始建立独立的情报系统。他招揽同乡、同学，建立严密组织，强调绝对忠诚和保密纪律。1930年中原大战期间，戴笠的情报组织发挥了重要作用。他派遣特务潜入冯玉祥、阎锡山部，获取军事部署、将领动态等情报，为蒋介石决策提供依据。\n戴笠工作勤奋，事必躬亲，常化装亲自侦查。他记忆力惊人，能记住大量人员信息和情报细节。至1930年底，他的特务组织已初具规模，在军队、政府机关中建立了情报网。戴笠对蒋介石绝对忠诚，自称“蒋委员长的耳目”，深得蒋信任，为他日后执掌军统局奠定了基础。"
CHI_HuangFu: "黄郛"
CHI_HuangFu_leader_desc: "§Y$CHI_HuangFu_birth_info$\n§Y背景：§!§L$CHI_HuangFu_bio$\n\n"
CHI_HuangFu_birth_info: "生于：§!§L1880年3月8日；浙江绍兴§!"
CHI_HuangFu_bio: "黄郛，原名绍麟，字膺白，浙江绍兴人。1904年入浙江武备学堂，次年赴日本留学，入东京振武学校。1905年加入同盟会。1908年转入日本陆军测量局地形科。1910年回国，在清廷军咨府任职。辛亥革命爆发后，参与上海光复，任沪军都督府参谋长兼第二师师长。\n1912年，黄郛任江苏都督府参谋长。1913年“二次革命”失败后流亡日本、美国。1916年回国，任北京政府外交总长。1921年出席华盛顿会议。1924年参与冯玉祥发动的北京政变，任代理内阁总理，摄行大总统职权。他主持修改清室优待条件，将溥仪驱逐出紫禁城。\n1927年，黄郛支持蒋介石“清党”，任上海特别市市长。1928年任外交部部长，处理济南惨案善后。1929年任北平政务整理委员会委员长。1930年中原大战期间，他周旋于各派之间，主张和平解决。战后，他淡出政坛，但仍是蒋介石重要的外交智囊。黄郛精通日语，熟悉日本政情，常参与对日交涉。他主张对日妥协，避免冲突，这一立场在国民党内颇有影响。"
CHI_JiangJingGuo: "蒋经国"
CHI_JiangJingGuo_C: "必须拥有蒋经国，才能开启赣南新政" 
CHI_JiangJingGuo_leader_desc: "§Y$CHI_JiangJingGuo_birth_info$\n§Y背景：§!§L$CHI_JiangJingGuo_bio$\n\n"
CHI_JiangJingGuo_birth_info: "生于：§!§L1910年4月27日；浙江奉化§!"
CHI_JiangJingGuo_bio: "蒋经国，名建丰，浙江奉化人，蒋介石长子。1916年入奉化武山小学，1922年入上海万竹小学。1925年5月，上海发生“五卅惨案”，蒋经国参加反帝游行，被学校开除。同年10月，经蒋介石安排，赴苏联莫斯科中山大学留学，化名“尼古拉·维拉迪米洛维奇·叶利扎罗夫”。在苏联期间，他加入苏联共产主义青年团，后转为苏联共产党（布）预备党员。\n1927年，蒋介石发动“四一二”政变，蒋经国在苏联公开谴责父亲，发表声明“蒋介石是我的敌人”。此后，他在苏联度过12年，先后在列宁格勒托尔马乔夫军政学院学习，毕业后曾任莫斯科迪纳摩电厂技师、乌拉尔重型机械厂车间主任、分厂厂长等职。1935年，与苏联女工芬娜（后改名蒋方良）结婚。\n至1930年，蒋经国仍身在苏联，处于政治流亡状态。他在苏联接受共产主义教育，参与社会主义建设，与父亲蒋介石的政治立场截然相反。这段特殊经历对他后来的政治理念和执政风格产生了深远影响。他身在异国，但时刻关注中国政局，内心充满矛盾与思考。"
CHI_ZhangQun: "张群"
CHI_ZhangQun_leader_desc: "§Y$CHI_ZhangQun_birth_info$\n§Y背景：§!§L$CHI_ZhangQun_bio$\n\n"
CHI_ZhangQun_birth_info: "生于：§!§L1889年5月9日；四川华阳（今属成都）§!"
CHI_ZhangQun_bio: "张群，字岳军，四川华阳人。1906年入保定陆军速成学堂。1908年赴日本留学，入振武学校，与蒋介石同窗。同年加入同盟会。1911年辛亥革命爆发，他与蒋介石一起回国，参加光复上海之役。1912年再赴日本，入陆军士官学校第十期炮兵科。1915年回国，在浙军任职。\n1917年，张群南下广州，参加孙中山领导的护法运动。1924年黄埔军校成立，他任军校办公厅主任。1926年北伐开始，任国民革命军总司令部总参议。1927年蒋介石建立南京政府，张群任军政部政务次长。1928年任上海特别市市长，整顿市政，发展公用事业。\n1929年，张群调任湖北省政府主席。1930年中原大战期间，他坐镇湖北，稳定后方，为蒋介石调兵遣将提供保障。战后，他调任外交部部长。张群善于处理复杂政务，尤其在地方行政方面经验丰富。他精通日语，常参与对日交涉。张群与蒋介石关系密切，既是同窗，又是政治盟友，是蒋介石决策圈中的重要成员。"
CHI_HuZongNan: "胡宗南" 
CHI_HuZongNan_leader_desc: "§Y$CHI_HuZongNan_birth_info$\n§Y背景：§!§L$CHI_HuZongNan_bio$\n\n"
CHI_HuZongNan_birth_info: "生于：§!§L1896年5月16日；浙江镇海§!"
CHI_HuZongNan_bio: "胡宗南，字寿山。早年毕业于吴兴中学，曾在家乡小学任教。1924年，听闻黄埔军校创办，毅然辞去教职，南下广州报考，因身高不足险些被拒，经廖仲恺特许方得入学，成为黄埔军校第一期学员。在学期间，他表现刻苦，深受校长蒋介石注意。毕业后，他历任军校教导团排长、连长等基层职务，先后参加了第一次东征、平定杨刘叛乱等战役。\n1926年北伐开始，胡宗南在国民革命军第一军第一师任职，随军转战江西、浙江、江苏等地，因作战勇敢，晋升迅速。1927年，他已升任第一军第一师副师长，成为蒋介石嫡系部队中的重要青年军官。在随后的龙潭战役等关键战斗中，他率部力战，进一步巩固了蒋介石对他的信任。1928年北伐结束后，他进入陆军大学将官班进修。\n1930年中原大战爆发，胡宗南时任第一师第一旅旅长，在陇海线主战场与冯玉祥部作战。他指挥所部在战役中表现顽强，尤其是在掩护友军和稳定战线方面发挥了作用，其忠诚与军事能力得到蒋介石的进一步肯定。战事末期，他已升任第一师代理师长，成为黄埔一期生中最早出任师长职务的将领之一，被视为蒋介石最为信赖的军事骨干，有“天子门生第一人”之称。"
JDW_FengZhiAng: "冯治安"
JDW_FengZhiAng_leader_desc: "§Y$JDW_FengZhiAng_birth_info$\n§Y背景：§!§L$JDW_FengZhiAng_bio$\n\n"
JDW_FengZhiAng_birth_info: "生于：§!§L1896年12月16日；河北故城§!"
JDW_FengZhiAng_bio: "冯治安，字仰之，河北故城人。1912年投效冯玉祥部，由士兵逐步升至连长。1917年参加讨伐张勋复辟之役。1921年升任营长。1924年第二次直奉战争后，冯玉祥部改编为国民军，冯治安升任团长。1926年，冯玉祥五原誓师，所部改编为国民联军，他随军参加北伐，任第二集团军第四师师长。\n1927年，冯治安率部转战河南，在兰封、开封等地与奉军作战。1928年北伐完成后，任第二集团军第二十三军军长。1929年蒋冯战争爆发，他随宋哲元反蒋，任西北军第四路军总指挥。1930年中原大战期间，冯治安任反蒋联军第四方面军第二路军司令，在平汉线战场与蒋军作战。他作战勇猛，善于指挥骑兵部队进行快速机动。\n西北军战败后，冯治安随宋哲元退入山西。1930年底，所部被张学良收编，改编为第二十九军第三十七师，他任师长，驻防山西阳泉。冯治安治军严格，重视部队纪律，严禁扰民。他注重军事训练，尤其强调夜战、近战和劈刀术，使部队保持了较强的战斗力。冯治安性格豪爽，待人诚恳，在西北军旧部中颇有人望。"
CHI_ShangGuanYunXiang: "上官云相"
CHI_ShangGuanYunXiang_leader_desc: "§Y$CHI_ShangGuanYunXiang_birth_info$\n§Y背景：§!§L$CHI_ShangGuanYunXiang_bio$\n\n"
CHI_ShangGuanYunXiang_birth_info: "生于：§!§L1895年；山东商河§!"
CHI_ShangGuanYunXiang_bio: "上官云相，字纪青，山东商河人。1914年入保定陆军军官学校预备班。1916年入保定军校第六期步兵科。1919年毕业后，在孙传芳部任排长、连长。1925年升任营长。1926年北伐军攻克江西，上官云相率部投诚，任国民革命军新编第二师团长。\n1927年，上官云相任第九军第十四师师长，参加龙潭战役。1928年二期北伐，他率部攻克泰安。1929年部队缩编，任第四十七师第一四一旅旅长。1930年中原大战期间，上官云相任第四十七师师长，在津浦线战场与晋军作战。在泰安、济南等战役中，他指挥部队坚守阵地，击退晋军多次进攻。\n上官云相作战勇猛，但性格粗暴，治军严苛。他重视部队训练，强调实战演练。战后，他因功升任第九军军长。上官云相非黄埔出身，但在北伐和中原大战中战功显著，逐渐在中央军系统中站稳脚跟。他善于处理人际关系，与何应钦、顾祝同等高级将领关系良好。"
CHI_JiangDingWen: "蒋鼎文"
CHI_JiangDingWen_leader_desc: "§Y$CHI_JiangDingWen_birth_info$\n§Y背景：§!§L$CHI_JiangDingWen_bio$\n\n"
CHI_JiangDingWen_birth_info: "生于：§!§L1895年1月15日；浙江诸暨§!"
CHI_JiangDingWen_bio: "蒋鼎文，字铭三，浙江诸暨人。1912年入绍兴大通学堂。1914年入浙江讲武堂。毕业后在浙军任排长、连长。1921年任孙中山大元帅府参谋部副官。1924年黄埔军校成立，任区队长、教官。他训练严格，深得蒋介石赏识。\n1925年两次东征，蒋鼎文任教导第一团营长，在淡水、棉湖等战斗中负伤。1926年北伐开始，他任第一军第二师第五团团长，参加南昌战役。1927年升任第一军第一师副师长，参加龙潭战役。1928年任第九师师长，参加二期北伐。\n1929年蒋桂战争中，蒋鼎文率部在湖北作战。1930年中原大战期间，他任第二军军长，在陇海线战场与冯玉祥部主力激战。在归德战役中，他指挥部队夜袭敌军阵地，打乱冯军部署。战后，他因功升任第二军团总指挥。蒋鼎文作战勇猛，常亲临一线指挥，身上多处负伤。他生活奢侈，喜好赌博，但在军事指挥上确有才能，是蒋介石嫡系将领中重要一员。"
CHI_JiangBaiLi: "蒋百里"
CHI_JiangBaiLi_leader_desc: "§Y$CHI_JiangBaiLi_birth_info$\n§Y背景：§!§L$CHI_JiangBaiLi_bio$\n\n"
CHI_JiangBaiLi_birth_info: "生于：§!§L1882年10月13日；浙江海宁§!"
CHI_JiangBaiLi_bio: "蒋百里，名方震，字百里，浙江海宁人。1901年入杭州求是书院。1905年以第一名毕业于日本陆军士官学校第三期步兵科，获天皇赐刀。1906年回国，任东北督练公所参议。1911年辛亥革命后，任浙江都督府总参议。1912年任保定陆军军官学校校长，致力军事教育改革，因陆军部掣肘，1913年愤而开枪自戕，幸未致命。\n1916年反对袁世凯称帝，任两广护国军司令部出师计划股主任。1917年任黎元洪总统府顾问。1918年随梁启超赴欧洲考察，著《欧洲文艺复兴史》。1920年回国，从事文化事业。1923年与胡适等组织新月社。\n1925年，蒋百里任吴佩孚部总参谋长。1929年，他支持唐生智反蒋，被蒋介石软禁。1930年获释后，居上海研究军事理论。他通晓英、日、德、法多国语言，军事造诣深厚，著有《国防论》等。蒋百里主张持久抗战，认为中日一旦开战，中国应利用广阔纵深，以空间换时间。他的军事思想对国民党高级将领有深远影响。至1930年底，他虽无兵权，但作为军事理论家，在中国军界享有崇高声誉。"
CHI_HuangWei: "黄维"
CHI_HuangWei_leader_desc: "§Y$CHI_HuangWei_birth_info$\n§Y背景：§!§L$CHI_HuangWei_bio$\n\n"
CHI_HuangWei_birth_info: "生于：§!§L1904年2月28日；江西贵溪§!"
CHI_HuangWei_bio: "黄维，号悟我，江西贵溪人。1923年毕业于江西省立第四师范学校，曾任小学教员。1924年考入黄埔军校第一期，毕业后任教导团排长。1925年参加第一次东征，在淡水、棉湖等战斗中作战勇敢，升任连长。1926年北伐开始，任第一军第二师营长，参加南昌、杭州等战役。\n1927年，黄维任第九军团长，参加龙潭战役。1928年入陆军大学特别班第一期深造。1930年中原大战期间，他任第十一师第三十一旅旅长，在陇海线战场与冯玉祥部作战。在归德战役中，他率旅坚守阵地，击退敌军多次进攻，因功受嘉奖。\n黄维治军严谨，生活简朴，不抽烟不喝酒，在国民党将领中属另类。他注重学习，军事理论扎实，擅长阵地防御战术。战后，他继续在第十一师任职，成为陈诚“土木系”的骨干成员。黄维对蒋介石忠诚，但性格固执，不善交际，在同僚中有“书呆子”之称。"
CHI_HuangBaiTao: "黄百韬"
CHI_HuangBaiTao_leader_desc: "§Y$CHI_HuangBaiTao_birth_info$\n§Y背景：§!§L$CHI_HuangBaiTao_bio$\n\n"
CHI_HuangBaiTao_birth_info: "生于：§!§L1900年9月9日；广东梅县§!"
CHI_HuangBaiTao_bio: "黄百韬，原名新，字焕然，广东梅县人。早年就读于梅县中学，后赴南京，入江苏省立第三中学。1918年投军，在江苏督军李纯部任传令兵。1920年入河北保定陆军军官学校第九期步兵科。1922年毕业后，在江苏陆军任排长、连长。1925年投靠张宗昌，任直鲁联军旅长。\n1927年，黄百韬率部投靠蒋介石，任国民革命军第六军团长。1928年部队缩编，任第四十八师营长。1929年入陆军大学特别班第二期深造。1930年中原大战期间，他任第一师参谋长，在陇海线战场参与作战筹划。他工作勤奋，谋划周密，为师长胡宗南所倚重。\n黄百韬非黄埔出身，但在军事指挥和参谋业务上能力突出。他善于学习，军事理论扎实，尤其重视实战经验总结。战后，他继续在第一师任职，逐渐在中央军系统中站稳脚跟。黄百韬为人谨慎，处事圆滑，与各方关系处理得当。他生活俭朴，不贪财不好色，在国民党将领中口碑较好。"
CHI_GuanLinZheng: "关麟征"
CHI_GuanLinZheng_leader_desc: "§Y$CHI_GuanLinZheng_birth_info$\n§Y背景：§!§L$CHI_GuanLinZheng_bio$\n\n"
CHI_GuanLinZheng_birth_info: "生于：§!§L1905年4月18日；陕西户县§!"
CHI_GuanLinZheng_bio: "关麟征，字雨东，陕西户县人。1924年考入黄埔军校第一期，与同乡杜聿明同期。在校期间表现活跃，毕业后任教导团排长。1925年参加第一次东征，在淡水战斗中负伤。伤愈后任连长，参加第二次东征。1926年北伐开始，任第一军第二师营长，参加南昌战役。\n1927年，关麟征任第九军团长，参加龙潭战役。1928年二期北伐，他率部攻克泰安。1929年任新编第五师副师长。1930年中原大战期间，关麟征任第一师第二旅旅长，在陇海线战场与冯玉祥部作战。在兰封战役中，他指挥部队夜袭敌军阵地，缴获大量武器装备。\n关麟征作战勇猛，性格刚烈，常身先士卒。他治军严格，强调纪律，对部下要求苛刻。战后，他升任第二师师长，成为中央军嫡系将领。关麟征与胡宗南关系密切，同为黄埔一期中的陕西籍将领，两人在军事上互相支持。他重视部队训练，尤其注重射击和刺杀技术，所部战斗力较强。"
ZOT_YangJiQing: "杨积庆"
ZOT_YangJiQing_leader_desc: "§Y$ZOT_YangJiQing_birth_info$\n§Y背景：§!§L$ZOT_YangJiQing_bio$\n\n"
ZOT_YangJiQing_birth_info: "生于：§!§L1889年；甘肃卓尼§!"
ZOT_YangJiQing_bio: "杨积庆，字德庵，藏族，世袭卓尼土司（第19任）。其家族自明代起统治卓尼地区，统辖洮河上游二十余旗。他早年接受传统教育，精通藏汉文，思想较为开明。1914年正式承袭土司职位后，致力于维护地方稳定，调解部落纠纷，并注重发展教育，创办卓尼第一所新式学校。在政治上，他周旋于甘肃军阀与中央政府之间，保持相对自治。1926年冯玉祥部进入甘肃后，他曾被任命为洮岷路保安司令。1930年中原大战期间，他保持中立，继续经营卓尼，发展农业、贸易，并组织藏兵维持地方秩序。杨积庆在甘南藏族地区威望较高，是当地重要的政治与军事首领。"
TOH_Tashi_Tsewang_Dorje: "扎西才旺多杰"
TOH_Tashi_Tsewang_Dorje_leader_desc: "§Y$TOH_Tashi_Tsewang_Dorje_birth_info$\n§Y背景：§!§L$TOH_Tashi_Tsewang_Dorje_bio$\n\n"
TOH_Tashi_Tsewang_Dorje_birth_info: "生于：§!§L1900年；西藏那曲§!"
TOH_Tashi_Tsewang_Dorje_bio: "扎西才旺多杰，出身于那曲地区一个有影响力的藏族部落首领家庭。早年学习藏文、佛经与骑射，青年时即参与部落管理。1920年代，他逐步接管家族权力，统治那曲北部数个牧场和村落。他善于处理与周边部落的关系，通过联姻和盟约扩大影响力，同时也与拉萨噶厦政府保持联络，缴纳赋税以示臣服。1930年前后，他致力于维护那曲地区的贸易通道，保障往来商队安全，并与青海马家军阀维持谨慎的关系。扎西才旺多杰勇武善战，重视部落武装的训练，在地方纠纷和草场争夺中常扮演仲裁或主导角色，是藏北地区一位实力派部落首领。"
DOT_Descending_Yang_Bohm: "降央伯姆"
DOT_Descending_Yang_Bohm_leader_desc: "§Y$DOT_Descending_Yang_Bohm_birth_info$\n§Y背景：§!§L$DOT_Descending_Yang_Bohm_bio$\n\n"
DOT_Descending_Yang_Bohm_birth_info: "生于：§!§L1892年；四川康定（原西康地区）§!"
DOT_Descending_Yang_Bohm_bio: "降央伯姆（又名降央巴姆），女性，藏族，西康地区重要的女土司之一。她出生于康巴地区土司家庭，早年接受藏文和家务教育。丈夫早逝后，她在家族支持下接管土司权力，统治康定附近数个村庄和牧场。面对民国初年西康地区的动荡局面，她以灵活手段周旋于川军、滇军及西藏地方政府之间，努力维持辖地自治与安全。她重视民生，鼓励农牧生产，调解内部纠纷，在属民中享有较高威望。1930年前后，她与刘文辉的川康边防军保持一定联系，接受委任但保持实质自治。降央伯姆是康区少数掌握实权的女性统治者之一，其统治展现了在动荡边疆地区维持稳定的能力。"
ROT_TianSongYao: "田颂尧"
ROT_TianSongYao_leader_desc: "§Y$ROT_TianSongYao_birth_info$\n§Y背景：§!§L$ROT_TianSongYao_bio$\n\n"
ROT_TianSongYao_birth_info: "生于：§!§L1888年；四川简阳§!"
ROT_TianSongYao_bio: "田颂尧，又名光祥，四川简阳人。1908年入四川陆军小学堂。1910年升入南京陆军第四中学。1911年辛亥革命爆发，参加学生军。1912年入保定陆军军官学校第一期步兵科。1914年毕业后回四川，在川军刘存厚部任排长、连长。\n1916年护国战争期间，田颂尧参加讨袁，升任营长。1917年任川军第二师团长。1920年川滇黔军阀混战，他率部参加，升任旅长。1923年任川军第二十一师师长。1926年，川军易帜，田颂尧任国民革命军第二十九军军长，驻防川北。\n1928年，田颂尧兼任四川省政府委员。1930年中原大战期间，他保持中立，集中力量经营川北防区。他在防区内自委官吏，征收赋税，发行货币，成为川北地区的实际统治者。田颂尧治军松散，部队纪律较差，但善于利用四川军阀间的矛盾，维持自身地位。他重视教育，在防区内兴办学校，发展文化事业。"
CHI_GuZhuTong: "顾祝同"
CHI_GuZhuTong_leader_desc: "§Y$CHI_GuZhuTong_birth_info$\n§Y背景：§!§L$CHI_GuZhuTong_bio$\n\n"
CHI_GuZhuTong_birth_info: "生于：§!§L1893年1月9日；江苏涟水§!"
CHI_GuZhuTong_bio: "顾祝同，字墨三，江苏涟水人。1911年辛亥革命爆发，参加革命军。1912年入武昌陆军第二预备学校。1914年考入保定陆军军官学校第六期步兵科。1919年毕业后，在长江上游总部陆军第十三旅任连长。1921年南下广东，任粤军第二军参谋。\n1924年黄埔军校成立，顾祝同任战术教官。1925年任教导第二团营长，参加两次东征。1926年北伐开始，任第一军第三师参谋长，后升任副师长。1927年任第九军军长，参加龙潭战役。1928年任第一军军长，参加二期北伐。\n1929年，顾祝同任武汉卫戍司令。1930年中原大战期间，他任第十六路军总指挥，在平汉线战场与冯玉祥部作战。他指挥稳健，善于协调各部队，在漯河、许昌等地取得胜利。战后，他调任国民政府警卫军军长，负责南京卫戍。顾祝同为人谨慎，对蒋介石忠诚，深得蒋信任。他善于处理人际关系，在国民党军界人缘较好，有“军中圣人”之称。"
ROD_ZhangXueLiang: "张学良"
ROD_ZhangXueLiang_leader_desc: "§Y$ROD_ZhangXueLiang_birth_info$\n§Y背景：§!§L$ROD_ZhangXueLiang_bio$\n\n"
ROD_ZhangXueLiang_birth_info: "生于：§!§L1901年6月3日；奉天省台安县（今属辽宁）§!"
ROD_ZhangXueLiang_bio: "张学良，字汉卿，号毅庵，奉系军阀首领张作霖之长子。早年接受传统教育，后入奉天陆军讲武堂第一期炮兵科学习，以优异成绩毕业，随即在奉军中服役，历任营长、团长、旅长，迅速晋升。1922年第一次直奉战争后，协助其父整军经武，参与创建东北空军和海军，并主导扩建奉天兵工厂，为奉军的现代化奠定了基础。\n1924年第二次直奉战争中，他出任镇威军第三军军长，在山海关一线与直军激战，表现出色。1928年6月，其父张作霖在皇姑屯被日本关东军炸成重伤后逝世（皇姑屯事件）。张学良秘密返回沈阳，稳定局势，于7月就任东三省保安总司令，继承父业，开始主政东北。面对日本步步紧逼的侵略野心和南京国民政府‘统一’的号召，他于1928年12月29日毅然通电全国，宣布‘遵守三民主义，服从国民政府’，改易旗帜，史称‘东北易帜’。此举标志着南京国民政府在形式上完成了全国统一，张学良被任命为东北边防军司令长官。\n1930年，中原大战爆发。交战双方蒋介石与阎锡山、冯玉祥等都极力拉拢手握重兵的张学良。他最初保持中立，静观待变。直至9月，战局僵持不下，他于18日发表‘和平通电’，随即派遣十余万东北军精锐入关，武装调停。东北军的介入迅速改变了力量平衡，反蒋联军顷刻瓦解，大战以蒋介石的胜利告终。为此，南京国民政府授予他陆海空军副司令之职，其势力范围扩展到华北的河北、察哈尔等地，个人政治声望达到顶峰。至1930年底，年仅29岁的‘少帅’张学良，已成为中国政坛上举足轻重的人物，但东北主力部队入关也造成了边防的空虚，为未来的危机埋下了伏笔。"
ROD_YuXueZhong: "于学忠"
ROD_YuXueZhong_leader_desc: "§Y$ROD_YuXueZhong_birth_info$\n§Y背景：§!§L$ROD_YuXueZhong_bio$\n\n"
ROD_YuXueZhong_birth_info: "生于：§!§L1890年11月19日；山东蓬莱§!"
ROD_YuXueZhong_bio: "于学忠，字孝侯，山东蓬莱人。1908年入通州速成随营学堂步兵科。1911年毕业后，在毅军任排长。1914年转入直系军阀吴佩孚部，由连长累升至旅长。1926年北伐军攻克武昌，吴佩孚败退，于学忠率残部退往河南。\n1927年，于学忠投靠张作霖，任镇威军第二十军军长。1928年皇姑屯事件后，他继续效忠张学良，任东北保安司令长官公署军事参议官。1929年中东路事件中，他任防俄军第一军军长，在满洲里与苏军作战。\n1930年中原大战期间，于学忠任东北军第一军军长，随张学良入关，支持蒋介石。他率部进驻北平、天津，稳定华北局势。战后，张学良任命他为河北省政府主席，成为东北军控制华北的重要将领。于学忠治军严明，注重军纪，禁止部队扰民。他为人正直，不参与派系斗争，在东北军中威信较高。"
ROD_XiQia: "爱新觉罗·熙洽"
ROD_XiQia_leader_desc: "§Y$ROD_XiQia_birth_info$\n§Y背景：§!§L$ROD_XiQia_bio$\n\n"
ROD_XiQia_birth_info: "生于：§!§L1884年；满洲正蓝旗§!"
ROD_XiQia_bio: "爱新觉罗·熙洽，字格民，满洲正蓝旗人，清太祖努尔哈赤胞弟穆尔哈齐后裔。1907年入日本陆军士官学校中华队第八期骑兵科。1911年回国，任奉天讲武堂教官。1912年任黑龙江都督府参谋。1916年任吉林督军署参谋长。\n1922年第一次直奉战争后，熙洽任吉林省陆军训练总监。1924年第二次直奉战争后，任吉林边防军副司令。1928年皇姑屯事件后，他继续效忠张学良，任吉林省政府委员兼边防军司令。\n熙洽是满洲贵族中少数掌握军权的人物。他精通日语，熟悉日本情况，主张与日本合作以维护满洲利益。1930年，他任吉林省政府代理主席，实际掌握吉林军政大权。熙洽思想保守，怀念清朝统治，暗中与日本关东军保持联系。他表面服从张学良，但内心另有打算，为日后在吉林迎接溥仪复辟埋下伏笔。"
ROD_MaZhanShan: "马占山"
HLJ_MaZhanShan: "马占山"
ROD_MaZhanShan_leader_desc: "§Y$ROD_MaZhanShan_birth_info$\n§Y背景：§!§L$ROD_MaZhanShan_bio$\n\n"
ROD_MaZhanShan_birth_info: "生于：§!§L1885年11月30日；奉天府怀德县（今吉林省公主岭市）§!"
ROD_MaZhanShan_bio: "马占山，字秀芳。出生于贫苦农家，少年时因给地主放马，丢失一匹后遭诬陷、毒打与关押，马被找回后地主亦不肯退赔，遂被逼逃亡，落草为寇。因其精于骑射、为人仗义，被推为头领。\n1908年，马占山率部众接受清廷招安，投身行伍。后投效清军奉天后路巡防营统领吴俊升麾下，以作战勇猛、骑射精湛渐获赏识。1913年，吴部改编为中央骑兵第二旅，他任连长。此后凭借军功，于1916年升任营长，1918年升任团长。\n1925年，马占山升任东北陆军第十七师骑兵第五旅旅长。同年，在平定郭松龄反奉之役中，其部表现出色，战后擢升为骑兵第十七师师长，后又任骑兵第二军军长。1928年，张作霖与吴俊升在皇姑屯被炸身亡，马占山对此誓言报复。1929年，他被张学良任命为黑龙江省骑兵总指挥。至1930年，其职务为黑河警备司令兼黑龙江省陆军步兵第三旅旅长。此时，他已成为奉系东北军中一位以悍勇闻名的将领，镇守着黑龙江的北大门。"
JLS_DingCao: "丁超"
JLS_DingCao_leader_desc: "§Y$JLS_DingCao_birth_info$\n§Y背景：§!§L$JLS_DingCao_bio$\n\n"
JLS_DingCao_birth_info: "生于：§!§L1886年；奉天（今辽宁）新宾§!"
JLS_DingCao_bio: "丁超，字洁忱，奉天新宾人。1905年入奉天陆军小学。1908年入北京陆军第一中学。1911年入保定陆军军官学校第一期炮兵科。1914年毕业后回奉天，任奉军第二十七师炮兵排长。1916年升任炮兵连长。1919年任东三省陆军讲武堂炮兵科长。\n1922年第一次直奉战争后，丁超任奉天陆军整理处科长，参与奉军现代化改革。1924年第二次直奉战争中，任奉军第一军炮兵团长，在山海关战场表现出色。1925年郭松龄反奉时，他率部参与平叛，升任东北陆军第十八师师长。\n1928年皇姑屯事件后，丁超继续效忠张学良。1929年中东路事件中，他任防俄军第二军军长，在绥芬河与苏军作战。1930年中原大战期间，他留守东北，任吉林省政府委员兼吉林铁路护路军司令。丁超治军严谨，重视炮兵训练和技术革新。他为人正直，在东北军中资历深厚，但与部分少壮派将领关系一般。"
JLS_LiDu: "李杜"
JLS_LiDu_leader_desc: "§Y$JLS_LiDu_birth_info$\n§Y背景：§!§L$JLS_LiDu_bio$\n\n"
JLS_LiDu_birth_info: "生于：§!§L1880年8月4日；奉天义州（今辽宁义县）§!"
JLS_LiDu_bio: "李杜，字植初，原名荫培，奉天义州人。1900年入奉天陆军随营学堂。1905年入东北讲武堂。1908年任奉军第二十镇排长。1911年辛亥革命时，他参与滦州起义，失败后逃往关外。1912年任奉天陆军第二十七师连长。\n1916年，李杜升任奉军第二十七师营长。1920年直皖战争中，他率部入关参战，升任团长。1924年第二次直奉战争后，任东北陆军第十师师长。1925年郭松龄反奉时，他率部参与平叛，战后升任吉林镇守使。\n1928年东北易帜后，李杜任吉林省防军司令。1929年中东路事件中，他指挥部队在满洲里与苏军作战。1930年中原大战期间，他留守吉林，任吉林省政府委员兼警务处长。李杜治军严格，注重边防建设。他性格刚直，不满部分东北军将领的腐化现象，主张整军经武，加强国防。"
ROX_ShengShiCai: "盛世才"
ROX_ShengShiCai_leader_desc: "§Y$ROX_ShengShiCai_birth_info$\n§Y背景：§!§L$ROX_ShengShiCai_bio$\n\n"
ROX_ShengShiCai_birth_info: "生于：§!§L1892年；辽宁开原§!"
ROX_ShengShiCai_bio: "盛世才，字晋庸，辽宁开原人。1912年入上海中国公学政治经济科。1915年赴日本留学，入明治大学。1917年回国，入云南讲武堂韶关分校。1919年毕业后，在奉军郭松龄部任排长、连长。1923年入日本陆军大学中国学生队，1927年毕业回国。\n1927年，盛世才任国民革命军总司令部上校参谋。1928年任参谋本部第一厅第三科科长。1929年任参谋本部边疆事务委员会专门委员。1930年，新疆省主席金树仁为整顿军队，通过蒋介石调盛世才入新，任新疆督办公署参谋处主任。\n盛世才精通日语，熟悉军事理论，但野心勃勃，善于权谋。他表面效忠金树仁，暗中培植个人势力。在新疆复杂的民族和地缘政治环境中，他逐渐崭露头角。至1930年底，他已在新疆军政界站稳脚跟，开始谋划更大的政治图谋。"
HET_YiMing: "穆罕默德·伊敏"
HET_YiMing_desc: "§Y$HET_YiMing_birth_info$\n§Y背景：§!§L$HET_YiMing_bio$\n\n"
HET_YiMing_birth_info: "生于：§!§L？？？；新疆和阗§!"
HET_YiMing_bio: "穆罕默德·伊敏，全名穆罕默德·伊敏·布格拉（维吾尔语：محمد أمين بۇغرا），汉名毛德明，伊斯兰经学院任教师。"
ROS_LiuXiang: "刘湘"
ROS_LiuXiang_leader_desc: "§Y$ROS_LiuXiang_birth_info$\n§Y背景：§!§L$ROS_LiuXiang_bio$\n\n"
ROS_LiuXiang_birth_info: "生于：§!§L1888年；四川大邑§!"
ROS_LiuXiang_bio: "刘湘，字甫澄，四川大邑人。1904年入四川陆军速成学堂。1906年入四川陆军讲武堂。1908年毕业后，在川军任排长。1911年辛亥革命时，参加四川独立运动。1912年任川军第二师连长。1916年护国战争中，他率部在川南与北洋军作战，升任营长。\n1918年，刘湘任川军第二师团长。1920年川滇黔军阀混战中，他支持川军总司令刘存厚，升任旅长。1922年任川军第二军军长。1926年川军易帜，他任国民革命军第二十一军军长。1928年任四川省政府委员。\n1930年中原大战期间，刘湘保持中立，集中力量统一四川。他击败刘文辉、杨森等对手，逐步控制川东、川南地区。刘湘治军有方，重视军队现代化，从外国购买武器，聘请军事顾问。他注重地方建设，在防区内兴办教育、整顿财政。至1930年底，他已成为四川最具实力的军阀，为日后统一全川奠定了基础。"
ROW_LiuWengHui: "刘文辉"
ROW_LiuWengHui_leader_desc: "§Y$ROW_LiuWengHui_birth_info$\n§Y背景：§!§L$ROW_LiuWengHui_bio$\n\n"
ROW_LiuWengHui_birth_info: "生于：§!§L1895年；四川大邑§!"
ROW_LiuWengHui_bio: "刘文辉，字自乾，四川大邑人，刘湘堂侄。1911年入四川陆军小学。1914年入西安陆军第二中学。1916年入保定陆军军官学校第二期炮兵科。1917年毕业后回四川，在川军刘存厚部任参谋。1919年任川军第八师团长。\n1922年，刘文辉任川军第九师师长。1926年川军易帜，他任国民革命军第二十四军军长。1928年任四川省政府主席。他利用家族关系和政治手腕，迅速扩张势力，控制川南、西康地区。\n1930年中原大战期间，刘文辉与刘湘矛盾激化，双方在川中地区对峙。他联合邓锡侯、田颂尧等军阀，与刘湘争夺四川霸权。刘文辉重视教育，在防区内兴办学校，发展文化事业。他注重经济建设，修筑公路，开发矿产。至1930年底，他控制着四川近半区域，是刘湘统一四川的最大障碍。"
RDX_DengXiHou: "邓锡侯"
RDX_DengXiHou_leader_desc: "§Y$RDX_DengXiHou_birth_info$\n§Y背景：§!§L$RDX_DengXiHou_bio$\n\n"
RDX_DengXiHou_birth_info: "生于：§!§L1889年；四川营山§!"
RDX_DengXiHou_bio: "邓锡侯，字晋康，四川营山人。1906年入四川陆军小学。1909年入南京陆军第四中学。1911年辛亥革命爆发，参加学生军。1912年入保定陆军军官学校第一期步兵科。1914年毕业后回四川，在川军刘存厚部任排长。\n1916年护国战争中，邓锡侯升任连长。1918年任川军第二师营长。1920年川滇黔军阀混战中，他率部作战有功，升任团长。1922年任川军第三师师长。1926年川军易帜，他任国民革命军第二十八军军长。\n1928年，邓锡侯任四川省政府委员。1930年中原大战期间，他周旋于刘湘、刘文辉之间，保持相对独立。他控制川北地区，自委官吏，征收赋税，成为一方诸侯。邓锡侯治军宽松，部队纪律较差，但善于利用四川军阀间的矛盾，维持自身地位。他重视地方建设，在防区内兴修水利，发展农业。"
BTF_BietingFang: "别廷芳"
BTF_BietingFang_leader_desc: "§Y$BTF_BietingFang_birth_info$\n§Y背景：§!§L$BTF_BietingFang_bio$\n\n"
BTF_BietingFang_birth_info: "生于：§!§L1883年；河南内乡§!"
BTF_BietingFang_bio: "别廷芳，字香斋，河南内乡人。早年务农，后因地方匪患严重，于1912年组织乡民成立自卫民团，逐渐发展成为豫西南一带颇具规模的民间武装首领。他以“保境安民”为口号，实行严格的地方自治，在内乡、淅川、西峡三县交界处建立割据势力。别廷芳治军严厉，注重训练，其民团战斗力较强，多次击退土匪和溃兵骚扰，保障了当地相对稳定的生产生活秩序。1920年代末至1930年代初，他周旋于冯玉祥西北军与蒋介石中央军之间，接受番号但保持独立。他在辖区内推行一系列地方建设措施，如兴修水利、创办学校、修筑道路等，同时推行严厉的社会控制政策，被称为“内乡王”。至1930年，别廷芳已成为豫西南地区最具实力的地方实力派人物之一。"
LDC_LuDaChang: "鲁大昌"
LDC_LuDaChang_leader_desc: "§Y$LDC_LuDaChang_birth_info$\n§Y背景：§!§L$LDC_LuDaChang_bio$\n\n"
LDC_LuDaChang_birth_info: "生于：§!§L1891年；甘肃临夏§!"
LDC_LuDaChang_bio: "鲁大昌，字寿山，甘肃临夏人，回族。早年投效西北马家军，在宁海军中历任排长、连长。1920年代，他因作战勇猛且善于带兵，逐步晋升为营长、团长。1928年河湟事变后，他收拢部分回军残部，自立门户，活动于甘肃西南部洮河、岷县一带。他凭借当地回族民众支持，建立起一支以骑兵为主的武装力量，控制数县之地，自征赋税，委任官吏，成为割据一方的小军阀。1930年中原大战期间，他名义上接受冯玉祥西北军的委任，但实际保持独立，静观局势变化。鲁大昌为人悍勇，熟悉陇南地形，善于游击作战，其部队在当地回族中有一定号召力。至1930年底，他仍在甘肃西南部维持着自己的势力范围。"
MBQ_MaBuQing: "马步青"
MBQ_MaBuQing_leader_desc: "§Y$MBQ_MaBuQing_birth_info$\n§Y背景：§!§L$MBQ_MaBuQing_bio$\n\n"
MBQ_MaBuQing_birth_info: "生于：§!§L1898年；甘肃临夏§!"
MBQ_MaBuQing_bio: "马步青，字子云，甘肃临夏人，回族，马麒之侄，马步芳之兄。早年随叔父马麒在宁海军中任职，由哨官逐步升至营长。1920年代，他参与宁海军在青海南部、甘肃河西等地的征战，积累战功。1928年，马仲英起事时，他奉命率部参与围剿，表现出一定的军事才能。1929年，他被任命为宁海军暂编骑兵第一师师长，驻防甘肃酒泉、张掖等地，负责河西走廊防务。马步青性格较为沉稳，注重维系与当地蒙古王公、藏族头人的关系，以巩固马家在河西的统治。1930年中原大战期间，他遵循马麒、马步芳的总体策略，保持中立观望，同时加强河西地区的控制，征收赋税，训练军队，为马家军阀向西扩展影响力奠定了基础。"
MZY_MaZhongYing: "马仲英"
MZY_MaZhongYing_leader_desc: "§Y$MZY_MaZhongYing_birth_info$\n§Y背景：§!§L$MZY_MaZhongYing_bio$\n\n"
MZY_MaZhongYing_birth_info: "生于：§!§L1910年；甘肃临夏§!"
MZY_MaZhongYing_bio: "马仲英，原名马步英，字子才，甘肃临夏人，回族。出身于马家军家族，为马麒族侄。1928年，年仅18岁的他因对家族内部权力分配不满，以“为父报仇”为名，在河州（今临夏）起事，自称“黑虎吸冯军”，迅速聚集数千回民武装，掀起“河湟事变”。他作战勇猛，战术灵活，率部转战甘肃、青海、宁夏等地，多次击败西北军和宁海军，一度围攻西宁，震动西北。1929年，他被冯玉祥部击败后率残部进入新疆，自称“甘宁青联军总司令”，在新疆东部活动。1930年，他联合新疆少数民族势力，占据哈密、吐鲁番等地，与新疆省主席金树仁的军队作战。马仲英年轻气盛，野心勃勃，善于鼓动回族群众，在西北地区有一定影响力。至1930年底，他仍在新疆东部活跃，成为西北地区一支重要的割据武装力量。"
MZY_YaoLeBoShi: "尧乐博斯"
MZY_YaoLeBoShi_leader_desc: "§Y$MZY_YaoLeBoShi_birth_info$\n§Y背景：§!§L$MZY_YaoLeBoShi_bio$\n\n"
MZY_YaoLeBoShi_birth_info: "生于：§!§L1889年；新疆哈密§!"
MZY_YaoLeBoShi_bio: "尧乐博斯（又译尧乐博士），原名尧乐娃，维吾尔族，新疆哈密人。早年从事商贸，积累财富后成为当地有影响力的头人。1920年代，他担任哈密王府卫队队长，后因协助新疆省政府平定地方叛乱有功，被任命为哈密警备司令。他精通汉语和维吾尔语，善于周旋于汉族官府与当地维吾尔民众之间。1930年，哈密发生农民暴动，他 initially 支持暴动队伍，但随后见形势变化，转而与新疆省主席金树仁合作，协助镇压暴动。尧乐博斯野心勃勃，试图利用混乱局势扩大自身势力，控制哈密地区。他拥有自己的武装，在当地维吾尔族中有一定号召力，是哈密地区重要的政治军事人物。至1930年底，他仍在哈密活动，伺机进一步扩张权力。"
RYS_YangSen: "杨森"
RYS_YangSen_leader_desc: "§Y$RYS_YangSen_birth_info$\n§Y背景：§!§L$RYS_YangSen_bio$\n\n"
RYS_YangSen_birth_info: "生于：§!§L1884年2月20日；四川广安§!"
RYS_YangSen_bio: "杨森，字子惠，四川广安人。1904年入四川陆军速成学堂，1908年入四川陆军讲武堂。毕业后在川军中任职，由排长累升至师长。1920年，他投靠北洋军阀吴佩孚，任陆军第十六师师长。1924年，他被北京政府任命为四川军务督理，成为四川主要军阀之一。1926年，北伐军进入湖南，杨森见风转舵，宣布加入国民革命军，任第二十军军长。但他反复无常，1927年曾支持蒋介石“清党”，后又与武汉国民政府联络。1928年，他参与国民党二次北伐，任第一集团军第二军团总指挥。1929年蒋桂战争爆发，他支持蒋介石，被任命为四川省政府主席。但不久与刘湘矛盾激化，爆发战争，战败后退出四川。1930年中原大战期间，他 initially 持观望态度，后接受蒋介石任命，率部在湖北作战。杨森治军较严，注重军队现代化，在川军中较早引进西方军事训练方法。他生活奢侈，妻妾成群，但同时也提倡体育运动，在驻地修建体育设施。至1930年底，他虽已失去四川地盘，但仍是国民党军中一支不可忽视的力量。"
YGC_YouGuoCai: "犹国才"
YGC_YouGuoCai_leader_desc: "§Y$YGC_YouGuoCai_birth_info$\n§Y背景：§!§L$YGC_YouGuoCai_bio$\n\n"
YGC_YouGuoCai_birth_info: "生于：§!§L1897年；贵州桐梓§!"
YGC_YouGuoCai_bio: "犹国才，字用九，贵州桐梓人。早年入贵州讲武学堂，毕业后在黔军中服役。1920年代，他追随周西成，在黔军中由连长累升至旅长。1926年，周西成任贵州省主席，犹国才成为其得力干将。1929年，周西成在与李燊的战争中战死，犹国才率残部退往黔北，与毛光翔、王家烈等共同拥戴毛光翔为第二十五军军长。1930年，他被毛光翔任命为第二十五军第一师师长，驻防遵义地区。犹国才作战勇猛，但性格粗暴，与同僚关系紧张。他控制黔北数县，自征赋税，委任官吏，成为相对独立的小军阀。至1930年底，他仍是贵州军阀体系中的重要将领，但内部矛盾已渐露端倪。"
JZZ_JiangZhaiZeng: "蒋在珍"
JZZ_JiangZhaiZeng_leader_desc: "§Y$JZZ_JiangZhaiZeng_birth_info$\n§Y背景：§!§L$JZZ_JiangZhaiZeng_bio$\n\n"
JZZ_JiangZhaiZeng_birth_info: "生于：§!§L1896年；贵州遵义§!"
JZZ_JiangZhaiZeng_bio: "蒋在珍，字丕绪，贵州遵义人。早年入贵州陆军小学，后入贵州讲武学堂。毕业后在黔军中服役，历任排长、连长、营长。1920年代，他追随周西成，参与贵州军阀混战，因战功升任团长。1929年周西成战死后，他转而支持毛光翔，被任命为第二十五军第三师师长，驻防黔东北地区。蒋在珍治军尚严，注重部队训练，其师战斗力在黔军中属较强之列。他控制正安、道真、务川等县，征收赋税，建立自己的行政体系。1930年中原大战期间，他保持中立，集中精力经营防区。蒋在珍为人谨慎，善于保存实力，在黔军各派系斗争中常采取观望态度。至1930年底，他仍是贵州军阀中拥有实权的人物之一。"
RHC_LiuChunHou: "刘存厚"
RHC_LiuChunHou_leader_desc: "§Y$RHC_LiuChunHou_birth_info$\n§Y背景：§!§L$RHC_LiuChunHou_bio$\n\n"
RHC_LiuChunHou_birth_info: "生于：§!§L1885年1月24日；四川简阳§!"
RHC_LiuChunHou_bio: "刘存厚，字积之，四川简阳人。1903年考入四川武备学堂第一期，1904年被选派赴日本留学，先后入成城学校、陆军士官学校中华队第六期步兵科。在日期间加入中国同盟会。1909年回国，任云南讲武堂战术教官，与李根源、罗佩金等共事，朱德、杨森等曾是其学生。\n1911年辛亥革命爆发，刘存厚在昆明参加重九起义，任云南军政府参谋部第一部部长。1912年返川，任川军第四师参谋长。1915年袁世凯称帝，他任护国川军总司令，在川南与北洋军激战。护国战争后，任川军第二师师长，逐渐成为四川军政界重要人物。\n1917年北京政府任命刘存厚为四川督军，但他与滇黔军及熊克武等川军将领矛盾激化，爆发‘刘罗’、‘刘戴’之战。1920年，滇黔军被逐出四川，他一度控制成都。1924年北京政府授予他‘崇威将军’衔。1925年，在杨森统一四川之战中败北，退守川北。1926年川军易帜，所部被改编为国民革命军第二十三军，他任军长。\n1930年，刘存厚任川陕边防督办，驻防达县、宣汉等地，控制川东北十余县。他一面与南京国民政府保持联系，一面在防区内自行其是，征收赋税，铸造货币，创办兵工厂，成为名副其实的‘川北王’。此时他虽已年过四旬，但仍致力于整军经武，其部队装备在川军中属较精良者，且注重军官培养，创办了‘川陕边防军官教育团’
XZS_TuDengJiaChuo: "第十三世达赖喇嘛"
XZS_TuDengJiaChuo_leader_desc: "§Y$XZS_TuDengJiaChuo_birth_info$\n§Y背景：§!§L$XZS_TuDengJiaChuo_bio$\n\n"
XZS_TuDengJiaChuo_birth_info: "生于：§!§L1876年6月27日；西藏达布地区（今朗县）§!"
XZS_TuDengJiaChuo_bio: "第十三世达赖喇嘛，法名土登嘉措，西藏拉萨甘丹寺、哲蚌寺、色拉寺三大寺认定为第十二世达赖喇嘛的转世灵童，1878年坐床。幼年学习佛经，1895年亲政。他面对英俄等列强对西藏的觊觎，试图在清朝、英国、俄国之间寻求平衡。1904年英军入侵拉萨时，他北逃至蒙古，试图向俄国求援未果。1908年赴北京觐见光绪皇帝和慈禧太后，获封'诚顺赞化西天大善自在佛'。1910年川军入藏，他再次出走，这次逃往印度，与英国殖民当局建立联系。1912年辛亥革命后返回西藏，驱逐清朝驻藏官员，实质独立。此后他推行一系列现代化改革，创办新式学校、邮政、电报等，同时强化政教合一体制。1920年代，他周旋于英国与内地军阀之间，试图维持西藏自治。1930年，他与国民政府关系有所缓和，但西藏事实上的独立状态持续。1933年圆寂。第十三世达赖喇嘛是西藏近代史上关键人物，其统治时期西藏与中央关系复杂多变。"
ROG_ChenMingQu: "陈铭枢"
ROG_ChenMingQu_leader_desc: "§Y$ROG_ChenMingQu_birth_info$\n§Y背景：§!§L$ROG_ChenMingQu_bio$\n\n"
ROG_ChenMingQu_birth_info: "生于：§!§L1889年；广东合浦（今属广西）§!"
ROG_ChenMingQu_bio: "陈铭枢，字真如，广东合浦人。1906年入广东黄埔陆军小学。1909年入南京陆军第四中学。1911年参加辛亥革命，任学生军队长。1912年入保定陆军军官学校第二期步兵科。1915年毕业后，在粤军任排长、连长。\n1919年，陈铭枢任粤军第一师团长。1925年任国民革命军第四军第十师师长。1926年北伐开始，他率部参加汀泗桥、贺胜桥战役，战功卓著。1927年任第十一军军长，后任广东省政府主席。\n1929年，陈铭枢因与蒋介石政见不合，辞去职务，赴欧洲考察。1930年回国，他主张抗日反蒋，在国民党内组织民主力量。他与蔡廷锴、蒋光鼐等将领关系密切，逐渐形成以第十九路军为基础的军事政治集团。陈铭枢思想开明，主张民主政治，反对蒋介石独裁。至1930年底，他正在酝酿新的政治行动。"
ROG_LingJiZhong: "林翼中"
ROG_LingJiZhong_leader_desc: "§Y$ROG_LingJiZhong_birth_info$\n§Y背景：§!§L$ROG_LingJiZhong_bio$\n\n"
ROG_LingJiZhong_birth_info: "生于：§!§L1892年；广东§!"
ROG_LingJiZhong_bio: "林翼中，字肇明，广东人。早年入广东陆军小学，后升入武昌陆军第三中学。1914年考入保定陆军军官学校第二期步兵科。1916年毕业后回广东，在粤军第一师任职。1920年代，他追随陈炯明，参与援闽、回粤等战役。陈炯明叛变后，他转而投靠孙中山，在东征陈炯明、平定杨刘叛乱中作战。1926年北伐开始，他任国民革命军第四军团长，参加汀泗桥、贺胜桥战役。1927年，他任第十一军师长，在张发奎部任职。1929年蒋桂战争后，他回到广东，任陈济棠部旅长。1930年，他任第一集团军第三军师长，驻防粤东。林翼中治军严谨，战术灵活，在粤军中以善守著称。他为人低调，不参与派系纷争，深得陈济棠信任。至1930年底，他已成为粤军重要将领之一。"
ROG_ChenJiTang: "陈济棠"
ROG_ChenJiTang_leader_desc: "§Y$ROG_ChenJiTang_birth_info$\n§Y背景：§!§L$ROG_ChenJiTang_bio$\n\n"
ROG_ChenJiTang_birth_info: "生于：§!§L1890年；广东防城（今属广西）§!"
ROG_ChenJiTang_bio: "陈济棠，字伯南，广东防城人。1907年入广东黄埔陆军小学。1909年入广州陆军速成学堂。1911年参加辛亥革命。1913年入保定陆军军官学校，未毕业即回广东。1915年任粤军排长。1920年任粤军连长。\n1922年陈炯明叛变时，陈济棠拥护孙中山，升任营长。1925年任国民革命军第四军第十一师团长。1926年北伐开始，他率部留守广东。1927年升任第四军师长。1928年任广东编遣区主任。\n1929年，陈济棠在蒋桂战争中支持蒋介石，被任命为第八路军总指挥，控制广东军权。1930年中原大战期间，他保持中立，集中力量经营广东。他整顿军队，发展经济，修建公路、港口，使广东成为相对独立的省份。陈济棠迷信风水，重视家族势力，在广东建立陈氏家族的统治。至1930年底，他已完全掌控广东军政大权，成为“南天王”。"
ROG_YuHanMou: "余汉谋"
ROG_YuHanMou_leader_desc: "§Y$ROG_YuHanMou_birth_info$\n§Y背景：§!§L$ROG_YuHanMou_bio$\n\n"
ROG_YuHanMou_birth_info: "生于：§!§L1896年；广东高要§!"
ROG_YuHanMou_bio: "余汉谋，字幄奇，广东高要人。1910年入广东黄埔陆军小学。1914年入武昌陆军第二预备学校。1916年入保定陆军军官学校第六期步兵科。1919年毕业后，在粤军任排长。1922年陈炯明叛变时，他拥护孙中山，升任连长。\n1925年，余汉谋任国民革命军第四军第十一师营长，参加两次东征。1926年北伐开始，他率部留守广东。1927年升任第十一师团长。1928年任第五十九师师长。\n1929年蒋桂战争中，余汉谋支持陈济棠，被任命为第一集团军第一军军长。1930年中原大战期间，他留守广东，负责粤北防务。余汉谋治军严谨，注重训练，所部战斗力较强。他为人谨慎，对陈济棠忠诚，是陈氏统治广东的重要军事支柱。至1930年底，他已成为粤军中最具实力的将领之一。"
PRC_XuXianQian: "徐向前"
NSD_XuXianQiang: "徐向前"
PRC_XuXianQian_leader_desc: "§Y$PRC_XuXianQian_birth_info$\n§Y背景：§!§L$PRC_XuXianQian_bio$\n\n"
PRC_XuXianQian_birth_info: "生于：§!§L1901年11月8日；山西五台§!"
PRC_XuXianQian_bio: "徐向前，原名象谦，字子敬，山西五台人。1919年考入山西省立国民师范学校。1921年毕业后，在阳曲县小学任教。1924年考入黄埔军校第一期。在校期间加入中国共产党。1925年参加第一次东征，任教导团排长。\n1925年秋，徐向前被派往冯玉祥部国民军第二军，任政治教官。1926年任中山军事学校教官。1927年蒋介石“清党”后，他前往上海，后转赴武汉，任中央军事政治学校武汉分校队长。\n1927年8月，徐向前参加南昌起义，任起义军第十一军连指导员。起义失败后，他转赴广州，参加广州起义，任工人赤卫队第六联队队长。起义失败后，他坚持在海陆丰地区开展游击战争。1929年，中共中央派他前往鄂豫皖革命根据地。1930年，他任红一军副军长兼第一师师长，参与创建鄂豫皖革命根据地。徐向前军事才能突出，善于指挥游击战和运动战，很快成为红军的重要将领。"
PRC_LuoBinHui: "罗炳辉"
PRC_LuoBinHui_leader_desc: "§Y$PRC_LuoBinHui_birth_info$\n§Y背景：§!§L$PRC_LuoBinHui_bio$\n\n"
PRC_LuoBinHui_birth_info: "生于：§!§L1897年12月22日；云南彝良§!"
PRC_LuoBinHui_bio: "罗炳辉，原名德富，字宿星，云南彝良人，彝族。1914年入滇军，在唐继尧部当兵。1915年参加护国战争，作战勇敢，由士兵升至营长。1922年参加孙中山领导的北伐，任朱培德部少校营长。1926年参加北伐战争，在程潜部任营长。\n1927年蒋介石发动'四一二'政变后，罗炳辉对国民党清共政策产生不满。1928年任江西吉安县靖卫大队大队长。1929年7月，在共产党员赵醒吾等人影响下，他秘密加入中国共产党。同年11月，他领导吉安靖卫大队起义，率部加入红军，任江西红军独立第五团团长。\n1930年，罗炳辉任红六军第二纵队司令员，后任红十二军军长。他作战勇猛，善于游击战，在中央苏区反'围剿'斗争中屡立战功。他身材魁梧，力大过人，在红军中以擅长使用大刀闻名，被称为'神行太保'。至1930年底，他已成长为红军高级指挥员。"
PRC_ZhouKun: "周昆"
PRC_ZhouKun_leader_desc: "§Y$PRC_ZhouKun_birth_info$\n§Y背景：§!§L$PRC_ZhouKun_bio$\n\n"
PRC_ZhouKun_birth_info: "生于：§!§L1902年；湖南平江§!"
PRC_ZhouKun_bio: "周昆，湖南平江人。1925年参加农民运动。1926年加入中国共产党。1927年参加湘赣边界秋收起义，随部队上井冈山。在井冈山斗争时期，他历任排长、连长等职。1928年任红四军第三十一团营长，参加巩固和发展井冈山革命根据地的斗争。\n1929年，周昆随红四军主力出击赣南、闽西，任第一纵队支队长。他作战勇敢，指挥果断，在开辟赣南、闽西革命根据地的战斗中表现出色。1930年，他任红十二军第三十四师师长，参与中央苏区第一次反'围剿'斗争。\n周昆军事素质较好，善于学习，在实战中积累了丰富的指挥经验。他注重部队政治工作，强调官兵平等，在部队中有较高威信。至1930年底，他已成为红军中年轻有为的指挥员之一，为革命根据地的巩固和发展做出了贡献。"
PRC_XunHuaiZhou: "寻淮洲"
PRC_XunHuaiZhou_leader_desc: "§Y$PRC_XunHuaiZhou_birth_info$\n§Y背景：§!§L$PRC_XunHuaiZhou_bio$\n\n"
PRC_XunHuaiZhou_birth_info: "生于：§!§L1912年；湖南浏阳§!"
PRC_XunHuaiZhou_bio: "寻淮洲，湖南浏阳人。1927年参加湘赣边界秋收起义，年仅15岁。起义后随部队上井冈山，任战士、班长。在井冈山斗争中，他作战勇敢，机智灵活，多次在战斗中立功。1928年加入中国共产党。\n1929年，寻淮洲随红四军主力出击赣南、闽西，任排长、连长。在开辟赣南、闽西革命根据地的战斗中，他表现出出色的军事才能。1930年，他任红十二军第三十四师第一〇〇团团长，参与中央苏区第一次反'围剿'斗争。在龙冈战斗中，他率团担任主攻，歼灭国民党军第十八师一部。\n寻淮洲是红军中最年轻的团长之一，军事指挥才能突出，善于打硬仗、恶仗。他关心战士，与士兵同甘共苦，深得官兵爱戴。至1930年底，这位年仅18岁的红军团长已在多次战斗中崭露头角，显示出卓越的军事指挥才能。"
PRC_DongZhenTang: "董振堂"
PRC_DongZhenTang_leader_desc: "§Y$PRC_DongZhenTang_birth_info$\n§Y背景：§!§L$PRC_DongZhenTang_bio$\n\n"
PRC_DongZhenTang_birth_info: "生于：§!§L1895年；河北新河§!"
PRC_DongZhenTang_bio: "董振堂，字绍仲，河北新河人。1917年入保定陆军军官学校预备学校。1919年入保定军校第九期炮兵科。1922年毕业后，在冯玉祥部任排长。1924年参加冯玉祥发动的北京政变，升任连长。1926年随冯玉祥五原誓师，参加北伐，任营长。\n1927年，董振堂升任国民革命军第二集团军第十三旅旅长。1928年北伐完成后，任第二十六路军第七十三旅旅长。1930年中原大战期间，他率部在河南与蒋军作战。冯玉祥战败后，第二十六路军被蒋介石收编，董振堂继续任旅长，驻防山东济宁。\n董振堂治军严明，体恤士兵，在西北军中以正直闻名。他对蒋介石排除异己、压制非嫡系部队的做法不满，对共产党主张的抗日救国纲领产生共鸣。至1930年底，他虽仍在国民党军队中任职，但已开始思考新的出路。"
PRC_GuZuoLing: "顾作霖"
PRC_GuZuoLing_leader_desc: "§Y$PRC_GuZuoLing_birth_info$\n§Y背景：§!§L$PRC_GuZuoLing_bio$\n\n"
PRC_GuZuoLing_birth_info: "生于：§!§L1908年；江苏嘉定（今属上海）§!"
PRC_GuZuoLing_bio: "顾作霖，江苏嘉定人。1925年入上海大学学习，在校期间参加学生运动，加入中国共产党。1926年任共青团上海杨树浦部委书记，领导工人运动。1927年参加上海工人第三次武装起义，负责宣传工作。蒋介石发动'四一二'政变后，他转入地下斗争。\n1928年，顾作霖任共青团江苏省委书记。1929年调任共青团中央组织部部长。1930年，他进入中央革命根据地，任少共（共青团）苏区中央局书记，负责苏区青年工作。他参与创办列宁团校，培养青年干部，组织少年先锋队和儿童团，为苏区青年运动的发展奠定了基础。\n顾作霖工作勤奋，善于组织动员，在苏区青年中享有很高威信。他注重青年思想教育，结合革命斗争实际开展团的工作。至1930年底，他已成为苏区青年工作的重要领导人。"
PRC_RenBiShi: "任弼时"
PRC_RenBiShi_leader_desc: "§Y$PRC_RenBiShi_birth_info$\n§Y背景：§!§L$PRC_RenBiShi_bio$\n\n"
PRC_RenBiShi_birth_info: "生于：§!§L1904年4月30日；湖南湘阴§!"
PRC_RenBiShi_bio: "任弼时，原名培国，湖南湘阴人。1920年加入中国社会主义青年团。1921年赴苏联莫斯科东方劳动者共产主义大学学习。1922年转为中国共产党党员。1924年回国，在上海大学任教。1925年任共青团中央组织部部长。\n1927年，任弼时在中共五大上当选为中央委员。大革命失败后，他参加八七会议，当选为临时中央政治局委员。1928年在中共六大上继续当选为中央委员。1929年任中共江苏省委常委、宣传部部长。\n1930年，任弼时进入中央革命根据地，任苏区中央局委员、组织部部长。他参与领导苏区党的建设、干部培养和群众工作。任弼时理论水平较高，工作细致深入，善于调查研究。他作风朴实，平易近人，在干部群众中威信很高。至1930年底，他已成为苏区党和政权建设的重要领导人之一。"
PRC_XieJueZai: "谢觉哉"
PRC_XieJueZai_leader_desc: "§Y$PRC_XieJueZai_birth_info$\n§Y背景：§!§L$PRC_XieJueZai_bio$\n\n"
PRC_XieJueZai_birth_info: "生于：§!§L1884年4月27日；湖南宁乡§!"
PRC_XieJueZai_bio: "谢觉哉，原名维鋆，字焕南，湖南宁乡人。清末秀才。1905年考入湖南商业师范学堂。1911年参加辛亥革命。1913年任教于宁乡云山学校。1919年参加五四运动。1921年加入新民学会。1925年加入中国共产党。\n1926年，谢觉哉任国民党湖南省党部常委兼工人部部长，开展工农运动。1927年马日事变后，他转入地下斗争。1928年到上海，负责编辑中共中央机关报《红旗日报》。1930年进入中央革命根据地，任毛泽东秘书，后任临时中央政府秘书长。\n谢觉哉是党内著名的'秀才'，文笔流畅，擅长公文写作和法律工作。他参与起草《中华苏维埃共和国宪法大纲》等法律文件，为苏区法制建设奠定了基础。他工作认真细致，作风严谨，深得毛泽东等领导人信任。至1930年底，他已成为苏区政权建设的重要骨干。"
PRC_DongBiWu: "董必武"
PRC_DongBiWu_leader_desc: "§Y$PRC_DongBiWu_birth_info$\n§Y背景：§!§L$PRC_DongBiWu_bio$\n\n"
PRC_DongBiWu_birth_info: "生于：§!§L1886年3月5日；湖北黄安（今红安）§!"
PRC_DongBiWu_bio: "董必武，原名贤琮，字洁畲，湖北黄安人。清末秀才。1911年参加辛亥革命，加入同盟会。1914年赴日本留学，入东京私立日本大学法科。1917年回国，在武昌从事律师工作。1920年参与创建武汉共产主义小组。\n1921年，董必武出席中国共产党第一次全国代表大会。会后回湖北，负责党组织发展和工农运动。1924年任国民党湖北省党部常委。1926年出席国民党二大，当选为候补中央执行委员。1927年大革命失败后，他赴苏联学习。\n1928年，董必武入莫斯科中山大学特别班学习。1929年转入列宁学院。1930年回国，进入中央革命根据地，任马克思共产主义学校（中央党校）教务长、副校长。他主讲党史、马列主义理论，为苏区培养了大批干部。董必武是党的创始人之一，德高望重，理论水平高，在党内享有崇高威信。"
PRC_XuTeLi: "徐特立"
PRC_XuTeLi_leader_desc: "§Y$PRC_XuTeLi_birth_info$\n§Y背景：§!§L$PRC_XuTeLi_bio$\n\n"
PRC_XuTeLi_birth_info: "生于：§!§L1877年2月1日；湖南善化（今长沙）§!"
PRC_XuTeLi_bio: "徐特立，原名懋恂，字师陶，湖南善化人。1895年开始教书。1905年入宁乡速成师范学校。1910年赴日本考察教育。1911年参加辛亥革命。1912年创办长沙师范学校。1919年赴法国勤工俭学。1924年回国，任湖南省立第一女子师范学校校长。\n1927年大革命失败后，徐特立加入中国共产党。同年参加南昌起义，任革命委员会委员。起义失败后，他赴苏联学习。1928年入莫斯科中山大学特别班。1930年回国，进入中央革命根据地，任教育部副部长、代部长。\n徐特立是党内著名的教育家，长期从事教育工作，经验丰富。在苏区，他主持制定教育方针政策，创办列宁小学、夜校、识字班，开展扫盲运动，为苏区教育事业的发展作出了重要贡献。他生活简朴，工作勤奋，深受苏区干部群众尊敬。至1930年底，他已成为苏区教育事业的奠基人之一。"
PRC_lingboqu: "林伯渠"
PRC_LingBoQu: "林伯渠"
PRC_lingboqu_leader_desc: "§Y$PRC_lingboqu_birth_info$\n§Y背景：§!§L$PRC_lingboqu_bio$\n\n"
PRC_lingboqu_birth_info: "生于：§!§L1886年3月20日；湖南安福（今临澧）§!"
PRC_lingboqu_bio: "林伯渠，名祖涵，字邃园，湖南安福人。1904年赴日本留学，入东京弘文学院。1905年加入同盟会。1911年参加辛亥革命。1913年参加二次革命，失败后流亡日本。1916年回国，在湖南从事革命活动。\n1921年，林伯渠加入中国共产党。1923年任国民党中央总务部副部长，协助孙中山改组国民党。1924年出席国民党一大，当选为中央候补执行委员。1926年任国民党中央农民部部长。1927年参加南昌起义，任革命委员会财政委员会主席。\n1928年，林伯渠赴苏联学习。1930年回国，进入中央革命根据地，任临时中央政府国民经济部部长。他主持苏区经济建设，发展农业生产，组织对外贸易，为打破国民党经济封锁、保障苏区物资供应作出了重要贡献。林伯渠是党内资深革命家，经验丰富，善于理财，在苏区经济建设中发挥了关键作用。"
PRC_WuYuZhang: "吴玉章"
PRC_WuYuZhang_leader_desc: "§Y$PRC_WuYuZhang_birth_info$\n§Y背景：§!§L$PRC_WuYuZhang_bio$\n\n"
PRC_WuYuZhang_birth_info: "生于：§!§L1878年12月30日；四川荣县§!"
PRC_WuYuZhang_bio: "吴玉章，原名永珊，字树人，四川荣县人。1903年赴日本留学，入东京成城学校。1905年加入同盟会。1911年参加辛亥革命。1912年任南京临时政府总统府秘书。1913年参加二次革命，失败后流亡法国。\n1916年回国，从事教育事业。1925年加入中国共产党。1926年出席国民党二大，当选为中央执行委员。1927年参加南昌起义，任革命委员会秘书长。起义失败后，他赴苏联学习。\n1928年，吴玉章入莫斯科中山大学特别班学习。1930年回国，进入中央革命根据地，任苏维埃大学校长。他主持苏区干部教育，培养了大批党政军干部。吴玉章是党内著名的教育家、语言文字学家，他参与制定汉语拼音方案，推广普通话，为新中国语言文字改革奠定了基础。至1930年底，他已成为苏区教育事业的重要领导人。"

PRC_KangSheng: "康生"
PRC_KangSheng_leader_desc: "§Y$PRC_KangSheng_birth_info$\n§Y背景：§!§L$PRC_KangSheng_bio$\n\n"
PRC_KangSheng_birth_info: "生于：§!§L1898年；山东诸城§!"
PRC_KangSheng_bio: "康生，原名张宗可，字少卿，山东诸城人。1917年入山东省立第一师范学校。1924年入上海大学社会科学系。1925年加入中国共产党。1926年任上海大学特支书记。1927年参加上海工人第三次武装起义。\n1927年蒋介石发动'四一二'政变后，康生转入地下斗争。1928年任中共江苏省委组织部部长。1930年任中共中央组织部秘书长。他长期在上海从事地下工作，负责组织、情报和保卫工作。\n康生精明干练，善于权谋，在党内斗争中立场坚定。他熟悉党的组织工作，对敌斗争经验丰富。至1930年底，他已在上海地下工作中积累了丰富经验，成为党在白区工作的重要骨干。但他也因行事诡秘、手段严厉而在党内引起一些争议。"

PRC_LiuShaoQi: "刘少奇"
PRC_LiuShaoQi_leader_desc: "§Y$PRC_LiuShaoQi_birth_info$\n§Y背景：§!§L$PRC_LiuShaoQi_bio$\n\n"
PRC_LiuShaoQi_birth_info: "生于：§!§L1898年11月24日；湖南宁乡§!"
PRC_LiuShaoQi_bio: "刘少奇，名绍选，字渭璜，湖南宁乡人。1916年入宁乡县立第一高等小学。1919年入长沙育才中学。1920年加入中国社会主义青年团。1921年赴苏联莫斯科东方劳动者共产主义大学学习，同年转为中国共产党党员。1922年回国，在中国劳动组合书记部工作。\n1922年9月，刘少奇参与领导安源路矿工人大罢工，任工人俱乐部全权代表。罢工胜利后，任安源路矿工人俱乐部主任。1925年，在第二次全国劳动大会上当选为中华全国总工会副委员长，参与领导五卅运动和省港大罢工。1927年，在中共五大上当选为中央委员。\n1928年，刘少奇以中共中央特派员身份到天津，指导顺直省委工作。1929年任中共满洲省委书记。1930年，出席在莫斯科召开的赤色职工国际第五次代表大会，当选为赤色职工国际执行局委员。会后留在赤色职工国际工作。刘少奇是中国工人运动的主要领导人之一，在领导工人运动、党的建设等方面有重要贡献。"
PRC_RaoShuShi: "饶漱石"
PRC_RaoShuShi_leader_desc: "§Y$PRC_RaoShuShi_birth_info$\n§Y背景：§!§L$PRC_RaoShuShi_bio$\n\n"
PRC_RaoShuShi_birth_info: "生于：§!§L1903年；江西临川§!"
PRC_RaoShuShi_bio: "饶漱石，曾用名梁朴，江西临川人。1923年加入中国社会主义青年团。1925年加入中国共产党。1926年任中共江西省委宣传部部长。1927年大革命失败后，转入地下工作。1928年任中共赣东北特委书记。1929年任中共江西省委书记。1930年，他进入中央苏区，任中共苏区中央局委员、组织部部长。他参与领导苏区党的建设、干部培养和群众工作。饶漱石工作能力强，但作风较为专断，在党内有争议。至1930年底，他已成为苏区重要的党务工作者。"
PRC_DengPing: "邓萍"
PRC_DengPing_leader_desc: "§Y$PRC_DengPing_birth_info$\n§Y背景：§!§L$PRC_DengPing_bio$\n\n"
PRC_DengPing_birth_info: "生于：§!§L1908年；四川富顺§!"
PRC_DengPing_bio: "邓萍，四川富顺人。1926年考入武汉中央军事政治学校。1927年加入中国共产党。同年8月参加南昌起义，任起义军排长。起义失败后，随部队转战粤闽赣湘边界。1928年参加湘南起义，任连长。同年4月随朱德、陈毅上井冈山，任红四军连长。1929年任红五军纵队参谋长。1930年任红三军团参谋长，协助军团长彭德怀指挥作战。他参与指挥红三军团攻占长沙等战役，表现出出色的参谋才能。邓萍年轻有为，军事素质好，是红军中优秀的参谋人才。至1930年底，他已成为红三军团的重要领导人之一。"
PRY_DengXiaoPing: "邓小平"
PRY_DengXiaoPing_leader_desc: "§Y$PRY_DengXiaoPing_birth_info$\n§Y背景：§!§L$PRY_DengXiaoPing_bio$\n\n"
PRY_DengXiaoPing_birth_info: "生于：§!§L1904年8月22日；四川广安§!"
PRY_DengXiaoPing_bio: "邓小平，原名希贤，学名邓先圣，四川广安人。1919年入重庆留法预备学校。1920年赴法国勤工俭学。1922年加入旅欧中国少年共产党（后改称旅欧中国共产主义青年团）。1924年转为中国共产党党员。1925年任旅欧共青团执委会书记局委员。\n1926年初，邓小平离法赴苏联，入莫斯科中山大学学习。1927年春回国，被派往冯玉祥部中山军事学校任政治处处长。大革命失败后，任中共中央秘书长。1928年任中共中央秘书长。\n1929年夏，邓小平作为中共中央代表前往广西，领导当地革命工作。他化名邓斌，任中共广西前敌委员会书记。12月，与张云逸、韦拔群等领导百色起义，创建红七军和右江苏维埃政府，任红七军政治委员、前委书记。1930年2月，与李明瑞、俞作豫等领导龙州起义，创建红八军。10月，率红七军离开右江根据地，转战桂黔湘粤赣边界，前往中央苏区。邓小平年轻有为，政治工作能力强，在创建右江革命根据地和红七军中发挥了重要作用。"
PRC_ChenYun: "陈云"
PRC_ChenYun_leader_desc: "§Y$PRC_ChenYun_birth_info$\n§Y背景：§!§L$PRC_ChenYun_bio$\n\n"
PRC_ChenYun_birth_info: "生于：§!§L1905年6月13日；江苏青浦（今属上海）§!"
PRC_ChenYun_bio: "陈云，原名廖陈云，江苏青浦人。1919年高小毕业后到上海商务印书馆当学徒、店员。1925年参加五卅运动，同年加入中国共产党，任商务印书馆发行所职工会委员长。1926年10月至1927年3月，参加上海工人三次武装起义。\n1927年大革命失败后，陈云回家乡从事农民运动，任中共青浦县委书记、淞浦特委组织部部长。1929年任中共江苏省委沪宁巡视员、江苏省委常委兼农委书记。1930年在中共六届三中全会上当选为中央候补委员。\n1930年9月，陈云在中共六届三中全会上当选为中央候补委员。他长期在上海从事工人运动和党的地下工作，积累了丰富的斗争经验。陈云注重调查研究，作风务实，在领导工人运动和党的组织工作方面表现出色。至1930年底，他已是党在江苏地区的重要领导干部。"
PRC_FangZhiMing: "方志敏"
PRC_FangZhiMing_leader_desc: "§Y$PRC_FangZhiMing_birth_info$\n§Y背景：§!§L$PRC_FangZhiMing_bio$\n\n"
PRC_FangZhiMing_birth_info: "生于：§!§L1899年8月21日；江西弋阳§!"
PRC_FangZhiMing_bio: "方志敏，名远镇，字志敏，江西弋阳人。1916年入弋阳县立高等小学。1919年入江西省立南昌甲种工业学校。1922年入九江伟烈大学。1924年加入中国共产党。1925年任国民党江西省党部农民部部长。\n1926年，方志敏回弋阳开展农民运动，组织农民协会。1927年大革命失败后，他回弋阳、横峰一带组织农民武装。1928年1月，领导弋横起义，创建赣东北革命根据地和红十字。1929年任信江苏维埃政府主席。\n1930年，方志敏任赣东北省苏维埃政府主席、红十字军长。他领导赣东北根据地军民开展土地革命，进行武装斗争，使根据地不断扩大。方志敏善于做群众工作，重视根据地建设，在极其困难的条件下坚持斗争。他撰写了《可爱的中国》、《清贫》等文章，表达了对革命事业的坚定信念。至1930年底，赣东北根据地已成为全国主要的革命根据地之一。"
PRC_LiuBoChen: "刘伯承"
PRC_LiuBoChen_leader_desc: "§Y$PRC_LiuBoChen_birth_info$\n§Y背景：§!§L$PRC_LiuBoChen_bio$\n\n"
PRC_LiuBoChen_birth_info: "生于：§!§L1892年12月4日；四川开县（今属重庆）§!"
PRC_LiuBoChen_bio: "刘伯承，名明昭，字伯承，四川开县人。1911年参加辛亥革命。1912年入重庆军政府将校学堂。1914年加入中华革命党。1916年参加护国战争，任连长。1923年参加讨伐吴佩孚的战争，任东路讨贼军第一路指挥官。1926年加入中国共产党。\n1926年12月，刘伯承任国民革命军川军各路总指挥，参与领导泸顺起义。1927年8月，参加南昌起义，任中共前敌委员会参谋团参谋长。起义失败后，赴苏联学习。1928年入莫斯科高级步兵学校。1929年入伏龙芝军事学院。\n1930年夏，刘伯承从苏联回国，任中共中央军委参谋长、长江局军委书记。他协助周恩来处理中央军委日常工作，参与指导各地红军斗争。刘伯承军事理论扎实，实战经验丰富，善于谋划，在红军中以'军神'著称。至1930年底，他已成为红军军事指挥和参谋工作的重要领导人。"
NAF_ZhaoShanZhi: "赵尚志"
NAF_ZhaoShanZhi_leader_desc: "§Y$NAF_ZhaoShanZhi_birth_info$\n§Y背景：§!§L$NAF_ZhaoShanZhi_bio$\n\n"
NAF_ZhaoShanZhi_birth_info: "生于：§!§L1908年10月26日；辽宁朝阳§!"
NAF_ZhaoShanZhi_bio: "赵尚志，辽宁朝阳人。1925年考入哈尔滨许公工业学校，同年加入中国共产党。1926年进入黄埔军校第四期学习。1927年大革命失败后，他被派往东北从事党的地下工作。1928年被捕入狱，在狱中坚贞不屈。1930年出狱后，继续在东北从事革命活动。他善于组织群众，在哈尔滨、绥化等地建立党的秘密组织。赵尚志性格刚毅，富有军事才能，对东北地区情况熟悉。至1930年底，他正在东北地区积蓄力量，为日后组织抗日游击队、创建东北抗日联军第三军奠定了基础。他后来成为东北抗日联军的主要创建者和领导人之一，被誉为“北国雄狮”。"
SOX_MaoGuangXiang: "毛光翔"
ROH_MaoGuangXing: "毛光翔"
SOX_MaoGuangXiang_leader_desc: "§Y$SOX_MaoGuangXiang_birth_info$\n§Y背景：§!§L$SOX_MaoGuangXiang_bio$\n\n"
SOX_MaoGuangXiang_birth_info: "生于：§!§L1894年；贵州遵义§!"
SOX_MaoGuangXiang_bio: "毛光翔，字群麟，贵州遵义人。早年入贵州陆军小学，后入贵州讲武学堂。毕业后在黔军周西成部服役，由排长累升至旅长。1926年，周西成任贵州省主席，毛光翔成为其得力干将，任第二十五军副军长。1929年，周西成在与李燊的战争中战死，毛光翔在王家烈、犹国才等将领支持下继任第二十五军军长兼贵州省主席。他主政贵州后，试图延续周西成的政策，整顿军政，发展经济。但黔军内部矛盾重重，王家烈等将领不服其领导。1930年，他勉强维持贵州统一，但实际控制范围有限。毛光翔能力平庸，缺乏魄力，在黔军将领中威望不足。至1930年底，他虽名义上是贵州最高统治者，但统治基础已开始动摇。"
SOX_SongXing: "宋醒"
SOX_SongXing_leader_desc: "§Y$SOX_SongXing_birth_info$\n§Y背景：§!§L$SOX_SongXing_bio$\n\n"
SOX_SongXing_birth_info: "生于：§!§L1893年；贵州铜仁§!"
SOX_SongXing_bio: "宋醒，字觉民，贵州铜仁人。早年入贵州陆军小学，后入贵州讲武学堂。毕业后在黔军服役，历任排长、连长、营长。1920年代，他追随周西成，参与贵州军阀混战，因战功升任团长。1929年周西成战死后，他转而支持毛光翔，被任命为第二十五军第二师师长，驻防黔东地区。宋醒治军较严，注重训练，其师战斗力在黔军中属中上水平。他控制铜仁、松桃等县，自征赋税，委任官吏，成为相对独立的小军阀。1930年中原大战期间，他保持中立，集中精力经营防区。宋醒为人圆滑，善于周旋于各派之间，在黔军内部斗争中常保持相对超脱。至1930年底，他仍是贵州军阀中拥有一定实权的人物。"
PRC_WangJiaXiang: "王稼祥"
PRC_WangJiaXiang_leader_desc: "§Y$PRC_WangJiaXiang_birth_info$\n§Y背景：§!§L$PRC_WangJiaXiang_bio$\n\n"
PRC_WangJiaXiang_birth_info: "生于：§!§L1906年8月15日；安徽泾县§!"
PRC_WangJiaXiang_bio: "王稼祥，原名嘉祥，又名稼蔷，安徽泾县人。1925年入上海大学附中学习，同年加入中国共产主义青年团。1928年转为中国共产党党员。同年赴苏联学习，入莫斯科中山大学。在苏联期间，他系统学习了马克思列宁主义理论，俄语水平较高。1930年回国，在上海从事党的宣传工作。他理论功底扎实，文笔流畅，在党的刊物上发表多篇文章，宣传革命理论。王稼祥工作认真，作风严谨，但缺乏实际革命经验。至1930年底，他正在上海从事党的宣传和理论工作，是党内年轻的理论干部之一。后来他进入中央苏区，成为党和红军的重要领导人之一，在外交和军事政治工作方面有重要贡献。"
MGJ_Demchugdongrub: "德穆楚克栋鲁普亲王"
MGJ_Demchugdongrub_leader_desc: "§Y$MGJ_Demchugdongrub_birth_info$\n§Y背景：§!§L$MGJ_Demchugdongrub_bio$\n\n"
MGJ_Demchugdongrub_birth_info: "生于：§!§L1902年2月8日；内蒙古锡林郭勒盟苏尼特右旗§!"
MGJ_Demchugdongrub_bio: "德穆楚克栋鲁普亲王，字希贤，通称德王。出身于清代蒙古苏尼特部右翼旗世袭札萨克多罗杜棱郡王家族，为成吉思汗黄金家族后裔。1908年，其父那木济勒旺楚克逝世，年仅6岁的德王承袭郡王爵位。1913年，北洋政府晋封其为札萨克和硕杜棱亲王。\n1919年，年满十八岁的德王正式执掌苏尼特右旗旗政。他自幼接受王府家塾教育，熟读蒙、汉典籍，常以成吉思汗第三十代世孙自居，怀有强烈的复兴蒙古民族之志。1924年，他升任锡林郭勒盟副盟长，开始涉足更广阔的政治舞台。同年11月，溥仪被逐出紫禁城，德王迅即前往北京拜见，并行三跪九拜大礼，显露出其浓厚的忠君与复辟思想。\n1925年，他先后出任北京善后会议委员、临时参议院参政等职，与中央政府保持联系。然而，其政治野心并未止步于此。为了实现“重振蒙古”的目标，他开始多方寻求外部力量支持。1929年，德王做出了两项关键举动：其一，被任命为察哈尔省政府委员，进一步巩固了其在军政界的位置；其二，他以自己的900名卫队为基础，初步组建了武装力量，这支队伍后来成为其军事活动的核心。同年冬，日本关东军特务开始潜入内蒙古地区进行活动，德王与日本方面有了初步接触。至1930年，德王已成为内蒙古地区一位拥有世袭权威、政治抱负并开始积累武装力量的重要王公，其周旋于中央、地方与外国势力之间的复杂政治生涯已现端倪。"
HZD_HouZhiDan: "侯之担"
HZD_HouZhiDan_leader_desc: "§Y$HZD_HouZhiDan_birth_info$\n§Y背景：§!§L$HZD_HouZhiDan_bio$\n\n"
HZD_HouZhiDan_birth_info: "生于：§!§L1894年；贵州遵义§!"
HZD_HouZhiDan_bio: "侯之担，字志丹，贵州遵义人。早年入贵州陆军小学，后入贵州讲武学堂。毕业后在黔军周西成部服役，由排长累升至旅长。1926年，周西成任贵州省主席，侯之成为其部属，任第二十五军第三师师长。1929年周西成战死后，他支持毛光翔继任，被任命为第二十五军副军长兼川黔边防司令，驻防黔北、川南交界地区。侯之担性格强悍，作战勇猛，但政治手腕不足。他控制赤水、习水、仁怀等县，自征赋税，建立自己的行政体系。1930年中原大战期间，他保持中立，集中精力经营防区。侯之担在黔军中以能战著称，但与其他将领关系紧张。至1930年底，他仍是贵州军阀中拥有较强军事实力的人物之一。"
ROQ_MaQi: "马麟"
ROQ_MaQi_leader_desc: "§Y$ROQ_MaQi_birth_info$\n§Y背景：§!§L$ROQ_MaQi_bio$\n\n"
ROQ_MaQi_birth_info: "生于：§!§L1869年；甘肃临夏§!"
ROQ_MaQi_bio: "马麒，字阁臣，甘肃临夏人，回族。早年随父马海晏在清军中服役，参与镇压河湟事变。1900年随父参加抗击八国联军，父死后继任旗官。1911年辛亥革命后，他投靠北洋政府，任西宁镇总兵，后任甘边宁海镇守使，建立宁海军，成为青海地区的实际统治者。1920年代，他周旋于北洋各派军阀之间，维护自己在青海的统治。1926年，冯玉祥部进入甘肃，他宣布加入国民军，被任命为国民军第二十六师师长。1928年青海建省，他任省政府主席。1929年，马仲英起事，他率部参与围剿。1930年中原大战期间，他保持中立，继续巩固在青海的统治。马麒为人精明，善于权术，通过联姻、结盟等手段控制青海各族头人。他重视教育，创办青海第一所新式学校。至1930年底，他已完全控制青海军政大权，为马步芳日后统治青海奠定了基础。"
ROQ_MaBuFang: "马步芳"
ROQ_MaBuFang_leader_desc: "§Y$ROQ_MaBuFang_birth_info$\n§Y背景：§!§L$ROQ_MaBuFang_bio$\n\n"
ROQ_MaBuFang_birth_info: "生于：§!§L1903年；甘肃临夏§!"
ROQ_MaBuFang_bio: "马步芳，字子香，甘肃临夏人，回族，马麒之子。早年在家乡接受经堂教育与军事训练，后入宁海军官训练团学习。1920年代初，他随父参与青海地区的军事行动，历任营长、团长。1928年青海建省后，他任暂编第一师师长，驻防化隆、循化等地，成为其父统治青海的得力助手。马步芳性格强悍，治军严酷，并注重培植个人势力，在军队和地方政府中安插亲信。1930年，其父马麒病重，他开始实际主持青海军政事务。他一方面与河西走廊的马仲英势力对抗，另一方面积极向蒋介石的南京中央政府靠拢，试图取得正式任命以巩固地位。至1930年底，他已成为青海马家军中最具实力的少壮派领袖，为其日后完全掌控青海军政大权铺平了道路。"
ROC_HuangShaoHong: "黄绍竑"
ROC_HuangShaoHong_leader_desc: "§Y$ROC_HuangShaoHong_birth_info$\n§Y背景：§!§L$ROC_HuangShaoHong_bio$\n\n"
ROC_HuangShaoHong_birth_info: "生于：§!§L1895年12月1日；广西容县§!"
ROC_HuangShaoHong_bio: "黄绍竑，字季宽，广西容县人。1911年考入广西陆军小学，与李宗仁、白崇禧为先后期同学。1914年升入武昌陆军第二预备学校，1916年入保定陆军军官学校第三期步兵科。1919年毕业后回广西，在旧桂系军队中任职。1921年，他转而投效孙中山领导的“广西讨贼军”，与李宗仁、白崇禧合作。在1924年至1925年的统一广西战斗中，他担任“定桂讨贼联军”副总指挥，运筹帷幄，战功卓著，成为新桂系的核心领袖之一。1926年两广统一，桂军改编为国民革命军第七军，他任党代表兼广西省政府主席，主持广西省政。北伐开始后，他留守广西，负责后勤支援和巩固后方。1927年“四一二”政变后，他支持蒋介石“清党”。1929年蒋桂战争爆发，桂系战败，他一度寓居香港。1930年中原大战期间，他返回广西，协助李宗仁、白崇禧重整旗鼓。黄绍竑政治手腕灵活，擅长行政与外交，是桂系中不可或缺的政军全才。"
ROC_LiZongRen: "李宗仁"
ROC_LiZongRen_leader_desc: "§Y$ROC_LiZongRen_birth_info$\n§Y背景：§!§L$ROC_LiZongRen_bio$\n\n"
ROC_LiZongRen_birth_info: "生于：§!§L1890年8月13日；广西临桂§!"
ROC_LiZongRen_bio: "李宗仁，字德邻，广西临桂人。1908年考入广西陆军小学，1912年升入广西陆军速成学堂。毕业后在旧桂系军队中由排长累升至营长。1921年，他脱离旧桂系，与黄绍竑、白崇禧等组建“广西定桂讨贼联军”，任总指挥，经过数年征战，于1925年统一广西，成为新桂系的首领。1926年两广统一，所部改编为国民革命军第七军，他任军长，率部参加北伐，在湖南、湖北、江西等地屡建战功，尤其在贺胜桥战役中表现突出。1927年，他支持蒋介石“清党”，并任武汉政治分会主席。1928年北伐完成后，任第四集团军总司令、武汉政治分会主席，势力扩展到两湖地区。1929年蒋桂战争爆发，他战败后被迫下野，流亡越南。1930年中原大战期间，他返回广西，与白崇禧、黄绍竑重组力量，出兵湖南策应冯玉祥、阎锡山反蒋，但未能改变战局。至1930年底，他作为桂系的核心领袖，仍在广西积蓄力量，等待时机。李宗仁为人宽厚，在桂系内部威望极高，有“李老总”之称。"
ROC_HuangXuChu: "黄旭初"
ROC_HuangXuChu_leader_desc: "§Y$ROC_HuangXuChu_birth_info$\n§Y背景：§!§L$ROC_HuangXuChu_bio$\n\n"
ROC_HuangXuChu_birth_info: "生于：§!§L1892年；广西容县§!"
ROC_HuangXuChu_bio: "黄旭初，字旭初，广西容县人，黄绍竑族弟。早年受黄绍竑影响，投身军旅。1916年入广西陆军讲武堂学习，毕业后在旧桂系军队中任下级军官。1921年转入黄绍竑部，参与统一广西的战争，以忠诚勤勉见称。1926年新桂系统治广西后，他主要在地方政府任职，历任县长、行政督察专员等职，积累了丰富的行政经验。1929年蒋桂战争后，他随桂系主力退守广西，负责地方政务和后勤保障。1930年中原大战期间，他留守广西后方，致力于维持地方秩序、征募粮饷，支持前线作战。黄旭初为人谨慎细致，精于理财和行政管理，虽不直接统兵，但在桂系治理广西的过程中发挥了重要作用，是桂系领导层中重要的文官和幕僚人才。"
ROY_LongYun: "龙云"
ROY_LongYun_leader_desc: "§Y$ROY_LongYun_birth_info$\n§Y背景：§!§L$ROY_LongYun_bio$\n\n"
ROY_LongYun_birth_info: "生于：§!§L1884年11月19日；云南昭通§!"
ROY_LongYun_bio: "龙云，原名登云，字志舟，彝族，云南昭通人。早年曾就读于昭通师范学校，后因家贫辍学，流落江湖。1911年加入滇军，参加辛亥革命。1912年入云南讲武堂第四期骑兵科，与朱德等同窗。毕业后在滇军中服役，历任排长、连长、营长。1921年，他因在顾品珍、唐继尧的政争中支持唐继尧，得到重用，升任近卫军团长。1922年任第五军军长。1927年，他联合胡若愚、张汝骥等发动“二六政变”，推翻唐继尧，成为云南的实际控制者之一。经过一系列内部斗争，他于1928年击败胡若愚，被蒋介石任命为云南省主席兼国民革命军第三十八军军长，开始其对云南长达十八年的统治。至1930年，他已初步稳固在云南的统治，整顿军队，发展经济，并谨慎处理与南京中央政府和邻省军阀的关系，致力于将云南建设为相对独立的根据地。"
ROM_MaQi: "马麟"
ROM_MaQi_leader_desc: "§Y$ROM_MaQi_birth_info$\n§Y背景：§!§L$ROM_MaQi_bio$\n\n"
ROM_MaQi_birth_info: "生于：§!§L1869年；甘肃河州（今临夏）§!"
ROM_MaQi_bio: "马麒，字阁臣，回族，甘肃河州人，西北马家军“青马”的奠基人。其家族世居河州，父马海晏为清军军官。马麒早年随父从军，1900年父死于抗击八国联军途中后，他承袭父职，任旗官。清末民初，他审时度势，先依附北洋政府，被任命为西宁镇总兵，后任甘边宁海镇守使，以宁海军为核心，逐步控制了青海地区。他采取“以教治教、以番治番”的策略，利用伊斯兰教和藏族部落头人的影响力巩固统治，同时引入汉族文官处理日常政务。1920年代，他在冯玉祥国民军入甘的复杂局势中巧妙周旋，保住了自己的地盘。1928年青海正式建省，他出任省主席。1930年，他已病重，将权柄逐渐移交给其子马步芳。马麒统治青海近二十年，确立了马氏家族在青海的世袭统治基础，其统治兼具封建性、民族性和军阀性。"
ROZ_MaHongBing: "马鸿宾"
ROZ_MaHongBing_leader_desc: "§Y$ROZ_MaHongBing_birth_info$\n§Y背景：§!§L$ROZ_MaHongBing_bio$\n\n"
ROZ_MaHongBing_birth_info: "生于：§!§L1884年9月14日；甘肃河州（今临夏）§!"
ROZ_MaHongBing_bio: "马鸿宾，字子寅，回族，甘肃河州人，马福禄之子，马福祥之侄。早年随叔父马福祥在西北军中任职，历任营长、团长、旅长。1921年任宁夏镇守使，开始经营宁夏。1926年冯玉祥五原誓师后，他加入国民军，任第二集团军第二十二师师长。1927年任宁夏省政府主席。1929年蒋冯战争后，他转而投靠蒋介石，任暂编第七师师长。1930年中原大战期间，他 initially 支持冯玉祥，但见形势不利，又转而支持蒋介石，被任命为宁夏省政府主席兼第十五路军总指挥。马鸿宾为人相对温和，注重地方建设，在宁夏兴办教育，整顿财政。但他与堂弟马鸿逵矛盾较深，争夺宁夏控制权。至1930年底，他虽名义上控制宁夏，但统治并不稳固。"
ROZ_MaHongKui: "马鸿逵"
ROK_MaHongKui: "马鸿逵"
ROZ_MaHongKui_leader_desc: "§Y$ROZ_MaHongKui_birth_info$\n§Y背景：§!§L$ROZ_MaHongKui_bio$\n\n"
ROZ_MaHongKui_birth_info: "生于：§!§L1892年3月11日；甘肃河州（今临夏）§!"
ROZ_MaHongKui_bio: "马鸿逵，字少云，回族，甘肃河州人，马福祥之子。早年入兰州陆军小学，后入北京汇文中学。1912年入袁世凯总统府任侍卫武官。1914年入宁夏新军，任营长。1920年任第五混成旅旅长。1926年随父马福祥加入冯玉祥国民军，任第四路军总司令。1927年任第二集团军第一方面军第四军军长。1929年蒋冯战争后，他脱离冯玉祥，投靠蒋介石，任第十五路军总指挥。1930年中原大战期间，他支持蒋介石，率部在山东、河南作战，战后任宁夏省政府主席。马鸿逵野心勃勃，手段强硬，与其堂兄马鸿宾争夺宁夏控制权。至1930年底，他正积极活动，试图取代马鸿宾，独掌宁夏大权。"
CAR_FengYuXiang: "冯玉祥"
CAR_FengYuXiang_leader_desc: "§Y$CAR_FengYuXiang_birth_info$\n§Y背景：§!§L$CAR_FengYuXiang_bio$\n\n"
CAR_FengYuXiang_birth_info: "生于：§!§L1882年11月6日；安徽巢县§!"
CAR_FengYuXiang_bio: "冯玉祥，字焕章。早年入伍淮军，后投效北洋军，凭借战功和治军才能逐步晋升，历任营长、团长、旅长、师长。1921年任陕西督军，开始建立自己的势力。1924年第二次直奉战争中，他发动北京政变，囚禁总统曹锟，驱逐溥仪出宫，并将所部改称国民军，任总司令兼第一军军长，邀请孙中山北上。1925年任西北边防督办，所部称西北军。1926年加入国民党，同年9月在五原誓师，率部参加北伐，任国民革命军第二集团军总司令。1927年曾与蒋介石结拜，但后来因利益冲突而反目。1928年北伐完成后，任行政院副院长兼军政部长。1929年因军队编遣问题与蒋介石矛盾激化，爆发蒋冯战争，失败后下野。1930年联合阎锡山、李宗仁等发动中原大战，失败后西北军瓦解，他隐居山西。冯玉祥以治军严格、生活简朴著称，人称‘布衣将军’，其部队注重爱国主义教育，但内部关系复杂，最终未能形成稳固的政治集团。至1930年底，他已失去军权，但仍在政坛有一定影响力。"
CAR_JiHongchang: "吉鸿昌"
CAR_JiHongchang_leader_desc: "§Y$CAR_JiHongchang_birth_info$\n§Y背景：§!§L$CAR_JiHongchang_bio$\n\n"
CAR_JiHongchang_birth_info: "生于：§!§L1895年10月4日；河南扶沟§!"
CAR_JiHongchang_bio: "吉鸿昌，字世五，河南扶沟人。1913年投效冯玉祥部，从士兵做起，因作战勇猛，屡立战功，逐步升任连长、营长、团长。1926年随冯玉祥五原誓师，参加北伐，任国民革命军第二集团军第十九师师长。1929年任宁夏省政府主席。1930年中原大战期间，任冯玉祥部第二路军总指挥。西北军失败后，所部被蒋介石收编，他任第二十二路军总指挥兼第三十师师长，奉命‘围剿’鄂豫皖苏区。但他对内战渐生反感，加上与共产党人接触，思想逐渐转变。1931年因拒绝执行‘剿共’命令，被蒋介石解除兵权，强令出国‘考察’。吉鸿昌性格刚直，富有爱国心，在西北军中以勇猛善战著称。至1930年底，他虽仍在国民党军队中任职，但已开始萌生投奔革命的想法。"
LSX_LiShouXing: "李守信"
LSX_LiShouXing_leader_desc: "§Y$LSX_LiShouXing_birth_info$\n§Y背景：§!§L$LSX_LiShouXing_bio$\n\n"
LSX_LiShouXing_birth_info: "生于：§!§L1892年；热河朝阳（今辽宁朝阳）§!"
LSX_LiShouXing_bio: "李守信，原名李义，字子忠，热河朝阳人，蒙古族。早年投身绿林，后受热河都统汤玉麟招安，任骑兵营长。1928年东北易帜后，他任东北军骑兵第十七旅团长，驻防热河。1930年中原大战期间，他保持中立，控制热河北部地区，自成一股势力。李守信精通骑射，熟悉蒙汉情况，在热河、察哈尔一带的蒙古王公和土匪中颇有声望。他虽名义上服从东北军，但实际拥有独立的武装，控制数县之地，征收赋税，委任官吏。至1930年底，他正在热河地区扩大势力，为日后投靠日本、成为伪蒙军高级将领埋下伏笔。"
PRC_SuQu: "中央苏区临时政府"
PRC_SuQu_leader_desc: "§Y$PRC_SuQu_info$\n§Y背景：§!§L$PRC_SuQu_bio$\n\n"
PRC_SuQu_info: "成立于：§!§L1931年11月；江西瑞金§!\n§Y性质：§!§R苏维埃政权§!"
PRC_SuQu_bio: "中央苏区临时政府，全称中华苏维埃共和国临时中央政府，是中国共产党在中央革命根据地（中央苏区）建立的全国性苏维埃政权。随着各革命根据地的发展，中共中央决定建立统一的苏维埃中央政权。临时中央政府下设外交、军事、劳动、财政、土地、教育、内务、司法、工农检察等人民委员部，并颁布了《中华苏维埃共和国宪法大纲》以及土地法、劳动法等一系列法律法令。临时中央政府领导各苏区开展土地革命、经济建设和文化教育，指挥红军抗击国民党军的‘围剿’。虽然实际管辖区域主要限于中央苏区，但它是中国共产党建立全国政权的第一次尝试，为后来的政权建设积累了经验。"
PRH_ZhouYiQun: "周逸群"
PRH_ZhouYiQun_leader_desc: "§Y$PRH_ZhouYiQun_birth_info$\n§Y背景：§!§L$PRH_ZhouYiQun_bio$\n\n"
PRH_ZhouYiQun_birth_info: "生于：§!§L1896年；贵州铜仁§!"
PRH_ZhouYiQun_bio: "周逸群，原名周立凤，字逸群，贵州铜仁人。1919年考入贵阳南明中学，在校期间受五四运动影响，投身学生运动。1924年考入黄埔军校第二期，同年加入中国共产党。1925年参加两次东征，任国民革命军第一军政治部宣传科科长。1926年参加北伐，任国民革命军总政治部宣传大队长。1927年参加南昌起义，任起义军第二十军第三师师长。起义失败后，他转赴湘鄂西地区，与贺龙等共同创建湘鄂西革命根据地。1928年任中共湘鄂西前敌委员会书记，参与领导湘鄂西地区的武装斗争和土地革命。1930年，任红二军团政治委员，与贺龙共同指挥部队，巩固和发展湘鄂西根据地。周逸群善于政治工作和群众动员，在根据地建设中重视党的建设、政权建设和经济工作。至1930年底，他已成为湘鄂西革命根据地和红二军团的主要领导人之一。"
PRH_XiaXi: "夏曦"
PRH_XiaXi_leader_desc: "§Y$PRH_XiaXi_birth_info$\n§Y背景：§!§L$PRH_XiaXi_bio$\n\n"
PRH_XiaXi_birth_info: "生于：§!§L1901年；湖南益阳§!"
PRH_XiaXi_bio: "夏曦，字蔓伯，湖南益阳人。1917年入湖南省立第一师范学校，与毛泽东同校。1919年参加五四运动。1920年加入中国社会主义青年团。1921年加入中国共产党。1922年任湖南学生联合会主席。1923年任国民党湖南省党部常委。1926年出席国民党二大，当选为候补中央执行委员。1927年大革命失败后，他转入地下斗争。1928年赴苏联学习，入莫斯科中山大学。1930年回国，任中共江苏省委常委、宣传部部长。夏曦理论水平较高，但思想偏“左”，执行过“左”倾路线。至1930年底，他正在上海从事党的宣传工作，不久后将被派往湘鄂西革命根据地，担任湘鄂西中央分局书记。"
PRH_GuangXiangYing: "关向应"
PRH_GuangXiangYing_leader_desc: "§Y$PRH_GuangXiangYing_birth_info$\n§Y背景：§!§L$PRH_GuangXiangYing_bio$\n\n"
PRH_GuangXiangYing_birth_info: "生于：§!§L1902年；辽宁金县（今大连）§!"
PRH_GuangXiangYing_bio: "关向应，原名关治祥，字向应，满族，辽宁金县人。1924年加入中国社会主义青年团。1925年加入中国共产党。同年赴苏联学习，入莫斯科东方劳动者共产主义大学。1927年回国，在上海从事共青团工作。1928年任共青团中央局组织部部长。1930年任中共中央长江局军委书记。他长期在国民党统治区从事秘密工作，积累了丰富的斗争经验。关向应工作认真，作风朴实，善于团结同志。至1930年底，他正在武汉、上海等地从事党的军事和青年工作，不久后将被派往湘鄂西革命根据地，任红三军政治委员，与贺龙共同领导湘鄂西的斗争。"
PRC_XiaoKe: "萧克"
PRC_XiaoKe_leader_desc: "§Y$PRC_XiaoKe_birth_info$\n§Y背景：§!§L$PRC_XiaoKe_bio$\n\n"
PRC_XiaoKe_birth_info: "生于：§!§L1907年7月14日；湖南嘉禾§!"
PRC_XiaoKe_bio: "萧克，湖南嘉禾人。1923年入嘉禾县甲种师范学校。1926年赴广州，入国民政府军事委员会宪兵教练所。同年加入中国共产党。1927年任国民革命军第二十四师连长，参加北伐战争。\n1927年8月，萧克参加南昌起义，任起义军第二十四师七十一团四连连长。起义失败后，他随部队转战粤闽赣湘边界。1928年1月，参加湘南起义，任宜章独立营副营长。4月，随朱德、陈毅上井冈山。\n1929年，萧克任红四军第三纵队支队长。1930年任红四军第三纵队司令员，参加中央苏区第一次反'围剿'斗争。他作战勇敢，指挥果断，在开辟赣南、闽西革命根据地的战斗中表现出色。萧克重视军事学习，勤于思考，善于总结经验。至1930年底，他已成为红军中年轻有为的中级指挥员。"
NHA_ZhangGuoTao: "张国焘"
NHA_ZhangGuoTao_leader_desc: "§Y$NHA_ZhangGuoTao_birth_info$\n§Y背景：§!§L$NHA_ZhangGuoTao_bio$\n\n"
NHA_ZhangGuoTao_birth_info: "生于：§!§L1897年11月26日；江西萍乡§!"
NHA_ZhangGuoTao_bio: "张国焘，字特立。1916年考入北京大学理预科，后转读哲学系。在校期间受新文化运动与共产主义思潮影响，投身学生运动。1919年五四运动中，他是北京大学学生领袖之一，参与组织游行和演讲。1920年秋，他参与成立北京共产主义小组，是中国共产党最早的党员之一。\n1921年7月，他作为北京代表赴上海出席中国共产党第一次全国代表大会，在会上报告了北京小组的活动，并当选为中央局成员，负责组织工作，成为党的三位主要创始人之一。此后，他主要在中国北方领导工人运动，包括著名的京汉铁路大罢工（1923年）。\n1924年1月，他出席国民党第一次全国代表大会，并当选为国民党中央候补执行委员，参与了国共合作初期的部分工作。1927年大革命失败后，他在中共“八七会议”上当选为临时中央政治局常委。同年，他受中央委派赴南昌，以中央代表身份参与策划并领导了南昌起义（八一起义）。起义部队南下广东失败后，他经香港辗转抵达上海。\n1928年，张国焘赴莫斯科参加中共六大，并留任中国共产党驻共产国际代表。在莫斯科期间，他卷入了苏联党内的政治斗争。1931年初，他奉共产国际之命回国，被派往鄂豫皖革命根据地，于4月抵达，担任中共鄂豫皖中央分局书记兼军事委员会主席，成为该根据地最高领导人。至1931年底，他领导根据地军民开展了多次反“围剿”斗争，并主持了“肃反”运动，其领导地位与权力得到巩固。"
NHA_ZengZhongSheng: "曾中生"
NHA_ZengZhongSheng_leader_desc: "§Y$NHA_ZengZhongSheng_birth_info$\n§Y背景：§!§L$NHA_ZengZhongSheng_bio$\n\n"
NHA_ZengZhongSheng_birth_info: "生于：§!§L1900年；湖南资兴§!"
NHA_ZengZhongSheng_bio: "曾中生，原名曾钟圣，湖南资兴人。1917年入衡阳省立第三师范学校。1922年考入黄埔军校第四期。1925年加入中国共产党。1926年参加北伐，任国民革命军第八军政治部组织科科长。1927年大革命失败后，他参加南昌起义，任起义军第十一军第二十四师参谋长。起义失败后，他转赴上海，从事党的秘密工作。1928年任中共南京市委书记。1929年任中共鄂豫皖特委书记，参与领导鄂豫皖革命根据地的创建。1930年，他任鄂豫皖革命军事委员会副主席，协助张国焘、徐向前等领导根据地的武装斗争。曾中生军事才能突出，善于总结经验，著有《与“剿赤军”作战要诀》等军事著作。至1930年底，他已成为鄂豫皖根据地的重要军事领导人之一。"
NSD_ChenChangHao: "陈昌浩"
NSD_ChenChangHao_leader_desc: "§Y$NSD_ChenChangHao_birth_info$\n§Y背景：§!§L$NSD_ChenChangHao_bio$\n\n"
NSD_ChenChangHao_birth_info: "生于：§!§L1906年；湖北汉阳§!"
NSD_ChenChangHao_bio: "陈昌浩，湖北汉阳人。1926年加入中国共产主义青年团。1927年赴苏联学习，入莫斯科中山大学。1930年回国，在上海从事党的宣传工作。他俄语流利，理论水平较高，但缺乏实际革命经验。1930年底，他被派往鄂豫皖革命根据地，任中共鄂豫皖中央分局常委、共青团鄂豫皖中央分局书记。陈昌浩是张国焘的积极支持者，在鄂豫皖根据地肃反运动中扮演了重要角色。至1930年底，他刚进入根据地，开始参与根据地的领导工作。"
NSD_KuanJiXun: "旷继勋"
NSD_KuanJiXun_leader_desc: "§Y$NSD_KuanJiXun_birth_info$\n§Y背景：§!§L$NSD_KuanJiXun_bio$\n\n"
NSD_KuanJiXun_birth_info: "生于：§!§L1897年；贵州思南§!"
NSD_KuanJiXun_bio: "旷继勋，原名大顺，号集成，贵州思南人。1916年入川军当兵，历任排长、连长、营长。1925年任川军江防军第二师第四旅旅长。1926年加入中国共产党。1929年6月，他率领川军第七混成旅在四川遂宁、蓬溪交界的大石桥发动起义，成立中国工农红军四川第一路，任总指挥。起义失败后，他转赴上海，在中共中央军委工作。1930年，他被派往洪湖革命根据地，任红六军军长。同年冬，调往鄂豫皖革命根据地，任红四军军长。旷继勋作战勇猛，指挥果断，为红四方面军的创建和发展作出了重要贡献。至1930年底，他已在鄂豫皖根据地担任重要军事职务。"
NSD_LiTe: "李特"
NSD_LiTe_leader_desc: "§Y$NSD_LiTe_birth_info$\n§Y背景：§!§L$NSD_LiTe_bio$\n\n"
NSD_LiTe_birth_info: "生于：§!§L1902年；安徽霍邱§!"
NSD_LiTe_bio: "李特，原名徐克勋，安徽霍邱人。1921年入唐山交通大学预科。1924年加入中国共产党。同年赴苏联学习，入莫斯科东方劳动者共产主义大学。1925年转入苏联红军学校学习军事。1927年回国，参加广州起义。起义失败后，他转赴上海，从事党的秘密工作。1929年，他被派往鄂豫皖革命根据地，任红一军参谋长。1930年，他任红四军参谋长，协助徐向前等指挥作战。李特军事理论扎实，参谋业务熟练，但性格偏激，在肃反中执行了错误政策。至1930年底，他已成为鄂豫皖根据地红军的重要参谋负责人。"
NSD_HeWei: "何畏"
NSD_HeWei_leader_desc: "§Y$NSD_HeWei_birth_info$\n§Y背景：§!§L$NSD_HeWei_bio$\n\n"
NSD_HeWei_birth_info: "生于：§!§L1900年；海南琼海§!"
NSD_HeWei_bio: "何畏，原名何世富，字敬止，海南琼海人。早年赴马来西亚谋生，参加当地革命活动。1925年回国，入黄埔军校第五期。1927年加入中国共产党。同年参加广州起义。起义失败后，他转赴东江地区，参加红军。1929年，他被派往鄂豫皖革命根据地，任红四军第十二师团长。1930年，他任红四军第十二师师长，参与指挥鄂豫皖根据地反“围剿”斗争。何畏作战勇猛，但性格粗暴，在肃反中表现积极。至1930年底，他已成为鄂豫皖根据地红军的主力师长之一。"
NSD_WangShuSeng: "王树声"
NSD_WangShuSeng_leader_desc: "§Y$NSD_WangShuSeng_birth_info$\n§Y背景：§!§L$NSD_WangShuSeng_bio$\n\n"
NSD_WangShuSeng_birth_info: "生于：§!§L1905年5月26日；湖北麻城§!"
NSD_WangShuSeng_bio: "王树声，原名王宏信，湖北麻城人。1926年加入中国共产党。1927年参与领导黄麻起义，后随部队转入木兰山地区坚持游击战争。1928年任中国工农红军第十一军第三十一师分队长。1929年任红一军第一师团长。1930年任红四军第十一师师长，参与指挥鄂豫皖根据地第一次反“围剿”斗争。王树声作战勇敢，善于游击战，在鄂豫皖根据地军民中享有较高威望。至1930年底，他已成为鄂豫皖根据地红军的重要指挥员之一。"
NSD_YuTianYun: "余天云"
NSD_YuTianYun_leader_desc: "§Y$NSD_YuTianYun_birth_info$\n§Y背景：§!§L$NSD_YuTianYun_bio$\n\n"
NSD_YuTianYun_birth_info: "生于：§!§L1906年；湖北黄安（今红安）§!"
NSD_YuTianYun_bio: "余天云，湖北黄安人。1927年参加黄麻起义，后随部队转入木兰山地区坚持游击战争。1928年加入中国共产党。1929年任红十一军第三十一师排长、连长。1930年任红一军第一师营长、团长。他作战勇猛，屡立战功，但性格刚烈，脾气暴躁。至1930年底，他已在鄂豫皖根据地红军中成长为一名中级指挥员。"
NSD_XuHaiDong: "徐海东"
NSD_XuHaiDong_leader_desc: "§Y$NSD_XuHaiDong_birth_info$\n§Y背景：§!§L$NSD_XuHaiDong_bio$\n\n"
NSD_XuHaiDong_birth_info: "生于：§!§L1900年；湖北大悟§!"
NSD_XuHaiDong_bio: "徐海东，湖北大悟人。早年曾当窑工。1925年加入中国共产党。1926年参加北伐战争，在国民革命军第四军任排长。1927年大革命失败后，返回家乡组织农民武装。1929年，他参与领导鄂豫皖地区的农民起义，后编入红军。1930年，任红四军第十二师三十六团团长，参与鄂豫皖革命根据地第一次反“围剿”斗争。他作战极其勇猛，身先士卒，多次负伤，在红军中以“徐老虎”闻名。至1930年底，他已成为鄂豫皖根据地红军中一名出色的指挥员，为红四方面军的发展壮大作出了重要贡献。"
NHA_ShengZeMing: "沈泽民"
NHA_ShengZeMing_leader_desc: "§Y$NHA_ShengZeMing_birth_info$\n§Y背景：§!§L$NHA_ShengZeMing_bio$\n\n"
NHA_ShengZeMing_birth_info: "生于：§!§L1902年；浙江桐乡§!"
NHA_ShengZeMing_bio: "沈泽民，原名沈德济，字泽民，浙江桐乡人，作家茅盾（沈雁冰）之弟。1919年考入南京河海工程专门学校。1920年赴日本留学。1921年回国，在上海参加文学研究会。1922年加入中国共产党。1924年任中共上海地方委员会委员。1926年赴苏联学习，入莫斯科中山大学。1928年出席中共六大，任翻译。1930年回国，任中共中央宣传部部长。他理论水平较高，但缺乏实际工作经验。1931年，他被派往鄂豫皖革命根据地，任中共鄂豫皖中央分局常委、宣传部部长。沈泽民在根据地积极推行“左”倾政策，在肃反中负有责任。至1930年底，他正在上海从事党的宣传工作。"
PRJ_YuanDeSheng: "袁德生"
PRJ_YuanDeSheng_leader_desc: "§Y$PRJ_YuanDeSheng_birth_info$\n§Y背景：§!§L$PRJ_YuanDeSheng_bio$\n\n"
PRJ_YuanDeSheng_birth_info: "生于：§!§L1894年；湖南浏阳§!"
PRJ_YuanDeSheng_bio: "袁德生，湖南浏阳人。1922年参加安源路矿工人大罢工，任工人代表。1923年加入中国共产党。1925年任安源路矿工人俱乐部副主任。1927年大革命失败后，他转入地下斗争。1928年任中共湖南省委委员。1929年任中共湘鄂赣边特委书记。1930年，他参与领导湘鄂赣革命根据地的武装斗争，任湘鄂赣省苏维埃政府主席。袁德生长期从事工人运动和根据地政权建设，有丰富的群众工作经验。至1930年底，他正在湘鄂赣根据地领导土地革命和政权建设。"
MEG_Anand_Amal: "阿南德·阿玛尔"
MEG_Anand_Amal_leader_desc: "§Y$MEG_Anand_Amal_birth_info$\n§Y背景：§!§L$MEG_Anand_Amal_bio$\n\n"
MEG_Anand_Amal_birth_info: "生于：§!§L1896年；印度孟买§!"
MEG_Anand_Amal_bio: "阿南德·阿玛尔，印度独立运动活动家，早年留学英国，学习法律。1919年返回印度，加入国大党，投身民族独立运动。他深受甘地非暴力不合作思想影响，多次组织和平示威和抵制英货运动。1920年代末，他开始关注亚洲各国民族解放运动，与中国的革命者有所接触。1930年，他参与领导了第二次非暴力不合作运动，反对英国殖民政府的食盐专卖法。阿南德·阿玛尔主张印度完全独立，并希望与亚洲其他被压迫民族联合。至1930年底，他正在印度各地巡回演讲，动员群众参加独立运动。"
JAP_Hirohito: "裕仁天皇"
JAP_Hirohito_leader_desc: "§Y$JAP_Hirohito_birth_info$\n§Y背景：§!§L$JAP_Hirohito_bio$\n\n"
JAP_Hirohito_birth_info: "生于：§!§L1901年4月29日；日本东京§!"
JAP_Hirohito_bio: "裕仁天皇，日本第124代天皇，昭和时代之君主。1921年因父亲大正天皇患病，开始摄政。1926年正式即位，年号“昭和”。在位初期，日本军部势力逐渐增强，对外扩张步伐加快。1930年，日本已在中国东北拥有重大利益，关东军正密谋进一步行动。裕仁天皇作为国家元首和军队最高统帅，在宪法框架下扮演象征性角色，但实际对军政决策的影响复杂且具争议。他受过良好教育，对海洋生物学有浓厚兴趣。至1930年底，日本正处于经济危机和政治动荡中，军国主义思潮日益泛滥，裕仁天皇的未来选择将深刻影响日本乃至东亚的命运。"
SOV_Stalin: "约瑟夫·斯大林"
SOV_Stalin_leader_desc: "§Y$SOV_Stalin_birth_info$\n§Y背景：§!§L$SOV_Stalin_bio$\n\n"
SOV_Stalin_birth_info: "生于：§!§L1878年12月18日；俄罗斯帝国第比利斯省哥里§!"
SOV_Stalin_bio: "约瑟夫·斯大林，原名约瑟夫·维萨里奥诺维奇·朱加什维利，苏联共产党和苏联政府的主要领导人。1922年起任联共（布）中央委员会总书记。1924年列宁逝世后，他逐步击败党内对手，成为苏联最高领导人。1928年，他推行第一个五年计划，加速苏联工业化，并实施农业集体化。1930年，苏联正处在剧烈变革中：工业建设取得显著进展，但农业集体化导致严重饥荒；党内清洗已经开始，斯大林的地位日益巩固。在国际方面，斯大林领导共产国际，指导各国共产主义运动，包括对中国革命给予支持和干预。至1930年底，斯大林已牢牢掌握苏联党政大权，其政策正深刻塑造着苏联的未来。"
SOV_blyukher: "瓦西里·布柳赫尔"
SOV_blyukher_leader_desc: "§Y$SOV_blyukher_birth_info$\n§Y背景：§!§L$SOV_blyukher_bio$\n\n"
SOV_blyukher_birth_info: "生于：§!§L1889年11月19日；俄罗斯帝国雅罗斯拉夫尔省§!"
SOV_blyukher_bio: "瓦西里·布柳赫尔，苏联元帅，军事家。1916年加入俄国社会民主工党（布）。1917年十月革命后参加红军，在国内战争中表现出色，1921年升任远东共和国军事部长兼人民革命军总司令。1924年至1927年，他化名“加伦”被派往中国，担任广州国民政府军事顾问，协助改组国民革命军，参与制定北伐战略，对黄埔军校建设和两次东征、北伐战争有重要贡献。1927年回国后，历任乌克兰军区副司令、远东特别集团军司令等职。1929年指挥苏军在中东路事件中击败东北军。1930年，他担任远东特别集团军司令，负责苏联远东防务。布柳赫尔是苏联最早获得红旗勋章和红星勋章的将领之一，被誉为“红色元帅”。至1930年底，他仍镇守苏联远东，警惕日本关东军的威胁。"
FRA_Pierre_Marie_Antoine_Pasquier: "皮埃尔·帕斯奎尔"
RAJ_Freeman_Thomas_leader_desc: "§Y$RAJ_Freeman_Thomas_birth_info$\n§Y背景：§!§L$RAJ_Freeman_Thomas_bio$\n\n"
RAJ_Freeman_Thomas_birth_info: "生于：§!§L1866年；英国伦敦§!"
RAJ_Freeman_Thomas_bio: "弗里曼·托马斯，第一代威林登伯爵，英国保守党政治家。1895年当选下议院议员。1900年至1905年任印度事务部政务次官。1915年任殖民地事务部政务次官。1924年任印度总督，直至1929年卸任。任内，他面对印度民族独立运动的高涨，采取“胡萝卜加大棒”政策：一方面通过《1919年印度政府法》进行有限改革，另一方面镇压非暴力不合作运动。1928年，他任命西蒙委员会调查印度宪政改革，因委员会没有印度人成员而引发广泛抗议。1930年，他已卸任总督，但仍在英国政界活跃，关注印度事务。至1930年底，印度正酝酿新一轮大规模非暴力不合作运动，英国殖民统治面临严峻挑战。"
RAJ_Freeman_Thomas: "弗里曼·托马斯"
RAJ_Freeman_Thomas_leader_desc: "§Y$RAJ_Freeman_Thomas_birth_info$\n§Y背景：§!§L$RAJ_Freeman_Thomas_bio$\n\n"
RAJ_Freeman_Thomas_birth_info: "生于：§!§L1866年；英国伦敦§!"
RAJ_Freeman_Thomas_bio: "弗里曼·托马斯，第一代威林登伯爵，英国保守党政治家。1895年当选下议院议员。1900年至1905年任印度事务部政务次官。1915年任殖民地事务部政务次官。1924年任印度总督，直至1929年卸任。任内，他面对印度民族独立运动的高涨，采取“胡萝卜加大棒”政策：一方面通过《1919年印度政府法》进行有限改革，另一方面镇压非暴力不合作运动。1928年，他任命西蒙委员会调查印度宪政改革，因委员会没有印度人成员而引发广泛抗议。1930年，他已卸任总督，但仍在英国政界活跃，关注印度事务。至1930年底，印度正酝酿新一轮大规模非暴力不合作运动，英国殖民统治面临严峻挑战。"
USA_Dwight_f_davis: "德怀特·戴维斯"
USA_Dwight_f_davis_leader_desc: "§Y$USA_Dwight_f_davis_birth_info$\n§Y背景：§!§L$USA_Dwight_f_davis_bio$\n\n"
USA_Dwight_f_davis_birth_info: "生于：§!§L1879年7月5日；美国密苏里州圣路易斯§!"
USA_Dwight_f_davis_bio: "德怀特·菲莱·戴维斯，美国政治家、网球运动员。1900年捐赠戴维斯杯，成为国际网球团体赛事的创始人之一。第一次世界大战期间，他在美国陆军服役，晋升至上校。战后进入政界，1923年至1925年任美国战争部助理部长。1925年至1929年任战争部长，在卡尔文·柯立芝总统内阁中任职。任内，他推动美国陆军现代化建设，并处理了1927年密西西比河大洪水等紧急事件。1929年至1932年，他出任美国驻菲律宾总督。至1930年，他正在菲律宾总督任上，致力于菲律宾的经济发展和公共工程建设，同时应对当地民族独立呼声。戴维斯后来还担任过美国陆军总参谋长等职。"
PCN_Concession: "公共租界"
PCN_Concession_leader_desc: "§Y$PCN_Concession_info$\n§Y背景：§!§L$PCN_Concession_bio$\n\n"
PCN_Concession_info: "成立于：§!§L1863年；上海§!"
PCN_Concession_bio: "上海公共租界是由英国和美国租界于1863年合并而成的国际租界，后有多国参与。它位于上海市中心，享有高度的自治权，拥有自己的行政机构工部局、警察武装万国商团和司法系统。租界内实行西方管理模式，基础设施先进，吸引了大量外国侨民和中国居民，成为远东最国际化的都市区域之一。至1930年，公共租界面积已达22.6平方公里，人口超过100万。它既是西方列强在华特权的象征，也是中国近代工商业、金融、文化和出版的中心。租界内政治环境复杂，既有殖民统治的压迫，也有相对自由的舆论空间和革命活动的掩护地。随着中国民族主义情绪高涨，公共租界的存在日益成为中外矛盾的焦点。"
AFG_mohammed_nadir_shah: "穆罕默德·纳迪尔沙"
AFG_mohammed_nadir_shah_leader_desc: "§Y$AFG_mohammed_nadir_shah_birth_info$\n§Y背景：§!§L$AFG_mohammed_nadir_shah_bio$\n\n"
AFG_mohammed_nadir_shah_birth_info: "生于：§!§L1883年4月9日；阿富汗德拉伊斯梅尔汗§!"
AFG_mohammed_nadir_shah_bio: "穆罕默德·纳迪尔·沙阿，阿富汗国王（1929-1933年在位），巴拉克宰王朝的成员。早年从军，曾任阿富汗驻法国武官。1919年第三次英国-阿富汗战争后，他担任国防大臣，协助阿曼努拉国王推行现代化改革。1924年因与国王政见不合而辞职，流亡欧洲。1929年，阿富汗发生叛乱，阿曼努拉国王被推翻，纳迪尔沙返回阿富汗，联合各部族武装击败叛军，同年10月加冕为国王。他即位后，采取稳健的改革政策，恢复经济，加强中央集权，改善与英国的关系。1930年，他平定部分地区叛乱，巩固统治，并开始制定新宪法。纳迪尔沙的统治为阿富汗带来了短暂的稳定，但他于1933年被刺杀。"
SIA_Bachatipu: "拉玛七世"
SIA_Bachatipu_leader_desc: "§Y$SIA_Bachatipu_birth_info$\n§Y背景：§!§L$SIA_Bachatipu_bio$\n\n"
SIA_Bachatipu_birth_info: "生于：§!§L1893年11月8日；暹罗曼谷§!"
SIA_Bachatipu_bio: "拉玛七世，原名巴差提朴，泰国（原暹罗）却克里王朝第七位国王。他是拉玛五世（朱拉隆功大帝）之子，拉玛六世之弟。早年留学英国，毕业于伊顿公学和伍尔维奇军事学院，后在英国陆军服役。1925年其兄逝世后，他回国继承王位。即位初期，他面临全球经济大萧条对暹罗经济的冲击，尝试推行财政紧缩政策并精简宫廷与政府开支。他具有一定的民主思想，曾考虑实施君主立宪，但态度谨慎。1930年，暹罗国内矛盾积聚，军人集团和中产阶级对绝对君主制的不满日益增长。至1930年底，拉玛七世仍在位，但一场将终结绝对君主制的革命已在酝酿之中。1932年，暹罗立宪革命爆发，他被迫接受宪法，成为名义上的立宪君主，并于1935年退位。"
HOL_bonifacius_cornelis_de_jonge: "博尼法西厄斯·科内利斯"
HOL_bonifacius_cornelis_de_jonge_leader_desc: "§Y$HOL_bonifacius_cornelis_de_jonge_birth_info$\n§Y背景：§!§L$HOL_bonifacius_cornelis_de_jonge_bio$\n\n"
HOL_bonifacius_cornelis_de_jonge_birth_info: "生于：§!§L1875年；荷兰海牙§!"
HOL_bonifacius_cornelis_de_jonge_bio: "博尼法西厄斯·科内利斯·德·永厄，荷兰殖民地官员。早年学习法律，后进入荷兰殖民事务部工作。1913年至1918年，他担任荷属东印度（今印度尼西亚）内政部官员。1920年代，他历任多个高级职务，包括荷属东印度副总督。1931年，他被任命为荷属东印度总督（1931-1936年在任）。在其正式就任总督前夕的1930年，他已深度参与殖民地的政策制定。面对日益高涨的印度尼西亚民族主义运动（如苏加诺领导的印度尼西亚民族党），他主张采取“刚性方针”，即加强控制、压制独立诉求，同时推行有限的福利政策以缓和矛盾。至1930年底，他正为赴任做准备，其未来政策将深刻影响荷属东印度的政治走向。"
POR_Joao_Carlos_Craveiro_Lopes: "若昂·桑托斯"
POR_Joao_Carlos_Craveiro_Lopes_leader_desc: "§Y$POR_Joao_Carlos_Craveiro_Lopes_birth_info$\n§Y背景：§!§L$POR_Joao_Carlos_Craveiro_Lopes_bio$\n\n"
POR_Joao_Carlos_Craveiro_Lopes_birth_info: "生于：§!§L1894年；葡萄牙里斯本§!"
POR_Joao_Carlos_Craveiro_Lopes_bio: "若昂·卡洛斯·克拉韦罗·洛佩斯，葡萄牙军官。1914年毕业于葡萄牙陆军学校，参加过第一次世界大战。1920年代，他被派往葡属殖民地服役，积累了丰富的殖民地治理和治安作战经验。1930年，他担任葡属印度（果阿、达曼、第乌）的高级驻军军官，负责防务和安全。在此期间，他面临印度国内要求葡萄牙归还殖民地的压力，以及当地小规模的反殖民活动。他忠实执行里斯本政府的政策，致力于维持葡萄牙在印度的殖民统治。克拉韦罗·洛佩斯后来在葡萄牙军政界继续晋升，并曾于1951年至1958年担任葡萄牙总统。"
TAN_Donduk_Kuular: "邓杜克·库拉"
TAN_Donduk_Kuular_leader_desc: "§Y$TAN_Donduk_Kuular_birth_info$\n§Y背景：§!§L$TAN_Donduk_Kuular_bio$\n\n"
TAN_Donduk_Kuular_birth_info: "生于：§!§L1888年；唐努图瓦（今俄罗斯图瓦共和国）§!"
TAN_Donduk_Kuular_bio: "邓杜克·库拉，图瓦（唐努乌梁海）政治人物，僧侣出身。1911年外蒙古宣布独立后，唐努图瓦地区也出现了独立倾向。1921年，在苏俄的支持下，图瓦人民革命党成立，库拉积极参与，成为领导人之一。1921年8月，图瓦宣布独立，成立“唐努图瓦人民共和国”。1920年代，他历任政府要职，主张仿照苏联模式进行社会改革，并清除传统宗教和贵族势力。1930年，他担任图瓦人民共和国小呼拉尔主席团主席（国家元首），是名义上的最高领导人。然而，图瓦的实际控制权很大程度上掌握在苏联顾问和亲苏的图瓦人民革命党手中。库拉在任期内推行集体化、反宗教运动，但国内矛盾逐渐加剧。至1930年底，他正努力在苏联的巨大影响力下维持图瓦脆弱的独立地位。"
NEP_Tribhuva: "特里布万"
NEP_Tribhuva_leader_desc: "§Y$NEP_Tribhuva_birth_info$\n§Y背景：§!§L$NEP_Tribhuva_bio$\n\n"
NEP_Tribhuva_birth_info: "生于：§!§L1906年6月30日；尼泊尔加德满都§!"
NEP_Tribhuva_bio: "特里布万·比尔·比克拉姆·沙阿，尼泊尔沙阿王朝第9代国王。1911年，其父去世后，年仅5岁的特里布万继位，由拉纳家族的首相摄政。拉纳家族世袭首相职位，掌握尼泊尔实权已近百年，国王仅为傀儡。特里布万在严格的宫廷教育中长大，精通尼泊尔语、英语和梵语。1930年，他已成年，但拉纳家族仍牢牢控制政府。他渴望恢复王权，暗中同情和支持正在兴起的反对拉纳家族专制、追求民主的改革力量。他谨慎地与外界接触，了解世界局势。至1930年底，特里布万国王表面上仍顺从拉纳政权，但内心已埋下变革的种子，为1951年最终联手民主力量推翻拉纳家族统治、结束尼泊尔孤立状态奠定了基础。"
BHU_Jigme_Wangchuk: "吉格梅·旺楚克"
BHU_Jigme_Wangchuk_leader_desc: "§Y$BHU_Jigme_Wangchuk_birth_info$\n§Y背景：§!§L$BHU_Jigme_Wangchuk_bio$\n\n"
BHU_Jigme_Wangchuk_birth_info: "生于：§!§L1905年；不丹旺杜波德朗§!"
BHU_Jigme_Wangchuk_bio: "吉格梅·旺楚克，不丹旺楚克王朝第二任国王（1926-1952年在位）。他是开国君主乌颜·旺楚克的长子。早年接受传统的不丹教育，并学习英语和印度事务。1926年其父逝世后即位。他继承并巩固了父亲开创的中央集权现代君主国，继续推行渐进式改革。1930年，他致力于加强国内行政管理和基础设施建设，维持与英属印度的特殊关系（根据1910年《普那卡条约》，不丹对外关系接受英属印度“指导”）。他性格内向，虔信佛教，治国较为保守，在不丹国内深受尊敬。至1930年底，他正领导着这个僻处喜马拉雅山脉中的隐秘王国，在保持传统与应对外部世界影响之间寻求平衡。"
ROX_JingShuRen: "金树仁"
ROX_JingShuRen_leader_desc: "§Y$ROX_JingShuRen_birth_info$\n§Y背景：§!§L$ROX_JingShuRen_bio$\n\n"
ROX_JingShuRen_birth_info: "生于：§!§L1879年；甘肃河州（今临夏）§"
ROX_JingShuRen_bio: "金树仁，字德庵，甘肃河州人。清末附生出身，后就读于甘肃文高等学堂。1911年辛亥革命后，入新疆都督杨增新幕府，以同乡之谊及办事勤勉渐获信任，历任疏附、阿克苏、迪化（今乌鲁木齐）等县知事。1926年升任新疆省政府民政厅厅长，成为杨增新的主要文职助手。\n1928年7月，杨增新在迪化遇刺身亡，金树仁在混乱中迅速行动，利用其掌握的省城卫队及民政系统，联合部分军官，平息局势，并得到南京国民政府的追认，继任新疆省政府主席兼边防督办。执政初期，他试图延续杨增新的‘闭关自守’政策，但威望与手腕均不及杨。为巩固权力，他大量任用甘肃河州同乡，形成‘河州帮’，排斥其他派系，导致新疆军政内部矛盾加剧。\n1930年前后，面对苏联势力渗透、哈密农民暴动以及甘肃军阀马仲英部入新等内外交困局面，金树仁的统治已显力不从心。他虽努力整军经武，并向南京输诚，但其统治基础脆弱，施政引发的不满正不断积聚，新疆渐趋动荡。"
ROH_WangJiaLie: "王家烈"
ROH_WangJiaLie_leader_desc: "§Y$ROH_WangJiaLie_birth_info$\n§Y背景：§!§L$ROH_WangJiaLie_bio$\n\n"
ROH_WangJiaLie_birth_info: "生于：§!§L1893年7月10日；贵州桐梓§!"
ROH_WangJiaLie_bio: "王家烈，字绍武，贵州桐梓人。1909年入桐梓县高等小学堂。1911年投身黔军，在周西成部下当兵。因其作战勇猛且与周西成有同乡之谊，得以迅速擢升，历任排长、连长、营长。1922年随周西成部入川发展，任团长。1926年，周西成回师贵州主政，王家烈升任第二十五军第二师师长，成为周西成麾下‘桐梓系’的核心将领之一。\n1929年，周西成在与李燊（李晓炎）的战争中战死。王家烈率部与毛光翔、犹国才等将领合力击退李燊，拥戴毛光翔继任第二十五军军长兼省主席。此后，他任副军长，但功高震主，与毛光翔渐生嫌隙。1930年，他主要驻防黔东南铜仁、镇远一带，虽名义上服从省府，实则积极扩军，并通过经营湘黔边境鸦片贸易以充军饷，实力不断壮大，为其日后取代毛光翔、主政贵州积蓄了资本。此时的他，已是黔军内部最具实力和野心的少壮派领袖。"
ROD_PuYi: "爱新觉罗·溥仪"
MCK_PuYi: "爱新觉罗·溥仪"
ROD_PuYi_leader_desc: "§Y$ROD_PuYi_birth_info$\n§Y背景：§!§L$ROD_PuYi_bio$\n\n‘’"
ROD_PuYi_birth_info: "生于：§!§L1906年2月7日；北京醇亲王府§!"
ROD_PuYi_bio: "爱新觉罗·溥仪，字曜之，号浩然。清朝末代皇帝，年号宣统。1908年，不足三岁的溥仪在慈禧太后临终前被指定入承大统，由其父载沣摄政。1911年辛亥革命爆发，1912年2月，在袁世凯逼迫下，隆裕太后代其颁布《退位诏书》，清朝统治终结，民国政府予以优待，允其暂居紫禁城后宫，保留尊号。\n紫禁城内的十几年间，溥仪在英国教师庄士敦等人的教导下，接受了中西混杂的教育，眼界渐开，复辟之念却从未消弭。1917年，他曾被张勋短暂拥立复辟，十二日后失败。1924年，冯玉祥发动‘北京政变’，修改清室优待条件，派兵将溥仪驱逐出宫。此后他辗转居于醇亲王府、日本驻北京公使馆，最终于1925年移居天津日租界，与遗老、军阀、政客乃至日本特务广泛交往，寻求‘重登大宝’的机会。\n至1930年，居于天津静园的张园和静园，溥仪已成为各方势力（尤其是日本）竞相拉拢与利用的对象。他内心充满对民国的不满与对恢复祖业的渴望，在日本关东军特务的蛊惑与身边遗老的鼓动下，其政治选择日益倾向借助外力，命运正滑向一个由他人设计的危险轨道。"
ROA_HangFuQu: "韩复榘"
ROA_HangFuQu_leader_desc: "§Y$ROA_HangFuQu_birth_info$\n§Y背景：§!§L$ROA_HangFuQu_bio$\n\n"
ROA_HangFuQu_birth_info: "生于：§!§L1891年1月25日；河北霸县§!"
ROA_HangFuQu_bio: "韩复榘，字向方。早年因家贫辍学，曾为县衙司书。1910年投效清军第二十镇第四十协第八十标第三营为兵。辛亥革命后，随营长冯玉祥参与滦州起义，失败后还乡。1912年再次投靠冯玉祥部，因作战勇猛、粗通文墨而深受赏识，由排长累升至营长、团长，成为冯玉祥麾下“十三太保”之一。\n1924年第二次直奉战争中，冯玉祥发动北京政变，组建国民军。韩复榘因功升任国民军第一军第一师第一旅旅长。1925年升任第一师师长。1926年，冯玉祥部国民军在南口大战中失利西撤，韩复榘师损失惨重，一度向阎锡山部投诚，后被冯玉祥招回。同年9月，冯玉祥五原誓师，所部集体加入国民党，韩复榘任国民联军第六路司令，参与援陕解西安之围。\n1927年，冯部改编为国民革命军第二集团军，出潼关参加北伐。韩复榘任第二集团军第六军军长、第三方面军总指挥，率部在豫北、冀南等地与奉军作战，战功显著。1928年北伐结束后，任第二集团军暂编第一师师长，后部队改编为第二十师，他任师长，并兼任河南省政府主席。此间，因冯玉祥治军严厉且偏袒其他将领，韩复榘对冯渐生不满。\n1929年5月，蒋冯战争酝酿之际，韩复榘联合石友三，在河南洛阳通电“拥护中央，主张和平”，率部东进投靠蒋介石，此即“甘棠东进”。蒋介石立即任命其为中央军第三路军总指挥，仍主持豫政。此举沉重打击了冯玉祥集团。1930年中原大战爆发，韩复榘任蒋介石方第一军团总指挥，负责山东津浦线方向的作战，对抗晋军。他起初作战不甚积极，力求保存实力，后经蒋方督促与晋军激战，最终在蒋军赢得全局胜利的背景下，率部进占济南。战后，蒋介石为酬庸其功并使其远离旧西北军中心，于1930年9月正式任命其为山东省政府主席，使其成为独据一方的封疆大吏。"
ROA_ShengHongLie: "沈鸿烈"
ROA_ShengHongLie_leader_desc: "§Y$ROA_ShengHongLie_birth_info$\n§Y背景：§!§L$ROA_ShengHongLie_bio$\n\n"
ROA_ShengHongLie_birth_info: "生于：§!§L1882年；湖北天门§!"
ROA_ShengHongLie_bio: "沈鸿烈，字成章，湖北天门人。1906年考取官费留学日本，入日本海军兵学校学习，成为中国近代最早接受系统海军教育的将领之一。在日本期间，他加入中国同盟会，参与反清革命活动。1911年辛亥革命爆发后，他立即回国，在海军中任职，参与光复上海、南京的军事行动。\n民国成立后，沈鸿烈在北洋政府海军部任职，曾参与《海军法规》的编纂工作。1920年，他受命前往东北，协助张作霖组建东北海军。他凭借专业的海军知识和务实的作风，深得张作霖信任，历任东北海军江防舰队司令、东北海军司令部参谋长等职，成为东北海军的实际创建者和灵魂人物。在他的主持下，东北海军从无到有，逐步发展成一支拥有江防、海防舰队和海军学校的区域性海上力量。\n1928年皇姑屯事件后，他继续效忠张学良，任东北海军副司令，实际主持海军日常事务。1930年中原大战期间，他指挥东北海军部分舰艇参与运兵和后勤支援，为张学良入关调停提供了保障。至1930年底，沈鸿烈已是中国海军界资历深厚的将领，他领导的东北海军虽然规模有限，但组织严密、训练有素，是当时中国几支重要海军力量之一。"
SYS_ShiYouSan: "石友三"
SYS_ShiYouSan_leader_desc: "§Y$SYS_ShiYouSan_birth_info$\n§Y背景：§!§L$SYS_ShiYouSan_bio$\n\n"
SYS_ShiYouSan_birth_info: "生于：§!§L1891年；吉林长春§!"
SYS_ShiYouSan_bio: "石友三，字汉章，吉林长春人。幼年家贫，曾当学徒，后投军于北洋陆军。1912年入冯玉祥部当兵，因机灵善战、勇猛凶悍而获冯玉祥赏识，由马夫、贴身护兵逐步擢升为连长、营长，成为冯玉祥麾下‘十三太保’之一。\n1924年，冯玉祥发动北京政变，石友三因功升任国民军第一军第八混成旅旅长。1926年，冯玉祥部国民军在南口大战中失利西撤，石友三率部归阎锡山晋军收编，但不久后复归冯部。同年9月，冯玉祥五原誓师，石友三任国民联军第六军军长，后任援陕第五路总指挥，参与解西安之围。\n1927年，冯部改编为国民革命军第二集团军，石友三任第一方面军副总指挥兼第五军军长，北伐中在豫、鲁战场作战。1928年北伐完成后，部队编遣，他任第二十四师师长，驻防河南南阳。因冯玉祥治军严苛且赏罚常凭个人好恶，石友三渐生不满。1929年5月，在蒋冯战争一触即发之际，他与韩复榘联合通电‘拥护中央’，叛冯投蒋，被蒋介石任命为第十三路军总指挥。\n1930年中原大战爆发，石友三 initially 表示支持蒋介石，但暗中与阎锡山、冯玉祥联络，于3月在安徽蚌埠就任阎、冯委任的第四方面军总司令及山东省政府主席，再次倒戈反蒋。他率部在陇海线战场与蒋军作战，但为保存实力，作战并不积极。战事后期，见反蒋联军败局已定，他再次通电投蒋。至1930年底，这位以‘倒戈将军’闻名、反复无常的军阀，虽暂时栖身于蒋介石阵营，但其多变的立场和手中的数万兵力，使其成为华北政局中一个极不稳定的因素。"
SYS_SunDianYing: "孙殿英"
SYS_SunDianYing_leader_desc: "§Y$SYS_SunDianYing_birth_info$\n§Y背景：§!§L$SYS_SunDianYing_bio$\n\n"
SYS_SunDianYing_birth_info: "生于：§!§L1889年；河南永城§!"
SYS_SunDianYing_bio: "孙殿英，名魁元，字殿英，河南永城人。早年混迹江湖，为庙会道徒，以赌博、贩运鸦片起家，后在豫西收罗土匪及会道门徒众，形成一股武装力量。\n1925年，孙殿英率部先后被地方军阀憨玉昆、国民军第三军收编，任旅长、师长。同年秋，改投山东督办张宗昌，历任直鲁联军师长、第十四军军长。1927年，在国民革命军北伐压力下，孙殿英接受改编，任国民革命军第六军团第十二军军长。\n1928年，孙殿英部驻防河北蓟县马伸桥，临近清东陵。为解决部队粮饷匮乏，他于同年7月以军事演习为名封锁陵区，动用炸药盗掘了慈禧太后定东陵和乾隆皇帝裕陵的地宫，掠取了大量珍宝，震惊全国，由此得“东陵大盗”之恶名。事后，他将部分赃物用于贿赂国民党高层以求脱罪。北伐结束后部队缩编，他降任旅长。\n1930年，中原大战爆发。孙殿英转而投靠阎锡山、冯玉祥的反蒋阵营，被任命为第四方面军第五路总指挥兼安徽省政府主席。战事后期，他见反蒋联军局势不利，遂保存实力，准备伺机另投他处。至1930年底，其作为一支没有固定政治立场、以生存和利益为优先的军阀力量，在华北政局中仍扮演着不确定的角色。"
ROJ_YanXiShan: "阎锡山"
ROJ_YanXiShan_leader_desc: "§Y$ROJ_YanXiShan_birth_info$\n§Y背景：§!§L$ROJ_YanXiShan_bio$\n\n“在三颗鸡蛋上跳舞，踩破哪一个都不行。”"
ROJ_YanXiShan_birth_info: "生于：§!§L1883年10月8日；山西五台§!"
ROJ_YanXiShan_bio: "阎锡山，字百川。1902年考入山西武备学堂，1904年被清政府保送至日本留学，先后入东京振武学校、日本陆军士官学校第六期。在日期间加入中国同盟会，并成为孙中山创建的同盟会核心军事组织“铁血丈夫团”成员。\n1909年回国，任山西陆军小学堂教官、监督。1911年辛亥革命爆发，他参与策动太原起义，被推举为山西都督，自此开始执掌山西军政大权。北洋政府时期，他周旋于袁世凯、段祺瑞等各派势力之间，通过“保境安民”策略，使山西相对稳定，同时大力推行以军事工业为核心的“厚生计划”，奠定晋系军阀的独立基础。\n1926年北伐战争开始后，阎锡山审时度势，于1927年6月通电“服从三民主义”，将所部改组为北方国民革命军，加入国民政府。1928年，他任国民革命军第三集团军总司令，参与二次北伐，势力范围扩展至华北的河北、察哈尔、绥远及平津地区。\n1929年至1930年间，因蒋介石的“削藩”政策与自身扩张野心，阎锡山与蒋介石的矛盾激化。1930年2月，他公开以“和平统一”为名电蒋，引发长达两个月的“电报论战”，成为中原大战的导火索。同年4月，他与冯玉祥、李宗仁等结成反蒋同盟，任中华民国陆海空军总司令，在中原、山东、湖南等多个战场与蒋介石的中央军展开大规模决战，是为“中原大战”。至1930年9月，因张学良率东北军入关支持蒋介石，反蒋联军战败。阎锡山被迫宣布下野，随后逃往大连，其控制的华北地盘大部丧失，但晋绥军基本盘得以保留，为日后重返山西留下伏笔。"
PRC_MaoZeDong: "毛泽东"
PRC_MaoZeDong_leader_desc: "§Y$PRC_MaoZeDong_birth_info$\n§Y背景：§!§L$PRC_MaoZeDong_bio$\n\n“星星之火，可以燎原。”"
PRC_MaoZeDong_birth_info: "生于：§!§L1893年12月26日；湖南湘潭§!"
PRC_MaoZeDong_bio: "毛泽东，字润之，出生于湖南湘潭韶山冲一个农民家庭。少年时曾在田间劳作，后入私塾和新式学堂读书。1911年辛亥革命爆发后，他投笔从戎，在湖南新军中当了半年兵。1914年至1918年，在湖南省立第一师范学校求学期间，他组织进步团体，开始深入思考社会改造问题。\n1918年，为组织湖南青年赴法勤工俭学，毛泽东首次来到北京，在北京大学图书馆担任助理员，期间广泛接触各种新思潮，并开始研读马克思主义著作。1919年，他返回湖南，投身五四运动，创办《湘江评论》，宣传革命思想。1920年，他在湖南建立共产主义小组，并于1921年7月，作为长沙共产主义小组的代表，赴上海参加中国共产党第一次全国代表大会，成为中国共产党的主要创始人之一。\n1923年，在中共三大上，毛泽东当选为中央执行委员。基于当时国共合作的决策，他同时以个人身份加入中国国民党。1924年，在国民党一大上，他当选为国民党中央候补执行委员，并曾代理国民党中央宣传部部长。1925年至1926年，他回到湖南开展农民运动，撰写了《中国社会各阶级的分析》和《湖南农民运动考察报告》等重要文章，奠定了其关于农民问题和中国革命道路的理论基础。\n1927年，蒋介石发动“四一二”反革命政变后，毛泽东在武汉出席的中共“八七会议”上提出了“枪杆子里面出政权”的著名论断。同年9月，他返回湖南，领导了湘赣边界的秋收起义。起义受挫后，他率部转向敌人统治力量薄弱的农村地区，于10月抵达江西罗霄山脉中段的井冈山，创建了第一个农村革命根据地，开辟了“农村包围城市，武装夺取政权”的革命道路。\n1928年4月，朱德、陈毅率领南昌起义余部与毛泽东会师，两军合编为工农革命军第四军（后改称红军第四军），毛泽东任党代表和军委书记。在根据地建设与军事斗争中，他形成了包括“三大纪律八项注意”在内的一系列建军与建党原则。至1930年，以井冈山根据地为起点，赣南、闽西等根据地相继开辟，毛泽东已成为红军和根据地的主要领导人之一，其关于中国革命道路的实践与理论探索，正深刻地影响着中国革命未来的走向。"
SCR_Rao_JiaJu: "饶家驹"
SCR_Rao_JiaJu_leader_desc: "§Y$SCR_Rao_JiaJu_birth_info$\n§Y背景：§!§L$SCR_Rao_JiaJu_bio$\n\n“愿以我身，换一方安宁。”"
SCR_Rao_JiaJu_birth_info: "生于：§!§L1878年3月15日；法国圣迪耶§!"
SCR_Rao_JiaJu_bio: "饶家驹，本名罗伯特·雅基诺·德·贝桑热，法国天主教耶稣会神父。1896年加入耶稣会，1913年被祝圣为神父，次年奉派来华。他很快掌握了流利的汉语，并取中文名‘饶家驹’。最初在上海徐家汇一带传教并教授法语和哲学，因其博学与仁慈而逐渐闻名。\n1920年代，他积极投身于上海的慈善与救济事业，曾任震旦大学法语系主任，并多次参与协调租界内外纠纷，其公正与沟通能力得到各方认可。1931年‘一·二八’事变期间，他主动参与救助伤兵与难民，积累了在战火中组织人道主义工作的宝贵经验。\n1937年‘八一三’淞沪会战爆发后，面对闸北、南市等地陷入火海、大量平民无处容身的惨状，饶家驹神父挺身而出。凭借其独特的身份和信誉，他奔走于中日军事当局、上海市政府以及各国外交官之间，进行了艰苦卓绝的斡旋。最终，他成功促成在上海南市划定一块‘南市难民区’（后称‘饶家驹区’）。该区域被中日双方承认为非军事化的‘中立区’，在战火中为超过25万中国难民提供了栖身之所，成为残酷战争中的一片‘安全绿洲’。\n至1930年代末，饶家驹已成为上海乃至整个远东地区战时人道主义工作的标志性人物。他的实践为后来的‘战时平民保护’理念提供了宝贵的先例，证明了在绝对的对立中，仍有可能开辟出捍卫基本人性的空间。"
PRC_ZhangWengTian: "张闻天"
PRC_ZhangWengTian_leader_desc: "§Y$PRC_ZhangWengTian_birth_info$\n§Y背景：§!§L$PRC_ZhangWengTian_bio$\n\n"
PRC_ZhangWengTian_birth_info: "生于：§!§L1900年8月30日；江苏南汇（今属上海）§!"
PRC_ZhangWengTian_bio: "张闻天，原名应皋（也作荫皋），字闻天，江苏南汇人。1917年入南京河海工程专门学校。1919年参加五四运动。1920年赴日本留学。1922年赴美国勤工俭学。1924年回国，任中华书局编辑。1925年加入中国共产党。\n1925年冬，张闻天被派往苏联学习，先后入莫斯科中山大学、红色教授学院学习和工作。在苏联期间取名'伊思美洛夫'。1930年，他与杨尚昆等一起从苏联回国。\n1931年1月，张闻天回到上海，任中共中央宣传部部长。他理论水平较高，擅长写作和宣传工作。在苏联学习期间，他系统学习了马克思列宁主义理论，为党的理论建设作出了贡献。至1930年底，他刚回国，准备投入国内的革命斗争。"
PRC_ZhuDe: "朱德"
PRC_ZhuDe_leader_desc: "§Y$PRC_ZhuDe_birth_info$\n§Y背景：§!§L$PRC_ZhuDe_bio$\n\n"
PRC_ZhuDe_birth_info: "生于：§!§L1886年12月1日；四川仪陇§!"
PRC_ZhuDe_bio: "朱德，字玉阶，原名代珍，四川仪陇人。1909年入云南陆军讲武堂。1911年参加辛亥革命。1915年参加护国战争，任团长。1917年参加护法战争，任旅长。1922年赴德国留学，同年加入中国共产党。1925年赴苏联学习军事。\n1926年回国，参与领导四川泸顺起义。1927年参与领导南昌起义，任起义军第九军军长。起义失败后，率余部转战闽粤赣湘边界。1928年1月，领导湘南起义。4月，率部到达井冈山，与毛泽东领导的秋收起义部队会师，成立工农革命军第四军（后改称红四军），任军长。\n1930年，朱德任红一军团总指挥、红一方面军总司令。他与毛泽东共同指挥红军取得了第一次反'围剿'的胜利。朱德军事经验丰富，善于带兵，在红军中威望极高，被亲切地称为'朱老总'。他为人宽厚，顾全大局，与毛泽东的合作被誉为'朱毛'合作，对红军的发展和革命根据地的巩固作出了重大贡献。"
PRC_ZhouEngLai: "周恩来"
PRC_ZhouEngLai_leader_desc: "§Y$PRC_ZhouEngLai_birth_info$\n§Y背景：§!§L$PRC_ZhouEngLai_bio$\n\n"
PRC_ZhouEngLai_birth_info: "生于：§!§L1898年3月5日；江苏淮安§!"
PRC_ZhouEngLai_bio: "周恩来，字翔宇，原籍浙江绍兴，生于江苏淮安。1917年天津南开学校毕业，后赴日本留学。1919年回国，参加五四运动。1920年赴法国勤工俭学。1921年加入中国共产党。1922年参与组织旅欧中国少年共产党（后改称旅欧中国共产主义青年团）。\n1924年回国，任黄埔军校政治部主任。1925年任国民革命军第一军政治部主任。1926年任中共中央军委书记。1927年3月，领导上海工人第三次武装起义。5月，在中共五届一中全会上当选为中央政治局委员。\n1927年大革命失败后，周恩来任中共前敌委员会书记，领导南昌起义。1928年在中共六届一中全会上当选为中央政治局常委，任中央组织部部长、中央军委书记。1930年，他实际主持中共中央工作，9月在中共六届三中全会上作报告，纠正李立三'左'倾冒险错误。周恩来是中国共产党早期重要领导人，长期负责军事、组织和统一战线工作，在党内享有崇高威望。"
PRC_GuSunZhang: "顾顺章"
PRC_GuSunZhang_leader_desc: "§Y$PRC_GuSunZhang_birth_info$\n§Y背景：§!§L$PRC_GuSunZhang_bio$\n\n"
PRC_GuSunZhang_birth_info: "生于：§!§L1904年；上海宝山§!"
PRC_GuSunZhang_bio: "顾顺章，原名顾凤鸣，上海宝山人。早年在上海南洋烟草公司当钳工。1924年加入中国共产党，在沪西区从事工人运动。1925年“五卅”运动中，他组织工人罢工，担任工人纠察队队长，以勇敢善斗著称。1926年，被党组织选派与陈赓等人一起赴苏联学习政治保卫工作，在莫斯科“契卡”培训机构受训半年。\n1927年回国后，顾顺章参加上海工人第三次武装起义，任工人武装纠察队总指挥，在攻打闸北警察署等战斗中表现突出。蒋介石发动“四一二”政变后，他转入地下斗争。同年，中共中央在上海成立中央特科，负责情报、保卫工作，顾顺章任特科三科（行动科）负责人，专门负责镇压叛徒、保卫中央领导安全。他精通化装、爆破、枪械使用，曾组织多次成功行动，处决叛徒何家兴、白鑫等人。\n1928年，在中共六大上当选为中央委员。1930年，他继续主持中央特科工作，是中共中央在上海地下工作的关键人物。但顾顺章性格张扬，生活作风逐渐腐化，喜欢耍枪弄棒、炫耀技能，引起部分同志担忧。他与周恩来、聂荣臻等中央领导保持单线联系，掌握大量党内机密。"
PRC_LiKeNong: "李克农"
PRC_LiKeNong_leader_desc: "§Y$PRC_LiKeNong_birth_info$\n§Y背景：§!§L$PRC_LiKeNong_bio$\n\n"
PRC_LiKeNong_birth_info: "生于：§!§L1899年9月15日；安徽巢县§!"
PRC_LiKeNong_bio: "李克农，安徽巢县人。1917年入芜湖安徽公学附小。1919年参加五四运动。1926年加入中国共产党。1927年大革命失败后，在上海从事党的秘密工作。1928年，他进入上海无线电管理处，以此为掩护开展情报工作。\n1929年，李克农与钱壮飞、胡底一起，打入国民党中央组织部党务调查科（中统前身），三人组成党的特别小组，由周恩来直接领导。李克农在上海担任无线电管理局广播新闻编辑，利用这个身份获取国民党机密情报。1930年，他向党中央提供了国民党第一次'围剿'中央苏区的军事部署等重要情报。\n李克农机智沉着，记忆力超群，善于应付复杂环境。他与钱壮飞、胡底被周恩来誉为党的情报工作'龙潭三杰'。在白色恐怖严重的上海，他们深入虎穴，为保卫党中央安全作出了特殊贡献。至1930年底，李克农仍在上海坚持地下情报工作。"
PRC_GuoRuKui: "郭汝瑰"
PRC_GuoRuKui_leader_desc: "§Y$PRC_GuoRuKui_birth_info$\n§Y背景：§!§L$PRC_GuoRuKui_bio$\n\n"
PRC_GuoRuKui_birth_info: "生于：§!§L1907年；四川铜梁（今属重庆）§!"
PRC_GuoRuKui_bio: "郭汝瑰，原名汝桂，四川铜梁人。1925年考入广州黄埔军校第五期。在校期间受进步思想影响。1927年蒋介石发动'四一二'政变后，他对国民党产生怀疑。1928年黄埔军校毕业后，在国民党军队中任职。1929年任国民革命军第二十军连附。\n1930年中原大战期间，郭汝瑰随部队在河南作战。他目睹军阀混战给人民带来的苦难，思想开始转向。战后，他回到四川，在川军中任职。郭汝瑰军事素质较好，作战勇敢，但对国民党军队的腐败现象和派系斗争深感不满。\n郭汝瑰为人正直，勤于思考。在川军期间，他开始秘密阅读进步书籍，接触共产主义思想。虽然此时他尚未与党组织建立联系，但已在寻找新的道路。至1930年底，他仍在国民党军队中服役，但内心已经萌生了革命的思想种子。"
PRC_PangHangNian: "潘汉年"
PRC_PangHangNian_leader_desc: "§Y$PRC_PangHangNian_birth_info$\n§Y背景：§!§L$PRC_PangHangNian_bio$\n\n"
PRC_PangHangNian_birth_info: "生于：§!§L1906年1月12日；江苏宜兴§!"
PRC_PangHangNian_bio: "潘汉年，江苏宜兴人。1924年入无锡国学专修馆学习。1925年加入中国共产党。1926年任国民革命军总政治部宣传科科长，参加北伐战争。1927年大革命失败后，他在上海从事文化工作和党的秘密工作。\n1928年，潘汉年参与组织左翼文化团体，任中共中央宣传部文化工作委员会书记。他创办《幻洲》、《现代小说》等刊物，团结进步文化人士。1929年，他参与筹备中国左翼作家联盟。1930年3月，'左联'在上海成立，他是主要领导人之一。\n潘汉年多才多艺，擅长文艺创作和宣传工作。他在上海文化界有广泛联系，为党团结了一批进步文化人士。同时，他也参与党的秘密工作，负责情报和统战工作。至1930年底，他既是左翼文化运动的重要组织者，又是党的秘密工作者，在上海这个复杂的环境中发挥着独特作用。"
PRC_BoGu: "博古"
PRC_BoGu_leader_desc: "§Y$PRC_BoGu_birth_info$\n§Y背景：§!§L$PRC_BoGu_bio$\n\n"
PRC_BoGu_birth_info: "生于：§!§L1907年5月14日；江苏无锡§!"
PRC_BoGu_bio: "博古，原名秦邦宪，字则民，江苏无锡人。1921年入苏州省立第二工业学校。1924年入上海大学社会学系。1925年加入中国共产党。1926年赴苏联学习，入莫斯科中山大学。在苏联期间取名'博古诺夫'，后简化为'博古'。\n1929年，博古与王明等人在中山大学参与宗派活动，形成'二十八个半布尔什维克'集团。1930年5月，他从苏联回国，在上海从事党的宣传工作。他理论水平较高，熟读马列著作，但缺乏实际革命经验。\n1930年，博古任全国总工会宣传部干事。他积极宣传苏联革命经验，主张在中国推行苏联模式。他文笔流畅，在党的刊物上发表多篇文章。虽然年轻，但他在从苏联回国的留学生中已有一定影响力。至1930年底，他正在上海从事党的宣传和理论工作，是党内年轻的理论干部之一。"
PRC_XiangZhongFa: "向忠发"
PRC_XiangZhongFa_leader_desc: "§Y$PRC_XiangZhongFa_birth_info$\n§Y背景：§!§L$PRC_XiangZhongFa_bio$\n\n"
PRC_XiangZhongFa_birth_info: "生于：§!§L1880年；湖北汉川§!"
PRC_XiangZhongFa_bio: "向忠发，湖北汉川人。早年在汉阳兵工厂当工人。1922年加入中国共产党。1923年参与领导京汉铁路大罢工。1925年任中共湖北区委委员。1926年任湖北省总工会委员长。1927年在中共五大上当选为中央委员。\n1927年大革命失败后，向忠发转入地下斗争。1928年赴苏联出席中共六大。由于当时共产国际强调领导干部的工人成分，他被选为中央政治局主席、中央政治局常委会主席（习惯上称为总书记）。但实际上，他理论水平和领导能力有限，党的主要工作由其他领导人负责。\n1930年，向忠发在上海主持党中央工作。他支持李立三的'左'倾冒险错误，签发了一系列冒险主义的文件。但他实际作用有限，更多是象征性的领导人。至1930年底，他仍是党的名义上的最高领导人，但实权掌握在李立三等实际工作负责人手中。"
PRC_ChenDuXiu: "陈独秀"
PRC_ChenDuXiu_leader_desc: "§Y$PRC_ChenDuXiu_birth_info$\n§Y背景：§!§L$PRC_ChenDuXiu_bio$\n\n"
PRC_ChenDuXiu_birth_info: "生于：§!§L1879年10月9日；安徽怀宁§!"
PRC_ChenDuXiu_bio: "陈独秀，原名庆同，字仲甫，安徽怀宁人。1896年考中秀才。1901年赴日本留学。1903年回国，在上海编辑《国民日日报》。1904年创办《安徽俗话报》。1915年在上海创办《青年杂志》（后改名《新青年》），发起新文化运动。\n1917年任北京大学文科学长。1919年五四运动的主要领导人之一。1920年创建上海共产主义小组。1921年中共一大上，被选为中央局书记，成为党的主要创始人。1922年中共二大至1927年中共五大，均当选为中央委员、中央局委员或中央政治局委员，并长期担任党的最高领导职务。\n1927年大革命失败后，陈独秀被解除领导职务。1929年因接受托洛茨基观点，被开除党籍。1930年，他在上海组织'中国共产党左派反对派'（托派），出版《无产者》刊物，宣传托洛茨基主义。他仍然坚持自己的政治主张，但已脱离中国共产党主流。至1930年底，他作为党的创始人，已走上不同的政治道路。"
PRC_WangMing: "王明"
PRC_WangMing_leader_desc: "§Y$PRC_WangMing_birth_info$\n§Y背景：§!§L$PRC_WangMing_bio$\n\n"
PRC_WangMing_birth_info: "生于：§!§L1904年4月9日；安徽六安§!"
PRC_WangMing_bio: "王明，原名陈绍禹，字露清，安徽六安人。1920年入安徽省立第三甲种农业学校。1924年入武昌商科大学预科。1925年加入中国共产党。同年秋，被派往苏联莫斯科中山大学学习。\n在中山大学期间，王明学习刻苦，俄语流利，得到校长米夫赏识。1927年毕业后留校任翻译、教员。1928年，他出席在莫斯科召开的中共六大，任翻译。1929年回国，在上海从事党的宣传工作。\n1930年，王明任中共中央宣传部秘书，在《红旗》等党的刊物上发表文章。他理论功底较好，熟读马列著作，但脱离中国实际，教条主义倾向严重。他得到共产国际代表米夫支持，在党内逐渐形成自己的派别。至1930年底，他虽然职位不高，但由于与共产国际的特殊关系，在党内已有相当影响力。"
PRC_LiDe: "李德"
PRC_LiDe_leader_desc: "§Y$PRC_LiDe_birth_info$\n§Y背景：§!§L$PRC_LiDe_bio$\n\n"
PRC_LiDe_birth_info: "生于：§!§L1900年9月28日；德国慕尼黑§!"
PRC_LiDe_bio: "李德，原名奥托·布劳恩，德国人。1918年加入德国共产党。1919年参加巴伐利亚苏维埃共和国起义。1923年与台尔曼一起组织汉堡起义。1926年被捕入狱。1928年越狱逃往苏联。1929年入伏龙芝军事学院学习。\n1932年春，李德从伏龙芝军事学院毕业。同年秋，受共产国际派遣前往中国。他经满洲里入境，于1932年底到达上海。1933年初，他与中共临时中央取得联系。同年秋，被秘密护送到中央苏区。\n在中央苏区，李德化名'李德'，任中华苏维埃共和国中央革命军事委员会军事顾问。他实际掌握了红军的指挥权，推行正规战、阵地战，否定毛泽东等人的游击战原则。由于他不了解中国实际，照搬苏联军事教条，给红军造成了严重损失。至1930年底，他尚未到达中国，但共产国际已决定派他来华指导中国革命。"
PRC_PengDeHuai: "彭德怀"
PRC_PengDeHuai_leader_desc: "§Y$PRC_PengDeHuai_birth_info$\n§Y背景：§!§L$PRC_PengDeHuai_bio$\n\n"
PRC_PengDeHuai_birth_info: "生于：§!§L1898年10月24日；湖南湘潭§!"
PRC_PengDeHuai_bio: "彭德怀，原名得华，字石穿，湖南湘潭人。1916年入湘军当兵。1922年入湖南陆军军官讲武堂。1926年任湘军营长，参加北伐战争。1928年4月加入中国共产党。同年7月，与滕代远、黄公略等领导平江起义，组建中国工农红军第五军，任军长。\n1928年12月，彭德怀率红五军主力到达井冈山，与毛泽东、朱德领导的红四军会师。1929年1月，为打破国民党军对井冈山的'会剿'，他和毛泽东、朱德率红四军主力出击赣南，红五军留守井冈山。\n1930年，彭德怀任红三军团总指挥。6月，率红三军团攻占长沙，这是红军在十年内战时期攻占的唯一省城。8月，红三军团与红一军团合编为红一方面军，他任副总司令兼红三军团军团长。彭德怀作战勇猛，性格刚烈，在红军中以敢打硬仗、恶仗著称。至1930年底，他已成为红军主要军事领导人之一。"
PRC_LingBiao: "林彪"
PRC_LingBiao_leader_desc: "§Y$PRC_LingBiao_birth_info$\n§Y背景：§!§L$PRC_LingBiao_bio$\n\n"
PRC_LingBiao_birth_info: "生于：§!§L1907年12月5日（一说1908年）；湖北黄冈§!"
PRC_LingBiao_bio: "林彪，原名祚大，字阳春，号毓蓉。早年受进步思想影响，1923年在武昌共进中学读书时加入中国社会主义青年团。1925年“五卅”运动期间，他积极参加学生运动，并代表武汉学生赴上海出席全国学生联合会第七次代表大会。同年，他加入中国共产党，并考入黄埔军校第四期步兵科。\n1926年10月，林彪从黄埔军校毕业，被分派至国民革命军第四军叶挺独立团（后改编为第25师73团）任见习排长，随后参加了北伐战争。1927年，他先后参加了武汉国民政府的第二次北伐和南昌起义，起义时任第11军25师73团连长。南昌起义军在广东潮汕地区受挫后，他随朱德、陈毅转战闽粤赣湘边界。\n1928年1月，林彪参加湘南起义。在随后的耒阳之战和敖山庙阻击战中，他指挥少量部队击溃敌军优势兵力，开始崭露头角。同年4月，他随部队上井冈山与毛泽东会师，先后任中国工农红军第四军第二十八团营长、团长，参与了巩固和发展井冈山革命根据地的斗争。\n1929年3月，随军挺进赣南、闽西后，林彪升任红四军第一纵队司令员。1930年6月，年仅23岁的林彪出任红四军军长，成为红军中最年轻的高级指挥员之一。至1930年底，他已在多次反“围剿”作战中表现出卓越的战术才能，深得朱德、毛泽东的器重，为其日后成为红军重要军事领导人奠定了基础。"
PRC_HeLong: "贺龙"
PRH_HeLong: "贺龙"
PRC_HeLong_leader_desc: "§Y$PRC_HeLong_birth_info$\n§Y背景：§!§L$PRC_HeLong_bio$\n\n"
PRC_HeLong_birth_info: "生于：§!§L1896年3月22日；湖南桑植§!"
PRC_HeLong_bio: "贺龙，原名文常，字云卿，湖南桑植人，土家族。1914年加入中华革命党。1916年以两把菜刀起事，组织农民武装。1918年任湘西靖国军第三梯团团长。1922年任川东边防军警备旅旅长。1925年任澧州镇守使。\n1926年，贺龙任国民革命军第八军第六师师长，参加北伐战争。1927年任独立第十五师师长，在河南大败奉军，升任第二十军军长。同年8月，他率部参加南昌起义，任起义军总指挥，并加入中国共产党。起义失败后，他回湘鄂西组织革命武装。\n1928年，贺龙与周逸群等创建湘鄂西革命根据地，任红四军（后改称红二军）军长。1930年7月，红二军与红六军在湖北公安会师，组成红二军团，他任总指挥。他领导湘鄂西根据地军民开展土地革命，进行武装斗争。贺龙作战勇猛，在湘鄂西群众中威望极高，被称为'贺胡子'。至1930年底，湘鄂西根据地已成为全国主要的革命根据地之一。"
RFC_LiJiSheng: "李济深"
RFC_LiJiSheng_leader_desc: "§Y$RFC_LiJiSheng_birth_info$\n§Y背景：§!§L$RFC_LiJiSheng_bio$\n\n"
RFC_LiJiSheng_birth_info: "生于：§!§L1885年11月6日；广西苍梧§!"
RFC_LiJiSheng_bio: "李济深，字任潮。早年就读于广东陆军速成学堂，1914年于北京陆军大学毕业后留校任教。后受革命感召南下广州，加入中国国民党，投身孙中山领导的护法军政府。在粤军第一师中，他由参谋长逐步升任师长，成为孙中山在粤倚重的军事骨干。\n1924年，黄埔军校筹建，李济深是筹备委员会的重要成员。他倾力支持，从所部调拨现款、枪支，并推荐得力军官如邓演达、陈诚等担任教官，为军校的创立奠定了基础。军校成立后，他出任教练部少将主任，后又兼任副校长，为培养革命军事人才贡献卓著。\n1925年，李济深升任国民革命军第四军军长。1926年北伐开始，他出任国民革命军总司令部参谋长，并代行总司令职权，留守广州大本营，统筹后方军政，确保北伐前线补给，权倾一时。1927年，他曾在广州参与“四一五”清党活动。北伐完成后，他担任广东省政府主席等要职。\n1929年，因蒋介石与桂系矛盾激化，李济深以调停人身份赴南京，却被蒋介石以“勾结桂系、分头发难”的罪名扣押，软禁于南京汤山达八个月之久，并被“永远开除国民党党籍”。此事成为其政治生涯的重大转折点。至1930年，这位一度镇守华南、门生故旧遍布军界的元老，在失去自由后，其政治立场与未来道路正面临根本性的重新抉择。"
NSD_SiFangMian: "第四方面军指挥部"
PRQ_FengBaiJu: "冯白驹"
PRQ_FengBaiJu_leader_desc: "§Y$PRQ_FengBaiJu_birth_info$\n§Y背景：§!§L$PRQ_FengBaiJu_bio$\n\n"
PRQ_FengBaiJu_birth_info: "生于：§!§L1903年；广东琼山（今海南海口）§!"
PRQ_FengBaiJu_bio: "冯白驹，原名冯裕球，学名冯继周[citation:1][citation:3]。1925年，他在上海大夏大学预科读书期间接触革命思想[citation:1][citation:8]。1926年（一说9月[citation:1]，一说11月[citation:3]）加入中国共产党，自此投身革命[citation:1]。1927年，在琼崖“四二二”事变后，他奉命组建中共琼山县委并担任书记，开始创建革命武装[citation:1]。同年7月，任琼崖讨逆革命军第六路军党代表，并于9月率部参加全琼武装总暴动[citation:1]。1929年初，他被派往澄迈县组建县委并任县委书记[citation:1]。1930年1月，在琼崖革命的关键时刻，冯白驹接任中共琼崖特别委员会书记，开始全面领导琼崖地区的革命斗争[citation:8]。"



NSA_LiuZhiDan: "刘志丹"
NSA_LiuZhiDan_leader_desc: "§Y$NSA_LiuZhiDan_birth_info$\n§Y背景：§!§L$NSA_LiuZhiDan_bio$\n\n"
NSA_LiuZhiDan_birth_info: "生于：§!§L1903年10月4日；陕西保安（今志丹县）§!"
NSA_LiuZhiDan_bio: "刘志丹，名景桂，字子丹，陕西保安（今志丹县）人[citation:2][citation:9]。1924年冬加入中国社会主义青年团[citation:2]。1925年春转为中国共产党党员[citation:2]，同年秋受党指派进入黄埔军校第四期学习[citation:2]。1926年秋毕业后参加北伐战争[citation:2]。\n1927年大革命失败后，他担任中共陕西省委的秘密交通工作[citation:2]。1928年4月，他参与领导了渭华起义，并担任西北工农革命军军事委员会主席[citation:1][citation:2]。同年秋，他担任中共陕北特委军事委员会书记，开始在陕甘边地区从事兵运工作[citation:2][citation:8]。1930年10月，他组建起一支约100人的南梁游击队，由此揭开了陕甘边区武装斗争的序幕[citation:3][citation:4]。至1930年底，刘志丹已成为中共在西北地区开展军事斗争的核心领导者之一，为日后创建红军和根据地奠定了初步基础。"

XIA_xia_gong: "夏恭"
XIA_xia_gong_leader_desc: "§Y$XIA_xia_gong_birth_info$\n§Y背景：§!§L$XIA_xia_gong_bio$\n\n"
XIA_xia_gong_birth_info: "生于：§!§L1872年；山西大同§"
XIA_xia_gong_bio: "夏恭，字肃斋，山西大同人。清末举人出身，为地方知名士绅。其早年生平及在1930年前的具体活动，现存可靠记载较少。"
PRC_NieRongZhen: "聂荣臻"
PRC_NieRongZhen_leader_desc: "§Y$PRC_NieRongZhen_birth_info$\n§Y背景：§!§L$PRC_NieRongZhen_bio$\n\n"
PRC_NieRongZhen_birth_info: "生于：§!§L1899年12月29日；四川江津（今属重庆）§!"
PRC_NieRongZhen_bio: "聂荣臻，四川江津人。1919年赴法国勤工俭学。1922年加入旅欧中国少年共产党（后改称旅欧中国共产主义青年团）。1923年转为中国共产党党员。1924年赴苏联学习，入莫斯科东方劳动者共产主义大学，后转入苏联红军学校中国班学习军事。\n1925年回国，任黄埔军校政治部秘书兼政治教官。1926年任中共广东区委军委特派员，参加北伐战争。1927年任中共前敌军委书记，参加南昌起义，任起义军第十一军党代表。起义失败后，转赴广州，参与领导广州起义。\n1928年，聂荣臻任中共广东省委军委书记。1930年任中共顺直省委组织部部长。他长期在国民党统治区从事党的秘密工作，积累了丰富的斗争经验。聂荣臻军事、政治才能兼备，工作细致稳重，在党的军事工作和组织工作方面有重要贡献。至1930年底，他正在天津从事党的地下工作。"
WDL_WangDeLing: "王德林"
WDL_WangDeLing_leader_desc: "§Y$WDL_WangDeLing_birth_info$\n§Y背景：§!§L$WDL_WangDeLing_bio$\n\n"
WDL_WangDeLing_birth_info: "生于：§!§L1875年；山东沂水（一说吉林敦化）§!"
WDL_WangDeLing_bio: "王德林，原名王林，字惠民。出身贫苦农家，少年时随家迁居吉林敦化。早年因生活所迫投身绿林，在吉林东部山林中活动，以‘义侠’闻名乡里，常劫富济贫，抗击侵扰地方的白俄匪帮与不法官绅，在吉东地区颇有声望。\n1903年，时任清军吉强军统领的胡殿甲鉴于王德林熟悉地形、勇猛善战且深得民心，对其予以招抚。王德林率部众百余人接受改编，被任命为吉强军步队哨官，由此步入行伍。1907年，他随军参与剿灭吉林匪患，因功升任营官。民国建立后，所在部队编入吉林陆军。\n1922年，王德林升任吉林陆军第七旅第一百零三团第三营营长，驻防延吉、汪清一带。他治军严谨，身先士卒，且对驻地百姓秋毫无犯，在军民中威信颇高。1925年，郭松龄反奉时，他奉命率部警戒后方，确保吉东稳定。战后因功晋升为吉林陆军第七旅第三十四团团附。\n至1930年，王德林任吉林陆军第七旅第六十三团（或作第六六五团）团附，驻守吉敦铁路沿线。他虽年过半百，但依然保持着军人的刚毅与对家国的忠诚。此时，他作为一位在吉东地区根基深厚、富有江湖义气与爱国情怀的资深军官，其命运与东北边防的安危紧密相连。未来，当外敌大举入侵时，这位绿林出身的将领将爆发出惊人的能量，成为东北抗日义勇军一面耀眼的旗帜。"
