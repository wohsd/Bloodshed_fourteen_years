  # 架空历史事件链
  ROD_unreal.1.t: "九一八事变 - 东北军奋起抵抗"
  ROD_unreal.1.d: "1931年9月18日夜，日本关东军突然发动九一八事变，炮轰沈阳北大营。次日清晨，张学良将军在北平发表全国广播演讲，声泪俱下地痛斥日本侵略者的暴行："东北是中国的东北，我们绝不能让一寸土地落入敌手！"他宣布打破不抵抗政策，命令东北军全体将士奋起抵抗，并正式向日本关东军宣战。张学良的演讲点燃了全国人民的抗日热情。"
  ROD_unreal.1.a: "奋起抵抗！"

  ROD_unreal.2.t: "组织东北抗日义勇军"
  ROD_unreal.2.d: "为了扩大抗日力量，东北军开始组织抗日义勇军，号召广大爱国青年、工人、农民加入抗日队伍。短短数月，义勇军队伍迅速壮大，成为东北地区抗击日本侵略者的重要力量。"
  ROD_unreal.2.a: "组织义勇军"

  ROD_unreal.3.t: "联合东北抗日联军"
  ROD_unreal.3.d: "为了团结一切抗日力量，东北军与杨靖宇、赵尚志等领导的东北抗日联军达成合作协议。双方摒弃党派分歧，组成统一的抗日联军，形成了强大的抗日武装力量。"
  ROD_unreal.3.a: "联合抗联"

  ROD_unreal.4.t: "建立敌后抗日根据地"
  ROD_unreal.4.d: "在东北地区建立多个敌后抗日根据地，包括长白山、大兴安岭等战略要地。这些根据地不仅为抗日武装提供了物资补给和休整场所，也成为了发动群众、开展游击战争的重要基地。"
  ROD_unreal.4.a: "建立根据地"

  ROD_unreal.5.t: "获得苏联援助"
  ROD_unreal.5.d: "在与中国共产党的积极合作下，东北军通过秘密渠道获得了苏联的军事援助，包括武器装备、弹药和军事顾问。这些援助大大增强了东北军的战斗力，为后续的反攻奠定了基础。"
  ROD_unreal.5.a: "接受援助"

  ROD_unreal.6.t: "发动冬季攻势"
  ROD_unreal.6.d: "1932年冬季，东北军利用日本关东军不适应严寒天气的弱点，发动了大规模的冬季攻势。抗日联军在冰天雪地中对日军据点展开猛烈攻击，取得了一系列胜利，沉重打击了侵略者的气焰。"
  ROD_unreal.6.a: "发动攻势"

  ROD_unreal.7.t: "收复沈阳"
  ROD_unreal.7.d: "经过数月的艰苦战斗，东北军在1933年初成功收复沈阳。这座东北的政治、经济中心重新回到中国人民手中，极大地鼓舞了全国人民的抗日士气，也让世界看到了中国人民抗击侵略者的决心。"
  ROD_unreal.7.a: "收复沈阳"

  ROD_unreal.8.t: "与关内抗日力量会师"
  ROD_unreal.8.d: "1933年春，东北军与关内的国民革命军在长城一线成功会师。双方将士握手言欢，共同宣誓要将日本侵略者赶出中国。全国抗日力量的大团结，为最终的胜利奠定了坚实基础。"
  ROD_unreal.8.a: "会师关内"

  ROD_unreal.9.t: "发动全面反攻"
  ROD_unreal.9.d: "1933年夏，在全国抗日力量的支持下，东北军发动全面反攻。抗日联军分多路向日军占领区发起进攻，收复了大片失地。到1933年底，东北全境基本光复，日本侵略者被赶出了中国东北。"
  ROD_unreal.9.a: "全面反攻"

  ROD_unreal.10.t: "抗日战争胜利"
  ROD_unreal.10.d: "经过两年多的艰苦卓绝战斗，东北军与全国抗日力量一起，彻底击败了日本侵略者。1933年12月，日本被迫宣布投降，中国人民取得了抗日战争的伟大胜利。东北军因此成为了中华民族的英雄，张学良将军也被尊为抗日民族英雄。"
  ROD_unreal.10.a: "庆祝胜利！"

  ROD_unreal.11.t: "南京要求我们放弃抵抗"
  ROD_unreal.11.d: "南京国民政府发来急电，要求东北军立即停止对日作战，服从中央政府的"攘外必先安内"政策。电报中称："为保全国家元气，避免无谓牺牲，望汉卿兄以大局为重，停止军事行动，等待国际调停。"这是一个艰难的选择——服从命令意味着放弃东北，但违抗命令则意味着与南京决裂。"
  ROD_unreal.11.a: "东北绝不投降！"

  ROD_unreal.12.t: "正式脱离南京政府"
  ROD_unreal.12.d: "在拒绝了南京的投降命令后，张学良将军正式宣布东北军脱离南京国民政府的管辖。他在宣言中痛陈："南京政府已丧失领导全国抗日之资格，东北军为保家卫国，不得不另寻出路。自今日起，东北军将独立行使抗日主权，直至将日寇完全驱逐出境！"此举标志着东北军与中央政府的正式决裂。"
  ROD_unreal.12.a: "独立自主，抗日到底！"

  ROD_unreal.13.t: "号召民间抗日"
  ROD_unreal.13.d: "为扩大抗日力量，张学良将军向全国发表《告民众书》，号召所有爱国志士、热血青年加入抗日队伍。宣言中写道："国之将亡，匹夫有责！无论男女老幼，无论党派信仰，凡我中华儿女，皆有保家卫国之责！"响应号召的民众络绎不绝，工人、农民、学生纷纷报名参军，抗日热情空前高涨。"
  ROD_unreal.13.a: "全民抗战！"

  ROD_unreal.14.t: "转移工厂"
  ROD_unreal.14.d: "为防止重要工业设施落入敌手，东北军开始组织大规模的战略转移。沈阳兵工厂、鞍山钢铁厂等重要企业的设备被紧急拆卸装车，向内地转移。工人们夜以继日地工作，将机器设备、原材料和熟练技工转移到安全地区。虽然损失惨重，但这些工业能力将为长期抗战提供重要支撑。"
  ROD_unreal.14.a: "保存实力，持久抗战！"

  ROD_unreal.15.t: "东北军回援"
  ROD_unreal.15.d: "消息传来，关内的东北军旧部纷纷响应号召，突破重重阻碍回师增援。这些将士大多是东北子弟，对故土有着深厚的感情。他们在途中高唱《松花江上》，誓言要打回东北老家。与此同时，海外华侨也踊跃捐款捐物，支援东北抗战。各路援军的到来，极大地增强了东北军的战斗力。"
  ROD_unreal.15.a: "众志成城，收复东北！"

