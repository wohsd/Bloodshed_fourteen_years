  # 民族精神
  ROD_northeast_army_tradition: "东北军传统"
  ROD_northeast_army_tradition_desc: "东北军源自北洋奉系，历经多次战争洗礼，形成了独特的军事传统。这支军队虽然失去了故土，但仍保持着顽强的战斗精神和军事素养。"
  
  ROD_exile_pain: "流亡之痛"
  ROD_exile_pain_desc: "九一八事变后，东北军被迫离开故土，流亡关内。失去家园的痛苦化作了复仇的决心，每一位将士都渴望打回东北，收复失地。"
  
  ROD_anti_japanese_vanguard: "抗日先锋"
  ROD_anti_japanese_vanguard_desc: "东北军是最早遭受日本侵略的军队，也是最早奋起反抗的力量。他们深知亡国之痛，因此成为了抗日的先锋和主力，誓要将日寇赶出中国。"

# ========== ROD 工业线与经济线国策 ==========
  ROD_ind_root: "东北新建设"
  ROD_ind_root_desc: "东北易帜，海内粗定。少帅决心休养生息、兴办实业：整顿奉票、扩充兵工、筑路开港、移民实边，把关外黑土地建成真正的新东北。"

  ROD_ind_arsenal: "扩充东三省兵工厂"
  ROD_ind_arsenal_desc: "奉天兵工厂号称远东第一，设备之精、产能之巨冠于全国。继续拨款扩充厂房与流水线，东北军的枪炮弹药便可自给自足。"

  ROD_ind_buy_arms: "采办万国军械"
  ROD_ind_buy_arms_desc: "东北军向有「万国军械博览会」之称。趁欧洲各国倾销战后军备，派员赴捷克、法国、日本洽购精良武器，先解燃眉之急。"

  ROD_ind_copy_arms: "设厂仿造军械"
  ROD_ind_copy_arms_desc: "买来的武器终会受制于人。以奉天兵工厂为基，测绘拆解各国名枪名炮，择其优者仿制，逐步实现军械自主。"

  ROD_ind_foreign_advisors: "聘请外籍技师"
  ROD_ind_foreign_advisors_desc: "重金延揽欧洲技师入厂传艺，培养自己的军械人才，把冶钢、铸管与弹道计算的真本事学到手。"

  ROD_ind_standardize: "统一弹药制式"
  ROD_ind_standardize_desc: "万国牌枪械带来万国种弹药，后勤苦不堪言。划定统一口径与弹药制式，各厂按图生产，前线再不必为一颗子弹发愁。"

  ROD_ind_fuel: "抚顺阜新煤田与页岩油"
  ROD_ind_fuel_desc: "抚顺、阜新煤层厚而易采，抚顺油母页岩更可干馏取油。扩建矿井、兴建设炼油厂，为机器与战舰储备黑色血液。"

  ROD_ind_steel: "鞍山本溪煤铁"
  ROD_ind_steel_desc: "鞍山铁矿、本溪煤铁近在咫尺，煤铁相生之地正是钢铁工业的摇篮。扩建高炉与平炉，让东北不再只出矿石，也出钢轨与枪炮钢。"

  ROD_ind_port: "葫芦岛筑港"
  ROD_ind_port_desc: "南满货物出口尽被大连港把持。1930年与荷兰公司签约修筑葫芦岛不冻港，配合自有铁路，打破日人对东北出海口的垄断。"

  ROD_ind_machinery: "东北机器修造业"
  ROD_ind_machinery_desc: "东北大学工厂、大亨铁工厂已能自造机车部件与工矿机械。扶持机器修造业，让矿山、铁路与兵工厂都有自家的机床撑腰。"

  ROD_ind_railway: "自建铁路干线"
  ROD_ind_railway_desc: "奉海、吉海、洮索诸路相继动工，东西干线绕开满铁自行组网。路权所至，即利权所至，沿线矿场林产也随之盘活。"

  ROD_ind_university: "扩充东北大学理工科"
  ROD_ind_university_desc: "少帅自兼校长，斥巨资扩建东北大学，礼聘国内名师，尤重工科。理工人才正是一省工业最长久的本钱。"

  ROD_ind_wartime: "战时军工总动员"
  ROD_ind_wartime_desc: "日寇压境，军需孔亟。颁布战时工业动员令，各厂转产军品、延长工时，让每一座高炉与车床都为抗战轰鸣。"

  ROD_ind_relocate: "工业内迁大西北"
  ROD_ind_relocate_desc: "关外不守，关内亦难保无虞。未雨绸缪，将机器、技工与图纸分批迁往西安、宝鸡重建工厂，为长期抗战保存工业火种。"

  ROD_ind_defense: "建成国防工业体系"
  ROD_ind_defense_desc: "煤、铁、油、钢、枪、炮、路、港环环相扣，一个足以支撑全面战争的国防工业体系在东北军治下初具规模。有恒产者方有恒心。"

  ROD_eco_bank: "巩固东三省官银号"
  ROD_eco_bank_desc: "东三省官银号是三省金融的总枢纽。充实准备金、整顿钱法、收拢发钞权，先稳住金融这盘棋的棋眼。"

  ROD_eco_fengpiao: "整顿奉票"
  ROD_eco_fengpiao_desc: "历年征战透支，奉票毛荒、物价腾贵。厉行兑现、紧缩发行，重建奉票信用——东北宁可少借债，也不印纸骗人。"

  ROD_eco_fabi: "遵行法币政策"
  ROD_eco_fabi_desc: "中央推行法币、统一全国币制。顺水推舟放弃奉票独立，既可收统一市场之利，也向南京表明服从中央、共御外侮的诚意。"

  ROD_eco_banknet: "三省金融网络"
  ROD_eco_banknet_desc: "边业银行与官银号分号密布奉天、吉林、黑龙江，汇划通达、农贷下乡，让商业资本流得动、也让农家借得到钱。"

  ROD_eco_customs: "力争关税自主"
  ROD_eco_customs_desc: "协定关税捆住中国数十年。借外交交涉争回税则自主权，提高外货进口税率，既护持本土实业，也充实三省府库。"

  ROD_eco_soy: "振兴大豆三品"
  ROD_eco_soy_desc: "大豆、豆粕、豆油「三品」占东北出口之半，畅销东瀛与南洋。设交易所、统制品质、自备运输，把豆黄金的利权握在自己手里。"

  ROD_eco_reclaim: "兴安屯垦实边"
  ROD_eco_reclaim_desc: "设兴安屯垦公署，邹作华率屯垦军沿洮儿河开荒筑路、编练屯丁。移民实边、足食足兵，亦使蒙地不再为外人觊觎。"

  ROD_eco_immigration: "招徕关内移民"
  ROD_eco_immigration_desc: "关内连年兵燹天灾，流民「闯关东」者岁以百万计。减票招垦、计口授田、贷给牛马种籽，使人丁与黑土地相结合。"

  ROD_eco_cooperatives: "农村信用合作社"
  ROD_eco_cooperatives_desc: "仿华洋义赈会成法，广设农村信用与运销合作社，低利借贷、联合购销，把农户从高利贷与粮商的盘剥中解救出来。"

  ROD_eco_relief_works: "以工代赈兴修公路"
  ROD_eco_relief_works_desc: "与其坐而赈饥，不如征发灾民筑路修堤。以工代赈既活民命，又在华北、西北织起一张公路网，军民两受其益。"

  ROD_eco_trade_war: "对日经济绝交"
  ROD_eco_trade_war_desc: "日寇武力未动，经济先侵：走私猖獗、白银外流、日货倾销。厉行缉私、抵制日货、提倡国货，以经济绝交回答侵略。"

  ROD_eco_national_economy: "国民经济建设运动"
  ROD_eco_national_economy_desc: "推行国民经济建设运动，提倡国货、振兴农业、改良手工业，动员全社会「尽人力、辟地利、供求应」，于建设中积蓄国力。"

  ROD_eco_control: "推行统制经济"
  ROD_eco_control_desc: "非常之时当行非常之法。对金融、贸易、工矿实行统制，限量保军需、定向配资源，把有限的生产力集中到刀刃上。"

  ROD_eco_wartime_system: "建立战时经济体制"
  ROD_eco_wartime_system_desc: "金融、产业、交通全面纳入战时轨道：粮秣有征发、物资有管制、工厂有动员。经济战线与战场同为一体，坚持到胜利的那一天。"

# ========== ROD 工业与经济国家精神 ==========
  ROD_idea_mukden_arsenal: "东三省兵工厂"
  ROD_idea_mukden_arsenal_desc: "远东第一兵工厂的钢铁洪流，使东北军火供应无虞。"
  ROD_idea_standard_arms: "统一弹药制式"
  ROD_idea_standard_arms_desc: "口径归一、弹药通用，生产线转产更加从容。"
  ROD_idea_coal_steel: "煤铁基地"
  ROD_idea_coal_steel_desc: "抚顺的煤、鞍山的铁，为工业建设提供了坚实底座。"
  ROD_idea_huludao: "葫芦岛开港"
  ROD_idea_huludao_desc: "自有出海口带动了整个东北的基建与贸易。"
  ROD_idea_fengpiao: "奉票信用"
  ROD_idea_fengpiao_desc: "整顿后的奉票币信稳固，民生与军工皆得其利。"
  ROD_idea_soy_trade: "大豆三品贸易"
  ROD_idea_soy_trade_desc: "大豆、豆粕、豆油远销海外，换回宝贵的外汇与机器。"
  ROD_idea_national_economy: "国民经济建设运动"
  ROD_idea_national_economy_desc: "全民投入经济建设，国力在工厂与田间悄然积聚。"
  ROD_idea_war_economy: "战时统制经济"
  ROD_idea_war_economy_desc: "一切为了前线，民用让位于军用。"
























# ========== ROD 政治转型终局国家精神 ==========
  ROD_idea_democratic: "民主抗战的堡垒"
  ROD_idea_democratic_desc: "民选政府领导下的华北，社会多元而韧性十足——这样的国家难以被外敌一夜击垮。"
  ROD_idea_communist: "人民革命政府"
  ROD_idea_communist_desc: "被动员起来的人民就是坚不可摧的国土，革命政府宁可战至最后一人。"
  ROD_idea_fascist: "反共防波堤"
  ROD_idea_fascist_desc: "特务、政训与唯一信仰把东北军锻造成党国最锋利的反共利刃。"

# ========== ROD 政治转型三线国策（KR式错支线）==========
  ROD_pol_root: "政统何往"
  ROD_pol_root_desc: "国难当头，东北军向何处去？是还政于民、联共抗日，还是拥戴一个铁腕领袖以强力救国？三条道路在北平城的风声鹤唳中等待抉择。"

  # ----- 民主主义线 -----
  ROD_pol_dem_1: "开放民众救亡运动"
  ROD_pol_dem_1_desc: "九一八后，阎宝航、高崇民、卢广绩、车向忱等东北名流在北平发起东北民众抗日救国会，学生、工人、报界纷纷加入。放开党禁、允许民众组织起来，让救亡的声音自由发出。"

  ROD_pol_dem_2: "营救七君子·释放政治犯"
  ROD_pol_dem_2_desc: "1936年11月，救国会沈钧儒、章乃器、邹韬奋、李公朴、王造时、沙千里、史良七人在上海被捕。少帅亲赴洛阳当面诤谏，又通电全国要求释放——一个尊重法治与民权的政府，才能让人民真心拥护。"

  ROD_pol_dem_3: "支持一二九学生运动"
  ROD_pol_dem_3_desc: "1935年12月9日，北平数千学生冲上街头反对华北自治。少帅在东城门接见学生代表，承诺「一周内用事实答复你们」，严令部下不许向群众开枪。青年的热血，是民主最宝贵的火种。"

  ROD_pol_dem_press: "开放言论·扶持救亡报刊"
  ROD_pol_dem_press_desc: "扶持《东方快报》《生存》等救亡报刊，取消邮电检查，允许批评时政。言论自由或许会带来杂音，但一个敢让人民说话的政府，才真正经得起国难的考验。"

  ROD_pol_dem_4: "召集全国救国会议"
  ROD_pol_dem_4_desc: "联合全国各界救国联合会、第三党、青年党、乡村建设派与东北抗日各团体，召集各方救国会议。各党派政见虽异，却无不愿赴国难——民主抗日的联合阵线由此成型。"

  ROD_pol_dem_5: "民主联合政府"
  ROD_pol_dem_5_desc: "吸收各抗日党派与无党派人士入阁，组建民主联合政府，推行省议会民选与地方自治。民主从乡邻之间的一张选票开始，而非止于南京的一纸通电。"

  ROD_pol_dem_6: "颁行宪法·还政于民"
  ROD_pol_dem_6_desc: "结束国民党训政，召开国民大会、颁行宪法，还政于民。东北军率先放下枪杆子干政的传统，宣誓效忠宪法与人民——这在军阀林立的中国，需要绝大的勇气。"

  ROD_pol_dem_7: "民主抗战的堡垒"
  ROD_pol_dem_7_desc: "华北成为全中国民主与抗战的双重堡垒：民选的政府、自由的民众、誓死不降的军队。民主不是软弱的代名词——人民知道为何而战，才会战斗到底。"

  # ----- 共产主义线 -----
  ROD_pol_com_1: "秘密接触中共"
  ROD_pol_com_1_desc: "榆林桥一役，团长高福源被俘后在红军中深受触动，自请归去充当信使。一条秘密渠道，在东北军与红军之间悄然接通。"

  ROD_pol_com_2: "洛川会谈"
  ROD_pol_com_2_desc: "1936年初，李克农与王以哲、张学良在洛川秘密会谈，双方达成停火、通商与互通情报的默契。围剿前线的枪声，渐渐稀落了。"

  ROD_pol_com_3: "延安会谈"
  ROD_pol_com_3_desc: "1936年4月9日夜，延安天主教堂，周恩来与张学良彻夜长谈。拥蒋还是反蒋、抗日如何发动——年轻的少帅第一次被一种主义真正说服。"

  ROD_pol_com_4a: "西安兵谏"
  ROD_pol_com_4a_desc: "1936年12月12日凌晨，临潼华清池枪声大作。张学良与杨虎城断然实行「兵谏」，扣押蒋介石，通电全国提出停止内战、一致抗日的八项主张——这是一场以整个身家性命为赌注的豪赌。"

  ROD_pol_com_4b: "组建西北国防政府"
  ROD_pol_com_4b_desc: "与此同时，另一个方案也在酝酿：联合苏联与红军，以兰州、西安为中心组建抗日联军临时西北军事委员会与西北国防政府，揭旗独立、联苏联共。莫斯科的态度，将决定走哪条路。"

  ROD_pol_com_5: "三位一体·逼蒋抗日"
  ROD_pol_com_5_desc: "兵谏之后，周恩来亲赴西安调停。东北军、十七路军与红军「三位一体」，最终和平解决、逼蒋承诺停止内战。十年血海深仇的两军，即将并肩开赴同一个战场。"

  ROD_pol_com_6: "人民革命政府"
  ROD_pol_com_6_desc: "旧军阀的旗帜落下，人民革命政府在西北宣告成立。打土豪、分田地、武装工农——东北军不再是某个人的军队，而是人民的武装。"

  ROD_pol_com_7: "红军抗日先锋"
  ROD_pol_com_7_desc: "被动员起来的东北军官兵编入抗日先锋军，东渡黄河、挺进抗日前线。这支曾经围剿红军的军队，如今高唱着《义勇军进行曲》，成为人民解放与民族救亡的双重先锋。"

  # ----- 法西斯主义线 -----
  ROD_pol_fas_1: "子承父业"
  ROD_pol_fas_1_desc: "张作相、万福麟等奉系老臣齐聚帅府，拥戴少帅继承大帅衣钵。东北的命运不能系于南京一纸电令，三十万奉军需要自己的主心骨——当年大帅张作霖能做到的，少帅一样能做到。"

  ROD_pol_fas_2: "重振奉军"
  ROD_pol_fas_2_desc: "以东三省讲武堂旧班底整训三军：汰弱留强、统一军械、恢复军法官杀。奉军要从丧师失地的阴影中走出来，重新成为关外最锋利的那把刀。"

  ROD_pol_fas_3: "拥立唯一领袖"
  ROD_pol_fas_3_desc: "中国一盘散沙，正因没有中心。奉系率先立下规矩：全军只忠于少帅一人，政出一门、令行禁止。当年大帅以一帮保险队起家，靠的正是这套人身依附的铁律。"

  ROD_pol_fas_italy: "远交德意"
  ROD_pol_fas_italy_desc: "派密使分赴罗马、柏林，聘请军事顾问、订购战机军械。德意欣赏反共立场与强人政治，奉系需要的是枪炮和建军经验——双方各取所需。"

  ROD_pol_fas_fudong: "取消复东会"
  ROD_pol_fas_fudong_desc: "复东会是东北流亡人士的救亡政治核心，素为南京所忌。§Y1934年5月§!，作为与蒋公合作的投名状，少帅亲手下令解散复东会，阎宝航、高崇民等旧人痛心疾首；其骨干与复兴社人马合流，一同并入即将成立的四维学会。"

  ROD_pol_fas_4: "扶持四维学会"
  ROD_pol_fas_4_desc: "§Y1934年5月§!，四维学会在武汉成立，蒋公自任名誉会长、少帅任会长，以「§O礼义廉耻§!」为纲，将东北籍旧部与南京系组织熔于一炉；新生活运动随即随军推行，从衣着起居到思想信仰一律制式化。他真心相信，法西斯式的纪律能把这盘散沙拧成一根绳。"

  ROD_pol_fas_5: "组训党军"
  ROD_pol_fas_5_desc: "复兴社（蓝衣社）政训人员在曾扩情主持下进驻东北军各级部队，特务、组织与效忠教育并行；奉军被改造为只知有领袖、不知有其他的党军。先立住自己的权柄，再谈安内攘外。"

  ROD_pol_fas_6: "兵出榆关"
  ROD_pol_fas_6_desc: "大军云集山海关，奉军再次亮出獠牙。§Y1924年§!大帅正是从此处挥师入关，两度逐鹿中原。这一次，少帅要用三十万大军证明：东北不只是南京的北方屏障，更是问鼎天下的一方诸侯。"

  ROD_pol_fas_7: "通电入关"
  ROD_pol_fas_7_desc: "一纸通电震动全国：东北军挥师入关，入主平津，继承大帅「安国军大元帅」的未竟之业。南京也好、两广也好，从此都要重新掂量这位年轻的东北王。中国的强人政治，奉系要坐头一把交椅。"
  ROD1931.991.t: "旧疾复发"
  ROD1931.991.d: "高烧反复，咳血不止——伤寒与戒断的后遗症一起找上门来。医生再次劝少帅静养，可东北的烂摊子，哪一样离得开他？\n\n§Y压力已超过70，国家陷入「积劳成疾」：§!§R稳定度与政治点获取受创。§!尽快完成戒毒疗养或减轻压力。"
  ROD1931.991.a: "又是彻夜难眠……"
  ROD1931.992.t: "身心俱疲"
  ROD1931.992.d: "外有强敌环伺，内有骂名滔天。少帅形销骨立，安眠药越用越重，有时一天昏睡十几个小时，醒来说不出一句整话。副官们私下担忧：再这样下去，怕是要垮。\n\n§Y压力已达到90，张学良「身心俱疲」：§!§R稳定度、政治点获取与战争支持全面受创。§!"
  ROD1931.992.a: "我……还能撑住。"
  ROD_zhang_stress_high: "积劳成疾"
  ROD_zhang_stress_high_desc: "少帅积劳成疾，旧病缠身：§R稳定度-5%，政治点获取-10%§!。完成戒毒疗养或通过减压决议可缓解。"
  ROD_zhang_stress_severe: "身心俱疲"
  ROD_zhang_stress_severe_desc: "内外交困，身心俱疲：§R稳定度-10%，政治点获取-20%，战争支持-5%§!。少帅的健康已亮起红灯。"
  ROD_rehab_suffering: "戒毒之苦"
  ROD_rehab_suffering_desc: "戒毒正在进行，戒断反应剧烈：§R稳定度-3%，政治点获取-10%§!。§Y180天后自然消退。§!"
  ROD_hidden.1.t: "张学良退隐"
  ROD_hidden.1.d: "连番战败，舆论汹汹，党内「请杀张以谢国人」之声不绝。蒋介石暗示少帅「暂避风头」——张学良被迫宣布下野出洋，将队伍与华北残局交托于学忠。"
  ROD_hidden.2.t: "西北剿匪总部成立"
  ROD_hidden.2.d: "1935年10月，国民政府设西北剿匪总部于西安，蒋介石自兼总司令，张学良任副总司令代行其职。东北军主力奉调入陕甘「剿共」——他们背井离乡，却要在这里打中国人。"
  ROD_hidden.3.t: "赴任北平绥靖公署"
  ROD_hidden.3.d: "1932年8月，国民政府任命张学良为北平绥靖公署主任，节制华北军政。虽辞去副帅名位、待罪于平津，少帅依然是华北的实际主宰。"
  ROD1931.927.t: "东北民众抗日救国会成立"
  ROD1931.927.d: "§Y1931年9月27日§!，流亡北平的东北爱国人士在西单牌楼旧刑部大街12号的奉天会馆东院——哈尔飞大戏院正式召开大会，宣布成立§Y东北民众抗日救国会§!。由卢广绩、阎宝航、高崇民等发起，宗旨为「抗日救国，收复失地」，联络东北军旧部、组织义勇军、募捐援抗。少帅虽不便公开出面，却暗中默许甚至资助——这是东北沦陷后，流亡同胞第一次有了自己的抗战组织。"
  ROD1931.927.a: "暗中拨款支持，鼓舞士气"
  ROD1931.927.b: "默许其活动，不公开介入"
  ROD1931.1104.t: "江桥抗战"
  ROD1931.1104.d: "§Y1931年11月4日§!，黑龙江省代主席马占山率省防军在嫩江江桥阻击日军多门二郎师团，打响§Y东北正规军武装抗日第一枪§!。江桥一战歼敌千余，全国振奋，「义勇军进行曲」式的呼声传遍大江南北。然而马占山兵力单薄、弹药不济，急电北平求援——少帅必须抉择。"
  ROD1931.1104.a: "全力增援，死守江桥"
  ROD1931.1104.b: "抽调一部兵力接济"
  ROD1931.1104.c: "力不能及，只能坐视"
  ROD1932.309.t: "伪满洲国成立"
  ROD1932.309.d: "§Y1932年3月9日§!，废帝溥仪在关东军扶持下于长春「登基」，伪满洲国正式挂牌。东三省彻底沦入敌手，东北三千万同胞沦为亡国奴。消息传来，举国哗然，流亡关内的东北军民更是义愤填膺——张作相、万福麟等老臣通电声讨，少帅的压力到达了顶点。"
  ROD1932.309.a: "通电声讨，誓师收复失地"
  ROD1932.309.b: "沉默以对，静待国联裁决"
  ROD1933.101.t: "榆关抗战·长城烽火"
  ROD1933.101.d: "§Y1933年1月1日§!，日军向山海关发起进攻，何柱国率部奋起抵抗，长城抗战爆发。榆关守军以寡敌众，激战三昼夜，安德馨营三百将士全部殉国，山海关于1月3日陷落。日军沿长城线全面推进，热河、冀东告急——这是九一八以来东北军与日军第一次大规模正面交锋。"
  ROD1933.101.a: "全线抵抗，死守长城各口"
  ROD1933.101.b: "保存实力，逐次后撤"
  ROD1933.311.t: "喜峰口大捷"
  ROD1933.311.d: "§Y1933年3月11日§!，宋哲元第二十九军在喜峰口夜袭日军营地，大刀队砍杀日寇数百，缴获炮十八门、坦克数十辆，取得九一八以来§Y正面战场首次大捷§!。捷报传出，全国欢腾，「大刀向鬼子们的头上砍去」从此传唱长城内外。少帅闻讯，精神为之一振。"
  ROD1933.311.a: "为英雄庆功，通电嘉奖"

  ROD1931.531.t: "第一辆国产汽车下线"
  ROD1931.531.d: "§Y1931年5月31日§!，中国第一辆自主生产的汽车——§O民生75型载货汽车§!在辽宁迫击炮厂总装下线。全车666种零件中464种为自制，国产化率高达七成。为庆祝第一辆国产汽车的问世，辽宁迫击炮厂举行了隆重的庆祝大会。这辆载重两吨的卡车证明：东北人完全有能力建立自己的汽车工业，军队的轮子从此不必再看洋人的脸色。"
  ROD1931.531.a: "东北制造，名不虚传"

# ========== ROD 军事线国策 ==========
  ROD_army_root: "东北军整军备战"
  ROD_army_root_desc: "九一八的炮声证明：旧军队的老一套已经打不赢现代战争。汰弱留强、统一军械、重整训练，东北军要从头练起。"

  ROD_army_def_root: "划区设防"
  ROD_army_def_root_desc: "划设四大防务区，纵深配置、梯次防御，把每一道山梁与河流都变成日军前进的代价。"

  ROD_army_atk_root: "厉兵秣马·待机反攻"
  ROD_army_atk_root_desc: "防御只能保住残局，反攻才能打回老家。整训攻击兵团，蓄精锐以待天时。"

  ROD_army_gua_root: "持久游击"
  ROD_army_gua_root_desc: "敌强我弱，则以空间换时间。化整为零、深入敌后，让关东军寝食难安。"

  ROD_army_fortify: "构筑国防工事"
  ROD_army_fortify_desc: "沿险要山口与铁路枢纽构筑永久工事群，配置重炮与机枪巢——钢筋水泥是最沉默的哨兵。"

  ROD_army_logistics: "整备兵站后勤"
  ROD_army_logistics_desc: "打仗打的是粮弹。统一兵站线路、扩建被服粮秣厂，让前线不再为一发子弹等待。"

  ROD_army_foreshore: "渤海湾岸防"
  ROD_army_foreshore_desc: "日军舰艇可随时在渤海湾择地登陆。配置岸炮、敷设雷区，封锁辽东湾的每一处滩头。"

  ROD_army_armor: "组建战车部队"
  ROD_army_armor_desc: "大帅时代东北军就有雷诺坦克驰骋关内。购买与仿制并举，组建真正属于东北军的战车部队。"

  ROD_army_cavalry_pro: "骑兵现代化"
  ROD_army_cavalry_pro_desc: "东北骑兵天下闻名。配发机枪迫炮、编练乘马步兵，让马刀与现代火力结合起来。"

  ROD_army_air_pro: "扩建东北空军"
  ROD_army_air_pro_desc: "东北空军曾为全国之冠，二百余架战机却在九一八一朝资敌。重建航空队、自办航校，夺回东北的天空。"

  ROD_army_mobilize: "动员抗日义勇军"
  ROD_army_mobilize_desc: "辽吉黑大地上，义勇军风起云涌。收编整顿、配发枪械、派入军官——民众的怒火就是最雄厚的兵源。"

  ROD_army_sabotage: "敌后破袭战"
  ROD_army_sabotage_desc: "炸桥梁、扒铁路、袭据点、夺军资，让满铁的军列夜夜不得安宁。"

  ROD_army_mountain: "长白山山地训练"
  ROD_army_mountain_desc: "长白山的林海雪原是最好的演兵场。编练山地部队，专在日军最不适应的地形与时节作战。"

  ROD_army_jiangqiao: "江桥抗战的教训"
  ROD_army_jiangqiao_desc: "马占山在嫩江桥证明日军并非不可战胜，也暴露了火力与后勤的致命短板。通令全军研讨此战得失，逐条整顿。"

  ROD_army_eq_ind: "装备自主化"
  ROD_army_eq_ind_desc: "奉天兵工厂的机器不能停。枪炮弹药自给自足，东北军的命脉才不握于外人之手。"

  ROD_army_eq_sov: "换装苏式军械"
  ROD_army_eq_sov_desc: "经秘密渠道洽购苏式装备：战车、飞机、火炮性能可靠且价格低廉。莫斯科乐见有人在远东牵制日本。"

  ROD_army_eq_ger: "换装德式军械"
  ROD_army_eq_ger_desc: "聘请德国顾问、采购克虏伯火炮与德械，以世界上最严整的陆军标准重整东北军备。"

  ROD_army_mukden_expand: "扩建奉天兵工厂"
  ROD_army_mukden_expand_desc: "增设枪弹、炮弹与机枪分厂，招募技工、添置机床，让这座远东第一兵工厂开足马力。"

  ROD_army_standardize: "全军枪械制式化"
  ROD_army_standardize_desc: "以辽十三式步枪为全军制式，统一口径、统一弹药、统一操典，万国牌军队从此成为历史。"

  ROD_army_copy_foreign: "仿制列国名械"
  ROD_army_copy_foreign_desc: "测绘捷克式轻机枪、哈奇开斯重机枪与各国名炮，择其优者仿制，逐步形成自己的军械体系。"

  ROD_army_sov_advisors: "延聘苏联军事顾问"
  ROD_army_sov_advisors_desc: "伏龙芝军事学院出身的顾问团抵达奉天，带来大纵深作战与诸兵种协同的新战术。"

  ROD_army_t26: "列装T-26战车"
  ROD_army_t26_desc: "成营的T-26开下军列，45毫米战车炮足以击穿日军任何装甲——东北军第一次拥有可靠的装甲拳头。"

  ROD_army_sbomber: "列装SB快速轰炸机"
  ROD_army_sbomber_desc: "SB快速轰炸机编队成军，速度之快令日军现役战斗机望尘莫及，关东军的机场与兵站从此不再安全。"

  ROD_army_ger_advisors: "延聘德国军事顾问"
  ROD_army_ger_advisors_desc: "普鲁士教官整训参谋本部，讲授阵地构筑、火力配系与参谋作业，东北军的指挥水准为之一新。"

  ROD_army_panzerIII: "列装三号坦克"
  ROD_army_panzerIII_desc: "三号坦克的50毫米长身管炮，足以撕开日军任何野战工事。"

  ROD_army_ju87: "列装斯图卡"
  ROD_army_ju87_desc: "Ju-87俯冲时的呼啸，将成为关东军阵地上最恐怖的声音。"

  ROD_army_unified: "军令军政统一"
  ROD_army_unified_desc: "撤并冗杂机关、统一号令章则，三省军队听从一个参谋本部。东北军从此如臂使指。"

  ROD_army_academy2: "扩建东北讲武堂"
  ROD_army_academy2_desc: "东三省陆军讲武堂曾与保定、黄埔齐名。扩招步、骑、炮、工各科，为全军源源不断输送现代军官。"

  ROD_army_army_group: "编组野战军团"
  ROD_army_army_group_desc: "以军为单位编组野战集群，统一指挥、协同作战，改变以往各旅各自为战的旧习。"

  ROD_army_reserves: "建立后备兵役"
  ROD_army_reserves_desc: "在乡军人登记造册、定期集训。一旦有事，半月之内可再成军十万。"

  ROD_army_resist_japan: "枕戈待旦·收复东北"
  ROD_army_resist_japan_desc: "整军完毕、战备完成。全军枕戈待旦，只待一声令下——打回老家去，收复白山黑水！"

# ========== ROD 军事线国家精神 ==========
  ROD_idea_fortification: "国防工事群"
  ROD_idea_fortification_desc: "山口与要道上遍布永备工事，来犯之敌将在钢筋水泥前撞得头破血流。"
  ROD_idea_yiyongjun: "东北抗日义勇军"
  ROD_idea_yiyongjun_desc: "不愿做奴隶的人们拿起武器：义勇军遍布白山黑水，为正规军提供兵员、情报与游击支援。"
  ROD_idea_jiangqiao_lessons: "江桥抗战的经验"
  ROD_idea_jiangqiao_lessons_desc: "嫩江桥畔的血战换来的经验教训，已化为全军的操典与火力配系。"
  ROD_idea_army_integration: "军令统一"
  ROD_idea_army_integration_desc: "号令出于一门，三省军队如臂使指，再不是各自为战的旧军阀部队。"

  ROD1935.706.t: "何梅协定"
  ROD1935.706.d: "§Y1935年5月§!，华北日军借口东北军支援抗日义勇军、违反《塘沽协定》，在河北步步紧逼，要求中央军与东北军悉数撤出。为围剿江西红军、集中兵力于西北，南京方面选择了退让——§Y7月6日§!，何应钦与梅津美治郎达成§O《何梅协定》§!：河北的中央军与东北军全部南调，党政军机关一律撤离。东北军就此离开盘踞两年的华北，调往西北「围剿」陕北红军。故土未复，又失栖身之地，白山黑水的儿郎从此成了寄人篱下的流亡之师。"
  ROD1935.706.a: "寄人篱下，待机复仇"
