l_simp_chinese:
# 左主线（听命中央线：1931九一八 → 1936西安事变）
  ROD_focus_0: "听命中央·依赖国联"
  ROD_focus_0_desc: "§Y1931年9月18日§!，关东军炮轰北大营。南京的电令只有六个字——「§O力避冲突§!」。少帅判断中日国力悬殊，又背负着「不抵抗将军」的万世骂名，把全部希望押在国联调停上：既然打不赢，那就让世界来裁判吧。"

  ROD_focus_2: "锦州交涉·李顿调查团"
  ROD_focus_2_desc: "关东军占了沈阳还不满足，又觊觎锦州。日方抛出「中立区」方案诱逼，张学良一面虚与委蛇，一面将希望寄托于§Y李顿调查团§!来华。然而国联的决议墨迹未干，日军的炮弹已经落进了锦州城。"

  ROD_focus_3: "辞副帅·待罪北平"
  ROD_focus_3_desc: "§Y1931年12月15日§!，张学良通电辞去陆海空军副司令，「待罪北平」。丢了东三省的他名义上下野，手里却还攥着二十万东北军——丢了老家的军队，和丢了军队的统帅，此刻谁也离不开谁。"

  ROD_focus_4: "主持北平军分会"
  ROD_focus_4_desc: "§Y1932年8月§!，张学良就任军事委员会北平分会代理委员长，重掌华北军政。数十万东北难民涌入关内，学生、义勇军眷属、散兵游勇充塞街巷——安顿流亡、整饬军纪，成为绥署的第一要务。"

  ROD_focus_5: "东北情报网"
  ROD_focus_5_desc: "利用同乡、旧部与伪满军中的关系，在沈阳、哈尔滨、大连重建情报网，严密监视关东军调动与溥仪「执政」政权的动向。家乡丢了，但东北人的眼睛没有瞎。"

  ROD_focus_6: "复校东北大学"
  ROD_focus_6_desc: "东北大学在北平借舍复校，收容流亡学生，章士钊、罗文干等名流出任教席；§Y1932年洛杉矶§!，东大学生§O刘长春§!单刀赴会，成为第一位站上奥运赛场的中国人。国土可亡，文脉与骨气不可亡。"

  ROD_focus_7: "长城抗战"
  ROD_focus_7_desc: "§Y1933年元旦§!，山海关城头一声炮响，何柱国部打响长城抗战第一枪。喜峰口二十九军大刀夜袭，古北口、界岭口中央军与东北军浴血拼杀——这一次，中国军队选择在长城脚下站着死。"

  ROD_focus_8: "热河崩溃·收容义勇军"
  ROD_focus_8_desc: "§Y1933年3月4日§!，汤玉麟一百余骑弃承德而逃，热河全省旬日沦丧，举国哗然。溃散的义勇军冯占海、郑桂林各部纷纷退入关内——少帅咬牙下令：§O是抗日的弟兄，一律发枪收编§!。"

  ROD_focus_9: "引咎下野"
  ROD_focus_9_desc: "热河之败，千夫所指。§Y3月11日§!，张学良当着蒋介石、宋子文的面签下通电：「§O此次日军侵入热河，皆因良处置失当……应请即日免去本兼各职，以正国法§!」。当日他飞赴上海，准备出洋——这是他为东北丢失付出的政治代价。"

  ROD_focus_31: "旅欧考察·戒毒新生"
  ROD_focus_31_desc: "§Y1933年4月至12月§!，张学良遍历意、德、法、英、丹、瑞。在上海医生密勒的帮助下，他以壮士断腕之勇戒掉了缠身多年的毒瘾；罗马的墨索里尼、柏林的复兴气象，让这个脱胎换骨的年轻人开始迷信「铁与血」的效率。"

  ROD_focus_32: "选派留洋军官"
  ROD_focus_32_desc: "借旅欧之机，张学良与齐亚诺私交甚笃，选派大批东北军航空学员赴意大利航校受训，又安排陆军军官分赴德法见习。他坚信：§O今日埋下的种子，明日就是重建东北空军的栋梁§!。"

  ROD_focus_33: "回国复出·拥戴领袖"
  ROD_focus_33_desc: "§Y1934年1月8日§!，张学良归国抵沪。脱胎换骨的他逢人便讲欧洲见闻：「§O中国必须有一个独裁领袖，才能凝聚国力§!」。他公开宣誓效忠蒋介石——这声「委员长」，一半是折服，一半是借梯上楼。"

  ROD_focus_34: "南京削藩·拒发抚恤"
  ROD_focus_34_desc: "噩耗传到南京，军委会非但不予补充，反而下令取消三个师的番号，几十万抚恤金一文不发。张学良怒问：「§O我的部下为谁而死？§!」南京的冷遇，比红军的子弹更让这支流亡军队寒心。"

  ROD_focus_35: "王曲整军·抗日同志会"
  ROD_focus_35_desc: "§Y1936年6月§!，王曲军官训练团开学，张学良亲任团长，「抗日是中国唯一出路」成为公开课程；9月，§O抗日同志会§!秘密成立，刘鼎、应德田、孙铭九等少壮派环列周围。西安城里，空气已经发烫。"

  # 右主线（联共抗日线）
  ROD_focus_1: "联共抗日"
  ROD_focus_1_desc: "与共产党合作，共同抵抗日本侵略。"
  
  ROD_focus_19: "组织抗日义勇军"
  ROD_focus_19_desc: "动员民众组建抗日武装力量。"
  
  ROD_focus_20: "与中共建立联系"
  ROD_focus_20_desc: "派遣代表与共产党进行秘密接触。"
  
  ROD_focus_21: "联合东北抗日联军"
  ROD_focus_21_desc: "与东北抗日联军合作，共同作战。"
  
  ROD_focus_22: "发动群众抗日"
  ROD_focus_22_desc: "动员广大民众参与抗日斗争。"
  
  ROD_focus_23: "建立敌后根据地"
  ROD_focus_23_desc: "在敌后建立抗日根据地。"
  
  ROD_focus_24: "接受中共领导"
  ROD_focus_24_desc: "接受中国共产党的政治指导。"
  
  ROD_focus_25: "建立抗日同盟"
  ROD_focus_25_desc: "与共产党建立正式的抗日同盟关系。"
  
  ROD_focus_26: "整编东北军"
  ROD_focus_26_desc: "将东北军改编为抗日联军。"
  
  ROD_focus_27: "深化国共合作"
  ROD_focus_27_desc: "进一步加强与共产党的合作关系。"
  
  ROD_focus_28: "寻求苏联援助"
  ROD_focus_28_desc: "向苏联请求军事和经济援助。"
  
  ROD_focus_29: "巩固统一战线"
  ROD_focus_29_desc: "巩固抗日民族统一战线。"
  
  ROD_focus_30: "血债血偿"
  ROD_focus_30_desc: "血债血偿，为东北人民报仇雪恨。"

  
  # 架空历史事件链
  ROD_unreal.1.t: "九一八事变 - 东北军奋起抵抗"
  ROD_unreal.1.d: "1931年9月18日夜，日本关东军突然发动九一八事变，炮轰沈阳北大营。次日清晨，张学良将军在北平发表全国广播演讲，声泪俱下地痛斥日本侵略者的暴行："东北是中国的东北，我们绝不能让一寸土地落入敌手！"他宣布打破不抵抗政策，命令东北军全体将士奋起抵抗，并正式向日本关东军宣战。张学良的演讲点燃了全国人民的抗日热情。"
  ROD_unreal.1.a: "奋起抵抗！"

  ROD_unreal.2.t: "组织东北抗日义勇军"
  ROD_unreal.2.d: "为了扩大抗日力量，东北军开始组织抗日义勇军，号召广大爱国青年、工人、农民加入抗日队伍。短短数月，义勇军队伍迅速壮大，成为东北地区抗击日本侵略者的重要力量。"
  ROD_unreal.2.a: "组织义勇军"

  ROD_unreal.3.t: "联合东北抗日联军"
  ROD_unreal.3.d: "为了团结一切抗日力量，东北军与杨靖宇、赵尚志等领导的东北抗日联军达成合作协议。双方摒弃党派分歧，组成统一的抗日联军，形成了强大的抗日武装力量。"
  ROD_unreal.3.a: "联合抗联"

  ROD_unreal.4.t: "建立敌后抗日根据地"
  ROD_unreal.4.d: "在东北地区建立多个敌后抗日根据地，包括长白山、大兴安岭等战略要地。这些根据地不仅为抗日武装提供了物资补给和休整场所，也成为了发动群众、开展游击战争的重要基地。"
  ROD_unreal.4.a: "建立根据地"

  ROD_unreal.5.t: "获得苏联援助"
  ROD_unreal.5.d: "在与中国共产党的积极合作下，东北军通过秘密渠道获得了苏联的军事援助，包括武器装备、弹药和军事顾问。这些援助大大增强了东北军的战斗力，为后续的反攻奠定了基础。"
  ROD_unreal.5.a: "接受援助"

  ROD_unreal.6.t: "发动冬季攻势"
  ROD_unreal.6.d: "1932年冬季，东北军利用日本关东军不适应严寒天气的弱点，发动了大规模的冬季攻势。抗日联军在冰天雪地中对日军据点展开猛烈攻击，取得了一系列胜利，沉重打击了侵略者的气焰。"
  ROD_unreal.6.a: "发动攻势"

  ROD_unreal.7.t: "收复沈阳"
  ROD_unreal.7.d: "经过数月的艰苦战斗，东北军在1933年初成功收复沈阳。这座东北的政治、经济中心重新回到中国人民手中，极大地鼓舞了全国人民的抗日士气，也让世界看到了中国人民抗击侵略者的决心。"
  ROD_unreal.7.a: "收复沈阳"

  ROD_unreal.8.t: "与关内抗日力量会师"
  ROD_unreal.8.d: "1933年春，东北军与关内的国民革命军在长城一线成功会师。双方将士握手言欢，共同宣誓要将日本侵略者赶出中国。全国抗日力量的大团结，为最终的胜利奠定了坚实基础。"
  ROD_unreal.8.a: "会师关内"

  ROD_unreal.9.t: "发动全面反攻"
  ROD_unreal.9.d: "1933年夏，在全国抗日力量的支持下，东北军发动全面反攻。抗日联军分多路向日军占领区发起进攻，收复了大片失地。到1933年底，东北全境基本光复，日本侵略者被赶出了中国东北。"
  ROD_unreal.9.a: "全面反攻"

  ROD_unreal.10.t: "抗日战争胜利"
  ROD_unreal.10.d: "经过两年多的艰苦卓绝战斗，东北军与全国抗日力量一起，彻底击败了日本侵略者。1933年12月，日本被迫宣布投降，中国人民取得了抗日战争的伟大胜利。东北军因此成为了中华民族的英雄，张学良将军也被尊为抗日民族英雄。"
  ROD_unreal.10.a: "庆祝胜利！"

  ROD_unreal.11.t: "南京要求我们放弃抵抗"
  ROD_unreal.11.d: "南京国民政府发来急电，要求东北军立即停止对日作战，服从中央政府的"攘外必先安内"政策。电报中称："为保全国家元气，避免无谓牺牲，望汉卿兄以大局为重，停止军事行动，等待国际调停。"这是一个艰难的选择——服从命令意味着放弃东北，但违抗命令则意味着与南京决裂。"
  ROD_unreal.11.a: "东北绝不投降！"

  ROD_unreal.12.t: "正式脱离南京政府"
  ROD_unreal.12.d: "在拒绝了南京的投降命令后，张学良将军正式宣布东北军脱离南京国民政府的管辖。他在宣言中痛陈："南京政府已丧失领导全国抗日之资格，东北军为保家卫国，不得不另寻出路。自今日起，东北军将独立行使抗日主权，直至将日寇完全驱逐出境！"此举标志着东北军与中央政府的正式决裂。"
  ROD_unreal.12.a: "独立自主，抗日到底！"

  ROD_unreal.13.t: "号召民间抗日"
  ROD_unreal.13.d: "为扩大抗日力量，张学良将军向全国发表《告民众书》，号召所有爱国志士、热血青年加入抗日队伍。宣言中写道："国之将亡，匹夫有责！无论男女老幼，无论党派信仰，凡我中华儿女，皆有保家卫国之责！"响应号召的民众络绎不绝，工人、农民、学生纷纷报名参军，抗日热情空前高涨。"
  ROD_unreal.13.a: "全民抗战！"

  ROD_unreal.14.t: "转移工厂"
  ROD_unreal.14.d: "为防止重要工业设施落入敌手，东北军开始组织大规模的战略转移。沈阳兵工厂、鞍山钢铁厂等重要企业的设备被紧急拆卸装车，向内地转移。工人们夜以继日地工作，将机器设备、原材料和熟练技工转移到安全地区。虽然损失惨重，但这些工业能力将为长期抗战提供重要支撑。"
  ROD_unreal.14.a: "保存实力，持久抗战！"

  ROD_unreal.15.t: "东北军回援"
  ROD_unreal.15.d: "消息传来，关内的东北军旧部纷纷响应号召，突破重重阻碍回师增援。这些将士大多是东北子弟，对故土有着深厚的感情。他们在途中高唱《松花江上》，誓言要打回东北老家。与此同时，海外华侨也踊跃捐款捐物，支援东北抗战。各路援军的到来，极大地增强了东北军的战斗力。"
  ROD_unreal.15.a: "众志成城，收复东北！"

  ROD1931.915.t: "张作相回锦州为父治丧"
  ROD1931.915.d: "东北边防副司令长官兼吉林省政府主席张作相之父在锦州病逝。张作相为奉系元老，与张作霖有八拜之交，在东北军中威望极高。父丧消息传来，张作相悲痛万分，决意回锦州奔丧，尽人子之孝。张作相为东北军政之柱石，此时离开前线，必将影响军心士气。"
  ROD1931.915.a: "忠孝两难全，将军且去"

  ROD1931.921.t: "张作相治丧归来"
  ROD1931.921.d: "张作相在锦州料理丧事毕，即日夜兼程赶回吉林前线。治丧期间，他虽身处后方，心系前线，屡次电询军情。归来后，他重掌军务，整顿防务，稳定军心。"
  ROD1931.921.a: "将军归来，军心振奋"

  ROD1931.301.t: "高纪毅整理东北铁路"
  ROD1931.301.d: "东北交通委员会委员长高纪毅主持东北铁路整理事务，推行吉海、洮昂、打通等路联运，统一铁路管理，并与日本满铁势力加以制衡。高纪毅精于铁路财务与运务管理，在东北交通建设上颇有实绩，其整理铁路之举措使东北交通自主性有所增强。"
  ROD1931.301.a: "整理铁路，自主经营"

  ROD1931.501.t: "张学良患病赴平就医"
  ROD1931.501.d: "1931年6月1日，东北边防司令长官张学良因长期操劳，加之吸食鸦片，身体日渐虚弱，伤寒病复发。经部下劝谏，张学良决意赴北平入协和医院治疗，将东北军务暂交副司令长官张作相代理。此举虽有利于张学良个人健康，但主帅离奉，东北军心有所动摇。"
  ROD1931.501.a: "主帅养病，东北军心浮动"

  ROD1931.601.t: "汤玉麟热河盗墓"
  ROD1931.601.d: "热河省政府主席汤玉麟以军事演习为名，派其弟汤佐荣率部盗掘清东陵。然而汤氏兄弟运气远逊于孙殿英，陵内珍宝早已被前人盗取一空。汤佐荣费尽心力却不愿空手而归，竟命士兵将三座皇陵的木护板悉数拆下，征发数十头黄牛牵引，硬生生将皇陵宫殿梓宫拉散，又将十几方重达数十吨的“哀册”以滚杠拖出。这些梓宫木料与“哀册”装满六十余辆牛车运走，木料运至开鲁换成小米充作军饷，“哀册”则被拉回热河省主席官邸。此举虽未获珍宝，却辱及先陵，舆论哗然，汤玉麟贪婪之名愈发昭彰。"
  ROD1931.601.a: "辱及先陵，舆论哗然"

  ROD1931.701.t: "张学良健康恶化"
  ROD1931.701.d: "1931年7月1日，张学良在北平协和医院治疗期间，病情未有明显好转，加之鸦片烟瘾未除，身体日渐衰弱。端纳等顾问力劝张学良彻底戒除鸦片，以恢复健康。张学良健康恶化之消息传至东北，将士忧心主帅安危，军中士气再度受挫。此时东北正值多事之秋，主帅久病不愈，对东北军政皆有不利影响。"
  ROD1931.701.a: "主帅病重，东北忧虑"

  ROD1931.715.t: "张学良病情好转"
  ROD1931.715.d: "1931年7月15日，经协和医院悉心治疗，张学良病情终于有所好转。在端纳等顾问的劝说下，张学良开始下定决心戒除鸦片烟瘾，身体逐渐恢复。消息传至东北，将士们悬着的心终于放下，军中士气有所回升。张学良虽尚未完全康复，但已能处理部分军务，东北军政运作渐趋正常。"
  ROD1931.715.a: "主帅康复，军心稍定"

  ROD1931.1203.t: "崂山事变"
  ROD1931.1203.d: "九一八事变后，东北海军失去东北基地，退驻青岛，军饷无着、补给困难。海军内部以舰长凌霄、方念祖为代表的军官派对副总司令沈鸿烈不满，借机发难。1931年12月3日，凌霄等人在崂山海域发动兵变，将沈鸿烈软禁于舰上，要求张学良撤换沈鸿烈。事变暴露了东北海军内部派系对立的严重问题，后经东北军方面斡旋，沈鸿烈获释复职，凌霄等人被清除出东北海军。崂山事变削弱了东北海军的凝聚力，为日后海军分裂埋下伏笔。"
  ROD1931.1203.a: "海军内讧，沈鸿烈脱险"

